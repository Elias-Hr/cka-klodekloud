<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKA Workshop</title>
<meta name="description" content="Interactive CKA course: chapters 2 to 9 with animated diagrams, code examples, lab solutions and quizzes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: chart-room console. Sticky top bar with the voyage progress, a chapter rail on the left, a reading column with full-width animated schematics. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E9EEF6; --ink:#14213D; --muted:#56627C; --line:#D3DBE8;
  --accent:#2C55E0; --accent-ink:#FFFFFF; --accent-soft:#DCE5FF;
  --signal:#E8781A; --signal-soft:#FDE7D3;
  --ok:#17875C; --ok-soft:#D7F2E5; --bad:#C93A3A; --bad-soft:#F8DCDC; --warn:#A86B00; --warn-soft:#FBEFD2;
  --plane:#E6ECFA; --node:#EEF2F8; --code-bg:#101A33; --code-ink:#DCE4F5; --code-muted:#7D8AA8;
  --c1:#2C55E0; --c2:#E8781A; --c3:#17875C; --c4:#B23A9A; --c5:#7A5AF8; --c6:#0E8FA8;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px; --topbar:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1222; --surface:#131B2F; --surface-2:#1A2440; --ink:#E5EAF5; --muted:#97A3BF; --line:#27324F;
  --accent:#7D9BFF; --accent-ink:#0C1222; --accent-soft:#1E2B55;
  --signal:#FFA04D; --signal-soft:#3A2814;
  --ok:#3FCB8E; --ok-soft:#123326; --bad:#FF7272; --bad-soft:#3B1A1D; --warn:#F0B54A; --warn-soft:#352812;
  --plane:#17213C; --node:#151E35; --code-bg:#080D1A; --code-ink:#DCE4F5; --code-muted:#7381A3;
  --c1:#7D9BFF; --c2:#FFA04D; --c3:#3FCB8E; --c4:#E57CD0; --c5:#A99BFF; --c6:#48C6DE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1222; --surface:#131B2F; --surface-2:#1A2440; --ink:#E5EAF5; --muted:#97A3BF; --line:#27324F;
  --accent:#7D9BFF; --accent-ink:#0C1222; --accent-soft:#1E2B55;
  --signal:#FFA04D; --signal-soft:#3A2814;
  --ok:#3FCB8E; --ok-soft:#123326; --bad:#FF7272; --bad-soft:#3B1A1D; --warn:#F0B54A; --warn-soft:#352812;
  --plane:#17213C; --node:#151E35; --code-bg:#080D1A; --code-ink:#DCE4F5; --code-muted:#7381A3;
  --c1:#7D9BFF; --c2:#FFA04D; --c3:#3FCB8E; --c4:#E57CD0; --c5:#A99BFF; --c6:#48C6DE;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
code,pre,kbd{font-family:var(--f-mono)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 16px;height:var(--topbar)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap}
.voyage{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.voyage .track{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.voyage .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--accent),var(--c6));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.voyage .pct{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:3.4em;text-align:right}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 10px;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .lbl{font-size:14px}
#menuBtn{display:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - var(--topbar))}
.sidebar{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:calc(var(--topbar) + env(safe-area-inset-top,0px));height:calc(100vh - var(--topbar) - env(safe-area-inset-top,0px));overflow-y:auto;padding-block:12px 40px}
.side-home{display:flex;gap:8px;padding:8px 18px;margin-bottom:4px}
.side-home a{font-size:14px;text-decoration:none;color:var(--muted);padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
.side-home a:hover,.side-home a.on{color:var(--ink);background:var(--surface-2)}
.chap{border-top:1px solid var(--line)}
.chap-head{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 18px;cursor:pointer;text-align:left}
.chap-head:hover{background:var(--surface-2)}
.chap-num{font-family:var(--f-display);font-size:12px;color:var(--muted);width:20px}
.chap-title{flex:1;font-weight:600;font-size:15px;line-height:1.3}
.ring{flex:none}
.ring .bgc{stroke:var(--surface-2)} .ring .fgc{stroke:var(--accent);transition:stroke-dashoffset .5s}
.ring.done .fgc{stroke:var(--ok)}
.chap-list{list-style:none;margin:0;padding:0 0 10px}
.chap-list a{display:flex;align-items:flex-start;gap:10px;padding:6px 18px 6px 50px;text-decoration:none;color:var(--muted);font-size:14px;line-height:1.35}
.chap-list a:hover{color:var(--ink);background:var(--surface-2)}
.chap-list a.on{color:var(--ink);background:var(--accent-soft);font-weight:600}
.chap-list .tick{flex:none;width:14px;height:14px;margin-top:2px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.chap-list a.isdone .tick{background:var(--ok);border-color:var(--ok)}
.chap-list a.isdone .tick::after{content:"";width:5px;height:3px;border:solid var(--surface);border-width:0 0 1.5px 1.5px;transform:rotate(-45deg) translate(1px,-1px)}
.chap-list .tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:auto;color:var(--muted);flex:none}
.chap-list .quizlink .tag{border-color:var(--signal);color:var(--signal)}

main:focus{outline:none}
main{min-width:0;padding-inline:clamp(16px,4vw,56px);padding-block:28px 96px}
.wrap{max-width:780px;margin:0 auto}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.4vw,46px);line-height:1.08;margin:0 0 14px;text-wrap:balance;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0 0 18px;color:var(--muted);max-width:52ch}
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;border:1px solid transparent;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.okb{background:var(--ok);color:var(--surface)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px;margin-top:24px;max-width:460px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.hero-art{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:0}
.hero-art svg{width:100%;height:auto;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .n{font-family:var(--f-display);font-size:28px;color:var(--accent);line-height:1}
.card h3{margin:0;font-size:17px;line-height:1.3}
.card p{margin:0;font-size:14px;color:var(--muted);line-height:1.45;flex:1}
.card .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card .bar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent)}
.card.complete .bar i{background:var(--ok)}
.section-title{font-family:var(--f-display);font-size:18px;font-weight:500;margin:34px 0 14px}

/* ---------- lesson ---------- */
.crumb{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--accent)}
.lesson-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.4vw,34px);line-height:1.15;margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
.lmeta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);align-items:center;margin-bottom:26px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.lmeta .chip{display:inline-flex;align-items:center;gap:6px}
.lmeta a{color:var(--muted)}
.prose{min-width:0}
.prose h2,.prose h3{font-family:var(--f-body);font-weight:600;text-wrap:balance}
.prose p,.prose li{max-width:68ch}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin:4px 0}
.prose strong{font-weight:600}
.prose :not(pre)>code{font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;overflow-wrap:break-word}
.prose table{border-collapse:collapse;font-size:14px;width:100%;min-width:480px}
.tablewrap{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.prose th,.prose td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.prose th{background:var(--surface-2);font-weight:600;font-size:13px}
.prose tr:last-child td{border-bottom:0}
.codeblock{margin:16px 0;border-radius:var(--radius);overflow:hidden;background:var(--code-bg);border:1px solid var(--line)}
.codebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 14px;background:color-mix(in srgb,var(--code-bg) 80%,var(--accent) 20%);font-family:var(--f-mono);font-size:12px;color:var(--code-muted)}
.codebar .fname{color:var(--code-ink)}
.copy{background:transparent;border:1px solid color-mix(in srgb,var(--code-muted) 50%,transparent);color:var(--code-ink);border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer;font-family:var(--f-mono)}
.copy:hover{border-color:var(--code-ink)}
.codeblock pre{margin:0;padding:12px 14px 14px;overflow-x:auto;font-size:13px;line-height:1.55;color:var(--code-ink);tab-size:2}
.codeblock pre code{background:none;border:0;padding:0;font-size:inherit}
.hljs-attr,.hljs-section{color:#8FB4FF}
.hljs-string{color:#9FE0B0}
.hljs-number,.hljs-literal{color:#FFBE7A}
.hljs-comment{color:var(--code-muted);font-style:italic}
.hljs-keyword,.hljs-built_in{color:#F29CE0}
.hljs-meta,.hljs-variable,.hljs-template-variable{color:#7FD8E8}
.hljs-bullet{color:#FFBE7A}
.prompt{color:var(--code-muted);user-select:none}
.admonition{margin:20px 0;border-radius:var(--radius);padding:12px 16px 12px 16px;border:1px solid var(--line);background:var(--surface)}
.admonition .admonition-title{margin:0 0 4px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.admonition .admonition-title::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.admonition p{margin:4px 0}
.admonition.exam{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.admonition.exam .admonition-title{color:var(--accent)}
.admonition.warning{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.admonition.warning .admonition-title{color:var(--warn)}
.admonition.note{background:var(--signal-soft);border-color:color-mix(in srgb,var(--signal) 35%,transparent)}
.admonition.note .admonition-title{color:var(--signal)}
.admonition.tip{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.admonition.tip .admonition-title{color:var(--ok)}
.lesson-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;text-decoration:none;color:var(--ink);background:var(--surface);min-width:0}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager .next{text-align:right;grid-column:2}
.pager span{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.donebar .msg{font-size:14px;color:var(--muted)}

/* ---------- animations ---------- */
.anim{margin:24px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.anim-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.anim-title{font-size:13px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.anim-title::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.anim-count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.anim-stage{padding:10px;overflow-x:auto}
@media (max-width:640px){.anim-stage{padding:4px} svg .t{font-size:14px} svg .ts,svg .tm{font-size:12px}}
.anim-stage svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}
.anim-cap{padding:12px 16px;border-top:1px solid var(--line);font-size:15px;min-height:3.2em;line-height:1.5}
.anim-cap code{font-size:.85em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.anim-ctl{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px;align-items:center}
.anim-ctl .sp{flex:1}
.cbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.cbtn:hover:not(:disabled){background:var(--surface-2)}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cbtn.pri:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
.cbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:background .2s,transform .2s}
.dots i.on{background:var(--accent);transform:scale(1.25)}
.ctl-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.ctl-row label{font-size:14px;display:inline-flex;align-items:center;gap:6px}
.ctl-row select,.ctl-row input[type=text],.ctl-row input[type=number]{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 8px;min-width:0}
.ctl-row input[type=text]{font-family:var(--f-mono)}
.ctl-row input[type=range]{accent-color:var(--accent)}
.term{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:13px;line-height:1.55;padding:12px 14px;margin:0;min-height:120px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--code-muted)} .term .ok{color:#9FE0B0} .term .er{color:#FF9C9C} .term .hl{color:#FFBE7A}
.out{font-family:var(--f-mono);font-size:14px;padding:12px 14px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.warn{background:var(--warn-soft);color:var(--warn)}

/* svg vocabulary */
svg text{white-space:pre}
svg .t{fill:var(--ink);font-family:var(--f-body);font-size:13px}
svg .ts{fill:var(--muted);font-family:var(--f-body);font-size:11px}
svg .tm{fill:var(--ink);font-family:var(--f-mono);font-size:11px}
svg .tb{font-weight:600}
svg .tw{fill:var(--surface)}
svg .ta{fill:var(--accent)} svg .tsig{fill:var(--signal)} svg .tok{fill:var(--ok)} svg .tbad{fill:var(--bad)}
svg .plane{fill:var(--plane);stroke:var(--accent);stroke-width:1.2;stroke-dasharray:5 4}
svg .node{fill:var(--node);stroke:var(--line);stroke-width:1.2}
svg .box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
svg .boxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
svg .boxs{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.4}
svg .boxok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.4}
svg .boxbad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.4}
svg .boxw{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.4}
svg .ln{fill:none;stroke:var(--muted);stroke-width:1.4}
svg .lna{fill:none;stroke:var(--accent);stroke-width:2}
svg .lns{fill:none;stroke:var(--signal);stroke-width:2}
svg .lnok{fill:none;stroke:var(--ok);stroke-width:2}
svg .lnbad{fill:none;stroke:var(--bad);stroke-width:2}
svg .dash{stroke-dasharray:5 4}
svg .flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
svg .pkt{fill:var(--signal);stroke:var(--surface);stroke-width:2}
svg .el{transition:opacity .45s ease,transform .45s ease}
svg .is-hidden{opacity:0;pointer-events:none}
svg .is-dim{opacity:.25}
svg .is-hl>rect:first-child,svg rect.is-hl{stroke:var(--signal)!important;stroke-width:2.6!important}
svg .is-hl>circle:first-child,svg circle.is-hl{stroke:var(--signal)!important;stroke-width:2.6!important}
svg .pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
svg .clickable{cursor:pointer}
svg .clickable:hover>rect:first-child,svg .clickable:hover>circle:first-child{stroke:var(--accent);stroke-width:2}
svg .f1{fill:var(--c1)} svg .f2{fill:var(--c2)} svg .f3{fill:var(--c3)} svg .f4{fill:var(--c4)} svg .f5{fill:var(--c5)} svg .f6{fill:var(--c6)} svg .fm{fill:var(--muted)} svg .fl{fill:var(--line)} svg .fs{fill:var(--surface)}
svg .s1{stroke:var(--c1)} svg .s2{stroke:var(--c2)} svg .s3{stroke:var(--c3)} svg .s4{stroke:var(--c4)}
svg .mark{fill:var(--muted)}
@media (prefers-reduced-motion: reduce){svg .flow,svg .pulse{animation:none} svg .el{transition:none}}

/* ---------- labs ---------- */
.lab-intro{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:18px;font-size:14px;color:var(--muted)}
.labq{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin:10px 0;overflow:hidden}
.labq summary{cursor:pointer;list-style:none;display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.labq summary::-webkit-details-marker{display:none}
.labq .qn{font-family:var(--f-mono);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;flex:none;margin-top:2px;font-variant-numeric:tabular-nums}
.labq .qt{flex:1;min-width:0;font-weight:500}
.labq .qt code{font-size:.86em;background:var(--surface-2);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
.labq .chev{flex:none;transition:transform .2s;color:var(--muted);margin-top:4px}
.labq[open] .chev{transform:rotate(90deg)}
.labq .qa{padding:0 14px 12px 14px;border-top:1px dashed var(--line);font-size:15px}
.labq[open] .qn{background:var(--ok-soft);color:var(--ok)}

/* ---------- quiz ---------- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0}
.qcard h3{margin:0 0 12px;font-size:16px;line-height:1.4;font-weight:600;display:flex;gap:10px}
.qcard h3 .qn{font-family:var(--f-mono);color:var(--accent);font-size:13px;flex:none;margin-top:2px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:15px;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none;margin-top:2px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.explain{margin-top:10px;font-size:14px;color:var(--muted)}
.score{position:sticky;bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:0 8px 30px -12px rgba(0,0,0,.25);margin-top:20px}
.score b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}

/* ---------- memo ---------- */
.memo-filter{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.memo-filter button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;cursor:pointer;font-family:var(--f-mono)}
.memo-filter button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.memo-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.memo-row code{font-size:13px;overflow-wrap:anywhere}
.memo-row a{font-size:12px;color:var(--muted);white-space:nowrap}
.memo-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}

/* ---------- search ---------- */
.search-ov{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 70px) 16px 16px}
.search-box{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.4)}
.search-box input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font:inherit;font-size:17px;background:var(--surface);color:var(--ink);outline:none}
.sres{max-height:60vh;overflow-y:auto}
.sres a{display:block;padding:10px 16px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.sres a:hover,.sres a.sel{background:var(--accent-soft)}
.sres small{display:block;color:var(--muted);font-size:12px}
.sres p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.sres mark{background:var(--signal-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.sres .empty{padding:16px;color:var(--muted);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.scrim{display:none}

  .hero{grid-template-columns:minmax(0,1fr)}
}

  main{padding-block:20px 80px}

}

<script>
window.COURSE={"chapters":[{"num":"02","title":"Core Concepts","short":"Core","summary":"Cluster architecture and its components, plus the core objects: Pods, ReplicaSets, Deployments, Namespaces and Services.","lessons":[{"id":"02-architecture","kind":"lesson","title":"Cluster Architecture","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/02-Cluster-Architecture.md","html":"<p>A Kubernetes cluster is a set of <strong>nodes<\/strong>, physical or virtual machines, that host applications in the form of containers. The course uses the analogy of two kinds of ships:<\/p>\n<ul>\n<li><strong>The control plane (master nodes)<\/strong> manages, plans, schedules and monitors the cluster. It runs <code>kube-apiserver<\/code>, <code>etcd<\/code>, <code>kube-scheduler<\/code> and <code>kube-controller-manager<\/code>.<\/li>\n<li><strong>The worker nodes<\/strong> carry the containers. Each node runs a <em>container runtime<\/em> (containerd, CRI-O…), the <code>kubelet<\/code> (the captain of the ship) and <code>kube-proxy<\/code> (communication between services).<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"arch\"><\/div>\n\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Role<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>etcd<\/strong><\/td>\n<td>Key-value store that holds the cluster state<\/td>\n<\/tr>\n<tr>\n<td><strong>kube-apiserver<\/strong><\/td>\n<td>The single entry point: authenticates, validates and orchestrates every operation<\/td>\n<\/tr>\n<tr>\n<td><strong>kube-scheduler<\/strong><\/td>\n<td>Picks the right node for each Pod<\/td>\n<\/tr>\n<tr>\n<td><strong>kube-controller-manager<\/strong><\/td>\n<td>Runs the controllers (node, replication…) that drive the cluster towards the desired state<\/td>\n<\/tr>\n<tr>\n<td><strong>kubelet<\/strong><\/td>\n<td>Agent on every node: creates Pods and reports their status<\/td>\n<\/tr>\n<tr>\n<td><strong>kube-proxy<\/strong><\/td>\n<td>Programs network rules so Services are reachable<\/td>\n<\/tr>\n<tr>\n<td><strong>Container runtime<\/strong><\/td>\n<td>Actually runs the containers (containerd, CRI-O…)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"A Kubernetes cluster is a set of nodes , physical or virtual machines, that host applications in the form of containers. The course uses the analogy of two kinds of ships: The control plane (master nodes) manages, plans, schedules and monitors the cluster. It runs kube-apiserver , etcd , kube-scheduler and kube-controller-manager . The worker nodes carry the containers. Each node runs a container runtime (containerd, CRI-O…), the kubelet (the captain of the ship) and kube-proxy (communication between services). Component Role etcd Key-value store that holds the cluster state kube-apiserver The single entry point: authenticates, validates and orchestrates every operation kube-scheduler Picks the right node for each Pod kube-controller-manager Runs the controllers (node, replication…) that drive the cluster towards the desired state kubelet Agent on every node: creates Pods and reports their status kube-proxy Programs network rules so Services are reachable Container runtime Actually runs the containers (containerd, CRI-O…)","minutes":2,"ncode":0},{"id":"02-docker-containerd","kind":"lesson","title":"Docker vs containerd","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/03-Docker-vs-ContainerD.md","html":"<p>In the beginning, Kubernetes could only orchestrate <strong>Docker<\/strong>. To support other runtimes (rkt, CRI-O…), it introduced the <strong>CRI<\/strong> (<em>Container Runtime Interface<\/em>): any vendor can act as a container runtime as long as it adheres to the <strong>OCI<\/strong> (<em>Open Container Initiative<\/em>) standards, which consist of an <em>image spec<\/em> (how an image should be built) and a <em>runtime spec<\/em> (how a container runtime should be developed).<\/p>\n<p>Docker was built long before the CRI and didn't support it. Kubernetes kept a temporary workaround, the <strong>dockershim<\/strong>, until it was removed in <strong>v1.24<\/strong>. Images built with Docker keep working because they follow the OCI image spec. The runtime inside Docker, <strong>containerd<\/strong>, is CRI compatible and is now a graduated CNCF project that can be installed on its own.<\/p>\n<div class=\"anim\" data-anim=\"cri\"><\/div>\n\n<p>Three CLI tools coexist:<\/p>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Community<\/th>\n<th>Purpose<\/th>\n<th>Works with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ctr<\/code><\/td>\n<td>containerd<\/td>\n<td>Debugging only, limited features<\/td>\n<td>containerd<\/td>\n<\/tr>\n<tr>\n<td><code>nerdctl<\/code><\/td>\n<td>containerd<\/td>\n<td>General purpose, Docker-like CLI<\/td>\n<td>containerd<\/td>\n<\/tr>\n<tr>\n<td><code>crictl<\/code><\/td>\n<td>Kubernetes<\/td>\n<td>Debugging, inspection<\/td>\n<td>All CRI-compatible runtimes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>With <code>ctr<\/code> you can pull an image and run a container:<\/p>\n<pre><code class=\"language-bash\">ctr images pull docker.io/library/redis:alpine\n<\/code><\/pre>\n<pre><code class=\"language-bash\">ctr run docker.io/library/redis:alpine redis\n<\/code><\/pre>\n<p><code>nerdctl<\/code> supports most of Docker's CLI options (replace <code>docker<\/code> with <code>nerdctl<\/code>) and adds newer containerd features: encrypted container images, lazy pulling, P2P image distribution, image signing and verifying, and namespaces in Kubernetes.<\/p>\n<p><code>crictl<\/code> comes from the Kubernetes community. It is aware of <strong>Pods<\/strong> (<code>crictl pods<\/code>), which Docker never was. Containers created by hand with <code>crictl<\/code> get deleted by the kubelet, which doesn't know about them: use it for debugging only.<\/p>\n<table>\n<thead>\n<tr>\n<th>docker cli<\/th>\n<th>crictl<\/th>\n<th>Description<\/th>\n<th>Unsupported Features<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>attach<\/td>\n<td>attach<\/td>\n<td>Attach to a running container<\/td>\n<td>--detach-keys, --sig-proxy<\/td>\n<\/tr>\n<tr>\n<td>exec<\/td>\n<td>exec<\/td>\n<td>Run a command in a running container<\/td>\n<td>--privileged, --user, --detach-keys<\/td>\n<\/tr>\n<tr>\n<td>images<\/td>\n<td>images<\/td>\n<td>List images<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>info<\/td>\n<td>info<\/td>\n<td>Display system-wide information<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>inspect<\/td>\n<td>inspect, inspecti<\/td>\n<td>Return low-level information on a container, image or task<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>logs<\/td>\n<td>logs<\/td>\n<td>Fetch the logs of a container<\/td>\n<td>--details<\/td>\n<\/tr>\n<tr>\n<td>ps<\/td>\n<td>ps<\/td>\n<td>List containers<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>stats<\/td>\n<td>stats<\/td>\n<td>Display a live stream of container(s) resource usage statistics<\/td>\n<td>Column: NET/BLOCK I/O, PIDs<\/td>\n<\/tr>\n<tr>\n<td>version<\/td>\n<td>version<\/td>\n<td>Show the runtime (Docker, ContainerD, or others) version information<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">Exam tip<\/p>\n<p>The lab nodes run containerd: to troubleshoot a node, use <code>crictl ps<\/code>, <code>crictl logs<\/code> and <code>crictl pods<\/code> instead of <code>docker<\/code>. If several runtimes are configured, set the socket with <code>--runtime-endpoint<\/code> or the <code>CONTAINER_RUNTIME_ENDPOINT<\/code> environment variable.<\/p>\n<\/div>","text":"In the beginning, Kubernetes could only orchestrate Docker . To support other runtimes (rkt, CRI-O…), it introduced the CRI ( Container Runtime Interface ): any vendor can act as a container runtime as long as it adheres to the OCI ( Open Container Initiative ) standards, which consist of an image spec (how an image should be built) and a runtime spec (how a container runtime should be developed). Docker was built long before the CRI and didn't support it. Kubernetes kept a temporary workaround, the dockershim , until it was removed in v1.24 . Images built with Docker keep working because they follow the OCI image spec. The runtime inside Docker, containerd , is CRI compatible and is now a graduated CNCF project that can be installed on its own. Three CLI tools coexist: Tool Community Purpose Works with ctr containerd Debugging only, limited features containerd nerdctl containerd General purpose, Docker-like CLI containerd crictl Kubernetes Debugging, inspection All CRI-compatible runtimes With ctr you can pull an image and run a container: nerdctl supports most of Docker's CLI options (replace docker with nerdctl ) and adds newer containerd features: encrypted container images, lazy pulling, P2P image distribution, image signing and verifying, and namespaces in Kubernetes. crictl comes from the Kubernetes community. It is aware of Pods ( crictl pods ), which Docker never was. Containers created by hand with crictl get deleted by the kubelet, which doesn't know about them: use it for debugging only. docker cli crictl Description Unsupported Features attach attach Attach to a running container --detach-keys, --sig-proxy exec exec Run a command in a running container --privileged, --user, --detach-keys images images List images info info Display system-wide information inspect inspect, inspecti Return low-level information on a container, image or task logs logs Fetch the logs of a container --details ps ps List containers stats stats Display a live stream of container(s) resource usage statistics Column: NET/BLOCK I/O, PIDs version version Show the runtime (Docker, ContainerD, or others) version information Exam tip The lab nodes run containerd: to troubleshoot a node, use crictl ps , crictl logs and crictl pods instead of docker . If several runtimes are configured, set the socket with --runtime-endpoint or the CONTAINER_RUNTIME_ENDPOINT environment variable.","minutes":3,"ncode":2},{"id":"02-etcd-basics","kind":"lesson","title":"ETCD for Beginners","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/04-ETCD-For-Beginners.md","html":"<p><strong>ETCD<\/strong> is a <strong>distributed, reliable key-value store<\/strong> that is simple, secure and fast. Where a relational database stores data in rows and columns, a key-value store stores information as keys and values: adding a detail about one item doesn't affect the others.<\/p>\n<div class=\"anim\" data-anim=\"etcd\"><\/div>\n\n<p>Installing it: download the binary for your OS from the GitHub releases page, extract it and run the service.<\/p>\n<pre><code class=\"language-bash\">$ curl -LO <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/etcd-io/etcd/releases/download/v3.5.6/etcd-v3.5.6-linux-amd64.tar.gz\" target=\"_blank\" rel=\"noopener\">https://github.com/etcd-io/etcd/releases/download/v3.5.6/etcd-v3.5.6-linux-amd64.tar.gz<\/a>\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ tar xvzf etcd-v3.5.6-linux-amd64.tar.gz\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ./etcd\n<\/code><\/pre>\n<p>When started, ETCD listens on port <strong>2379<\/strong> by default. The default client is <code>etcdctl<\/code>:<\/p>\n<pre><code class=\"language-bash\"># Store a key-value pair\n$ ./etcdctl put key1 value1\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># Retrieve the stored data\n$ ./etcdctl get key1\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># View more commands: run etcdctl without any arguments\n$ ./etcdctl\n<\/code><\/pre>","text":"ETCD is a distributed, reliable key-value store that is simple, secure and fast. Where a relational database stores data in rows and columns, a key-value store stores information as keys and values: adding a detail about one item doesn't affect the others. Installing it: download the binary for your OS from the GitHub releases page, extract it and run the service. When started, ETCD listens on port 2379 by default. The default client is etcdctl :","minutes":2,"ncode":6},{"id":"02-etcd-k8s","kind":"lesson","title":"ETCD in Kubernetes","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/05-ETCD-in-Kubernetes.md","html":"<p>The ETCD datastore holds <strong>everything about the cluster<\/strong>: Nodes, Pods, Configs, Secrets, Accounts, Roles, Bindings and others. Every piece of information you see with <code>kubectl get<\/code> comes from the ETCD server, and a change is only considered complete once it is written to ETCD.<\/p>\n<p><strong>Manual setup<\/strong>: download the binaries and configure ETCD as a service on the master node yourself.<\/p>\n<pre><code class=\"language-bash\">$ wget -q --https-only &quot;<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/etcd-io/etcd/releases/download/v3.3.11/etcd-v3.3.11-linux-amd64.tar.gz&quot;\" target=\"_blank\" rel=\"noopener\">https://github.com/etcd-io/etcd/releases/download/v3.3.11/etcd-v3.3.11-linux-amd64.tar.gz&quot;<\/a>\n<\/code><\/pre>\n<p><strong>kubeadm setup<\/strong>: kubeadm deploys the ETCD server as a Pod in the <code>kube-system<\/code> namespace.<\/p>\n<pre><code class=\"language-bash\">$ kubectl get pods -n kube-system\n<\/code><\/pre>\n<p>To list all keys stored by Kubernetes:<\/p>\n<pre><code class=\"language-bash\">$ kubectl exec etcd-master -n kube-system -- sh -c &quot;ETCDCTL_API=3 etcdctl --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key --cacert=/etc/kubernetes/pki/etcd/ca.crt get / --prefix --keys-only&quot;\n<\/code><\/pre>\n<p>Kubernetes stores data under a root directory, <strong><code>/registry<\/code><\/strong>, and below that by type of construct: <code>minions<\/code>, <code>nodes<\/code>, <code>pods<\/code>, <code>replicasets<\/code>, <code>deployments<\/code>, <code>roles<\/code>, <code>secrets<\/code>…<\/p>\n<div class=\"anim\" data-anim=\"registry\"><\/div>\n\n<p><strong>ETCD in an HA environment<\/strong>: with multiple master nodes, there is an ETCD instance on each. The instances must know about each other, through the <code>--initial-cluster<\/code> option in <code>etcd.service<\/code>.<\/p>","text":"The ETCD datastore holds everything about the cluster : Nodes, Pods, Configs, Secrets, Accounts, Roles, Bindings and others. Every piece of information you see with kubectl get comes from the ETCD server, and a change is only considered complete once it is written to ETCD. Manual setup : download the binaries and configure ETCD as a service on the master node yourself. kubeadm setup : kubeadm deploys the ETCD server as a Pod in the kube-system namespace. To list all keys stored by Kubernetes: Kubernetes stores data under a root directory, /registry , and below that by type of construct: minions , nodes , pods , replicasets , deployments , roles , secrets … ETCD in an HA environment : with multiple master nodes, there is an ETCD instance on each. The instances must know about each other, through the --initial-cluster option in etcd.service .","minutes":2,"ncode":3},{"id":"02-apiserver","kind":"lesson","title":"Kube API Server","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/06-Kube-API-Server.md","html":"<p>The <strong>kube-apiserver<\/strong> is the primary component in Kubernetes. It <strong>authenticates<\/strong> and <strong>validates<\/strong> requests, then <strong>retrieves and updates<\/strong> data in the ETCD store. It is the <strong>only<\/strong> component that talks to ETCD directly: kube-scheduler, kube-controller-manager and the kubelets all go through it.<\/p>\n<p>The path of a Pod creation shows its role:<\/p>\n<div class=\"anim\" data-anim=\"podcreate\"><\/div>\n\n<p>Installing it the hard way: the binary is on the Kubernetes release page.<\/p>\n<pre><code class=\"language-bash\">$ wget <a target=\"_blank\" rel=\"noopener\" href=\"https://storage.googleapis.com/kubernetes-release/release/v1.13.0/bin/linux/amd64/kube-apiserver\" target=\"_blank\" rel=\"noopener\">https://storage.googleapis.com/kubernetes-release/release/v1.13.0/bin/linux/amd64/kube-apiserver<\/a>\n<\/code><\/pre>\n<p>With kubeadm, it runs as a Pod in <code>kube-system<\/code>:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get pods -n kube-system\n<\/code><\/pre>\n<p>Its options are in the Pod definition file:<\/p>\n<pre><code class=\"language-bash\">$ cat /etc/kubernetes/manifests/kube-apiserver.yaml\n<\/code><\/pre>\n<p>In a non-kubeadm setup, in the systemd service file:<\/p>\n<pre><code class=\"language-bash\">$ cat /etc/systemd/system/kube-apiserver.service\n<\/code><\/pre>\n<p>Either way, you can see the running process and its effective options:<\/p>\n<pre><code class=\"language-bash\">$ ps -aux | grep kube-apiserver\n<\/code><\/pre>","text":"The kube-apiserver is the primary component in Kubernetes. It authenticates and validates requests, then retrieves and updates data in the ETCD store. It is the only component that talks to ETCD directly: kube-scheduler, kube-controller-manager and the kubelets all go through it. The path of a Pod creation shows its role: Installing it the hard way: the binary is on the Kubernetes release page. With kubeadm, it runs as a Pod in kube-system : Its options are in the Pod definition file: In a non-kubeadm setup, in the systemd service file: Either way, you can see the running process and its effective options:","minutes":2,"ncode":5},{"id":"02-controller-manager","kind":"lesson","title":"Kube Controller Manager","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/07-Kube-Controller-Manager.md","html":"<p>In Kubernetes terms, a <strong>controller<\/strong> is a process that continuously monitors the state of the components in the system and works towards bringing the whole system to the <strong>desired state<\/strong>. The <code>kube-controller-manager<\/code> packages all these controllers into a single process.<\/p>\n<ul>\n<li><strong>Node Controller<\/strong>: monitors node status through the kube-apiserver (every 5 s). After 40 s without a heartbeat, the node is marked <code>Unreachable<\/code>; after 5 minutes, its Pods are evicted and recreated elsewhere.<\/li>\n<li><strong>Replication Controller<\/strong>: monitors ReplicaSets and makes sure the desired number of Pods is always available.<\/li>\n<li>Many more: Deployment, Namespace, Endpoint, Job, CronJob, Service-Account, PV-Protection, PV-Binder…<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"reconcile\"><\/div>\n\n<pre><code class=\"language-bash\">$ wget <a target=\"_blank\" rel=\"noopener\" href=\"https://storage.googleapis.com/kubernetes-release/release/v1.13.0/bin/linux/amd64/kube-controller-manager\" target=\"_blank\" rel=\"noopener\">https://storage.googleapis.com/kubernetes-release/release/v1.13.0/bin/linux/amd64/kube-controller-manager<\/a>\n<\/code><\/pre>\n<p>All controllers are enabled by default; you can enable specific ones in the service file:<\/p>\n<pre><code class=\"language-bash\">$ cat /etc/systemd/system/kube-controller-manager.service\n<\/code><\/pre>\n<p>With kubeadm it runs as a Pod in <code>kube-system<\/code>:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get pods -n kube-system\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ cat /etc/kubernetes/manifests/kube-controller-manager.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ps -aux | grep kube-controller-manager\n<\/code><\/pre>","text":"In Kubernetes terms, a controller is a process that continuously monitors the state of the components in the system and works towards bringing the whole system to the desired state . The kube-controller-manager packages all these controllers into a single process. Node Controller : monitors node status through the kube-apiserver (every 5 s). After 40 s without a heartbeat, the node is marked Unreachable ; after 5 minutes, its Pods are evicted and recreated elsewhere. Replication Controller : monitors ReplicaSets and makes sure the desired number of Pods is always available. Many more: Deployment, Namespace, Endpoint, Job, CronJob, Service-Account, PV-Protection, PV-Binder… All controllers are enabled by default; you can enable specific ones in the service file: With kubeadm it runs as a Pod in kube-system :","minutes":2,"ncode":5},{"id":"02-scheduler","kind":"lesson","title":"Kube Scheduler","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/08-Kube-Scheduler.md","html":"<p>The <strong>kube-scheduler<\/strong> only decides <strong>which Pod goes on which node<\/strong>. It doesn't actually place the Pod on the node: that's the job of the <strong>kubelet<\/strong>.<\/p>\n<p>It works in two phases:<\/p>\n<ol>\n<li><strong>Filter<\/strong>: it drops nodes that don't fit the Pod (not enough resources, taints, selectors…).<\/li>\n<li><strong>Rank<\/strong>: it scores the remaining nodes, for example favouring the node with the most CPU left after placement.<\/li>\n<\/ol>\n<div class=\"anim\" data-anim=\"schedule\"><\/div>\n\n<pre><code class=\"language-bash\">$ wget <a target=\"_blank\" rel=\"noopener\" href=\"https://storage.googleapis.com/kubernetes-release/release/v1.13.0/bin/linux/amd64/kube-scheduler\" target=\"_blank\" rel=\"noopener\">https://storage.googleapis.com/kubernetes-release/release/v1.13.0/bin/linux/amd64/kube-scheduler<\/a>\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get pods -n kube-system\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ cat /etc/kubernetes/manifests/kube-scheduler.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ps -aux | grep kube-scheduler\n<\/code><\/pre>","text":"The kube-scheduler only decides which Pod goes on which node . It doesn't actually place the Pod on the node: that's the job of the kubelet . It works in two phases: Filter : it drops nodes that don't fit the Pod (not enough resources, taints, selectors…). Rank : it scores the remaining nodes, for example favouring the node with the most CPU left after placement.","minutes":2,"ncode":4},{"id":"02-kubelet","kind":"lesson","title":"Kubelet","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/09-Kubelet.md","html":"<p>The <strong>kubelet<\/strong> is the captain of each node and its sole point of contact with the cluster. It registers the node, asks the container runtime to create the containers of the Pods assigned to it, then monitors them and reports their status to the kube-apiserver.<\/p>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Common trap<\/p>\n<p><strong>kubeadm does not deploy the kubelet.<\/strong> You must always download and install it manually on each worker node.<\/p>\n<\/div>\n<pre><code class=\"language-bash\">$ wget <a target=\"_blank\" rel=\"noopener\" href=\"https://storage.googleapis.com/kubernetes-release/release/v1.13.0/bin/linux/amd64/kubelet\" target=\"_blank\" rel=\"noopener\">https://storage.googleapis.com/kubernetes-release/release/v1.13.0/bin/linux/amd64/kubelet<\/a>\n<\/code><\/pre>\n<p>To see the process and its effective options on a worker node:<\/p>\n<pre><code class=\"language-bash\">$ ps -aux |grep kubelet\n<\/code><\/pre>","text":"The kubelet is the captain of each node and its sole point of contact with the cluster. It registers the node, asks the container runtime to create the containers of the Pods assigned to it, then monitors them and reports their status to the kube-apiserver. Common trap kubeadm does not deploy the kubelet. You must always download and install it manually on each worker node. To see the process and its effective options on a worker node:","minutes":2,"ncode":2},{"id":"02-kube-proxy","kind":"lesson","title":"Kube Proxy","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/10-Kube-Proxy.md","html":"<p>Within a cluster, every Pod can reach every other Pod thanks to a <strong>Pod network<\/strong>. But Pod IPs change, so applications use <strong>Services<\/strong> instead. A Service is not a process: it only exists in Kubernetes memory.<\/p>\n<p><strong>kube-proxy<\/strong> runs on <strong>every node<\/strong>. Whenever a Service is created, it programs rules (often <code>iptables<\/code>) that forward traffic heading to the Service IP to the actual backend Pods.<\/p>\n<div class=\"anim\" data-anim=\"kubeproxy\"><\/div>\n\n<pre><code class=\"language-bash\">$ wget <a target=\"_blank\" rel=\"noopener\" href=\"https://storage.googleapis.com/kubernetes-release/release/v1.13.0/bin/linux/amd64/kube-proxy\" target=\"_blank\" rel=\"noopener\">https://storage.googleapis.com/kubernetes-release/release/v1.13.0/bin/linux/amd64/kube-proxy<\/a>\n<\/code><\/pre>\n<p>With kubeadm, kube-proxy is deployed as a <strong>DaemonSet<\/strong> (one Pod per node):<\/p>\n<pre><code class=\"language-bash\">$ kubectl get pods -n kube-system\n<\/code><\/pre>","text":"Within a cluster, every Pod can reach every other Pod thanks to a Pod network . But Pod IPs change, so applications use Services instead. A Service is not a process: it only exists in Kubernetes memory. kube-proxy runs on every node . Whenever a Service is created, it programs rules (often iptables ) that forward traffic heading to the Service IP to the actual backend Pods. With kubeadm, kube-proxy is deployed as a DaemonSet (one Pod per node):","minutes":2,"ncode":2},{"id":"02-pods","kind":"lesson","title":"Pods","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/11-Pods.md","html":"<p>Kubernetes doesn't deploy containers directly on worker nodes: it encapsulates them in a <strong>Pod<\/strong>, the smallest object you can create. A Pod usually has a <strong>one-to-one relationship<\/strong> with the container running your application.<\/p>\n<ul>\n<li>To <strong>scale up<\/strong>, you add new <strong>Pods<\/strong>, never more containers to an existing Pod.<\/li>\n<li>A Pod <strong>can<\/strong> hold multiple containers, but usually not of the same kind: typically the application plus a helper container. They share the network (<code>localhost<\/code>), storage and lifecycle.<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"pod\"><\/div>\n\n<p>Create an nginx Pod:<\/p>\n<pre><code class=\"language-bash\">$ kubectl run nginx --image nginx\n<\/code><\/pre>\n<p>List the Pods:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get pods\n<\/code><\/pre>\n<p>Every Kubernetes object defined in YAML has four top-level fields: <code>apiVersion<\/code>, <code>kind<\/code>, <code>metadata<\/code> and <code>spec<\/code>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: myapp-pod\n  labels:\n     app: myapp\n     type: front-end\nspec:\n  containers:\n  - name: nginx-container\n    image: nginx\n<\/code><\/pre>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">Save time<\/p>\n<p>Generate a YAML skeleton instead of writing it: <code>kubectl run redis --image=redis123 --dry-run=client -o yaml &gt; redis.yaml<\/code>, then edit and apply it.<\/p>\n<\/div>","text":"Kubernetes doesn't deploy containers directly on worker nodes: it encapsulates them in a Pod , the smallest object you can create. A Pod usually has a one-to-one relationship with the container running your application. To scale up , you add new Pods , never more containers to an existing Pod. A Pod can hold multiple containers, but usually not of the same kind: typically the application plus a helper container. They share the network ( localhost ), storage and lifecycle. Create an nginx Pod: List the Pods: Every Kubernetes object defined in YAML has four top-level fields: apiVersion , kind , metadata and spec : Save time Generate a YAML skeleton instead of writing it: kubectl run redis --image=redis123 --dry-run=client -o yaml > redis.yaml , then edit and apply it.","minutes":2,"ncode":3},{"id":"02-lab-11","kind":"lab","title":"Lab · Pods","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/13-Practice-Test-PODs.md","practice":"https://kodekloud.com/topic/practice-test-pods/","items":[{"q":"How many pods exist on the system?","a":"<pre><code class=\"language-bash\">kubectl get pods\n<\/code><\/pre>\n<p>Count the number of pods (if any)<\/p>"},{"q":"Create a new pod with the nginx image.","a":"<pre><code class=\"language-bash\">kubectl run nginx --image=nginx\n<\/code><\/pre>"},{"q":"How many pods are created now?","a":"<pre><code class=\"language-bash\">kubectl get pods\n<\/code><\/pre>\n<p>Count the number of pods (if any)<\/p>\n<p>To get the system to tell you you can also do this<\/p>\n<pre><code class=\"language-bash\">kubectl get pods --no-headers | wc -l\n<\/code><\/pre>\n<ul>\n<li><code>--no-headers<\/code> should be obvious - output only the details.<\/li>\n<li><code>wc<\/code> is the word count program. <code>-l<\/code> tells it to count lines instead, and it will count the lines emitted by <code>kubectl<\/code><\/li>\n<\/ul>"},{"q":"What is the image used to create the new pods?","a":"<p><code>kubectl describe<\/code> outputs lots of information. The following will describe all pods whose name starts with <code>newpods<\/code>, and then we filter with <code>grep<\/code> to get what we are looking for.<\/p>\n<pre><code class=\"language-bash\">kubectl describe pod newpods | grep image\n<\/code><\/pre>\n<p>We see that all three are pulling the same image.<\/p>"},{"q":"Which nodes are these pods placed on?","a":"<pre><code class=\"language-bash\">kubectl get pods -o wide\n<\/code><\/pre>\n<p>Note the node column for each of the 3 <code>newpods<\/code> pods<\/p>"},{"q":"How many containers are part of the pod webapp?","a":"<pre><code class=\"language-bash\">kubectl describe pod webapp\n<\/code><\/pre>\n<p>Look under the <code>Containers<\/code> section. Note there is <code>nginx<\/code> and <code>agentx<\/code><\/p>"},{"q":"What images are used in the new webapp pod?","a":"<p>Examine the output from Q6. For each of the identified containers, look at <code>Image:<\/code><\/p>"},{"q":"What is the state of the container agentx in the pod webapp?","a":"<pre><code class=\"language-bash\">kubectl describe pod webapp\n<\/code><\/pre>\n<p>Examine the <code>State:<\/code> field for the <code>agentx<\/code> container.<\/p>"},{"q":"Why do you think the container agentx in pod webapp is in error?","a":"<p>Examine the output from Q8 and look in the <code>Events:<\/code> section at the end. Look at the event that says <code>failed to pull and unpack image ...<\/code><\/p>"},{"q":"What does the READY column in the output of the kubectl get pods command indicate?","a":"<pre><code class=\"language-bash\">kubectl get pods\n<\/code><\/pre>\n<p>Look at the <code>webapp<\/code> pod which we know has two containers and one is in error. You can deduce which of the answers is correct from this.<\/p>"},{"q":"Delete the webapp Pod.","a":"<pre><code class=\"language-bash\">kubectl delete pod webapp\n<\/code><\/pre>\n<p>To delete the pod without any delay and confirmation, we can add <code>--force<\/code> flag. Note that in a real production system, forcing is a last resort as it can leave behind containers that haven't been cleaned up properly. Some may have important cleanup jobs to run when they are requested to terminate, which wouldn't get run.<\/p>\n<p>You can however use <code>--force<\/code> in the exam as it will gain you time. No exam pods rely on any of the above.<\/p>"},{"q":"Create a new pod with the name redis and with the image redis123. — Use a pod-definition YAML file.","a":"<p>To create the pod definition YAML file:<\/p>\n<p><code>--dry-run=client<\/code> tells <code>kubectl<\/code> to test without actually doing anything. <code>-o yaml<\/code> says \"Output what you would send to API server to the console\", which we then redirect into the named file.<\/p>\n<pre><code class=\"language-bash\">kubectl run redis --image=redis123 --dry-run=client -o yaml &gt; redis.yaml\n<\/code><\/pre>\n<p>And now use the YAML you created to deploy the pod.<\/p>\n<pre><code class=\"language-bash\">kubectl create -f redis.yaml\n<\/code><\/pre>"},{"q":"Now change the image on this pod to redis. — Once done, the pod should be in a running state.","a":"<p>There are three ways this can be done!<\/p>\n<ol>\n<li>Method 1 \nEdit your manifest file created in last question<\/li>\n<\/ol>\n<pre><code class=\"language-bash\">vi redis.yaml\n<\/code><\/pre>\n<p>Fix the image name in the redis.yaml to <code>redis<\/code>, save and exit.<\/p>\n<p>Apply the edited yaml<\/p>\n<pre><code class=\"language-bash\">kubectl apply -f redis.yaml\n<\/code><\/pre>\n<ol>\n<li>Method 2 \nEdit the running pod directly (note not all fields can be edited this way)<\/li>\n<\/ol>\n<pre><code>kubectl edit pod redis\n<\/code><\/pre>\n<p>This will bring the pod YAML up in <code>vi<\/code>. Edit it as per method 1. When you eixt <code>vi<\/code> the change will be immediately applied. If you make a mistake, you will be dropped back into <code>vi<\/code><\/p>\n<ol>\n<li>Method 3 \nPatch the image directly. For this you need to know the <code>name<\/code> of the container in the pod, as we assign the new image to that name, as in <code>container_image_name=new_image<\/code><\/li>\n<\/ol>\n<pre><code class=\"language-bash\">kubectl set image pod/redis redis=redis\n<\/code><\/pre>"}],"text":"How many pods exist on the system? Create a new pod with the nginx image. How many pods are created now? What is the image used to create the new pods? Which nodes are these pods placed on? How many containers are part of the pod webapp? What images are used in the new webapp pod? What is the state of the container agentx in the pod webapp? Why do you think the container agentx in pod webapp is in error? What does the READY column in the output of the kubectl get pods command indicate? Delete the webapp Pod. Create a new pod with the name redis and with the image redis123. — Use a pod-definition YAML file. Now change the image on this pod to redis. — Once done, the pod should be in a running state.","minutes":13},{"id":"02-replicasets","kind":"lesson","title":"ReplicaSets","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/14-ReplicaSets.md","html":"<p>Controllers are the brain behind Kubernetes. The <strong>Replication Controller<\/strong> makes sure a given number of Pods is always running: it provides <strong>high availability<\/strong> (a failed Pod is replaced) and <strong>load balancing<\/strong> across nodes. Even for a single Pod, it brings the Pod back up when it fails.<\/p>\n<p>The <strong>ReplicaSet<\/strong> is the newer technology that replaces it. The key difference: it requires a <strong><code>selector<\/code><\/strong>, which also lets it manage Pods created before it, as long as they carry matching labels.<\/p>\n<div class=\"anim\" data-anim=\"replicaset\"><\/div>\n\n<p>Replication Controller definition file:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: ReplicationController\nmetadata:\n  name: myapp-rc\n  labels:\n    app: myapp\n    type: front-end\nspec:\n template:\n    metadata:\n      name: myapp-pod\n      labels:\n        app: myapp\n        type: front-end\n    spec:\n     containers:\n     - name: nginx-container\n       image: nginx\n replicas: 3\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f rc-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get replicationcontroller\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get pods\n<\/code><\/pre>\n<p>ReplicaSet definition file (note <code>apiVersion: apps/v1<\/code> and the <code>selector<\/code>):<\/p>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: ReplicaSet\nmetadata:\n  name: myapp-replicaset\n  labels:\n    app: myapp\n    type: front-end\nspec:\n template:\n    metadata:\n      name: myapp-pod\n      labels:\n        app: myapp\n        type: front-end\n    spec:\n     containers:\n     - name: nginx-container\n       image: nginx\n replicas: 3\n selector:\n   matchLabels:\n    type: front-end\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f replicaset-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get replicaset\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get pods\n<\/code><\/pre>\n<p><strong>Labels and selectors<\/strong>: the ReplicaSet monitors the Pods whose labels match its <code>selector<\/code>. That link is how it knows which Pods to count.<\/p>\n<p><strong>Three ways to scale to 6 replicas<\/strong>:<\/p>\n<ol>\n<li>Update <code>replicas: 6<\/code> in the definition file and apply it:<\/li>\n<\/ol>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: ReplicaSet\nmetadata:\n  name: myapp-replicaset\n  labels:\n    app: myapp\n    type: front-end\nspec:\n template:\n    metadata:\n      name: myapp-pod\n      labels:\n        app: myapp\n        type: front-end\n    spec:\n     containers:\n     - name: nginx-container\n       image: nginx\n replicas: 6\n selector:\n   matchLabels:\n    type: front-end\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl apply -f replicaset-definition.yaml\n<\/code><\/pre>\n<ol start=\"2\">\n<li>Use <code>kubectl scale<\/code> with the file (the file itself is <strong>not<\/strong> updated):<\/li>\n<\/ol>\n<pre><code class=\"language-bash\">$ kubectl scale --replicas=6 -f replicaset-definition.yaml\n<\/code><\/pre>\n<ol start=\"3\">\n<li>Use <code>kubectl scale<\/code> with the type and name:<\/li>\n<\/ol>\n<pre><code class=\"language-bash\">$ kubectl scale --replicas=6 replicaset myapp-replicaset\n<\/code><\/pre>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Remember<\/p>\n<p>Editing the image of a ReplicaSet does not recreate existing Pods. Delete them (the ReplicaSet recreates them with the new image) or use a <strong>Deployment<\/strong>.<\/p>\n<\/div>","text":"Controllers are the brain behind Kubernetes. The Replication Controller makes sure a given number of Pods is always running: it provides high availability (a failed Pod is replaced) and load balancing across nodes. Even for a single Pod, it brings the Pod back up when it fails. The ReplicaSet is the newer technology that replaces it. The key difference: it requires a selector , which also lets it manage Pods created before it, as long as they carry matching labels. Replication Controller definition file: ReplicaSet definition file (note apiVersion: apps/v1 and the selector ): Labels and selectors : the ReplicaSet monitors the Pods whose labels match its selector . That link is how it knows which Pods to count. Three ways to scale to 6 replicas : Update replicas: 6 in the definition file and apply it: Use kubectl scale with the file (the file itself is not updated): Use kubectl scale with the type and name: Remember Editing the image of a ReplicaSet does not recreate existing Pods. Delete them (the ReplicaSet recreates them with the new image) or use a Deployment .","minutes":4,"ncode":12},{"id":"02-lab-13","kind":"lab","title":"Lab · ReplicaSets","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/15-Practice-Tests-ReplicaSet.md","practice":"https://kodekloud.com/topic/practice-test-replicasets/","items":[{"q":"How many pods exist on the system?","a":"<pre><code class=\"language-bash\">kubectl get pods\n<\/code><\/pre>\n<p>Count the number of pods (if any)<\/p>"},{"q":"How many ReplicaSets exist on the system?","a":"<pre><code class=\"language-bash\">kubectl get replicasets\n<\/code><\/pre>\n<p>Count the number of ReplicaSets  (if any)<\/p>"},{"q":"How about now? How many ReplicaSets do you see?","a":"<pre><code class=\"language-bash\">kubectl get replicasets\n<\/code><\/pre>\n<p>Count the number of ReplicaSets  (if any)<\/p>"},{"q":"How many PODs are DESIRED in the new-replica-set?","a":"<p>From the output of Q3, look in <code>DESIRED<\/code> column<\/p>"},{"q":"What is the image used to create the pods in the new-replica-set?","a":"<pre><code>kubectl describe replicaset\n<\/code><\/pre>\n<p>...and look under the containers section --- or --<\/p>\n<pre><code>kubectl get rs -o wide\n<\/code><\/pre>\n<p>...and look in the <code>IMAGES<\/code> column. Kubernetes accepts <code>rs<\/code> as shorthand for <code>replicaset<\/code>.<\/p>"},{"q":"How many PODs are READY in the new-replica-set?","a":"<pre><code>kubectl get rs\n<\/code><\/pre>\n<p>Look in the <code>READY<\/code> column.<\/p>"},{"q":"Why do you think the PODs are not ready?","a":"<pre><code>kubectl describe pods\n<\/code><\/pre>\n<p>Look in the <code>Events<\/code> section at the end.<\/p>"},{"q":"Delete any one of the 4 PODs.","a":"<pre><code>kubectl get pods\n<\/code><\/pre>\n<p>Choose any of the four.<\/p>\n<pre><code>kubectl delete pod new-replica-set-XXXX\n<\/code><\/pre>"},{"q":"How many PODs exist now?","a":"<pre><code>kubectl get pods\n<\/code><\/pre>"},{"q":"Why are there still 4 PODs, even after you deleted one?","a":"<blockquote>\n<p>ReplicaSets ensures that desired number of PODs always run<\/p>\n<\/blockquote>"},{"q":"Create a ReplicaSet using the replicaset-definition-1.yaml file located at /root/. — There is an issue with the file, so try to fix it.","a":"<pre><code>kubectl create -f replicaset-definition-1.yaml\n<\/code><\/pre>\n<p>Note the error message.<\/p>\n<p>Get the apiVersion for replicaset<\/p>\n<pre><code>$ kubectl explain replicaset | grep VERSION\n<\/code><\/pre>\n<p>Update the replicaset definition file in <code>vi<\/code> with correct version and then retry creation.<\/p>\n<pre><code>$ kubectl create -f replicaset-definition-1.yaml\n<\/code><\/pre>"},{"q":"Fix the issue in the replicaset-definition-2.yaml file and create a ReplicaSet using it.","a":"<pre><code>kubectl create -f replicaset-definition-1.yaml\n<\/code><\/pre>\n<p>Note the error message.<\/p>\n<p>Selector matchLabels should match with POD labels - Update <code>replicaset-definition-2.yaml<\/code><\/p>\n<p>The values for labels on lines 9 and 13 should match.<\/p>\n<pre><code>$ kubectl create -f replicaset-definition-2.yaml\n<\/code><\/pre>"},{"q":"Delete the two newly created ReplicaSets - replicaset-1 and replicaset-2","a":"<pre><code>kubectl delete replicaset replicaset-1\nkubectl delete rs replicaset-2\n<\/code><\/pre>\n<p>--- OR ---<\/p>\n<pre><code>kubectl delete replicaset replicaset-1 replicaset-2\n<\/code><\/pre>"},{"q":"Fix the original replica set new-replica-set to use the correct busybox image.","a":"<pre><code>kubectl edit replicaset new-replica-set\n<\/code><\/pre>\n<p>Edit the image to be <code>busybox<\/code>, save and exit.<\/p>"},{"q":"Fix the original replica set new-replica-set to use the correct busybox image.","a":"<pre><code>kubectl edit replicaset new-replica-set\n<\/code><\/pre>\n<p>Fix the image, save and exit.<\/p>\n<p>You will note if you do <code>kubectl get pods<\/code>, that they are still broken. ReplicaSets are not very smart and do not redeploy pods when the container specification has been edited.<\/p>\n<p>We must either delete and recreate the replicaset by exporting its YAML...<\/p>\n<pre><code>kubectl get rs new-replica-set -o yaml &gt; rs.yaml\nkubectl delete rs new-replica-set\nkunectl create -f rs.yaml\n<\/code><\/pre>\n<p>-- OR --<\/p>\n<p>Delete each broken pod. The ReplicaSet will deploy a new one in its place which should be working.<\/p>\n<p>-- OR --<\/p>\n<p>Scale it to zero, then back to 4<\/p>\n<pre><code>kubectl scale rs new-replica-set --replicas 0\nkubectl scale rs new-replica-set --replicas 4\n<\/code><\/pre>"},{"q":"Scale the ReplicaSet to 5 PODs.","a":"<pre><code>kubectl scale rs new-replica-set --replicas 5\n<\/code><\/pre>"}],"text":"How many pods exist on the system? How many ReplicaSets exist on the system? How about now? How many ReplicaSets do you see? How many PODs are DESIRED in the new-replica-set? What is the image used to create the pods in the new-replica-set? How many PODs are READY in the new-replica-set? Why do you think the PODs are not ready? Delete any one of the 4 PODs. How many PODs exist now? Why are there still 4 PODs, even after you deleted one? Create a ReplicaSet using the replicaset-definition-1.yaml file located at /root/. — There is an issue with the file, so try to fix it. Fix the issue in the replicaset-definition-2.yaml file and create a ReplicaSet using it. Delete the two newly created ReplicaSets - replicaset-1 and replicaset-2 Fix the original replica set new-replica-set to use the correct busybox image. Fix the original replica set new-replica-set to use the correct busybox image. Scale the ReplicaSet to 5 PODs.","minutes":16},{"id":"02-deployments","kind":"lesson","title":"Deployments","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/16-Deployments.md","html":"<p>A <strong>Deployment<\/strong> sits above the ReplicaSet. It adds <strong>rolling updates<\/strong>, <strong>rollbacks<\/strong>, and the ability to pause and resume changes. The hierarchy is <strong>Deployment → ReplicaSet → Pods<\/strong>.<\/p>\n<div class=\"anim\" data-anim=\"hierarchy\"><\/div>\n\n<p>The definition file looks like a ReplicaSet's; only <code>kind<\/code> changes:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: myapp-deployment\n  labels:\n    app: myapp\n    type: front-end\nspec:\n template:\n    metadata:\n      name: myapp-pod\n      labels:\n        app: myapp\n        type: front-end\n    spec:\n     containers:\n     - name: nginx-container\n       image: nginx\n replicas: 3\n selector:\n   matchLabels:\n    type: front-end\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f deployment-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get deployment\n<\/code><\/pre>\n<p>The Deployment automatically creates a ReplicaSet:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get replicaset\n<\/code><\/pre>\n<p>Which in turn creates the Pods:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get pods\n<\/code><\/pre>\n<p>To see all objects at once:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get all\n<\/code><\/pre>\n<p>Imperatively, in one line:<\/p>\n<pre><code class=\"language-bash\">kubectl create deployment httpd-frontend --image=httpd:2.4-alpine --replicas=3\n<\/code><\/pre>","text":"A Deployment sits above the ReplicaSet. It adds rolling updates , rollbacks , and the ability to pause and resume changes. The hierarchy is Deployment → ReplicaSet → Pods . The definition file looks like a ReplicaSet's; only kind changes: The Deployment automatically creates a ReplicaSet: Which in turn creates the Pods: To see all objects at once: Imperatively, in one line:","minutes":2,"ncode":7},{"id":"02-lab-15","kind":"lab","title":"Lab · Deployments","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/17-Practice-Tests-Deployments.md","practice":"https://kodekloud.com/topic/practice-tests-deployments/","items":[{"q":"How many pods exist on the system?","a":"<pre><code class=\"language-bash\">kubectl get pods\n<\/code><\/pre>\n<p>Count the number of pods (if any)<\/p>"},{"q":"How many ReplicaSets exist on the system?","a":"<pre><code class=\"language-bash\">kubectl get replicasets\n<\/code><\/pre>\n<p>Count the number of ReplicaSets  (if any)<\/p>"},{"q":"How many Deployments exist on the system?","a":"<pre><code class=\"language-bash\">kubectl get deployments\n<\/code><\/pre>\n<p>Count the number of Deployments  (if any)<\/p>"},{"q":"How many Deployments exist on the system now?","a":"<pre><code class=\"language-bash\">kubectl get deployments\n<\/code><\/pre>\n<p>Count the number of Deployments  (if any)<\/p>"},{"q":"How many ReplicaSets exist on the system now?","a":"<pre><code class=\"language-bash\">kubectl get replicasets\n<\/code><\/pre>\n<p>Count the number of ReplicaSets  (if any)<\/p>"},{"q":"How many Pods exist on the system?","a":"<pre><code class=\"language-bash\">kubectl get pods\n<\/code><\/pre>\n<p>Count the number of pods  (if any)<\/p>"},{"q":"Out of all the existing PODs, how many are ready?","a":"<p>From the output of the previous command, check the <code>READY<\/code> column<\/p>"},{"q":"What is the image used to create the pods in the new deployment?","a":"<pre><code>kubectl describe deployment\n<\/code><\/pre>\n<p>Look under the containers section.<\/p>\n<p>Another way - run the following and check the <code>IMAGES<\/code> column<\/p>\n<pre><code>kubectl get deployment -o wide\n<\/code><\/pre>"},{"q":"Why do you think the deployment is not ready?","a":"<pre><code>kubectl describe pods\n<\/code><\/pre>\n<p>Look under the events section.<\/p>"},{"q":"Create a new Deployment using the deployment-definition-1.yaml file located at /root/. — There is an issue with the file, so try to fix it.","a":"<pre><code>kubectl create -f deployment-definition-1.yaml\n<\/code><\/pre>\n<p>Note the error<\/p>\n<p>Edit the file with <code>vi<\/code>...<\/p>\n<p>The value for <strong><code>kind<\/code><\/strong> is incorrect. It should be <strong><code>Deployment<\/code><\/strong> with a capital <strong><code>D<\/code><\/strong>. Update the deployment definition and create the deployment with the above command.<\/p>"},{"q":"Create a new Deployment with the below attributes using your own deployment definition file.","a":"<p>Create a deployment definition file in <code>vi<\/code>, e.g. <code>my-deployment.yaml<\/code> with the following<\/p>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  labels:\n    app: httpd-frontend\n  name: httpd-frontend\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: httpd-frontend\n  template:\n    metadata:\n      labels:\n        app: httpd-frontend\n    spec:\n      containers:\n      - image: httpd:2.4-alpine\n        name: httpd\n<\/code><\/pre>\n<pre><code>kubectl create -f my-deployment.yaml\n<\/code><\/pre>\n<p>Or we could create it imperatively...<\/p>\n<pre><code>kubectl create deployment httpd-frontend --image=httpd:2.4-alpine --replicas=3\n<\/code><\/pre>"}],"text":"How many pods exist on the system? How many ReplicaSets exist on the system? How many Deployments exist on the system? How many Deployments exist on the system now? How many ReplicaSets exist on the system now? How many Pods exist on the system? Out of all the existing PODs, how many are ready? What is the image used to create the pods in the new deployment? Why do you think the deployment is not ready? Create a new Deployment using the deployment-definition-1.yaml file located at /root/. — There is an issue with the file, so try to fix it. Create a new Deployment with the below attributes using your own deployment definition file.","minutes":11},{"id":"02-namespaces","kind":"lesson","title":"Namespaces","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/18-Namespaces.md","html":"<p>A <strong>namespace<\/strong> isolates a set of resources, like members of different households who share a first name but live in different houses. Kubernetes creates three at setup:<\/p>\n<ul>\n<li><strong>default<\/strong>: where you work unless told otherwise;<\/li>\n<li><strong>kube-system<\/strong>: the internal components, kept apart to prevent accidental deletion;<\/li>\n<li><strong>kube-public<\/strong>: resources that should be available to all users.<\/li>\n<\/ul>\n<p>Each namespace can have its own <strong>policies<\/strong> (who can do what) and <strong>resource quotas<\/strong>. Within a namespace, resources reach each other by name (<code>db-service<\/code>); across namespaces, you append the namespace (<code>db-service.dev.svc.cluster.local<\/code>).<\/p>\n<div class=\"anim\" data-anim=\"dnsname\"><\/div>\n\n<pre><code class=\"language-bash\">$ kubectl get pods\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get pods --namespace=kube-system\n<\/code><\/pre>\n<p>This Pod is created in the <code>default<\/code> namespace:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: myapp-pod\n  labels:\n     app: myapp\n     type: front-end\nspec:\n  containers:\n  - name: nginx-container\n    image: nginx\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pod-definition.yaml\n<\/code><\/pre>\n<p>To create it in another namespace:<\/p>\n<pre><code class=\"language-bash\">$ kubectl create -f pod-definition.yaml --namespace=dev\n<\/code><\/pre>\n<p>Or pin the namespace in the definition file:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: myapp-pod\n  namespace: dev\n  labels:\n     app: myapp\n     type: front-end\nspec:\n  containers:\n  - name: nginx-container\n    image: nginx\n<\/code><\/pre>\n<p>Create a namespace declaratively:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Namespace\nmetadata:\n  name: dev\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f namespace-dev.yaml\n<\/code><\/pre>\n<p>Or imperatively:<\/p>\n<pre><code class=\"language-bash\">$ kubectl create namespace dev\n<\/code><\/pre>\n<p>Switch to a namespace permanently:<\/p>\n<pre><code class=\"language-bash\">$ kubectl config set-context $(kubectl config current-context) --namespace=dev\n<\/code><\/pre>\n<p>View Pods in all namespaces:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get pods --all-namespaces\n<\/code><\
