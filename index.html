ntify the POD that consumes the least CPU(cores).","a":"<p>Run the <code>kubectl top pod<\/code> command<\/p>\n<pre><code>kubectl top pod\n<\/code><\/pre>\n<p>Examine the <code>CPU(cores)<\/code> column of the output to get the answer.<\/p>"}],"text":"We have deployed a few PODs running workloads. Inspect it. Let us deploy metrics-server to monitor the PODs and Nodes. Pull the git repository for the deployment files. Deploy the metrics-server by creating all the components downloaded. It takes a few minutes for the metrics server to start gathering data. Identify the node that consumes the most CPU(cores). Identify the node that consumes the most Memory(bytes). Identify the POD that consumes the most Memory(bytes). Identify the POD that consumes the least CPU(cores).","minutes":8},{"id":"04-app-logs","kind":"lesson","title":"Managing Application Logs","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/04-Logging-and-Monitoring/04-Managing-Application-Logs.md","html":"<p>With Docker, a container writing to standard output is read with <code>docker logs -f &lt;id&gt;<\/code>. Kubernetes follows the same idea:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: event-simulator-pod\nspec:\n  containers:\n  - name: event-simulator\n    image: kodekloud/event-simulator\n<\/code><\/pre>\n<p>Stream the logs live (<code>-f<\/code> for <em>follow<\/em>):<\/p>\n<pre><code class=\"language-bash\">$ kubectl logs -f event-simulator-pod\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"logs\"><\/div>\n\n<p>If the Pod has <strong>multiple containers<\/strong>, you must name the container explicitly, otherwise the command fails:<\/p>\n<pre><code class=\"language-bash\">$ kubectl logs -f &lt;pod-name&gt; &lt;container-name&gt;\n$ kubectl logs -f even-simulator-pod event-simulator\n<\/code><\/pre>\n<div class=\"admonition tip\">\n<p class=\"admonition-title\">Useful flags<\/p>\n<p><code>--previous<\/code> shows the logs of the container before its last restart, <code>--tail=20<\/code> the last 20 lines, <code>-c &lt;name&gt;<\/code> names the container explicitly.<\/p>\n<\/div>","text":"With Docker, a container writing to standard output is read with docker logs -f <id> . Kubernetes follows the same idea: Stream the logs live ( -f for follow ): If the Pod has multiple containers , you must name the container explicitly, otherwise the command fails: Useful flags --previous shows the logs of the container before its last restart, --tail=20 the last 20 lines, -c <name> names the container explicitly.","minutes":2,"ncode":3},{"id":"04-lab-3","kind":"lab","title":"Lab · Application Logs","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/04-Logging-and-Monitoring/06-Practice-Test-Managing-Application-Logs.md","practice":"https://kodekloud.com/topic/practice-test-managing-application-logs/","items":[{"q":"We have deployed a POD hosting an application. Inspect it. Wait for it to start.","a":"<pre><code>$ kubectl get pods\n<\/code><\/pre>"},{"q":"Inspect the logs of the POD","a":"<pre><code>$ kubectl logs webapp-1\n<\/code><\/pre>"},{"q":"We have deployed a new POD - &#x27;webapp-2&#x27; - hosting an application. Inspect it. Wait for it to start.","a":"<pre><code>$ kubectl get pods\n<\/code><\/pre>"},{"q":"Inspect the logs of the webapp in the POD","a":"<pre><code>$ kubectl logs webapp-2\n<\/code><\/pre>"}],"text":"We have deployed a POD hosting an application. Inspect it. Wait for it to start. Inspect the logs of the POD We have deployed a new POD - 'webapp-2' - hosting an application. Inspect it. Wait for it to start. Inspect the logs of the webapp in the POD","minutes":4}],"quiz":[{"q":"Where does the Metrics Server get Pod metrics from?","options":["From etcd","From the kubelet, through cAdvisor","From kube-proxy"],"answer":1,"explain":"cAdvisor, built into the kubelet, collects container performance metrics."},{"q":"Does the Metrics Server keep a history of metrics?","options":["Yes, in etcd","No, everything is in memory"],"answer":1,"explain":"For history, you need a solution such as Prometheus."},{"q":"Which command shows node resource usage?","options":["kubectl top node","kubectl get metrics","kubectl describe node --usage"],"answer":0,"explain":"kubectl top pod does the same for Pods."},{"q":"A Pod has two containers. What must you add to kubectl logs?","options":["--all","The container name","Nothing"],"answer":1,"explain":"For example kubectl logs -f webapp event-simulator, or -c event-simulator."}],"folder":"04-Logging-and-Monitoring"},{"num":"05","title":"Application Lifecycle Management","short":"App lifecycle","summary":"Rolling updates and rollbacks, commands and arguments, environment variables, ConfigMaps, Secrets, multi-container Pods and init containers.","lessons":[{"id":"05-rolling-updates","kind":"lesson","title":"Rolling Updates and Rollback","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/02-RollingUpdates-and-Rollback.md","html":"<p>Creating a Deployment triggers a <strong>rollout<\/strong>, which creates a <strong>revision<\/strong> (revision 1). Every update to the container image or configuration triggers a new rollout and a new revision. This keeps track of changes and lets you roll back.<\/p>\n<pre><code class=\"language-bash\">$ kubectl rollout status deployment/myapp-deployment\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl rollout history deployment/myapp-deployment\n<\/code><\/pre>\n<p><strong>Two deployment strategies<\/strong>:<\/p>\n<ol>\n<li><strong>Recreate<\/strong>: destroy all old instances, then create the new ones. The application is <strong>down<\/strong> in between.<\/li>\n<li><strong>RollingUpdate<\/strong> (default strategy): replace instances <strong>one by one<\/strong>. The application stays available.<\/li>\n<\/ol>\n<div class=\"anim\" data-anim=\"rolling\"><\/div>\n\n<p>Under the hood, the Deployment creates a <strong>new ReplicaSet<\/strong> and scales it up while scaling the old one down. Afterwards, <code>kubectl get replicasets<\/code> shows the old ReplicaSet with 0 Pods and the new one with 5.<\/p>\n<p>To update, edit the definition file (here the image) and apply it:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata:\n name: myapp-deployment\n labels:\n  app: nginx\nspec:\n template:\n   metadata:\n     name: myap-pod\n     labels:\n       app: myapp\n       type: front-end\n   spec:\n    containers:\n    - name: nginx-container\n      image: nginx:1.7.1\n replicas: 3\n selector:\n  matchLabels:\n    type: front-end\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl apply -f deployment-definition.yaml\n<\/code><\/pre>\n<p>Or directly, without touching the file (which will then be out of date):<\/p>\n<pre><code class=\"language-bash\">$ kubectl set image deployment/myapp-deployment nginx=nginx:1.9.1\n<\/code><\/pre>\n<p><code>kubectl describe deployment<\/code> shows the difference: with Recreate, the old ReplicaSet is scaled to 0 and then the new one to 5; with RollingUpdate, both change in small steps.<\/p>\n<p>Undo a change:<\/p>\n<pre><code class=\"language-bash\">$ kubectl rollout undo deployment/myapp-deployment\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create deployment nginx --image=nginx\n<\/code><\/pre>\n<p>Summary of kubectl commands:<\/p>\n<pre><code class=\"language-bash\">$ kubectl create -f deployment-definition.yaml\n$ kubectl get deployments\n$ kubectl apply -f deployment-definition.yaml\n$ kubectl set image deployment/myapp-deployment nginx=nginx:1.9.1\n$ kubectl rollout status deployment/myapp-deployment\n$ kubectl rollout history deployment/myapp-deployment\n$ kubectl rollout undo deployment/myapp-deployment\n<\/code><\/pre>","text":"Creating a Deployment triggers a rollout , which creates a revision (revision 1). Every update to the container image or configuration triggers a new rollout and a new revision. This keeps track of changes and lets you roll back. Two deployment strategies : Recreate : destroy all old instances, then create the new ones. The application is down in between. RollingUpdate (default strategy): replace instances one by one . The application stays available. Under the hood, the Deployment creates a new ReplicaSet and scales it up while scaling the old one down. Afterwards, kubectl get replicasets shows the old ReplicaSet with 0 Pods and the new one with 5. To update, edit the definition file (here the image) and apply it: Or directly, without touching the file (which will then be out of date): kubectl describe deployment shows the difference: with Recreate, the old ReplicaSet is scaled to 0 and then the new one to 5; with RollingUpdate, both change in small steps. Undo a change: Summary of kubectl commands:","minutes":3,"ncode":8},{"id":"05-lab-1","kind":"lab","title":"Lab · Rolling Updates and Rollback","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/03-Practice-Test-RollingUpdates-Rollback.md","practice":"https://kodekloud.com/topic/practice-test-rolling-updates-and-rollbacks/","items":[{"q":"We have deployed a simple web application. Inspect the PODs and the Services","a":"<pre><code>$ kubectl get pods\n$ kubectl get services\n<\/code><\/pre>"},{"q":"What is the current color of the web application?","a":"<pre><code>Access the web portal\n<\/code><\/pre>"},{"q":"Execute the script at /root/curl-test.sh.","a":""},{"q":"Run the command &#x27;kubectl describe deployment&#x27; and look at &#x27;Desired Replicas&#x27;","a":"<pre><code>$ kubectl describe deployment\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl describe deployment&#x27; and look for &#x27;Images&#x27;","a":"<pre><code>$ kubectl describe deployment\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl describe deployment&#x27; and look at &#x27;StrategyType&#x27;","a":"<pre><code>$ kubectl describe deployment\n<\/code><\/pre>"},{"q":"If you were to upgrade the application now what would happen?","a":"<pre><code>PODs are upgraded few at a time\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl edit deployment frontend&#x27; and modify the required feild","a":"<pre><code>$ kubectl edit deployment frontend\n<\/code><\/pre>"},{"q":"Execute the script at /root/curl-test.sh.","a":""},{"q":"Look at the Max Unavailable value under RollingUpdateStrategy in deployment details","a":"<pre><code>$ kubectl describe deployment\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl edit deployment frontend&#x27; and modify the required field. Make sure to delete the properties of rollingUpdate as well, set at &#x27;strategy.rollingUpdate&#x27;.","a":"<pre><code>$ kubectl edit deployment frontend\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl edit deployment frontend&#x27; and modify the required feild","a":"<pre><code>$ kubectl edit deployment frontend\n<\/code><\/pre>"},{"q":"Execute the script at /root/curl-test.sh.","a":""}],"text":"We have deployed a simple web application. Inspect the PODs and the Services What is the current color of the web application? Execute the script at /root/curl-test.sh. Run the command 'kubectl describe deployment' and look at 'Desired Replicas' Run the command 'kubectl describe deployment' and look for 'Images' Run the command 'kubectl describe deployment' and look at 'StrategyType' If you were to upgrade the application now what would happen? Run the command 'kubectl edit deployment frontend' and modify the required feild Execute the script at /root/curl-test.sh. Look at the Max Unavailable value under RollingUpdateStrategy in deployment details Run the command 'kubectl edit deployment frontend' and modify the required field. Make sure to delete the properties of rollingUpdate as well, set at 'strategy.rollingUpdate'. Run the command 'kubectl edit deployment frontend' and modify the required feild Execute the script at /root/curl-test.sh.","minutes":13},{"id":"05-docker-commands","kind":"lesson","title":"Commands and Arguments in Docker","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/04-Commands-and-Arguments-in-Docker.md","html":"<pre><code class=\"language-bash\">$ docker run ubuntu\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ docker ps\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ docker ps -a\n<\/code><\/pre>\n<p>The <code>ubuntu<\/code> container exits immediately. Unlike virtual machines, <strong>containers are not meant to host an operating system<\/strong>: they run a specific task or process (a web server, a database…) and live only as long as that process. The default process of the ubuntu image is <code>bash<\/code>, which exits without a terminal.<\/p>\n<p>You can override the default command by appending it to <code>docker run<\/code>:<\/p>\n<pre><code class=\"language-bash\">$ docker run ubuntu sleep 5\n<\/code><\/pre>\n<p>To make it permanent, build an image with the <code>CMD<\/code> instruction, in shell form (<code>CMD sleep 5<\/code>) or JSON array form (<code>CMD [\"sleep\", \"5\"]<\/code>, where the first element must be the executable):<\/p>\n<pre><code class=\"language-bash\">$ docker build -t ubuntu-sleeper .\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ docker run ubuntu-sleeper\n<\/code><\/pre>\n<p><strong>ENTRYPOINT<\/strong>: like CMD, it specifies the program run when the container starts, but whatever you pass on the command line is <strong>appended<\/strong> to it instead of replacing it. Combine both: <code>ENTRYPOINT [\"sleep\"]<\/code> sets the program, <code>CMD [\"5\"]<\/code> the default value. To override the entrypoint at runtime: <code>docker run --entrypoint sleep2.0 ubuntu-sleeper 10<\/code>.<\/p>\n<div class=\"anim\" data-anim=\"cmdargs\"><\/div>","text":"The ubuntu container exits immediately. Unlike virtual machines, containers are not meant to host an operating system : they run a specific task or process (a web server, a database…) and live only as long as that process. The default process of the ubuntu image is bash , which exits without a terminal. You can override the default command by appending it to docker run : To make it permanent, build an image with the CMD instruction, in shell form ( CMD sleep 5 ) or JSON array form ( CMD [\"sleep\", \"5\"] , where the first element must be the executable): ENTRYPOINT : like CMD, it specifies the program run when the container starts, but whatever you pass on the command line is appended to it instead of replacing it. Combine both: ENTRYPOINT [\"sleep\"] sets the program, CMD [\"5\"] the default value. To override the entrypoint at runtime: docker run --entrypoint sleep2.0 ubuntu-sleeper 10 .","minutes":2,"ncode":6},{"id":"05-k8s-commands","kind":"lesson","title":"Commands and Arguments in Kubernetes","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/05-Commands-and-Arguments-in-Kubernetes.md","html":"<p>The two Pod fields map to the two Dockerfile instructions:<\/p>\n<table>\n<thead>\n<tr>\n<th>Dockerfile<\/th>\n<th>Kubernetes Pod<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ENTRYPOINT<\/code><\/td>\n<td><code>command<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>CMD<\/code><\/td>\n<td><code>args<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Anything appended to <code>docker run<\/code> goes into the <code>args<\/code> property, as an array. <code>command<\/code> overrides the image's ENTRYPOINT.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: ubuntu-sleeper-pod\nspec:\n containers:\n - name: ubuntu-sleeper\n   image: ubuntu-sleeper\n   command: [&quot;sleep2.0&quot;]\n   args: [&quot;10&quot;]\n<\/code><\/pre>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">Exam tip<\/p>\n<p>You can't edit <code>command<\/code> or <code>args<\/code> on an existing Pod. <code>kubectl edit<\/code> saves a copy in <code>/tmp<\/code>; apply it with <code>kubectl replace --force -f /tmp/kubectl-edit-xxx.yaml<\/code>.<\/p>\n<\/div>","text":"The two Pod fields map to the two Dockerfile instructions: Dockerfile Kubernetes Pod ENTRYPOINT command CMD args Anything appended to docker run goes into the args property, as an array. command overrides the image's ENTRYPOINT. Exam tip You can't edit command or args on an existing Pod. kubectl edit saves a copy in /tmp ; apply it with kubectl replace --force -f /tmp/kubectl-edit-xxx.yaml .","minutes":2,"ncode":1},{"id":"05-lab-4","kind":"lab","title":"Lab · Commands and Arguments","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/06-Practice-Test-Commands-and-Arguments.md","practice":"https://kodekloud.com/topic/practice-test-commands-and-arguments/","items":[{"q":"Run the command &#x27;kubectl get pods&#x27; and count the number of pods.","a":"<pre><code>$ kubectl get pods\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl describe pod&#x27; and look for command option","a":"<pre><code>$ kubectl describe pod\n<\/code><\/pre>"},{"q":"Set the command option to [&#x27;sleep&#x27;, &#x27;5000&#x27;]. Answer file at: /var/answers/answer-ubuntu-sleeper-2.yaml","a":""},{"q":"Both sleep and 1200 should be defined as a string. Answer file at: /var/answers/answer-ubuntu-sleeper-3.yaml","a":""},{"q":"Answer file at: /var/answers/answer-ubuntu-sleeper-3-2.yaml","a":""},{"q":"Inspect the file &#x27;Dockerfile&#x27; given at /root/webapp-color. What command is run at container startup?","a":"<pre><code>python app.py\n<\/code><\/pre>"},{"q":"Inspect the file &#x27;Dockerfile2&#x27; given at /root/webapp-color. What command is run at container startup?","a":"<pre><code>python app.py --color red\n<\/code><\/pre>"},{"q":"The &#x27;command&#x27; (entrypoint) is overridden in the pod definition. So the answer is --color green","a":""},{"q":"Inspect the two files under directory &#x27;webapp-color-3&#x27;. What command is run at container startup?","a":"<pre><code>python app.py --color pink\n<\/code><\/pre>"},{"q":"Answer file located at /var/answers/answer-webapp-color-green.yaml","a":""}],"text":"Run the command 'kubectl get pods' and count the number of pods. Run the command 'kubectl describe pod' and look for command option Set the command option to ['sleep', '5000']. Answer file at: /var/answers/answer-ubuntu-sleeper-2.yaml Both sleep and 1200 should be defined as a string. Answer file at: /var/answers/answer-ubuntu-sleeper-3.yaml Answer file at: /var/answers/answer-ubuntu-sleeper-3-2.yaml Inspect the file 'Dockerfile' given at /root/webapp-color. What command is run at container startup? Inspect the file 'Dockerfile2' given at /root/webapp-color. What command is run at container startup? The 'command' (entrypoint) is overridden in the pod definition. So the answer is --color green Inspect the two files under directory 'webapp-color-3'. What command is run at container startup? Answer file located at /var/answers/answer-webapp-color-green.yaml","minutes":10},{"id":"05-env-vars","kind":"lesson","title":"Configure Environment Variables in Applications","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/07.Configure-Environment-Variables-in-Applications.md","html":"<p>With Docker:<\/p>\n<pre><code class=\"language-bash\">$ docker run -e APP_COLOR=pink simple-webapp-color\n<\/code><\/pre>\n<p>In a Pod, use the <strong><code>env<\/code><\/strong> property, an array of <code>name<\/code> / <code>value<\/code> pairs:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: simple-webapp-color\nspec:\n containers:\n - name: simple-webapp-color\n   image: simple-webapp-color\n   ports:\n   - containerPort: 8080\n   env:\n   - name: APP_COLOR\n     value: pink\n<\/code><\/pre>\n<p>Instead of a plain value, you can read it from a ConfigMap (<code>valueFrom.configMapKeyRef<\/code>) or a Secret (<code>valueFrom.secretKeyRef<\/code>).<\/p>","text":"With Docker: In a Pod, use the env property, an array of name / value pairs: Instead of a plain value, you can read it from a ConfigMap ( valueFrom.configMapKeyRef ) or a Secret ( valueFrom.secretKeyRef ).","minutes":2,"ncode":2},{"id":"05-configmaps","kind":"lesson","title":"Configure ConfigMaps in Applications","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/08-Configure-ConfigMaps-in-Applications.md","html":"<p>When environment variables pile up, move them out of the Pod definitions into a <strong>ConfigMap<\/strong>, which stores key-value pairs in plain text. Two phases: <strong>create<\/strong> the ConfigMap, then <strong>inject<\/strong> it into the Pod.<\/p>\n<p>Imperative way:<\/p>\n<pre><code class=\"language-bash\">$ kubectl create configmap app-config --from-literal=APP_COLOR=blue --from-literal=APP_MODE=prod\n$ kubectl create configmap app-config --from-file=app_config.properties (Another way)\n<\/code><\/pre>\n<p>Declarative way (no <code>spec<\/code>, but <code>data<\/code>):<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: ConfigMap\nmetadata:\n name: app-config\ndata:\n APP_COLOR: blue\n APP_MODE: prod\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f config-map.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get configmaps (or)\n$ kubectl get cm\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl describe configmaps\n<\/code><\/pre>\n<p>Inject all keys with <code>envFrom<\/code>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: simple-webapp-color\nspec:\n containers:\n - name: simple-webapp-color\n   image: simple-webapp-color\n   ports:\n   - containerPort: 8080\n   envFrom:\n   - configMapRef:\n       name: app-config\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: app-config\ndata:\n  APP_COLOR: blue\n  APP_MODE: prod\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pod-definition.yaml\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"configmap\"><\/div>\n\n<p>Three ways to inject: all keys (<code>envFrom<\/code>), a <strong>single environment variable<\/strong> (<code>env[].valueFrom.configMapKeyRef<\/code> with <code>name<\/code> and <code>key<\/code>), or <strong>files in a volume<\/strong> (one key = one file).<\/p>","text":"When environment variables pile up, move them out of the Pod definitions into a ConfigMap , which stores key-value pairs in plain text. Two phases: create the ConfigMap, then inject it into the Pod. Imperative way: Declarative way (no spec , but data ): Inject all keys with envFrom : Three ways to inject: all keys ( envFrom ), a single environment variable ( env[].valueFrom.configMapKeyRef with name and key ), or files in a volume (one key = one file).","minutes":2,"ncode":8},{"id":"05-lab-7","kind":"lab","title":"Lab · Environment Variables","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/09-Practice-Test-Env-Variables.md","practice":"https://kodekloud.com/topic/practice-test-env-variables/","items":[{"q":"Run the command &#x27;kubectl get pods&#x27; and count the number of pods.","a":"<pre><code>$ kubectl get pods\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl describe pod&#x27; and look for ENV option","a":"<pre><code>$ kubectl describe pod\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl describe pod&#x27; and look for ENV option","a":"<pre><code>$ kubectl describe pod\n<\/code><\/pre>"},{"q":"View the web application UI by clicking on the &#x27;Webapp Color&#x27; Tab above your terminal.","a":""},{"q":"Set the environment option to APP_COLOR - green.","a":"<pre><code>$ kubectl get pods webapp-color -o yaml &gt; green.yaml\n$ kubectl delete pods webapp-color\nUpdate APP_COLOR to green\n$ kubectl create -f green.yaml\n<\/code><\/pre>"},{"q":"View the changes to the web application UI by clicking on the &#x27;Webapp Color&#x27; Tab above your terminal.","a":""},{"q":"Run kubectl get configmaps","a":"<pre><code>$ kubectl get configmaps\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl describe configmaps&#x27; and look for DB_HOST option","a":"<pre><code>$ kubectl describe configmaps\n<\/code><\/pre>"},{"q":"Create a new ConfigMap for the &#x27;webapp-color&#x27; POD. Use the spec given on the right.","a":"<pre><code>$ kubectl create configmap webapp-config-map --from-literal=APP_COLOR=darkblue\n<\/code><\/pre>"},{"q":"Set the environment option to envFrom and use configMapRef webapp-config-map.","a":"<pre><code>$ kubectl get pods webapp-color -o yaml &gt; new-webapp.yaml\n$ kubectl delete pods webapp-color\n Update pod definition file, under spec.containers section update the below.\n- envFrom:\n  - configMapRef:\n     name: webapp-config-map\n<\/code><\/pre>\n<pre><code>$ kubectl create -f new-webapp.yaml\n<\/code><\/pre>"},{"q":"View the changes to the web application UI by clicking on the &#x27;Webapp Color&#x27; Tab above your terminal.","a":""}],"text":"Run the command 'kubectl get pods' and count the number of pods. Run the command 'kubectl describe pod' and look for ENV option Run the command 'kubectl describe pod' and look for ENV option View the web application UI by clicking on the 'Webapp Color' Tab above your terminal. Set the environment option to APP_COLOR - green. View the changes to the web application UI by clicking on the 'Webapp Color' Tab above your terminal. Run kubectl get configmaps Run the command 'kubectl describe configmaps' and look for DB_HOST option Create a new ConfigMap for the 'webapp-color' POD. Use the spec given on the right. Set the environment option to envFrom and use configMapRef webapp-config-map. View the changes to the web application UI by clicking on the 'Webapp Color' Tab above your terminal.","minutes":11},{"id":"05-secrets","kind":"lesson","title":"Secrets","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/10.Secrets.md","html":"<p>Putting a password in a ConfigMap is a bad idea: it is stored in plain text.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: ConfigMap\nmetadata:\n name: app-config\ndata:\n  DB_Host: mysql\n  DB_User: root\n  DB_Password: paswrd\n<\/code><\/pre>\n<p><strong>Secrets<\/strong> are used to store sensitive information. As with ConfigMaps: <strong>create<\/strong> the Secret, then <strong>inject<\/strong> it.<\/p>\n<p>Imperative way:<\/p>\n<pre><code class=\"language-bash\">$ kubectl create secret generic app-secret --from-literal=DB_Host=mysql --from-literal=DB_User=root --from-literal=DB_Password=paswrd\n$ kubectl create secret generic app-secret --from-file=app_secret.properties\n<\/code><\/pre>\n<p>Declarative way: values must be <strong>base64-encoded<\/strong>.<\/p>\n<pre><code class=\"language-bash\">$ echo -n &quot;mysql&quot; | base64\n$ echo -n &quot;root&quot; | base64\n$ echo -n &quot;paswrd&quot;| base64\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Secret\nmetadata:\n name: app-secret\ndata:\n  DB_Host: bX1zcWw=\n  DB_User: cm9vdA==\n  DB_Password: cGFzd3Jk\n<\/code><\/pre>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Correction<\/p>\n<p>In the repo, <code>DB_Host<\/code> is <code>bX1zcWw=<\/code>, which decodes to <code>m}sql<\/code>. The correct encoding of <code>mysql<\/code> is <code>bXlzcWw=<\/code>. Check it with the tool below.<\/p>\n<\/div>\n<div class=\"anim\" data-anim=\"base64\"><\/div>\n\n<pre><code class=\"language-bash\">$ kubectl create -f secret-data.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get secrets\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl describe secret\n<\/code><\/pre>\n<p>View the (encoded) values:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get secret app-secret -o yaml\n<\/code><\/pre>\n<p>Decode them:<\/p>\n<pre><code class=\"language-bash\">$ echo -n &quot;bX1zcWw=&quot; | base64 --decode\n$ echo -n &quot;cm9vdA==&quot; | base64 --decode\n$ echo -n &quot;cGFzd3Jk&quot; | base64 --decode\n<\/code><\/pre>\n<p>Inject with <code>envFrom<\/code> / <code>secretRef<\/code>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Secret\nmetadata:\n name: app-secret\ndata:\n  DB_Host: bX1zcWw=\n  DB_User: cm9vdA==\n  DB_Password: cGFzd3Jk\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: simple-webapp-color\nspec:\n containers:\n - name: simple-webapp-color\n   image: simple-webapp-color\n   ports:\n   - containerPort: 8080\n   envFrom:\n   - secretRef:\n       name: app-secret\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pod-definition.yaml\n<\/code><\/pre>\n<p>You can also inject a single variable (<code>secretKeyRef<\/code>) or mount the whole Secret as a <strong>volume<\/strong>: each attribute becomes a file whose content is the value (<code>/opt/app-secret-volumes/DB_Password<\/code> contains <code>paswrd<\/code>).<\/p>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">A Secret is not encrypted<\/p>\n<p>Base64 is an <strong>encoding<\/strong>, not encryption: anyone can decode it. Safety comes from the practices around Secrets:<\/p>\n<ul>\n<li>don't check Secret definition files into source code repositories;<\/li>\n<li>enable <strong>Encryption at Rest<\/strong> so Secrets are stored encrypted in ETCD;<\/li>\n<li>restrict access with RBAC.<\/li>\n<\/ul>\n<p>Kubernetes also limits exposure: a Secret is only sent to a node if a Pod on that node needs it, the kubelet stores it in a <strong>tmpfs<\/strong> (never written to disk), and deletes its local copy when the Pod is deleted. For more: Helm Secrets, HashiCorp Vault.<\/p>\n<\/div>","text":"Putting a password in a ConfigMap is a bad idea: it is stored in plain text. Secrets are used to store sensitive information. As with ConfigMaps: create the Secret, then inject it. Imperative way: Declarative way: values must be base64-encoded . Correction In the repo, DB_Host is bX1zcWw= , which decodes to m}sql . The correct encoding of mysql is bXlzcWw= . Check it with the tool below. View the (encoded) values: Decode them: Inject with envFrom / secretRef : You can also inject a single variable ( secretKeyRef ) or mount the whole Secret as a volume : each attribute becomes a file whose content is the value ( /opt/app-secret-volumes/DB_Password contains paswrd ). A Secret is not encrypted Base64 is an encoding , not encryption: anyone can decode it. Safety comes from the practices around Secrets: don't check Secret definition files into source code repositories; enable Encryption at Rest so Secrets are stored encrypted in ETCD; restrict access with RBAC. Kubernetes also limits exposure: a Secret is only sent to a node if a Pod on that node needs it, the kubelet stores it in a tmpfs (never written to disk), and deletes its local copy when the Pod is deleted. For more: Helm Secrets, HashiCorp Vault.","minutes":4,"ncode":12},{"id":"05-lab-9","kind":"lab","title":"Lab · Secrets","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/11.Practice-Test-Secrets.md","practice":"https://kodekloud.com/topic/practice-test-secrets/","items":[{"q":"Run the command &#x27;kubectl get secrets&#x27; and count the number of pods.","a":"<pre><code>$ kubectl get secrets\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl get secrets&#x27; and look at the DATA field","a":"<pre><code>$ kubectl get secrets\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl describe secret&#x27;","a":"<pre><code>$ kubectl describe secret\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl describe secret&#x27;","a":"<pre><code>$ kubectl describe secret\n<\/code><\/pre>"},{"q":"We have already deployed the required pods and services. Check out the pods and services created. Check out the web application using the &#x27;Webapp MySQL&#x27; link above your terminal, next to the Quiz Portal Link.","a":""},{"q":"Run command kubectl create secret generic db-secret --from-literal=DB_Host=sql01 --from-literal=DBUser=root --from-literal=DB_Password=password123","a":"<pre><code>$ kubectl create secret generic db-secret --from-literal=DB_Host=sql01 --from-literal=DB_User=root --from-literal=DB_Password=password123\n<\/code><\/pre>"},{"q":"Check Answer at /var/answers/answer-webapp.yaml","a":"<pre><code>$ kubectl get pod webapp-pod -o yaml &gt; web.yaml\n$ kubectl delete pod webapp-pod\n<\/code><\/pre>\n<p>Update web.yaml with secret section<\/p>\n<p>envFrom:<\/p>"},{"q":"secretRef:","a":"<p>name: db-secret<\/p>\n<pre><code>$ kubectl create -f web.yaml\n<\/code><\/pre>"},{"q":"View the web application to verify it can successfully connect to the database","a":""}],"text":"Run the command 'kubectl get secrets' and count the number of pods. Run the command 'kubectl get secrets' and look at the DATA field Run the command 'kubectl describe secret' Run the command 'kubectl describe secret' We have already deployed the required pods and services. Check out the pods and services created. Check out the web application using the 'Webapp MySQL' link above your terminal, next to the Quiz Portal Link. Run command kubectl create secret generic db-secret --from-literal=DB_Host=sql01 --from-literal=DBUser=root --from-literal=DB_Password=password123 Check Answer at /var/answers/answer-webapp.yaml secretRef: View the web application to verify it can successfully connect to the database","minutes":9},{"id":"05-multi-container","kind":"lesson","title":"Multi-Container Pods","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/12.Multi-Containers-PODs.md","html":"<p><strong>Microservices<\/strong> break a monolithic application into small independent components that are deployed and scaled separately. Sometimes two services must work <strong>together<\/strong>: a web server and its logging agent, for instance. You don't want to merge them, but they must be created and destroyed together.<\/p>\n<p>A multi-container Pod gives its containers the same <strong>lifecycle<\/strong>, the same <strong>network<\/strong> (they reach each other on <code>localhost<\/code>) and access to the same <strong>storage volumes<\/strong>.<\/p>\n<div class=\"anim\" data-anim=\"multicontainer\"><\/div>\n\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: simple-webapp\n  labels:\n    name: simple-webapp\nspec:\n  containers:\n  - name: simple-webapp\n    image: simple-webapp\n    ports:\n    - containerPort: 8080\n  - name: log-agent\n    image: log-agent\n<\/code><\/pre>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Correction<\/p>\n<p>The repo writes <code>ContainerPort<\/code> with a capital C. The field name is <code>containerPort<\/code>: Kubernetes is case-sensitive.<\/p>\n<\/div>","text":"Microservices break a monolithic application into small independent components that are deployed and scaled separately. Sometimes two services must work together : a web server and its logging agent, for instance. You don't want to merge them, but they must be created and destroyed together. A multi-container Pod gives its containers the same lifecycle , the same network (they reach each other on localhost ) and access to the same storage volumes . Correction The repo writes ContainerPort with a capital C. The field name is containerPort : Kubernetes is case-sensitive.","minutes":2,"ncode":1},{"id":"05-lab-11","kind":"lab","title":"Lab · Multi-Container Pods","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/13-Practice-Test-Multi-Container-Pods.md","practice":"https://kodekloud.com/topic/practice-test-multi-container-pods/","items":[{"q":"Identify the number of containers running in the &#x27;red&#x27; pod.","a":"<pre><code>$ kubectl get pod red\n<\/code><\/pre>"},{"q":"Identify the name of the containers running in the &#x27;blue&#x27; pod.","a":"<pre><code>$ kubectl describe pod blue\n<\/code><\/pre>"},{"q":"Answer file is located at /var/answers/answer-yellow.yaml","a":"<pre><code>$ kubectl create -f /var/answers/answer-yellow.yaml\n<\/code><\/pre>"},{"q":"We have deployed an application logging stack in the elastic-stack namespace. Inspect it.","a":"<pre><code>$ kubectl get pods -n elastic-stack\n<\/code><\/pre>"},{"q":"Inspect the Kibana UI using the link above your terminal. There shouldn&#x27;t be any logs for now.","a":""},{"q":"Run <code>kubectl describe pod -n elastic-stack<\/code>","a":"<pre><code>$ kubectl describe pod -n elastic-stack\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl -n elastic-stack exec -it app cat /log/app.log&#x27;","a":"<pre><code>$ kubectl -n elastic-stack exec -it app cat /log/app.log\n<\/code><\/pre>"},{"q":"Answer file is located at /var/answers/answer-app.yaml","a":""},{"q":"Inspect the Kibana UI. You should now see logs appearing in the &#x27;Discover&#x27; section. You might have to wait for a couple of minutes for the logs to populate. You might have to create an index pattern to list the logs. If not sure check this video: https://bit.ly/2EXYdHf","a":""}],"text":"Identify the number of containers running in the 'red' pod. Identify the name of the containers running in the 'blue' pod. Answer file is located at /var/answers/answer-yellow.yaml We have deployed an application logging stack in the elastic-stack namespace. Inspect it. Inspect the Kibana UI using the link above your terminal. There shouldn't be any logs for now. Run kubectl describe pod -n elastic-stack Run the command 'kubectl -n elastic-stack exec -it app cat /log/app.log' Answer file is located at /var/answers/answer-app.yaml Inspect the Kibana UI. You should now see logs appearing in the 'Discover' section. You might have to wait for a couple of minutes for the logs to populate. You might have to create an index pattern to list the logs. If not sure check this video: https://bit.ly/2EXYdHf","minutes":9},{"id":"05-design-patterns","kind":"lesson","title":"Multi-Container Pods Design Patterns","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/14-Multi-Container-Pods-Design-Patterns.md","html":"<p>Three classic multi-container Pod patterns:<\/p>\n<ul>\n<li><strong>Sidecar<\/strong>: a helper container extends the main application. Example: an agent that ships web server logs to a central log server.<\/li>\n<li><strong>Adapter<\/strong>: it <strong>standardises<\/strong> the application's output before sending it. Example: converting different log formats into a common one.<\/li>\n<li><strong>Ambassador<\/strong>: it acts as a <strong>proxy<\/strong> to the outside world. The application always connects to <code>localhost<\/code>, and the ambassador routes to the right database for the environment (dev, test, prod).<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"patterns\"><\/div>\n\n<p>Reference: <a target=\"_blank\" rel=\"noopener\" href=\"https://kubernetes.io/blog/2015/06/the-distributed-system-toolkit-patterns/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/blog/2015/06/the-distributed-system-toolkit-patterns/<\/a><\/p>","text":"Three classic multi-container Pod patterns: Sidecar : a helper container extends the main application. Example: an agent that ships web server logs to a central log server. Adapter : it standardises the application's output before sending it. Example: converting different log formats into a common one. Ambassador : it acts as a proxy to the outside world. The application always connects to localhost , and the ambassador routes to the right database for the environment (dev, test, prod). Reference: https://kubernetes.io/blog/2015/06/the-distributed-system-toolkit-patterns/","minutes":2,"ncode":0},{"id":"05-init-containers","kind":"lesson","title":"Init Containers","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/15.Init-Containers.md","html":"<p>In a multi-container Pod, each container is expected to run a process that stays alive for the Pod's whole lifecycle; if one fails, the Pod restarts. But sometimes you need a process that <strong>runs to completion<\/strong>: pulling code or a binary from a repository, or waiting for an external service or database to be up before the application starts. That's what <strong>initContainers<\/strong> are for.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: myapp-pod\n  labels:\n    app: myapp\nspec:\n  containers:\n  - name: myapp-container\n    image: busybox:1.28\n    command: ['sh', '-c', 'echo The app is running! &amp;&amp; sleep 3600']\n  initContainers:\n  - name: init-myservice\n    image: busybox\n    command: ['sh', '-c', 'git clone &lt;some-repository-that-will-be-used-by-application&gt; ;']\n<\/code><\/pre>\n<ul>\n<li>When the Pod is first created, the initContainer runs and must <strong>run to completion<\/strong> before the real application container starts.<\/li>\n<li>With several initContainers, they run <strong>one at a time, in sequential order<\/strong>.<\/li>\n<li>If any initContainer fails, Kubernetes <strong>restarts the Pod<\/strong> repeatedly until it succeeds.<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"initcontainers\"><\/div>\n\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: myapp-pod\n  labels:\n    app: myapp\nspec:\n  containers:\n  - name: myapp-container\n    image: busybox:1.28\n    command: ['sh', '-c', 'echo The app is running! &amp;&amp; sleep 3600']\n  initContainers:\n  - name: init-myservice\n    image: busybox:1.28\n    command: ['sh', '-c', 'until nslookup myservice; do echo waiting for myservice; sleep 2; done;']\n  - name: init-mydb\n    image: busybox:1.28\n    command: ['sh', '-c', 'until nslookup mydb; do echo waiting for mydb; sleep 2; done;']\n<\/code><\/pre>","text":"In a multi-container Pod, each container is expected to run a process that stays alive for the Pod's whole lifecycle; if one fails, the Pod restarts. But sometimes you need a process that runs to completion : pulling code or a binary from a repository, or waiting for an external service or database to be up before the application starts. That's what initContainers are for. When the Pod is first created, the initContainer runs and must run to completion before the real application container starts. With several initContainers, they run one at a time, in sequential order . If any initContainer fails, Kubernetes restarts the Pod repeatedly until it succeeds.","minutes":2,"ncode":2},{"id":"05-lab-14","kind":"lab","title":"Lab · Init Containers","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/16-Practice-Test-Init-Containers.md","practice":"https://kodekloud.com/topic/practice-test-init-containers/","items":[{"q":"Identify the pod that has an initContainer configured.","a":"<pre><code>$ kubectl get pods\n$ kubectl describe pods\n<\/code><\/pre>"},{"q":"What is the image used by the initContainer on the blue pod?","a":"<pre><code>$ kubectl describe pods blue\n<\/code><\/pre>"},{"q":"Run the command kubectl describe pod blue and check the state field of the initContainer.","a":"<pre><code>$ kubectl describe pod blue\n<\/code><\/pre>"},{"q":"Check the reason field of the initContainer","a":"<pre><code>$ kubectl describe pod blue\n<\/code><\/pre>"},{"q":"Run the command kubectl describe pod purple","a":"<pre><code>$ kubectl describe pod purple\n<\/code><\/pre>"},{"q":"Run the kubectl describe pod purple command and look at the container state","a":"<pre><code>$ kubectl describe pod purple\n<\/code><\/pre>"},{"q":"Check the commands used in the initContainers. The first one sleeps for 600 seconds (10 minutes) and the second one sleeps for 1200 seconds (20 minutes)","a":"<pre><code>$ kubectl describe pod purple\n<\/code><\/pre>"},{"q":"Update the pod red to use an initContainer that uses the busybox image and sleeps for 20 seconds","a":"<pre><code>$ kubectl get pod red -o yaml &gt; red.yaml\n$ kubectl delete pod red\n<\/code><\/pre>\n<p>Update the red.yaml with sleep 20 seconds<\/p>\n<pre><code>$ kubectl create -f red.yaml\n<\/code><\/pre>"},{"q":"Check the command used by the initContainer. Looks like there is a type in sleep command. Fix it, it should be <strong><code>sleep 2<\/code><\/strong> not <strong><code>sleeeep 2<\/code><\/strong>","a":"<pre><code>$ kubectl describe pod orange\n$ kubectl get pod orange -o yaml &gt; orange.yaml\n$ kubectl delete pod orange\n\nUpdate the orange.yaml with correct sleep command and recreate the pod\n$ kubectl create -f orange.yaml\n<\/code><\/pre>"}],"text":"Identify the pod that has an initContainer configured. What is the image used by the initContainer on the blue pod? Run the command kubectl describe pod blue and check the state field of the initContainer. Check the reason field of the initContainer Run the command kubectl describe pod purple Run the kubectl describe pod purple command and look at the container state Check the commands used in the initContainers. The first one sleeps for 600 seconds (10 minutes) and the second one sleeps for 1200 seconds (20 minutes) Update the pod red to use an initContainer that uses the busybox image and sleeps for 20 seconds Check the command used by the initContainer. Looks like there is a type in sleep command. Fix it, it should be sleep 2 not sleeeep 2","minutes":9},{"id":"05-self-healing","kind":"lesson","title":"Self-Healing Applications","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/05-Application-Lifecycle-Management/17.Self-Healing-Applications.md","html":"<p>Kubernetes supports <strong>self-healing applications<\/strong> through ReplicaSets and Replication Controllers: when the application inside a Pod crashes, the Pod is recreated automatically, and the desired number of replicas is maintained at all times.<\/p>\n<p>Kubernetes can also check application health with <strong>Liveness and Readiness Probes<\/strong>. They are not part of the CKA exam: they belong to the CKAD curriculum.<\/p>","text":"Kubernetes supports self-healing applications through ReplicaSets and Replication Controllers: when the application inside a Pod crashes, the Pod is recreated automatically, and the desired number of replicas is maintained at all times. Kubernetes can also check application health with Liveness and Readiness Probes . They are not part of the CKA exam: they belong to the CKAD curriculum.","minutes":2,"ncode":0}],"quiz":[{"q":"What is the default deployment strategy of a Deployment?","options":["Recreate","RollingUpdate","BlueGreen"],"answer":1,"explain":"RollingUpdate replaces Pods gradually and keeps the application available."},{"q":"Which command rolls back to the previous revision?","options":["kubectl rollout back deployment/myapp","kubectl rollout undo deployment/myapp-deployment","kubectl rollback deployment/myapp"],"answer":1,"explain":"rollout history lists revisions; undo --to-revision=N targets a specific one."},{"q":"Which Dockerfile instruction does a Pod's command field override?","options":["ENTRYPOINT","CMD","RUN"],"answer":0,"explain":"command overrides ENTRYPOINT, args overrides CMD."},{"q":"What does echo -n \"cm9vdA==\" | base64 --decode return?","options":["admin","root","paswrd"],"answer":1,"explain":"Base64 decodes without any key: Secrets are not encrypted by default."},{"q":"How do you inject every key of a ConfigMap as environment variables?","options":["env.configMap","envFrom with configMapRef","volumes.configMap only"],"answer":1,"explain":"envFrom: - configMapRef: name: app-config."},{"q":"Several init containers are defined. How do they run?","options":["In parallel","One at a time, in order","After the main container"],"answer":1,"explain":"Each must complete successfully before the next one starts."},{"q":"Which pattern uses a local proxy to reach the right database for each environment?","options":["Sidecar","Adapter","Ambassador"],"answer":2,"explain":"The application always talks to localhost; the ambassador routes the connection."}],"folder":"05-Application-Lifecycle-Management"},{"num":"06","title":"Cluster Maintenance","short":"Maintenance","summary":"OS upgrades and node maintenance, Kubernetes release versions, upgrading a kubeadm cluster, and backing up and restoring ETCD.","lessons":[{"id":"06-os-upgrades","kind":"lesson","title":"OS Upgrades","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/06-Cluster-Maintenance/02-OS-Upgrades.md","html":"<p>When a node goes down, its Pods are unreachable. If it comes back quickly, the kubelet restarts the Pods. If it stays down <strong>more than 5 minutes<\/strong> (the controller-manager's <em>pod-eviction-timeout<\/em>), its Pods are considered dead: those that belong to a ReplicaSet are recreated on other nodes, standalone Pods are <strong>lost<\/strong>.<\/p>\n<p>For safe maintenance, <strong>drain<\/strong> the node first:<\/p>\n<pre><code class=\"language-bash\">$ kubectl drain node-1\n<\/code><\/pre>\n<p>The Pods are gracefully terminated and recreated on other nodes, and the node is marked <strong>unschedulable<\/strong> (<em>cordoned<\/em>). After maintenance it stays that way: you have to uncordon it.<\/p>\n<pre><code class=\"language-bash\">$ kubectl uncordon node-1\n<\/code><\/pre>\n<p><code>kubectl cordon<\/code> only marks the node unschedulable: existing Pods <strong>stay<\/strong>, but no new ones arrive.<\/p>\n<div class=\"anim\" data-anim=\"drain\"><\/div>\n\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">Exam tip<\/p>\n<p><code>drain<\/code> refuses to proceed if the node runs DaemonSet Pods (add <code>--ignore-daemonsets<\/code>) or Pods not managed by a controller (<code>--force<\/code>, which deletes them for good).<\/p>\n<\/div>","text":"When a node goes down, its Pods are unreachable. If it comes back quickly, the kubelet restarts the Pods. If it stays down more than 5 minutes (the controller-manager's pod-eviction-timeout ), its Pods are considered dead: those that belong to a ReplicaSet are recreated on other nodes, standalone Pods are lost . For safe maintenance, drain the node first: The Pods are gracefully terminated and recreated on other nodes, and the node is marked unschedulable ( cordoned ). After maintenance it stays that way: you have to uncordon it. kubectl cordon only marks the node unschedulable: existing Pods stay , but no new ones arrive. Exam tip drain refuses to proceed if the node runs DaemonSet Pods (add --ignore-daemonsets ) or Pods not managed by a controller ( --force , which deletes them for good).","minutes":2,"ncode":2},{"id":"06-lab-1","kind":"lab","title":"Lab · OS Upgrades","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/06-Cluster-Maintenance/03-Practice-Test-OS-Upgrades.md","practice":"https://kodekloud.com/topic/practice-test-os-upgrades/","items":[{"q":"Let us explore the environment first. How many nodes do you see in the cluster?","a":"<pre><code>$ kubectl get nodes\n<\/code><\/pre>"},{"q":"How many applications do you see hosted on the cluster?","a":"<pre><code>$ kubectl get deploy\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl get pods -o wide&#x27; and get the list of nodes the pods are placed on","a":"<pre><code>$ kubectl get pods -o wide\n<\/code><\/pre>"},{"q":"Run the command kubectl drain node01 --ignore-daemonsets","a":"<pre><code>$ kubectl drain node01 --ignore-daemonsets\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl get pods -o wide&#x27; and get the list of nodes the pods are placed on","a":"<pre><code>$ kubectl get pods -o wide\n<\/code><\/pre>"},{"q":"Run the command kubectl uncordon node01","a":"<pre><code>$ kubectl uncordon node01\n<\/code><\/pre>"},{"q":"Run the command kubectl get pods -o wide","a":"<pre><code>$ kubectl get pods -o wide\n<\/code><\/pre>"},{"q":"Why are there no pods on node01?","a":"<pre><code>Only when new pods are created they will be scheduled\n<\/code><\/pre>"},{"q":"Use the command kubectl describe node master and look under taint section to check if it has any taints.","a":"<pre><code>$ kubectl describe node master\n<\/code><\/pre>"},{"q":"Run the command kubectl drain node02 --ignore-daemonsets","a":"<pre><code>$ kubectl drain node02 --ignore-daemonsets\n<\/code><\/pre>"},{"q":"Check the applications hosted on the node02.","a":"<pre><code>node02 has a pod not part of a replicaset\n$ kubectl get pods -o wide\n<\/code><\/pre>"},{"q":"Check the list of pods","a":"<pre><code>$ kubectl get pods -o wide\n<\/code><\/pre>"},{"q":"What would happen to hr-app if node02 is drained forcefully?","a":"<pre><code>$ kubectl drain node02 --ignore-daemonsets --force\nhr-app will be lost forever\n<\/code><\/pre>"},{"q":"Run the command kubectl drain node02 --ignore-daemonsets --force","a":"<pre><code>$ kubectl drain node02 --ignore-daemonsets --force\n<\/code><\/pre>"},{"q":"Run the command kubectl cordon node03","a":"<pre><code>$ kubectl cordon node03\n<\/code><\/pre>"}],"text":"Let us explore the environment first. How many nodes do you see in the cluster? How many applications do you see hosted on the cluster? Run the command 'kubectl get pods -o wide' and get the list of nodes the pods are placed on Run the command kubectl drain node01 --ignore-daemonsets Run the command 'kubectl get pods -o wide' and get the list of nodes the pods are placed on Run the command kubectl uncordon node01 Run the command kubectl get pods -o wide Why are there no pods on node01? Use the command kubectl describe node master and look under taint section to check if it has any taints. Run the command kubectl drain node02 --ignore-daemonsets Check the applications hosted on the node02. Check the list of pods What would happen to hr-app if node02 is drained forcefully? Run the command kubectl drain node02 --ignore-daemonsets --force Run the command kubectl cordon node03","minutes":15},{"id":"06-k8s-versions","kind":"lesson","title":"Kubernetes Software Versions","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/06-Cluster-Maintenance/04-Kubernetes-Software-Versions.md","html":"<p>The installed version is shown by:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get nodes\n<\/code><\/pre>\n<p>A version such as <strong>v1.11.3<\/strong> reads <strong>major.minor.patch<\/strong>:<\/p>\n<ul>\n<li><strong>minor<\/strong> releases bring features and functionalities, every few months;<\/li>\n<li><strong>patch<\/strong> releases bring bug fixes, more often.<\/li>\n<\/ul>\n<p>Features go through <strong>alpha<\/strong> (disabled by default), <strong>beta<\/strong> (enabled, tested) and then <strong>stable<\/strong>. All releases are at <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/kubernetes/kubernetes/releases.\" target=\"_blank\" rel=\"noopener\">https://github.com/kubernetes/kubernetes/releases.<\/a><\/p>\n<p>The downloaded package contains all control plane components at the <strong>same version<\/strong>, except <strong>ETCD<\/strong> and <strong>CoreDNS<\/strong>, which are separate projects with their own versions.<\/p>","text":"The installed version is shown by: A version such as v1.11.3 reads major.minor.patch : minor releases bring features and functionalities, every few months; patch releases bring bug fixes, more often. Features go through alpha (disabled by default), beta (enabled, tested) and then stable . All releases are at https://github.com/kubernetes/kubernetes/releases. The downloaded package contains all control plane components at the same version , except ETCD and CoreDNS , which are separate projects with their own versions.","minutes":2,"ncode":1},{"id":"06-cluster-upgrade","kind":"lesson","title":"Cluster Upgrade Process","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/06-Cluster-Maintenance/05-Cluster-Upgrade-Introduction.md","html":"<p>Components don't have to be at the same version, but none may be higher than the <strong>kube-apiserver<\/strong>, which is the reference. This is the <strong>version skew policy<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Allowed versions (kube-apiserver at 1.X)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>kube-apiserver<\/td>\n<td>X<\/td>\n<\/tr>\n<tr>\n<td>controller-manager, kube-scheduler<\/td>\n<td>X or X-1<\/td>\n<\/tr>\n<tr>\n<td>kubelet, kube-proxy<\/td>\n<td>X to X-2<\/td>\n<\/tr>\n<tr>\n<td>kubectl<\/td>\n<td>X+1 to X-1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"anim\" data-anim=\"skew\"><\/div>\n\n<p>Kubernetes only supports the <strong>three most recent minor versions<\/strong>. The recommended approach is to <strong>upgrade one minor version at a time<\/strong> (1.10 → 1.11 → 1.12).<\/p>\n<p>Upgrade the <strong>master<\/strong> first, then the <strong>worker nodes<\/strong>. While the master is being upgraded, applications keep running, but you can't manage them with kubectl. Three strategies for the workers:<\/p>\n<ol>\n<li><strong>All at once<\/strong>: downtime.<\/li>\n<li><strong>One node at a time<\/strong>: drain a node, upgrade it, repeat.<\/li>\n<li><strong>Add new nodes<\/strong> already on the new version, then remove the old ones (convenient in the cloud).<\/li>\n<\/ol>\n<p><strong>Master with kubeadm<\/strong>:<\/p>\n<pre><code class=\"language-bash\">$ kubeadm upgrade plan\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ apt-get upgrade -y kubeadm=1.12.0-00\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubeadm upgrade apply v1.12.0\n<\/code><\/pre>\n<p><code>kubectl get nodes<\/code> still shows the old version: the VERSION column shows the version of the <strong>kubelets<\/strong> registered with the API server, not the version of the API server itself.<\/p>\n<pre><code class=\"language-bash\">$ kubectl get nodes\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ apt-get upgrade kubelet=1.12.0-00\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ systemctl restart kubelet\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get nodes\n<\/code><\/pre>\n<p><strong>Worker nodes<\/strong>, one at a time:<\/p>\n<pre><code class=\"language-bash\">$ kubectl drain node-1\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ apt-get upgrade -y kubeadm=1.12.0-00\n$ apt-get upgrade -y kubelet=1.12.0-00\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubeadm upgrade node config --kubelet-version v1.12.0\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ systemctl restart kubelet\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl uncordon node-1\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"upgrade\"><\/div>\n\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Recent versions<\/p>\n<p>On current clusters, the worker command is simply <code>kubeadm upgrade node<\/code>, and packages come from the <code>pkgs.k8s.io<\/code> repositories (one repository per minor version, to switch before upgrading).<\/p>\n<\/div>","text":"Components don't have to be at the same version, but none may be higher than the kube-apiserver , which is the reference. This is the version skew policy : Component Allowed versions (kube-apiserver at 1.X) kube-apiserver X controller-manager, kube-scheduler X or X-1 kubelet, kube-proxy X to X-2 kubectl X+1 to X-1 Kubernetes only supports the three most recent minor versions . The recommended approach is to upgrade one minor version at a time (1.10 → 1.11 → 1.12). Upgrade the master first, then the worker nodes . While the master is being upgraded, applications keep running, but you can't manage them with kubectl. Three strategies for the workers: All at once : downtime. One node at a time : drain a node, upgrade it, repeat. Add new nodes already on the new version, then remove the old ones (convenient in the cloud). Master with kubeadm : kubectl get nodes still shows the old version: the VERSION column shows the version of the kubelets registered with the API server, not the version of the API server itself. Worker nodes , one at a time: Recent versions On current clusters, the worker command is simply kubeadm upgrade node , and packages come from the pkgs.k8s.io repositories (one repository per minor version, to switch before upgrading).","minutes":4,"ncode":12},{"id":"06-lab-4","kind":"lab","title":"Lab · Cluster Upgrade Process","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/06-Cluster-Maintenance/06-Practice-Test-Cluster-Upgrade-Process.md","practice":"https://kodekloud.com/topic/practice-test-cluster-upgrade-process/","items":[{"q":"What is the current version of the cluster?","a":"<pre><code>$ kubectl get nodes\n<\/code><\/pre>"},{"q":"How many nodes are part of this cluster?","a":"<pre><code>$ kubctl get nodes\n<\/code><\/pre>"},{"q":"Check what nodes the pods are hosted on.","a":"<pre><code>$ kubectl get pods -o wide\n<\/code><\/pre>"},{"q":"Count the number of deployments","a":"<pre><code>$ kubectl get deploy\n<\/code><\/pre>"},{"q":"Run the command kubectl get pods -o wide","a":"<pre><code>$ kubectl get pods -o wide\n<\/code><\/pre>"},{"q":"You are tasked to upgrade the cluster. User&#x27;s accessing the applications must not be impacted. And you cannot provision new VMs. What strategy would you use to upgrade the cluster?","a":"<pre><code>Upgrade one node at a time while moving the workloads to the other\n<\/code><\/pre>"},{"q":"Run the kubeadm upgrade plan command","a":"<pre><code>$ kubeadm upgrade plan\n<\/code><\/pre>"},{"q":"Run the kubectl drain master --ignore-daemonsets","a":"<pre><code>$ kubectl drain master --ignore-daemonsets\n<\/code><\/pre>"},{"q":"Run the command apt install kubeadm=1.18.0-00 and then kubeadm upgrade apply v1.18.0 and then apt install kubelet=1.18.0-00 to upgrade the kubelet on the master node","a":"<pre><code>$ apt install kubeadm=1.18.0-00\n$ kubeadm upgrade apply v1.18.0 \n$ apt install kubelet=1.18.0-00\n<\/code><\/pre>"},{"q":"Run the command kubectl uncordon master","a":"<pre><code>$ kubectl uncordon master \n<\/code><\/pre>"},{"q":"Run the command kubectl drain node01 --ignore-daemonsets","a":"<pre><code>$ kubectl drain node01 --ignore-daemonsets\n<\/code><\/pre>"},{"q":"Run the commands: apt install kubeadm=1.18.0-00 and then kubeadm upgrade node. Finally, run apt install kubelet=1.18.0-00.","a":"<pre><code>$ apt install kubeadm=1.18.0-00\n$ kubeadm upgrade node\n$ apt install kubelet=1.18.0-00\n<\/code><\/pre>"},{"q":"Run the command kubectl uncordon node01","a":"<pre><code>$ kubectl uncordon node01\n<\/code><\/pre>"}],"text":"What is the current version of the cluster? How many nodes are part of this cluster? Check what nodes the pods are hosted on. Count the number of deployments Run the command kubectl get pods -o wide You are tasked to upgrade the cluster. User's accessing the applications must not be impacted. And you cannot provision new VMs. What strategy would you use to upgrade the cluster? Run the kubeadm upgrade plan command Run the kubectl drain master --ignore-daemonsets Run the command apt install kubeadm=1.18.0-00 and then kubeadm upgrade apply v1.18.0 and then apt install kubelet=1.18.0-00 to upgrade the kubelet on the master node Run the command kubectl uncordon master Run the command kubectl drain node01 --ignore-daemonsets Run the commands: apt install kubeadm=1.18.0-00 and then kubeadm upgrade node. Finally, run apt install kubelet=1.18.0-00. Run the command kubectl uncordon node01","minutes":13},{"id":"06-backup-restore","kind":"lesson","title":"Backup and Restore Methods","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/06-Cluster-Maintenance/07-Backup-and-Restore-Methods.md","html":"<p>Backup candidates: <strong>resource configuration<\/strong> files, the <strong>ETCD cluster<\/strong>, and <strong>persistent volumes<\/strong>.<\/p>\n<p><strong>Resource configuration<\/strong>: the declarative approach is preferred, because the files can live in a source code repository such as GitHub.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: myapp-pod\n  labels:\n    app: myapp\n    type: front-end\nspec:\n  containers:\n  - name: nginx-container\n    image: nginx\n<\/code><\/pre>\n<p>Since some objects may have been created imperatively, you can also query the kube-apiserver:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get all --all-namespaces -o yaml &gt; all-deploy-services.yaml (only for few resource groups)\n<\/code><\/pre>\n<p>This only covers a few resource groups. Tools like <strong>ARK<\/strong>, now called <strong>Velero<\/strong>, do the job thoroughly.<\/p>\n<p><strong>ETCD<\/strong>: instead of the resources, you can back up the ETCD cluster itself. Its data lives in the service's <code>--data-dir<\/code> directory. Take a <strong>snapshot<\/strong>:<\/p>\n<pre><code class=\"language-bash\">$ ETCDCTL_API=3 etcdctl snapshot save snapshot.db\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$  ETCDCTL_API=3 etcdctl snapshot status snapshot.db\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"etcdbackup\"><\/div>\n\n<p><strong>Restore<\/strong>: stop the kube-apiserver service first (it depends on ETCD):<\/p>\n<pre><code class=\"language-bash\">$ service kube-apiserver stop\n<\/code><\/pre>\n<p>Restore the snapshot into a <strong>new<\/strong> data directory (<code>etcdctl snapshot restore snapshot.db --data-dir /var/lib/etcd-from-backup<\/code>), point the ETCD service at it, then:<\/p>\n<pre><code class=\"language-bash\">$ systemctl daemon-reload\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ service etcd restart\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ service kube-apiserver start\n<\/code><\/pre>\n<p>Every <code>etcdctl<\/code> command must specify the endpoint and certificates:<\/p>\n<pre><code class=\"language-bash\">$ ETCDCTL_API=3 etcdctl \\\n  snapshot save /tmp/snapshot.db \\\n  --endpoints=https://[127.0.0.1]:2379 \\\n  --cacert=/etc/kubernetes/pki/etcd/ca.crt \\\n  --cert=/etc/kubernetes/pki/etcd/etcd-server.crt \\\n  --key=/etc/kubernetes/pki/etcd/etcd-server.key\n<\/code><\/pre>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">kubeadm cluster<\/p>\n<p>There, ETCD is a static Pod: after restoring, change the <code>hostPath<\/code> of the <code>etcd-data<\/code> volume in <code>/etc/kubernetes/manifests/etcd.yaml<\/code> to the new directory. The Pod is recreated automatically. The certificate paths are in the same manifest.<\/p>\n<\/div>\n<p><strong>Managed cloud<\/strong>: without access to ETCD, backing up through the kube-apiserver is often the only option.<\/p>","text":"Backup candidates: resource configuration files, the ETCD cluster , and persistent volumes . Resource configuration : the declarative approach is preferred, because the files can live in a source code repository such as GitHub. Since some objects may have been created imperatively, you can also query the kube-apiserver: This only covers a few resource groups. Tools like ARK , now called Velero , do the job thoroughly. ETCD : instead of the resources, you can back up the ETCD cluster itself. Its data lives in the service's --data-dir directory. Take a snapshot : Restore : stop the kube-apiserver service first (it depends on ETCD): Restore the snapshot into a new data directory ( etcdctl snapshot restore snapshot.db --data-dir /var/lib/etcd-from-backup ), point the ETCD service at it, then: Every etcdctl command must specify the endpoint and certificates: kubeadm cluster There, ETCD is a static Pod: after restoring, change the hostPath of the etcd-data volume in /etc/kubernetes/manifests/etcd.yaml to the new directory. The Pod is recreated automatically. The certificate paths are in the same manifest. Managed cloud : without access to ETCD, backing up through the kube-apiserver is often the only option.","minutes":3,"ncode":9},{"id":"06-etcdctl","kind":"lesson","title":"Working with ETCDCTL","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/06-Cluster-Maintenance/08-Working-With-ETCDCTL.md","html":"<p><code>etcdctl<\/code> is the command line client for ETCD. For backup and restore, you must use <strong>API version 3<\/strong>:<\/p>\n<pre><code class=\"language-bash\">export ETCDCTL_API=3\n<\/code><\/pre>\n<p>Otherwise the <code>snapshot<\/code> commands don't exist. To see the options of a subcommand:<\/p>\n<pre><code class=\"language-bash\">etcdctl snapshot save -h\netcdctl snapshot restore -h\n<\/code><\/pre>\n<p>The mandatory TLS options, taken from the <code>etcd.yaml<\/code> manifest:<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>--cacert<\/code><\/td>\n<td>Verify the certificates of TLS-enabled secure servers using this CA bundle<\/td>\n<\/tr>\n<tr>\n<td><code>--cert<\/code><\/td>\n<td>Identify the secure client using this TLS certificate file<\/td>\n<\/tr>\n<tr>\n<td><code>--endpoints=[127.0.0.1:2379]<\/code><\/td>\n<td>ETCD address (the default, as ETCD runs on the master node)<\/td>\n<\/tr>\n<tr>\n<td><code>--key<\/code><\/td>\n<td>Identify the secure client using this TLS key file<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"etcdctl is the command line client for ETCD. For backup and restore, you must use API version 3 : Otherwise the snapshot commands don't exist. To see the options of a subcommand: The mandatory TLS options, taken from the etcd.yaml manifest: Option Purpose --cacert Verify the certificates of TLS-enabled secure servers using this CA bundle --cert Identify the secure client using this TLS certificate file --endpoints=[127.0.0.1:2379] ETCD address (the default, as ETCD runs on the master node) --key Identify the secure client using this TLS key file","minutes":2,"ncode":2},{"id":"06-lab-7","kind":"lab","title":"Lab · Backup and Restore","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/06-Cluster-Maintenance/09-Practice-Test-Backup-and-Restore-Methods.md","practice":"https://kodekloud.com/topic/practice-test-backup-and-restore-methods/","items":[{"q":"How many deployments exist in the cluster?","a":"<pre><code>kubectl get deployments\n<\/code><\/pre>"},{"q":"What is the version of ETCD running on the cluster?","a":"<pre><code>kubectl describe pod -n kube-system etcd-controlplane\n<\/code><\/pre>\n<p>Find the entry for <code>Image<\/code><\/p>"},{"q":"At what address can you reach the ETCD cluster from the controlplane node?","a":"<pre><code>kubectl describe pod -n kube-system etcd-controlplane\n<\/code><\/pre>\n<p>Under <code>Command<\/code> find <code>--listen-client-urls<\/code><\/p>"},{"q":"Where is the ETCD server certificate file located?","a":"<p>On kubeadm clusters like this one, the default location for certificate files is <code>/etc/kubernetes/pki/etcd<\/code><\/p>\n<p>Choose the correct certificate<\/p>"},{"q":"Where is the ETCD CA Certificate file located?","a":"<p>On kubeadm clusters like this one, the default location for certificate files is <code>/etc/kubernetes/pki/etcd<\/code><\/p>\n<p>Choose the correct certificate<\/p>"},{"q":"Take a snapshot of the ETCD database using the built-in snapshot functionality. — Store the backup file at location &lt;b&gt;/opt/snapshot-pre-boot.db&lt;/b&gt;","a":"<pre><code>ETCDCTL_API=3 etcdctl snapshot save \\\n  --cacert=/etc/kubernetes/pki/etcd/ca.crt \\\n  --cert=/etc/kubernetes/pki/etcd/server.crt \\\n  --key=/etc/kubernetes/pki/etcd/server.key \\\n  /opt/snapshot-pre-boot.db\n<\/code><\/pre>"},{"q":"Information only.","a":""},{"q":"Wake up! We have a conference call! After the reboot the master nodes came back online, but none of our applications are accessible. Check the status of the applications on the cluster. What&#x27;s wrong?","a":"<blockquote>\n<p>All of the above<\/p>\n<\/blockquote>"},{"q":"Luckily we took a backup. Restore the original state of the cluster using the backup file.","a":"<ol>\n<li>Restore the backup to a new directory<\/li>\n<\/ol>\n<pre><code>ETCDCTL_API=3 etcdctl snapshot restore \\\n  --data-dir /var/lib/etcd-from-backup \\\n  /opt/snapshot-pre-boot.db\n<\/code><\/pre>\n<ol>\n<li>Modify the <code>etcd<\/code> pod to use the new directory.<\/li>\n<\/ol>\n<p>To do this, we need to edit the <code>volumes<\/code> section and change the <code>hostPath<\/code> to be the directory we restored to.<\/p>\n<pre><code>vi /etc/kubernetes/manifests/etcd.yaml\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">volumes:\n- hostPath:\n    path: /etc/kubernetes/pki/etcd\n    type: DirectoryOrCreate\n  name: etcd-certs\n- hostPath:\n    path: /var/lib/etcd      # &lt;- change this\n    type: DirectoryOrCreate\n  name: etcd-data\n<\/code><\/pre>\n<p>New value: <code>/var/lib/etcd-from-backup<\/code><\/p>\n<p>Save this and wait for up to a minute for the <code>etcd<\/code> pod to reload.<\/p>\n<ol>\n<li>Verify<\/li>\n<\/ol>\n<pre><code>kubectl get deployments\nkubectl get services\n<\/code><\/pre>\n<p>See also: <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/kodekloudhub/community-faq/blob/main/docs/etcd-faq.md\" target=\"_blank\" rel=\"noopener\">https://github.com/kodekloudhub/community-faq/blob/main/docs/etcd-faq.md<\/a><\/p>"}],"text":"How many deployments exist in the cluster? What is the version of ETCD running on the cluster? At what address can you reach the ETCD cluster from the controlplane node? Where is the ETCD server certificate file located? Where is the ETCD CA Certificate file located? Take a snapshot of the ETCD database using the built-in snapshot functionality. — Store the backup file at location <b>/opt/snapshot-pre-boot.db<\/b> Information only. Wake up! We have a conference call! After the reboot the master nodes came back online, but none of our applications are accessible. Check the status of the applications on the cluster. What's wrong? Luckily we took a backup. Restore the original state of the cluster using the backup file.","minutes":9},{"id":"06-lab-8","kind":"lab","title":"Lab · Backup and Restore 2","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/06-Cluster-Maintenance/10-Practice-Test-Backup-and-Restore-Methods-2.md","practice":"https://kodekloud.com/topic/practice-test-backup-and-restore-methods-2-2/","items":[{"q":"Information only","a":""},{"q":"Explore the student-node and the clusters it has access to.","a":"<pre><code class=\"language-bash\">kubectl config get-contexts\n<\/code><\/pre>"},{"q":"How many clusters are defined in the kubeconfig on the student-node?","a":"<pre><code class=\"language-bash\">kubectl config get-contexts\n<\/code><\/pre>\n<blockquote>\n<p>2<\/p>\n<\/blockquote>"},{"q":"How many nodes (both controlplane and worker) are part of cluster1?","a":"<pre><code class=\"language-bash\">kubectl config use-context cluster1\nkubectl get nodes\n<\/code><\/pre>\n<blockquote>\n<p>2<\/p>\n<\/blockquote>"},{"q":"What is the name of the controlplane node in cluster2?","a":"<pre><code class=\"language-bash\">kubectl config use-context cluster2\nkubectl get nodes\n<\/code><\/pre>\n<blockquote>\n<p>cluster2-controlplane<\/p>\n<\/blockquote>"},{"q":"Information only","a":""},{"q":"How is ETCD configured for cluster1?","a":"<pre><code class=\"language-bash\">kubectl config use-context cluster1\nkubectl get pods -n kube-system\n<\/code><\/pre>\n<blockquote>\n<p>From the output we can see a pod for etcd, therefore the answer is <code>Stacked ETCD<\/code><\/p>\n<\/blockquote>"},{"q":"How is ETCD configured for cluster2?","a":"<pre><code class=\"language-bash\">kubectl config use-context cluster2\nkubectl get pods -n kube-system\n<\/code><\/pre>\n<blockquote>\n<p>From the output we can see no pod for etcd. Since no etcd is not an option for a <em>functioning<\/em> cluster the answer must therefore be <code>External ETCD<\/code><\/p>\n<\/blockquote>"},{"q":"What is the IP address of the External ETCD datastore used in cluster2?","a":"<p>For this, we need to exampine the API server configuration<\/p>\n<pre><code class=\"language-bash\">kubectl config use-context cluster2\nkubectl get pods -n kube-system kube-apiserver-cluster2-controlplane -o yaml | grep etcd\n<\/code><\/pre>\n<blockquote>\n<p>From the output, locate <code>--etcd-servers<\/code>. The IP address in this line is the answer.<\/p>\n<\/blockquote>"},{"q":"What is the default data directory used the for ETCD datastore used in cluster1?","a":"<p>For this, we need to examine the etcd manifest on the control plane node, and we need to find out the hostpath of its <code>etcd-data<\/code> volume.<\/p>\n<pre><code class=\"language-bash\">kubectl config use-context cluster1\nkubectl get pods -n kube-system etcd-cluster1-controlplane -o yaml\n<\/code><\/pre>\n<p>In the output, find the <code>volumes<\/code> section. The host path of the volume named <code>etcd-data<\/code> is the answer.<\/p>\n<blockquote>\n<p>/var/lib/etcd<\/p>\n<\/blockquote>"},{"q":"Information only","a":""},{"q":"What is the default data directory used the for ETCD datastore used in cluster2?","a":"<p>For this, we need to examine the system unit file for the etcd service. Remember that for external etcd, it is running as an operating system service.<\/p>\n<pre><code class=\"language-bash\">ssh etcd-server\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># Verify the name of the service\nsystemctl list-unit-files | grep etcd\n\n# Using the output from above command\nsystemctl cat etcd.service\n<\/code><\/pre>\n<p>Note the comment line in the output. This tells you where the service unit file is. We are going to need to edit this file in a later question!<\/p>\n<p>From the output, locate <code>--data-dir<\/code><\/p>\n<blockquote>\n<p>/var/lib/etcd-data<\/p>\n<\/blockquote>\n<p>Return to the student node:<\/p>\n<pre><code class=\"language-bash\">exit\n<\/code><\/pre>"},{"q":"How many other nodes are part of the ETCD cluster that etcd-server is a part of?","a":"<p>This question is somewhat contentious. It ought not to contain the word <code>other<\/code>. The required answer is<\/p>\n<blockquote>\n<p>1<\/p>\n<\/blockquote>"},{"q":"Take a backup of etcd on cluster1 and save it on the student-node at the path /opt/cluster1.db","a":"<p>For this, we need to do the backup on the control node, then pull it back to the student node.<\/p>\n<pre><code class=\"language-bash\">ssh cluster1-controlplane\n<\/code><\/pre>\n<pre><code class=\"language-bash\">ETCDCTL_API=3 etcdctl snapshot save \\\n  --cacert /etc/kubernetes/pki/etcd/ca.crt \\\n  --cert /etc/kubernetes/pki/etcd/server.crt \\\n  --key /etc/kubernetes/pki/etcd/server.key \\\n  cluster1.db\n\n# Return to student node\nexit\n<\/code><\/pre>\n<pre><code class=\"language-bash\">scp cluster1-controlplane:~/cluster1.db /opt/\n<\/code><\/pre>"},{"q":"An ETCD backup for cluster2 is stored at /opt/cluster2.db. Use this snapshot file to carry out a restore on cluster2 to a new path &lt;b&gt;/var/l
