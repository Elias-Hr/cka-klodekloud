/pre>\n<p>Limit resources in a namespace with a <strong>ResourceQuota<\/strong>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: ResourceQuota\nmetadata:\n  name: compute-quota\n  namespace: dev\nspec:\n  hard:\n    pods: &quot;10&quot;\n    requests.cpu: &quot;4&quot;\n    requests.memory: 5Gi\n    limits.cpu: &quot;10&quot;\n    limits.memory: 10Gi\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f compute-quota.yaml\n<\/code><\/pre>","text":"A namespace isolates a set of resources, like members of different households who share a first name but live in different houses. Kubernetes creates three at setup: default : where you work unless told otherwise; kube-system : the internal components, kept apart to prevent accidental deletion; kube-public : resources that should be available to all users. Each namespace can have its own policies (who can do what) and resource quotas . Within a namespace, resources reach each other by name ( db-service ); across namespaces, you append the namespace ( db-service.dev.svc.cluster.local ). This Pod is created in the default namespace: To create it in another namespace: Or pin the namespace in the definition file: Create a namespace declaratively: Or imperatively: Switch to a namespace permanently: View Pods in all namespaces: Limit resources in a namespace with a ResourceQuota :","minutes":4,"ncode":13},{"id":"02-lab-17","kind":"lab","title":"Lab · Namespaces","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/19-Practice-Test-Namespaces.md","practice":"https://kodekloud.com/topic/practice-test-namespaces/","items":[{"q":"How many Namespaces exist on the system?","a":"<pre><code>kubectl get namespace\n<\/code><\/pre>\n<p>Count the number of namespaces (if any)<\/p>"},{"q":"How many pods exist in the research namespace?","a":"<pre><code>kubectl get pods --namespace=research\n<\/code><\/pre>\n<p>Count the number of pods (if any)<\/p>"},{"q":"Create a POD in the finance namespace.","a":"<pre><code>kubectl run redis --image=redis --namespace=finance\n<\/code><\/pre>"},{"q":"Which namespace has the blue pod in it?","a":"<pre><code>kubectl get pods --all-namespaces\n<\/code><\/pre>\n<p>Examine the output.<\/p>\n<p>Or use <code>grep<\/code> to filter the results, knowing that <code>NAMESPACE<\/code> is the first result column<\/p>\n<pre><code>kubectl get pods --all-namespaces | grep blue\n<\/code><\/pre>"},{"q":"Access the Blue web application using the link above your terminal!!","a":"<p>Press the <code>blue-application-ui<\/code> button at the top of the terminal. Try the following:<\/p>\n<pre><code>Host Name: db-service\nHost Port: 6379\n<\/code><\/pre>"},{"q":"What DNS name should the Blue application use to access the database db-service in its own namespace - marketing?","a":"<blockquote>\n<p>db-service<\/p>\n<\/blockquote>\n<p>To access services in the same namespace, only the host name part of the fully qualified domain name (FQDN) is required.<\/p>"},{"q":"What DNS name should the Blue application use to access the database db-service in the dev namespace?","a":"<p>Either FQDN<\/p>\n<blockquote>\n<p>db-service.dev.svc.cluster.local<\/p>\n<\/blockquote>\n<p>Or, it is sufficient just to append the namespace name<\/p>\n<blockquote>\n<p>db-service.dev<\/p>\n<\/blockquote>"}],"text":"How many Namespaces exist on the system? How many pods exist in the research namespace? Create a POD in the finance namespace. Which namespace has the blue pod in it? Access the Blue web application using the link above your terminal!! What DNS name should the Blue application use to access the database db-service in its own namespace - marketing? What DNS name should the Blue application use to access the database db-service in the dev namespace?","minutes":7},{"id":"02-services","kind":"lesson","title":"Services","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/20-Services.md","html":"<p>Kubernetes <strong>Services<\/strong> enable communication between components inside and outside the application: users to the frontend, frontend to backend, backend to an external data source. They provide <strong>loose coupling<\/strong> between microservices.<\/p>\n<p>Example: a web Pod runs on node <code>192.168.1.2<\/code>, inside the internal network <code>10.244.0.0<\/code>. From the node you can reach the Pod; from outside you can't. Something has to sit in the middle: the Service.<\/p>\n<p>The three Service types:<\/p>\n<ul>\n<li><strong>NodePort<\/strong>: makes an internal port accessible on a port of <strong>every node<\/strong> (range <strong>30000-32767<\/strong>).<\/li>\n<li><strong>ClusterIP<\/strong>: creates a virtual IP inside the cluster so groups of Pods can talk to each other.<\/li>\n<li><strong>LoadBalancer<\/strong>: provisions a load balancer on supported cloud providers.<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"nodeport\"><\/div>\n\n<p>The three ports of a NodePort, seen from the <strong>Service<\/strong>: <code>targetPort<\/code> (the Pod's port, 80), <code>port<\/code> (the Service's own port, 80, the only mandatory field), <code>nodePort<\/code> (the port opened on the node, 30008). If <code>targetPort<\/code> is omitted it takes the value of <code>port<\/code>; if <code>nodePort<\/code> is omitted, a free port is allocated.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Service\nmetadata:\n name: myapp-service\nspec:\n type: NodePort\n ports:\n - targetPort: 80\n   port: 80\n   nodePort: 30008\n<\/code><\/pre>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Correction<\/p>\n<p>The repo writes <code>types: NodePort<\/code> in this first example. The correct field is <code>type<\/code> (singular), as in the next example.<\/p>\n<\/div>\n<p>To connect the Service to the Pods, add a <code>selector<\/code> that matches their labels:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Service\nmetadata:\n name: myapp-service\nspec:\n type: NodePort\n ports:\n - targetPort: 80\n   port: 80\n   nodePort: 30008\n selector:\n   app: myapp\n   type: front-end\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f service-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get services\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ curl <a target=\"_blank\" rel=\"noopener\" href=\"http://192.168.1.2:30008\" target=\"_blank\" rel=\"noopener\">http://192.168.1.2:30008<\/a>\n<\/code><\/pre>\n<p>With <strong>multiple Pods<\/strong> carrying those labels, the Service load-balances requests across them (random algorithm, with session affinity). When the Pods are <strong>distributed across multiple nodes<\/strong>, the Service spans all nodes automatically: the same <code>nodePort<\/code> answers on each one.<\/p>","text":"Kubernetes Services enable communication between components inside and outside the application: users to the frontend, frontend to backend, backend to an external data source. They provide loose coupling between microservices. Example: a web Pod runs on node 192.168.1.2 , inside the internal network 10.244.0.0 . From the node you can reach the Pod; from outside you can't. Something has to sit in the middle: the Service. The three Service types: NodePort : makes an internal port accessible on a port of every node (range 30000-32767 ). ClusterIP : creates a virtual IP inside the cluster so groups of Pods can talk to each other. LoadBalancer : provisions a load balancer on supported cloud providers. The three ports of a NodePort, seen from the Service : targetPort (the Pod's port, 80), port (the Service's own port, 80, the only mandatory field), nodePort (the port opened on the node, 30008). If targetPort is omitted it takes the value of port ; if nodePort is omitted, a free port is allocated. Correction The repo writes types: NodePort in this first example. The correct field is type (singular), as in the next example. To connect the Service to the Pods, add a selector that matches their labels: With multiple Pods carrying those labels, the Service load-balances requests across them (random algorithm, with session affinity). When the Pods are distributed across multiple nodes , the Service spans all nodes automatically: the same nodePort answers on each one.","minutes":3,"ncode":5},{"id":"02-clusterip","kind":"lesson","title":"Services - ClusterIP","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/21-Services-ClusterIP.md","html":"<p>A full-stack application has several tiers (frontend, backend, Redis…). Pod IPs keep changing, so you can't rely on them. A <strong>ClusterIP<\/strong> Service groups the Pods of one tier behind <strong>a single, stable IP and name<\/strong>, and load-balances between them. It is the default Service type.<\/p>\n<div class=\"anim\" data-anim=\"clusterip\"><\/div>\n\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Service\nmetadata:\n name: back-end\nspec:\n type: ClusterIP\n ports:\n - targetPort: 80\n   port: 80\n selector:\n   app: myapp\n   type: back-end\n<\/code><\/pre>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Correction<\/p>\n<p>The repo writes <code>types: ClusterIP<\/code>. The correct field is <code>type<\/code>. Since ClusterIP is the default, you can also leave it out.<\/p>\n<\/div>\n<pre><code class=\"language-bash\">$ kubectl create -f service-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get services\n<\/code><\/pre>\n<p>Other Pods reach this Service by its name (<code>back-end<\/code>) or its ClusterIP.<\/p>","text":"A full-stack application has several tiers (frontend, backend, Redis…). Pod IPs keep changing, so you can't rely on them. A ClusterIP Service groups the Pods of one tier behind a single, stable IP and name , and load-balances between them. It is the default Service type. Correction The repo writes types: ClusterIP . The correct field is type . Since ClusterIP is the default, you can also leave it out. Other Pods reach this Service by its name ( back-end ) or its ClusterIP.","minutes":2,"ncode":3},{"id":"02-lab-20","kind":"lab","title":"Lab · Services","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/22-Practice-Test-Services.md","practice":"https://kodekloud.com/topic/practice-test-services/","items":[{"q":"How many Services exist on the system?","a":"<pre><code>kubectl get services\n<\/code><\/pre>\n<p>Count the number of services (if any)<\/p>"},{"q":"Information only","a":""},{"q":"What is the type of the default kubernetes service?","a":"<p>From the output of Q1, examine the <code>TYPE<\/code> column.<\/p>"},{"q":"What is the targetPort configured on the kubernetes service?","a":"<pre><code>$ kubectl describe service | grep TargetPort\n<\/code><\/pre>"},{"q":"How many labels are configured on the kubernetes service?","a":"<pre><code>kubectl describe service\n<\/code><\/pre>\n<p>...and look for labels.<\/p>\n<p>--- OR ---<\/p>\n<pre><code>kubectl get service --show-labels\n<\/code><\/pre>"},{"q":"How many Endpoints are attached on the kubernetes service?","a":"<pre><code>kubectl describe service\n<\/code><\/pre>\n<p>...and look for endpoints<\/p>"},{"q":"How many Deployments exist on the system now?","a":"<pre><code>kubectl get deployment\n<\/code><\/pre>\n<p>Count the deployments (if any)<\/p>"},{"q":"What is the image used to create the pods in the deployment?","a":"<pre><code>kubectl describe deployment\n<\/code><\/pre>\n<p>Look in the containers section.<\/p>\n<p>--- OR ---<\/p>\n<pre><code>kubectl get deployment -o wide\n<\/code><\/pre>\n<p>Look in the <code>IMAGES<\/code> column<\/p>"},{"q":"Are you able to access the Web App UI?","a":"<p>Try to access the Web Application UI using the tab simple-webapp-ui above the terminal.<\/p>"},{"q":"Create a new service to access the web application using the service-definition-1.yaml file.","a":"<pre><code>vi service-definition-1.yaml\n<\/code><\/pre>\n<p>Fill in the values as directed, save and exit.<\/p>\n<pre><code>kubectl create -f service-definition-1.yaml\n<\/code><\/pre>"},{"q":"Test newly deployed service.","a":""}],"text":"How many Services exist on the system? Information only What is the type of the default kubernetes service? What is the targetPort configured on the kubernetes service? How many labels are configured on the kubernetes service? How many Endpoints are attached on the kubernetes service? How many Deployments exist on the system now? What is the image used to create the pods in the deployment? Are you able to access the Web App UI? Create a new service to access the web application using the service-definition-1.yaml file. Test newly deployed service.","minutes":11},{"id":"02-imperative","kind":"lesson","title":"Imperative Commands with kubectl","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/23-Imperative-Commands-with-kubectl.md","html":"<p>There are two ways to manage objects:<\/p>\n<ul>\n<li><strong>Imperative<\/strong>: you say <em>what to do<\/em>, step by step (<code>kubectl run<\/code>, <code>create<\/code>, <code>expose<\/code>, <code>edit<\/code>, <code>scale<\/code>, <code>set image<\/code>). Fast, ideal in the exam for one-off tasks.<\/li>\n<li><strong>Declarative<\/strong>: you describe <em>the desired state<\/em> in a file, and <code>kubectl apply<\/code> works out what needs to change. Preferred for production and complex configurations.<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"imperative\"><\/div>\n\n<p>Commands to know by heart (from the lab):<\/p>\n<pre><code class=\"language-bash\">kubectl run nginx-pod --image=nginx:alpine\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl run redis --image=redis:alpine -l tier=db\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl expose pod redis --port=6379 --name redis-service\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl create deployment webapp --image=kodekloud/webapp-color --replicas=3\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl run custom-nginx --image=nginx --port=8080\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl create ns dev-ns\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl create deployment redis-deploy -n dev-ns --image redis --replicas 2\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl run httpd --image httpd:alpine --expose --port 80\n<\/code><\/pre>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">Handy options<\/p>\n<p><code>--dry-run=client<\/code> tests the command without creating anything; <code>-o yaml<\/code> prints the YAML that would be sent. Together they generate a starting manifest in a second.<\/p>\n<\/div>","text":"There are two ways to manage objects: Imperative : you say what to do , step by step ( kubectl run , create , expose , edit , scale , set image ). Fast, ideal in the exam for one-off tasks. Declarative : you describe the desired state in a file, and kubectl apply works out what needs to change. Preferred for production and complex configurations. Commands to know by heart (from the lab): Handy options --dry-run=client tests the command without creating anything; -o yaml prints the YAML that would be sent. Together they generate a starting manifest in a second.","minutes":3,"ncode":8},{"id":"02-lab-22","kind":"lab","title":"Lab · Imperative Commands","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/02-Core-Concepts/24-Practice-Test-Imperative-Commands.md","practice":"https://kodekloud.com/topic/practice-test-imperative-commands-2/","items":[{"q":"Information","a":""},{"q":"Deploy a pod named nginx-pod using the nginx:alpine image.","a":"<pre><code>kubectl run nginx-pod --image=nginx:alpine\n<\/code><\/pre>"},{"q":"Deploy a redis pod using the redis:alpine image with the labels set to tier=db.","a":"<pre><code>kubectl run redis --image=redis:alpine -l tier=db\n<\/code><\/pre>"},{"q":"Create a service redis-service to expose the redis application within the cluster on port 6379.","a":"<pre><code>kubectl expose pod redis --port=6379 --name redis-service\n<\/code><\/pre>"},{"q":"Create a deployment named webapp using the image kodekloud/webapp-color with 3 replicas.","a":"<pre><code>kubectl create deployment webapp --image=kodekloud/webapp-color --replicas=3\n<\/code><\/pre>"},{"q":"Create a new pod called custom-nginx using the nginx image and expose it on container port 8080.","a":"<pre><code>kubectl run custom-nginx --image=nginx --port=8080\n<\/code><\/pre>"},{"q":"Create a new namespace called dev-ns.","a":"<pre><code>kubectl create ns dev-ns\n<\/code><\/pre>"},{"q":"Create a new deployment called redis-deploy in the dev-ns namespace with the redis image. It should have 2 replicas.","a":"<pre><code>kubectl create deployment redis-deploy -n dev-ns --image redis --replicas 2\n<\/code><\/pre>"},{"q":"Create a pod called httpd using the image httpd:alpine in the default namespace. — Next, create a service of type ClusterIP by the same name (httpd). — The target port for the service should be 80.","a":"<pre><code>kubectl run httpd --image httpd:alpine --expose --port 80\n<\/code><\/pre>"}],"text":"Information Deploy a pod named nginx-pod using the nginx:alpine image. Deploy a redis pod using the redis:alpine image with the labels set to tier=db. Create a service redis-service to expose the redis application within the cluster on port 6379. Create a deployment named webapp using the image kodekloud/webapp-color with 3 replicas. Create a new pod called custom-nginx using the nginx image and expose it on container port 8080. Create a new namespace called dev-ns. Create a new deployment called redis-deploy in the dev-ns namespace with the redis image. It should have 2 replicas. Create a pod called httpd using the image httpd:alpine in the default namespace. — Next, create a service of type ClusterIP by the same name (httpd). — The target port for the service should be 80.","minutes":9}],"quiz":[{"q":"Which is the only component that talks to etcd directly?","options":["kube-scheduler","kube-apiserver","kubelet","kube-controller-manager"],"answer":1,"explain":"Every other component goes through the kube-apiserver to read or write cluster state."},{"q":"Does the kube-scheduler place the Pod on the node itself?","options":["Yes, it creates the containers","No, it picks the node; the kubelet creates the Pod","No, kube-proxy does it"],"answer":1,"explain":"The scheduler only decides the node. The kubelet on that node then asks the container runtime to create the containers."},{"q":"Which tool should you use to debug containers on a node running containerd?","options":["docker","ctr","crictl","nerdctl"],"answer":2,"explain":"crictl comes from the Kubernetes community, is aware of Pods, and works with every CRI-compatible runtime."},{"q":"What is the main difference between a ReplicaSet and a ReplicationController?","options":["The ReplicaSet requires a selector","A ReplicaSet can't be scaled","The ReplicationController uses apps/v1"],"answer":0,"explain":"The selector lets a ReplicaSet also manage Pods created before it, as long as their labels match."},{"q":"Which component does kubeadm not deploy?","options":["etcd","kube-apiserver","kubelet","kube-proxy"],"answer":2,"explain":"The kubelet must always be installed manually on each node."},{"q":"In a NodePort Service, which field is mandatory?","options":["targetPort","port","nodePort"],"answer":1,"explain":"targetPort defaults to port, and a free nodePort (30000-32767) is allocated automatically."},{"q":"Which DNS name reaches db-service in the dev namespace?","options":["db-service.svc.dev","db-service.dev.svc.cluster.local","dev.db-service.cluster.local"],"answer":1,"explain":"The format is <service>.<namespace>.svc.cluster.local. db-service.dev also works."},{"q":"Which command generates a Pod's YAML without creating it?","options":["kubectl create pod nginx -o yaml","kubectl run nginx --image=nginx --dry-run=client -o yaml","kubectl get pod nginx --export"],"answer":1,"explain":"--dry-run=client prevents creation, -o yaml prints the manifest."}],"folder":"02-Core-Concepts"},{"num":"03","title":"Scheduling","short":"Scheduling","summary":"Controlling where Pods run: manual scheduling, labels and selectors, taints and tolerations, node affinity, resource limits, DaemonSets, static Pods and multiple schedulers.","lessons":[{"id":"03-manual-scheduling","kind":"lesson","title":"Manual Scheduling","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/02-Manual-Scheduling.md","html":"<p>Every Pod has a field called <strong><code>nodeName<\/code><\/strong> that is not set by default. The scheduler looks for Pods without <code>nodeName<\/code>, picks a node, then sets it by creating a <strong>Binding<\/strong> object.<\/p>\n<p>Without a scheduler, the Pod stays <strong>Pending<\/strong>. You can then place it yourself by setting <code>nodeName<\/code> <strong>at creation time<\/strong>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n name: nginx\n labels:\n  name: nginx\nspec:\n containers:\n - name: nginx\n   image: nginx\n   ports:\n   - containerPort: 8080\n nodeName: node02\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"manualsched\"><\/div>\n\n<p><code>nodeName<\/code> can't be modified on an existing Pod. To assign a Pod that already exists, create a <strong>Binding<\/strong> object (sent as JSON in a POST request to the Pod's <code>binding<\/code> API), which mimics what the scheduler does:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Binding\nmetadata:\n  name: nginx\ntarget:\n  apiVersion: v1\n  kind: Node\n  name: node02\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n name: nginx\n labels:\n  name: nginx\nspec:\n containers:\n - name: nginx\n   image: nginx\n   ports:\n   - containerPort: 8080\n<\/code><\/pre>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">Exam tip<\/p>\n<p>A Pod stuck in Pending with no scheduling event? Check that the <code>kube-scheduler<\/code> Pod exists in <code>kube-system<\/code>. If it's missing, place the Pod with <code>nodeName<\/code> (delete and recreate it, for example with <code>kubectl replace --force -f<\/code>).<\/p>\n<\/div>","text":"Every Pod has a field called nodeName that is not set by default. The scheduler looks for Pods without nodeName , picks a node, then sets it by creating a Binding object. Without a scheduler, the Pod stays Pending . You can then place it yourself by setting nodeName at creation time : nodeName can't be modified on an existing Pod. To assign a Pod that already exists, create a Binding object (sent as JSON in a POST request to the Pod's binding API), which mimics what the scheduler does: Exam tip A Pod stuck in Pending with no scheduling event? Check that the kube-scheduler Pod exists in kube-system . If it's missing, place the Pod with nodeName (delete and recreate it, for example with kubectl replace --force -f ).","minutes":2,"ncode":3},{"id":"03-lab-1","kind":"lab","title":"Lab · Manual Scheduling","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/03-Practice-Test-Manual-Scheduling.md","practice":"https://kodekloud.com/topic/practice-test-manual-scheduling/","items":[{"q":"A pod definition file nginx.yaml is given. Create a pod using the file.","a":"<pre><code>kubectl create -f nginx.yaml\n<\/code><\/pre>"},{"q":"What is the status of the created POD?","a":"<pre><code>kubectl get pods\n<\/code><\/pre>\n<p>Examine the <code>STATUS<\/code> column<\/p>"},{"q":"Why is the POD in a pending state? — Inspect the environment for various kubernetes control plane components.","a":"<pre><code>kubectl get pods --namespace kube-system\n<\/code><\/pre>\n<p>There is a key pod missing here!<\/p>"},{"q":"Manually schedule the pod on node01.","a":"<p>We will have to delete and recereate the pod, as the only property that may be edited on a running container is <code>image<\/code><\/p>\n<pre><code>vi nginx.yaml\n<\/code><\/pre>\n<p>Make the following edit<\/p>\n<pre><code class=\"language-yaml\">---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx\nspec:\n  nodeName: node01    # add this line\n  containers:\n  -  image: nginx\n     name: nginx\n<\/code><\/pre>\n<pre><code>kubectl delete -f nginx.yaml\nkubectl create -f nginx.yaml\n<\/code><\/pre>"},{"q":"Now schedule the same pod on the controlplane node.","a":"<p>Repeat the steps as per the previous question. Edit <code>nodeName<\/code> to be <code>controlplane<\/code><\/p>"}],"text":"A pod definition file nginx.yaml is given. Create a pod using the file. What is the status of the created POD? Why is the POD in a pending state? — Inspect the environment for various kubernetes control plane components. Manually schedule the pod on node01. Now schedule the same pod on the controlplane node.","minutes":5},{"id":"03-labels-selectors","kind":"lesson","title":"Labels and Selectors","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/04-Labels-and-Selectors.md","html":"<p><strong>Labels<\/strong> are properties attached to each item (<code>app<\/code>, <code>function<\/code>, <code>tier<\/code>…). <strong>Selectors<\/strong> filter items by those labels. Together they are the standard way to group things.<\/p>\n<div class=\"anim\" data-anim=\"labels\"><\/div>\n\n<p>Labels go under <code>metadata.labels<\/code>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n name: simple-webapp\n labels:\n   app: App1\n   function: Front-end\nspec:\n containers:\n - name: simple-webapp\n   image: simple-webapp\n   ports:\n   - containerPort: 8080\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get pods --selector app=App1\n<\/code><\/pre>\n<p>Kubernetes uses labels to <strong>connect objects together<\/strong>. Don't confuse the two <code>labels<\/code> sections of a ReplicaSet: the ReplicaSet's own (at the top) and the Pods' (under <code>template<\/code>). The <code>selector<\/code> matches the latter.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: ReplicaSet\nmetadata:\n  name: simple-webapp\n  labels:\n    app: App1\n    function: Front-end\nspec:\n replicas: 3\n selector:\n   matchLabels:\n    app: App1\n template:\n   metadata:\n     labels:\n       app: App1\n       function: Front-end\n   spec:\n     containers:\n     - name: simple-webapp\n       image: simple-webapp\n<\/code><\/pre>\n<p>Same principle for Services:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Service\nmetadata:\n name: my-service\nspec:\n selector:\n   app: App1\n ports:\n - protocol: TCP\n   port: 80\n   targetPort: 9376\n<\/code><\/pre>\n<p><strong>Annotations<\/strong>: labels and selectors group objects, while annotations record other details for informational purposes (build version, contact, tool…).<\/p>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: ReplicaSet\nmetadata:\n  name: simple-webapp\n  labels:\n    app: App1\n    function: Front-end\n  annotations:\n     buildversion: 1.34\nspec:\n replicas: 3\n selector:\n   matchLabels:\n    app: App1\n template:\n   metadata:\n     labels:\n       app: App1\n       function: Front-end\n   spec:\n     containers:\n     - name: simple-webapp\n       image: simple-webapp\n<\/code><\/pre>","text":"Labels are properties attached to each item ( app , function , tier …). Selectors filter items by those labels. Together they are the standard way to group things. Labels go under metadata.labels : Kubernetes uses labels to connect objects together . Don't confuse the two labels sections of a ReplicaSet: the ReplicaSet's own (at the top) and the Pods' (under template ). The selector matches the latter. Same principle for Services: Annotations : labels and selectors group objects, while annotations record other details for informational purposes (build version, contact, tool…).","minutes":2,"ncode":5},{"id":"03-lab-3","kind":"lab","title":"Lab · Labels and Selectors","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/05-Practice-Test-Labels-and-Selectors.md","practice":"https://kodekloud.com/topic/practice-test-labels-and-selectors/","items":[{"q":"We have deployed a number of PODs. They are labelled with tier, env and bu. How many PODs exist in the dev environment (env)?","a":"<p>Here we are filtering pods by the value olf a label<\/p>\n<pre><code>kubectl get pods --selector env=dev\n<\/code><\/pre>\n<p>Count the pods (if any)<\/p>"},{"q":"How many PODs are in the finance business unit (bu)?","a":"<p>Similarly ...<\/p>\n<pre><code>kubectl get pods --selector bu=finance\n<\/code><\/pre>\n<p>Count the pods (if any)<\/p>"},{"q":"How many objects are in the prod environment including PODs, ReplicaSets and any other objects?","a":"<pre><code>kubectl get all --selector env=prod\n<\/code><\/pre>\n<p>Count everything (if anything)<\/p>"},{"q":"Identify the POD which is part of the prod environment, the finance BU and of frontend tier?","a":"<p>We can combine label expressions with comma. Only items with <em>all<\/em> the given label/value pairs will be returned, i.e. it is an <code>and<\/code> condition.<\/p>\n<pre><code>kubectl get all --selector env=prod,bu=finance,tier=frontend\n<\/code><\/pre>"},{"q":"A ReplicaSet definition file is given replicaset-definition-1.yaml. Try to create the replicaset. There is an issue with the file. Try to fix it.","a":"<pre><code>kubectl create -f replicaset-definition-1.yaml\n<\/code><\/pre>\n<p>Note the error message.<\/p>\n<p>Selector matchLabels should match with POD labels - Update <code>replicaset-definition-2.yaml<\/code><\/p>\n<p>The values for labels on lines 9 and 13 should match.<\/p>\n<pre><code>$ kubectl create -f replicaset-definition-2.yaml\n<\/code><\/pre>"}],"text":"We have deployed a number of PODs. They are labelled with tier, env and bu. How many PODs exist in the dev environment (env)? How many PODs are in the finance business unit (bu)? How many objects are in the prod environment including PODs, ReplicaSets and any other objects? Identify the POD which is part of the prod environment, the finance BU and of frontend tier? A ReplicaSet definition file is given replicaset-definition-1.yaml. Try to create the replicaset. There is an issue with the file. Try to fix it.","minutes":5},{"id":"03-taints","kind":"lesson","title":"Taints and Tolerations","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/06-Taints-and-Tolerations.md","html":"<p><strong>Taints<\/strong> (on nodes) and <strong>tolerations<\/strong> (on Pods) restrict what a node accepts. The course uses the bug-spray analogy: the taint repels every Pod except those that are tolerant to it.<\/p>\n<div class=\"anim\" data-anim=\"taints\"><\/div>\n\n<p>Taint a node:<\/p>\n<pre><code class=\"language-bash\">$ kubectl taint nodes &lt;node-name&gt; key=value:taint-effect\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl taint nodes node1 app=blue:NoSchedule\n<\/code><\/pre>\n<p>The <strong>taint effect<\/strong> defines what happens to Pods that don't tolerate the taint:<\/p>\n<table>\n<thead>\n<tr>\n<th>Effect<\/th>\n<th>New Pods<\/th>\n<th>Pods already running<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>NoSchedule<\/code><\/td>\n<td>Not scheduled<\/td>\n<td>Stay<\/td>\n<\/tr>\n<tr>\n<td><code>PreferNoSchedule<\/code><\/td>\n<td>Avoided if possible, not guaranteed<\/td>\n<td>Stay<\/td>\n<\/tr>\n<tr>\n<td><code>NoExecute<\/code><\/td>\n<td>Not scheduled<\/td>\n<td><strong>Evicted<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Tolerations go in the Pod definition. Values are quoted:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n name: myapp-pod\nspec:\n containers:\n - name: nginx-container\n   image: nginx\n tolerations:\n - key: &quot;app&quot;\n   operator: &quot;Equal&quot;\n   value: &quot;blue&quot;\n   effect: &quot;NoSchedule&quot;\n<\/code><\/pre>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">What taints don't do<\/p>\n<p>Taints and tolerations don't tell a Pod to go to a particular node. They tell the node which Pods to accept. A tolerant Pod can still land somewhere else.<\/p>\n<\/div>\n<p>The master node has a taint that keeps application Pods off it:<\/p>\n<pre><code class=\"language-bash\">$ kubectl describe node kubemaster |grep Taint\n<\/code><\/pre>\n<p>To remove a taint, append <code>-<\/code>: <code>kubectl taint nodes node1 app=blue:NoSchedule-<\/code>.<\/p>","text":"Taints (on nodes) and tolerations (on Pods) restrict what a node accepts. The course uses the bug-spray analogy: the taint repels every Pod except those that are tolerant to it. Taint a node: The taint effect defines what happens to Pods that don't tolerate the taint: Effect New Pods Pods already running NoSchedule Not scheduled Stay PreferNoSchedule Avoided if possible, not guaranteed Stay NoExecute Not scheduled Evicted Tolerations go in the Pod definition. Values are quoted: What taints don't do Taints and tolerations don't tell a Pod to go to a particular node. They tell the node which Pods to accept. A tolerant Pod can still land somewhere else. The master node has a taint that keeps application Pods off it: To remove a taint, append - : kubectl taint nodes node1 app=blue:NoSchedule- .","minutes":2,"ncode":4},{"id":"03-lab-5","kind":"lab","title":"Lab · Taints and Tolerations","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/07-Practice-Test-Taints-and-Tolerations.md","practice":"https://kodekloud.com/topic/practice-test-taints-and-tolerations/","items":[{"q":"How many nodes exist on the system?","a":"<pre><code>$ kubectl get nodes\n<\/code><\/pre>\n<p>Count the nodes<\/p>"},{"q":"Do any taints exist on node01 node?","a":"<pre><code>$ kubectl describe node node01\n<\/code><\/pre>\n<p>Find the <code>Taints<\/code> property in the output.<\/p>"},{"q":"Create a taint on node01 with key of spray, value of mortein and effect of NoSchedule","a":"<pre><code>kubectl taint nodes node01 spray=mortein:NoSchedule\n<\/code><\/pre>"},{"q":"Create a new pod with the nginx image and pod name as mosquito.","a":"<pre><code>kubectl run mosquito --image nginx\n<\/code><\/pre>"},{"q":"What is the state of the POD?","a":"<pre><code>kubectl get pods\n<\/code><\/pre>\n<p>Check the <code>STATUS<\/code> column<\/p>"},{"q":"Why do you think the pod is in a pending state?","a":"<p>Mosqitoes don't like mortein!<\/p>\n<p>So the answer is that the pod cannot tolerate the taint on the node.<\/p>"},{"q":"Create another pod named bee with the nginx image, which has a toleration set to the taint mortein.","a":"<p>Allegedly bees are immune to mortein!<\/p>\n<ol>\n<li>Create a YAML skeleton for the pod imperatively<\/li>\n<\/ol>\n<pre><code>kubectl run bee --image nginx --dry-run=client -o yaml &gt; bee.yaml\n<\/code><\/pre>\n<ol>\n<li>Edit the file to add the toleration<\/li>\n<\/ol>\n<pre><code>vi bee.yaml\n<\/code><\/pre>\n<ol>\n<li>Add the toleration. This goes at the same indentation level as <code>containers<\/code> as it is a POD setting.<\/li>\n<\/ol>\n<pre><code class=\"language-yaml\">tolerations:\n- key: spray\n  value: mortein\n  effect: NoSchedule\n  operator: Equal\n<\/code><\/pre>\n<ol>\n<li>Save and exit, then create pod<\/li>\n<\/ol>\n<pre><code>kubectl create -f bee.yaml\n<\/code><\/pre>"},{"q":"Information only.","a":""},{"q":"Do you see any taints on controlplane node?","a":"<pre><code>kubectl describe node controlplane\n<\/code><\/pre>\n<p>Examine the <code>Taints<\/code> property.<\/p>"},{"q":"Remove the taint on controlplane, which currently has the taint effect of NoSchedule.","a":"<pre><code>kubectl taint nodes controlplane node-role.kubernetes.io/control-plane:NoSchedule-\n<\/code><\/pre>"},{"q":"What is the state of the pod mosquito now?","a":"<pre><code>$ kubectl get pods\n<\/code><\/pre>"},{"q":"Which node is the POD mosquito on now?","a":"<pre><code>$ kubectl get pods -o wide\n<\/code><\/pre>\n<p>This also explains why the <code>mosquito<\/code> pod colud schedule anywhere. It also could not tolerate <code>controlplane<\/code> taints, which we have now removed.<\/p>"}],"text":"How many nodes exist on the system? Do any taints exist on node01 node? Create a taint on node01 with key of spray, value of mortein and effect of NoSchedule Create a new pod with the nginx image and pod name as mosquito. What is the state of the POD? Why do you think the pod is in a pending state? Create another pod named bee with the nginx image, which has a toleration set to the taint mortein. Information only. Do you see any taints on controlplane node? Remove the taint on controlplane, which currently has the taint effect of NoSchedule. What is the state of the pod mosquito now? Which node is the POD mosquito on now?","minutes":12},{"id":"03-node-selectors","kind":"lesson","title":"Node Selectors","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/08-Node-Selectors.md","html":"<p>To send a heavy Pod to the large node of the cluster, the simplest method is <strong>nodeSelector<\/strong>: label the node, then have the Pod ask for that label.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n name: myapp-pod\nspec:\n containers:\n - name: data-processor\n   image: data-processor\n nodeSelector:\n  size: Large\n<\/code><\/pre>\n<p>Label a node:<\/p>\n<pre><code class=\"language-bash\">$ kubectl label nodes &lt;node-name&gt; &lt;label-key&gt;=&lt;label-value&gt;\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl label nodes node-1 size=Large\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pod-definition.yml\n<\/code><\/pre>\n<p><strong>Limitations<\/strong>: a single label and a strict equality. You can't express \"Large <strong>or<\/strong> Medium\" or \"<strong>not<\/strong> Small\". For that you need <strong>Node Affinity<\/strong>.<\/p>","text":"To send a heavy Pod to the large node of the cluster, the simplest method is nodeSelector : label the node, then have the Pod ask for that label. Label a node: Limitations : a single label and a strict equality. You can't express \"Large or Medium\" or \" not Small\". For that you need Node Affinity .","minutes":2,"ncode":4},{"id":"03-node-affinity","kind":"lesson","title":"Node Affinity","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/09-Node-Affinity.md","html":"<p><strong>Node Affinity<\/strong> has the same goal as nodeSelector (host Pods on particular nodes) but supports advanced <strong>expressions<\/strong>: <code>In<\/code>, <code>NotIn<\/code>, <code>Exists<\/code>, <code>DoesNotExist<\/code>, <code>Gt<\/code>, <code>Lt<\/code>.<\/p>\n<p>The starting nodeSelector:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n name: myapp-pod\nspec:\n containers:\n - name: data-processor\n   image: data-processor\n nodeSelector:\n  size: Large\n<\/code><\/pre>\n<p>With affinity, \"Large or Medium\":<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n name: myapp-pod\nspec:\n containers:\n - name: data-processor\n   image: data-processor\n affinity:\n   nodeAffinity:\n     requiredDuringSchedulingIgnoredDuringExecution:\n        nodeSelectorTerms:\n        - matchExpressions:\n          - key: size\n            operator: In\n            values:\n            - Large\n            - Medium\n<\/code><\/pre>\n<p>\"Anything but Small\":<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n name: myapp-pod\nspec:\n containers:\n - name: data-processor\n   image: data-processor\n affinity:\n   nodeAffinity:\n     requiredDuringSchedulingIgnoredDuringExecution:\n        nodeSelectorTerms:\n        - matchExpressions:\n          - key: size\n            operator: NotIn\n            values:\n            - Small\n<\/code><\/pre>\n<p>\"The size label exists, whatever its value\":<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n name: myapp-pod\nspec:\n containers:\n - name: data-processor\n   image: data-processor\n affinity:\n   nodeAffinity:\n     requiredDuringSchedulingIgnoredDuringExecution:\n        nodeSelectorTerms:\n        - matchExpressions:\n          - key: size\n            operator: Exists\n<\/code><\/pre>\n<p>Try the operators on a small cluster:<\/p>\n<div class=\"anim\" data-anim=\"affinity\"><\/div>\n\n<p><strong>Node Affinity types<\/strong>: the name describes behaviour during scheduling (<em>DuringScheduling<\/em>) and during execution (<em>DuringExecution<\/em>).<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>During scheduling<\/th>\n<th>During execution<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>requiredDuringSchedulingIgnoredDuringExecution<\/code><\/td>\n<td>Required: otherwise the Pod stays Pending<\/td>\n<td>Ignored<\/td>\n<\/tr>\n<tr>\n<td><code>preferredDuringSchedulingIgnoredDuringExecution<\/code><\/td>\n<td>Preferred: falls back to any node<\/td>\n<td>Ignored<\/td>\n<\/tr>\n<tr>\n<td><code>requiredDuringSchedulingRequiredDuringExecution<\/code> <em>(planned)<\/em><\/td>\n<td>Required<\/td>\n<td>Pod is evicted if the label goes away<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Node Affinity has the same goal as nodeSelector (host Pods on particular nodes) but supports advanced expressions : In , NotIn , Exists , DoesNotExist , Gt , Lt . The starting nodeSelector: With affinity, \"Large or Medium\": \"Anything but Small\": \"The size label exists, whatever its value\": Try the operators on a small cluster: Node Affinity types : the name describes behaviour during scheduling ( DuringScheduling ) and during execution ( DuringExecution ). Type During scheduling During execution requiredDuringSchedulingIgnoredDuringExecution Required: otherwise the Pod stays Pending Ignored preferredDuringSchedulingIgnoredDuringExecution Preferred: falls back to any node Ignored requiredDuringSchedulingRequiredDuringExecution (planned) Required Pod is evicted if the label goes away","minutes":2,"ncode":4},{"id":"03-lab-8","kind":"lab","title":"Lab · Node Affinity","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/10-Practice-Test-Node-Affinity.md","practice":"https://kodekloud.com/topic/practice-test-node-affinity-2/","items":[{"q":"How many Labels exist on node node01?","a":"<pre><code>kubectl describe node node01\n<\/code><\/pre>\n<p>Look under <code>Labels<\/code> section<\/p>\n<p>--- OR ---<\/p>\n<pre><code>kubectl get node node01 --show-labels\n<\/code><\/pre>"},{"q":"What is the value set to the label key beta.kubernetes.io/arch on node01?","a":"<p>From the output of Q1, find the answer there.<\/p>"},{"q":"Apply a label color=blue to node node01","a":"<pre><code>kubectl label node node01 color=blue\n<\/code><\/pre>"},{"q":"Create a new deployment named blue with the nginx image and 3 replicas.","a":"<pre><code>kubectl create deployment blue --image=nginx --replicas=3\n<\/code><\/pre>"},{"q":"Which nodes can the pods for the blue deployment be placed on?","a":"<p>Check if master and node01 have any taints on them that will prevent the pods to be scheduled on them. If there are no taints, the pods can be scheduled on either node.<\/p>\n<pre><code>kubectl describe nodes controlplane | grep -i taints\nkubectl describe nodes node01 | grep -i taints\n<\/code><\/pre>"},{"q":"Set Node Affinity to the deployment to place the pods on node01 only.","a":"<p>Now we edit in place the deployment we created earlier. Remember that we labelled <code>node01<\/code> with <code>color=blue<\/code>? Now we are going to create an affinity to that label, which will \"attract\" the pods of the deployment to it.<\/p>\n<p>1.<\/p>\n<pre><code>$ kubectl edit deployment blue\n<\/code><\/pre>\n<ol>\n<li>Add the YAML below under the template.spec section, i.e. at the same level as <code>containers<\/code> as it is a POD setting. The affinity will be considered only during scheduling stage, however this edit will cause the deployment to roll out again.<\/li>\n<\/ol>\n<pre><code class=\"language-yaml\">affinity:\n  nodeAffinity:\n    requiredDuringSchedulingIgnoredDuringExecution:\n      nodeSelectorTerms:\n      - matchExpressions:\n        - key: color\n          operator: In\n          values:\n          - blue\n<\/code><\/pre>"},{"q":"Which nodes are the pods placed on now?","a":"<pre><code>$ kubectl get pods -o wide\n<\/code><\/pre>"},{"q":"Create a new deployment named red with the nginx image and 2 replicas, and ensure it gets placed on the controlplane node only.","a":"<ol>\n<li>Create a YAML template for the deploymemt<\/li>\n<\/ol>\n<pre><code>kubectl create deployment red --image nginx --replicas 2 --dry-run=client -o yaml &gt; red.yaml\n<\/code><\/pre>\n<ol>\n<li>Edit the file<\/li>\n<\/ol>\n<pre><code>vi red.yaml\n<\/code><\/pre>\n<ol>\n<li>Add the toleration using the label stated in the question, and placing it as before for the <code>blue<\/code> deployment<\/li>\n<\/ol>\n<pre><code class=\"language-yaml\">affinity:\n  nodeAffinity:\n    requiredDuringSchedulingIgnoredDuringExecution:\n      nodeSelectorTerms:\n      - matchExpressions:\n        - key: node-role.kubernetes.io/control-plane\n          operator: Exists\n<\/code><\/pre>\n<ol>\n<li>Save, exit and create the deployment<\/li>\n<\/ol>\n<pre><code>kubectl create -f red.yaml\n<\/code><\/pre>\n<ol>\n<li>Check the result<\/li>\n<\/ol>\n<pre><code>$ kubectl get pods -o wide\n<\/code><\/pre>"}],"text":"How many Labels exist on node node01? What is the value set to the label key beta.kubernetes.io/arch on node01? Apply a label color=blue to node node01 Create a new deployment named blue with the nginx image and 3 replicas. Which nodes can the pods for the blue deployment be placed on? Set Node Affinity to the deployment to place the pods on node01 only. Which nodes are the pods placed on now? Create a new deployment named red with the nginx image and 2 replicas, and ensure it gets placed on the controlplane node only.","minutes":8},{"id":"03-taints-vs-affinity","kind":"lesson","title":"Taints and Tolerations vs Node Affinity","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/11.Taints-and-Tolerations-vs-Node-Affinity.md","html":"<p>Goal: dedicate three nodes (blue, red, green) to three teams, in a cluster shared with others.<\/p>\n<ul>\n<li><strong>Taints and tolerations only<\/strong>: other Pods stay off our nodes, but our Pods may land on other teams' nodes.<\/li>\n<li><strong>Node affinity only<\/strong>: our Pods go to our nodes, but other Pods may also be placed on them.<\/li>\n<li><strong>Both combined<\/strong>: taints repel the others, affinity attracts ours. The nodes are <strong>completely dedicated<\/strong>.<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"combo\"><\/div>","text":"Goal: dedicate three nodes (blue, red, green) to three teams, in a cluster shared with others. Taints and tolerations only : other Pods stay off our nodes, but our Pods may land on other teams' nodes. Node affinity only : our Pods go to our nodes, but other Pods may also be placed on them. Both combined : taints repel the others, affinity attracts ours. The nodes are completely dedicated .","minutes":2,"ncode":0},{"id":"03-resources","kind":"lesson","title":"Resource Requirements and Limits","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/12-Resource-Limits.md","html":"<p>Each node has a set of CPU, memory and disk resources. The scheduler places a Pod where its requirements fit. If no node has enough resources, the Pod stays <strong>Pending<\/strong>, with an event such as <em>Insufficient cpu<\/em>.<\/p>\n<ul>\n<li><strong>Request<\/strong>: what the container reserves. The scheduler uses it to pick a node.<\/li>\n<li><strong>Limit<\/strong>: the maximum allowed at runtime.<\/li>\n<\/ul>\n<p>The course quotes defaults of 0.5 CPU / 256Mi as request and 1 CPU / 512Mi as limit. In recent versions, these defaults only apply when a <strong>LimitRange<\/strong> is defined in the namespace.<\/p>\n<p>Units: <code>1<\/code> CPU = 1 vCPU (1000m; it can go as low as <code>0.1<\/code> or <code>100m<\/code>). Memory: <code>Mi<\/code>/<code>Gi<\/code> (powers of 1024) or <code>M<\/code>/<code>G<\/code> (powers of 1000).<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: simple-webapp-color\n  labels:\n    name: simple-webapp-color\nspec:\n containers:\n - name: simple-webapp-color\n   image: simple-webapp-color\n   ports:\n    - containerPort:  8080\n   resources:\n     requests:\n      memory: &quot;1Gi&quot;\n      cpu: &quot;1&quot;\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: simple-webapp-color\n  labels:\n    name: simple-webapp-color\nspec:\n containers:\n - name: simple-webapp-color\n   image: simple-webapp-color\n   ports:\n    - containerPort:  8080\n   resources:\n     requests:\n      memory: &quot;1Gi&quot;\n      cpu: &quot;1&quot;\n     limits:\n       memory: &quot;2Gi&quot;\n       cpu: &quot;2&quot;\n<\/code><\/pre>\n<p>Requests and limits are set <strong>per container<\/strong>. What happens when a container exceeds its limits?<\/p>\n<div class=\"anim\" data-anim=\"limits\"><\/div>","text":"Each node has a set of CPU, memory and disk resources. The scheduler places a Pod where its requirements fit. If no node has enough resources, the Pod stays Pending , with an event such as Insufficient cpu . Request : what the container reserves. The scheduler uses it to pick a node. Limit : the maximum allowed at runtime. The course quotes defaults of 0.5 CPU / 256Mi as request and 1 CPU / 512Mi as limit. In recent versions, these defaults only apply when a LimitRange is defined in the namespace. Units: 1 CPU = 1 vCPU (1000m; it can go as low as 0.1 or 100m ). Memory: Mi / Gi (powers of 1024) or M / G (powers of 1000). Requests and limits are set per container . What happens when a container exceeds its limits?","minutes":2,"ncode":2},{"id":"03-lab-11","kind":"lab","title":"Lab · Resource Limits","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/13-Practice-Test-Resource-Limits.md","practice":"https://kodekloud.com/topic/practice-test-resource-limits/","items":[{"q":"Run the command &#x27;kubectl describe pod rabbit&#x27; and inspect requests.","a":"<pre><code>$ kubectl describe pod rabbit\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl delete pod rabbit&#x27;.","a":"<pre><code>$ kubectl delete pod rabbit\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl get pods&#x27; and inspect the status of the pod elephant","a":"<pre><code>$ kubectl get pods\n<\/code><\/pre>"},{"q":"The status &#x27;OOMKilled&#x27; indicates that the pod ran out of memory. Identify the memory limit set on the POD.","a":""},{"q":"Generate a template of the existing pod.","a":"<pre><code>$ kubectl get pods elephant -o yaml &gt; elephant.yaml\n<\/code><\/pre>\n<p>Update the elephant.yaml pod definition with the resource memory limits to 20Mi<\/p>\n<pre><code>resources:\n    limits:\n      memory: 20Mi\n---\n<\/code><\/pre>\n<p>Delete the pod and recreate it.<\/p>\n<pre><code>$ kubectl delete pod elephant\n$ kubectl create -f elephant.yaml\n<\/code><\/pre>"},{"q":"Inspect the status of POD. Make sure it&#x27;s running","a":"<pre><code>$ kubectl get pods\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl delete pod elephant&#x27;.","a":"<pre><code>$ kubectl delete pod elephant\n<\/code><\/pre>"}],"text":"Run the command 'kubectl describe pod rabbit' and inspect requests. Run the command 'kubectl delete pod rabbit'. Run the command 'kubectl get pods' and inspect the status of the pod elephant The status 'OOMKilled' indicates that the pod ran out of memory. Identify the memory limit set on the POD. Generate a template of the existing pod. Inspect the status of POD. Make sure it's running Run the command 'kubectl delete pod elephant'.","minutes":7},{"id":"03-daemonsets","kind":"lesson","title":"DaemonSets","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/14-DaemonSets.md","html":"<p>A <strong>DaemonSet<\/strong> is like a ReplicaSet, but it runs <strong>exactly one copy<\/strong> of the Pod on <strong>each node<\/strong> of the cluster. A new node gets its copy; a removed node loses it.<\/p>\n<p>Use cases: monitoring agents, log collectors, <strong>kube-proxy<\/strong>, networking solutions (weave-net…).<\/p>\n<div class=\"anim\" data-anim=\"daemonset\"><\/div>\n\n<p>The definition is almost identical to a ReplicaSet's. Compare:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: ReplicaSet\nmetadata:\n  name: monitoring-daemon\n  labels:\n    app: nginx\nspec:\n  selector:\n    matchLabels:\n      app: monitoring-agent\n  template:\n    metadata:\n     labels:\n       app: monitoring-agent\n    spec:\n      containers:\n      - name: monitoring-agent\n        image: monitoring-agent\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: DaemonSet\nmetadata:\n  name: monitoring-daemon\n  labels:\n    app: nginx\nspec:\n  selector:\n    matchLabels:\n      app: monitoring-agent\n  template:\n    metadata:\n     labels:\n       app: monitoring-agent\n    spec:\n      containers:\n      - name: monitoring-agent\n        image: monitoring-agent\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f daemon-set-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get daemonsets\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl describe daemonsets monitoring-daemon\n<\/code><\/pre>\n<p><strong>How it works<\/strong>: up to v1.12, the DaemonSet set <code>nodeName<\/code> on each Pod. Since then, it uses the default scheduler with <strong>node affinity<\/strong>.<\/p>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">Exam tip<\/p>\n<p>There is no <code>kubectl create daemonset<\/code>. Generate a Deployment with <code>--dry-run=client -o yaml<\/code>, change <code>kind<\/code> to <code>DaemonSet<\/code> and remove <code>replicas<\/code>, <code>strategy<\/code> and <code>status<\/code>.<\/p>\n<\/div>","text":"A DaemonSet is like a ReplicaSet, but it runs exactly one copy of the Pod on each node of the cluster. A new node gets its copy; a removed node loses it. Use cases: monitoring agents, log collectors, kube-proxy , networking solutions (weave-net…). The definition is almost identical to a ReplicaSet's. Compare: How it works : up to v1.12, the DaemonSet set nodeName on each Pod. Since then, it uses the default scheduler with node affinity . Exam tip There is no kubectl create daemonset . Generate a Deployment with --dry-run=client -o yaml , change kind to DaemonSet and remove replicas , strategy and status .","minutes":2,"ncode":5},{"id":"03-lab-13","kind":"lab","title":"Lab · DaemonSets","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/15-Practice-Test-DaemonSets.md","practice":"https://kodekloud.com/topic/practice-test-daemonsets/","items":[{"q":"Run the command kubectl get daemonsets --all-namespaces","a":"<pre><code>$ kubectl get daemonsets --all-namespaces\n<\/code><\/pre>"},{"q":"Run the command kubectl get daemonsets --all-namespaces","a":"<pre><code>$ kubectl get daemonsets --all-namespaces\n<\/code><\/pre>"},{"q":"Run the command kubectl get all --all-namespaces and identify the types","a":"<pre><code>$ kubectl get all --all-namespaces\n<\/code><\/pre>"},{"q":"Run the command kubectl describe daemonset kube-proxy --namespace=kube-system","a":"<pre><code>$ kubectl describe daemonset kube-proxy --namespace=kube-system\n<\/code><\/pre>"},{"q":"Run the command kubectl describe daemonset kube-flannel-ds-amd64 --namespace=kube-system","a":"<pre><code>$ kubectl describe daemonset kube-flannel-ds-amd64 --namespace=kube-system\n<\/code><\/pre>"},{"q":"Create a daemonset","a":"<pre><code>$ vi ds.yaml\n<\/code><\/pre>\n<pre><code>apiVersion: apps/v1\nkind: DaemonSet\nmetadata:\n  name: elasticsearch\n  namespace: kube-system\n  labels:\n    k8s-app: fluentd-logging\nspec:\n  selector:\n    matchLabels:\n      name: elasticsearch\n  template:\n    metadata:\n      labels:\n        name: elasticsearch\n    spec:\n      tolerations:\n      # this toleration is to have the daemonset runnable on master nodes\n      # remove it if your masters can't run pods\n      - key: node-role.kubernetes.io/master\n        effect: NoSchedule\n      containers:\n      - name: elasticsearch\n        image: k8s.gcr.io/fluentd-elasticsearch:1.20\n<\/code><\/pre>"},{"q":"To create the daemonset and list the daemonsets and pods","a":"<pre><code>$ kubectl create -f ds.yaml\n$ kubectl get ds -n kube-system\n$ kubectl get pod -n kube-system|grep elasticsearch\n<\/code><\/pre>"}],"text":"Run the command kubectl get daemonsets --all-namespaces Run the command kubectl get daemonsets --all-namespaces Run the command kubectl get all --all-namespaces and identify the types Run the command kubectl describe daemonset kube-proxy --namespace=kube-system Run the command kubectl describe daemonset kube-flannel-ds-amd64 --namespace=kube-system Create a daemonset To create the daemonset and list the daemonsets and pods","minutes":7},{"id":"03-static-pods","kind":"lesson","title":"Static Pods","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/16-Static-Pods.md","html":"<p>Picture a single node with no master: no kube-apiserver, no scheduler. The <strong>kubelet<\/strong> can still create Pods. It reads Pod definition files from a <strong>directory on the node<\/strong>, creates the Pods, restarts them if they crash, and deletes them if the file is removed. These are <strong>static Pods<\/strong>.<\/p>\n<div class=\"anim\" data-anim=\"staticpod\"><\/div>\n\n<p>The directory is passed to the kubelet with the <strong><code>--pod-manifest-path<\/code><\/strong> option in <code>kubelet.service<\/code>, or through <code>staticPodPath<\/code> in the config file referenced by <code>--config<\/code> (the kubeadm way). With kubeadm, it is <strong><code>/etc/kubernetes/manifests<\/code><\/strong>.<\/p>\n<p>Without a cluster, you see these Pods with the runtime:<\/p>\n<pre><code class=\"language-bash\">$ docker ps\n<\/code><\/pre>\n<p>The kubelet can create both kinds of Pods at the same time. When the node is part of a cluster, it creates a read-only <strong>mirror Pod<\/strong> in the kube-apiserver: it shows in <code>kubectl get pods<\/code>, suffixed with the node name (<code>kube-apiserver-controlplane<\/code>), but you can't edit or delete it through kubectl.<\/p>\n<p><strong>Use case<\/strong>: deploying the control plane itself. kubeadm installs the kubelet on the master, then places the manifests for <code>etcd<\/code>, <code>kube-apiserver<\/code>, <code>kube-controller-manager<\/code> and <code>kube-scheduler<\/code> in <code>/etc/kubernetes/manifests<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Static Pods<\/th>\n<th>DaemonSets<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Created by the kubelet<\/td>\n<td>Created by the kube-apiserver (DaemonSet controller)<\/td>\n<\/tr>\n<tr>\n<td>Deploy control plane components<\/td>\n<td>Deploy monitoring agents, logging agents<\/td>\n<\/tr>\n<tr>\n<td>Ignored by the kube-scheduler<\/td>\n<td>Ignored by the kube-scheduler<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">Find the directory<\/p>\n<p><code>ps -aux | grep kubelet<\/code> to find <code>--config<\/code>, then <code>grep staticPodPath /var/lib/kubelet/config.yaml<\/code>. On a worker, ssh into the node before searching.<\/p>\n<\/div>","text":"Picture a single node with no master: no kube-apiserver, no scheduler. The kubelet can still create Pods. It reads Pod definition files from a directory on the node , creates the Pods, restarts them if they crash, and deletes them if the file is removed. These are static Pods . The directory is passed to the kubelet with the --pod-manifest-path option in kubelet.service , or through staticPodPath in the config file referenced by --config (the kubeadm way). With kubeadm, it is /etc/kubernetes/manifests . Without a cluster, you see these Pods with the runtime: The kubelet can create both kinds of Pods at the same time. When the node is part of a cluster, it creates a read-only mirror Pod in the kube-apiserver: it shows in kubectl get pods , suffixed with the node name ( kube-apiserver-controlplane ), but you can't edit or delete it through kubectl. Use case : deploying the control plane itself. kubeadm installs the kubelet on the master, then places the manifests for etcd , kube-apiserver , kube-controller-manager and kube-scheduler in /etc/kubernetes/manifests . Static Pods DaemonSets Created by the kubelet Created by the kube-apiserver (DaemonSet controller) Deploy control plane components Deploy monitoring agents, logging agents Ignored by the kube-scheduler Ignored by the kube-scheduler Find the directory ps -aux | grep kubelet to find --config , then grep staticPodPath /var/lib/kubelet/config.yaml . On a worker, ssh into the node before searching.","minutes":2,"ncode":1},{"id":"03-lab-15","kind":"lab","title":"Lab · Static Pods","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/17-Practice-Test-StaticPods.md","practice":"https://kodekloud.com/topic/practice-test-static-pods/","items":[{"q":"Run the command kubectl get pods --all-namespaces and look for those with -controlplane appended in the name","a":"<pre><code>$ kubectl get pods --all-namespaces\n<\/code><\/pre>"},{"q":"Which of the below components is NOT deployed as a static pod?","a":"<pre><code>$ kubectl get pods --all-namespaces\n<\/code><\/pre>"},{"q":"Which of the below components is NOT deployed as a static POD?","a":"<pre><code>$ kubectl get pods --all-namespaces\n<\/code><\/pre>"},{"q":"Run the kubectl get pods --all-namespaces -o wide","a":"<pre><code>$ kubectl get pods --all-namespaces -o wide\n<\/code><\/pre>"},{"q":"Run the command ps -aux | grep kubelet and identify the config file - --config=/var/lib/kubelet/config.yaml. Then checkin the config file for staticPdPath.","a":"<pre><code>$ ps -aux | grep kubelet\n<\/code><\/pre>"},{"q":"Count the number of files under /etc/kubernetes/manifests","a":""},{"q":"Check the image defined in the /etc/kubernetes/manifests/kube-apiserver.yaml manifest file.","a":""},{"q":"Create a pod definition file in the manifests folder. Use command kubectl run --restart=Never --image=busybox static-busybox --dry-run -o yaml --command -- sleep 1000 &gt; /etc/kubernetes/manifests/static-busybox.yaml","a":"<pre><code>$ kubectl run --restart=Never --image=busybox static-busybox --dry-run=client -o yaml --command -- sleep 1000 &gt; /etc/kubernetes/manifests/static-busybox.yaml\n<\/code><\/pre>"},{"q":"Simply edit the static pod definition file and save it","a":"<pre><code>/etc/kubernetes/manifests/static-busybox.yaml\n<\/code><\/pre>\n<p>OR<\/p>\n<pre><code>Run the command with updated image tag:\nkubectl run --restart=Never --image=busybox:1.28.4 static-busybox--dry-run=client -o yaml --command -- sleep 1000 &gt; /etc/kubernetes/manifests/static-busybox.yaml\n<\/code><\/pre>"},{"q":"Identify which node the static pod is created on, ssh to the node and delete the pod definition file. If you don&#x27;t know theIP of the node, run the kubectl get nodes -o wide command and identify the IP. Then SSH to the node using that IP. For static pod manifest path look at the file /var/lib/kubelet/config.yaml on node01","a":"<pre><code>$ kubectl get pods -o wide\n$ kubectl get nodes -o wide\n$ ssh &lt;ip address of pod&gt;\n$ grep staticPodPath /var/lib/kubelet/config.yaml\n$ node01 $ rm -rf /etc/just-to-mess-with-you/greenbox.yaml\n<\/code><\/pre>"}],"text":"Run the command kubectl get pods --all-namespaces and look for those with -controlplane appended in the name Which of the below components is NOT deployed as a static pod? Which of the below components is NOT deployed as a static POD? Run the kubectl get pods --all-namespaces -o wide Run the command ps -aux | grep kubelet and identify the config file - --config=/var/lib/kubelet/config.yaml. Then checkin the config file for staticPdPath. Count the number of files under /etc/kubernetes/manifests Check the image defined in the /etc/kubernetes/manifests/kube-apiserver.yaml manifest file. Create a pod definition file in the manifests folder. Use command kubectl run --restart=Never --image=busybox static-busybox --dry-run -o yaml --command -- sleep 1000 > /etc/kubernetes/manifests/static-busybox.yaml Simply edit the static pod definition file and save it Identify which node the static pod is created on, ssh to the node and delete the pod definition file. If you don't know theIP of the node, run the kubectl get nodes -o wide command and identify the IP. Then SSH to the node using that IP. For static pod manifest path look at the file /var/lib/kubelet/config.yaml on node01","minutes":10},{"id":"03-multiple-schedulers","kind":"lesson","title":"Multiple Schedulers","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/18-Multiple-Schedulers.md","html":"<p>If the default scheduler doesn't fit your needs, you can write your own and run it <strong>alongside<\/strong>. Each scheduler needs a unique name (<code>schedulerName<\/code> in its <code>KubeSchedulerConfiguration<\/code>); the default one is <code>default-scheduler<\/code>.<\/p>\n<pre><code class=\"language-bash\">$ wget <a target=\"_blank\" rel=\"noopener\" href=\"https://storage.googleapis.com/kubernetes-release/release/v1.12.0/bin/linux/amd64/kube-scheduler\" target=\"_blank\" rel=\"noopener\">https://storage.googleapis.com/kubernetes-release/release/v1.12.0/bin/linux/amd64/kube-scheduler<\/a>\n<\/code><\/pre>\n<p>With kubeadm, deploy it as a Pod:<\/p>\n<pre><code class=\"language-bash\">$ kubectl create -f my-custom-scheduler.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get pods -n kube-system\n<\/code><\/pre>\n<p>A Pod picks its scheduler with <strong><code>schedulerName<\/code><\/strong>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx\nspec:\n  containers:\n  - image: nginx\n    name: nginx\n  schedulerName: my-custom-scheduler\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pod-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get pods\n<\/code><\/pre>\n<p>If the scheduler is misconfigured, the Pod stays Pending. To see which scheduler placed what, check the events (<em>Source<\/em> column):<\/p>\n<pre><code class=\"language-bash\">$ kubectl get events\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl logs my-custom-scheduler -n kube-system\n<\/code><\/pre>","text":"If the default scheduler doesn't fit your needs, you can write your own and run it alongside . Each scheduler needs a unique name ( schedulerName in its KubeSchedulerConfiguration ); the default one is default-scheduler . With kubeadm, deploy it as a Pod: A Pod picks its scheduler with schedulerName : If the scheduler is misconfigured, the Pod stays Pending. To see which scheduler placed what, check the events ( Source column):","minutes":2,"ncode":8},{"id":"03-lab-17","kind":"lab","title":"Lab · Multiple Schedulers","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/19-Practice-Test-Multiple-Schedulers.md","practice":"https://kodekloud.com/topic/practice-test-multiple-schedulers/","items":[{"q":"Run the command &#x27;kubectl get pods --namespace=kube-system&#x27;","a":"<pre><code>$ kubectl get pods --namespace=kube-system\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl describe pod kube-scheduler-controlplane --namespace=kube-system&#x27;","a":"<pre><code>$ kubectl describe pod kube-scheduler-controlplane --namespace=kube-system\n<\/code><\/pre>"},{"q":"Use the imperative command to create the configmap with option --from-file","a":"<pre><code>$ kubectl create -n kube-system configmap my-scheduler-config --from-file=/root/my-scheduler-config.yaml\n<\/code><\/pre>"},{"q":"Use the file at /root/my-scheduler.yaml to create your own scheduler with correct image.","a":"<pre><code>$ kubectl create -f /root/my-scheduler.yaml\n<\/code><\/pre>"},{"q":"Set schedulerName property on pod specification to the name of the new scheduler. File is located at /root/nginx-pod.yaml","a":"<pre><code>master $ grep schedulerName /root/nginx-pod.yaml\nschedulerName: my-scheduler\n\n$ kubectl create -f /root/nginx-pod.yaml\n<\/code><\/pre>"}],"text":"Run the command 'kubectl get pods --namespace=kube-system' Run the command 'kubectl describe pod kube-scheduler-controlplane --namespace=kube-system' Use the imperative command to create the configmap with option --from-file Use the file at /root/my-scheduler.yaml to create your own scheduler with correct image. Set schedulerName property on pod specification to the name of the new scheduler. File is located at /root/nginx-pod.yaml","minutes":5},{"id":"03-scheduler-profiles","kind":"lesson","title":"Configuring Kubernetes Schedulers","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/03-Scheduling/20-Configuring-Kubernetes-Schedulers.md","html":"<p>The scheduler processes Pods in several <strong>phases<\/strong>, each extensible through <strong>plugins<\/strong>:<\/p>\n<ol>\n<li><strong>Scheduling queue<\/strong>: Pods wait, sorted by <strong>priority<\/strong> (<code>priorityClassName<\/code>). Plugin: <code>PrioritySort<\/code>.<\/li>\n<li><strong>Filtering<\/strong>: nodes that can't run the Pod are dropped. Plugins: <code>NodeResourcesFit<\/code>, <code>NodeName<\/code>, <code>NodeUnschedulable<\/code>, <code>TaintToleration<\/code>, <code>NodeAffinity<\/code>.<\/li>\n<li><strong>Scoring<\/strong>: remaining nodes get a score. Plugins: <code>NodeResourcesFit<\/code>, <code>ImageLocality<\/code> (prefers a node that already has the image).<\/li>\n<li><strong>Binding<\/strong>: the Pod is bound to the highest-scoring node. Plugin: <code>DefaultBinder<\/code>.<\/li>\n<\/ol>\n<div class=\"anim\" data-anim=\"schedphases\"><\/div>\n\n<p>Since v1.18, a single scheduler binary can run several <strong>profiles<\/strong> (each with its own <code>schedulerName<\/code> and enabled or disabled plugins), avoiding multiple scheduler processes.<\/p>\n<p>References:<\/p>\n<ul>\n<li>https://github.com/kubernetes/community/blob/master/contributors/devel/sig-scheduling/scheduler.md<\/li>\n<li>https://kubernetes.io/blog/2017/03/advanced-scheduling-in-kubernetes/<\/li>\n<li>https://jvns.ca/blog/2017/07/27/how-does-the-kubernetes-scheduler-work/<\/li>\n<\/ul>","text":"The scheduler processes Pods in several phases , each extensible through plugins : Scheduling queue : Pods wait, sorted by priority ( priorityClassName ). Plugin: PrioritySort . Filtering : nodes that can't run the Pod are dropped. Plugins: NodeResourcesFit , NodeName , NodeUnschedulable , TaintToleration , NodeAffinity . Scoring : remaining nodes get a score. Plugins: NodeResourcesFit , ImageLocality (prefers a node that already has the image). Binding : the Pod is bound to the highest-scoring node. Plugin: DefaultBinder . Since v1.18, a single scheduler binary can run several profiles (each with its own schedulerName and enabled or disabled plugins), avoiding multiple scheduler processes. References: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-scheduling/scheduler.md https://kubernetes.io/blog/2017/03/advanced-scheduling-in-kubernetes/ https://jvns.ca/blog/2017/07/27/how-does-the-kubernetes-scheduler-work/","minutes":2,"ncode":0}],"quiz":[{"q":"A Pod stays Pending and there is no kube-scheduler Pod in kube-system. What's the quickest fix?","options":["Restart the kubelet","Recreate the Pod with spec.nodeName set","Add a toleration"],"answer":1,"explain":"Without a scheduler, setting nodeName at creation places the Pod directly on the node."},{"q":"Which taint effect evicts running Pods that don't tolerate it?","options":["NoSchedule","PreferNoSchedule","NoExecute"],"answer":2,"explain":"NoExecute rejects new Pods and evicts running ones without a matching toleration."},{"q":"Does a toleration guarantee the Pod lands on the tainted node?","options":["Yes","No, you need node affinity to attract the Pod"],"answer":1,"explain":"Taints repel, tolerations allow. To attract, use nodeSelector or nodeAffinity."},{"q":"Which affinity operator matches nodes that have the size label, whatever its value?","options":["In","NotIn","Exists"],"answer":2,"explain":"Exists takes no list of values."},{"q":"What happens to a container that keeps using more memory than its limit?","options":["It gets throttled","It is terminated (OOMKilled)","Nothing"],"answer":1,"explain":"CPU is throttled, memory isn't: sustained overuse leads to an OOMKill."},{"q":"Where does kubeadm put static Pod manifests?","options":["/var/lib/kubelet/pods","/etc/kubernetes/manifests","/etc/systemd/system"],"answer":1,"explain":"It's the staticPodPath value in /var/lib/kubelet/config.yaml."},{"q":"Which object guarantees one copy of a Pod on every node?","options":["ReplicaSet","Deployment","DaemonSet"],"answer":2,"explain":"The DaemonSet adds or removes its copy as nodes join or leave the cluster."},{"q":"Which Pod field selects a custom scheduler?","options":["scheduler","schedulerName","nodeScheduler"],"answer":1,"explain":"The name must match the one declared in the scheduler's configuration."}],"folder":"03-Scheduling"},{"num":"04","title":"Logging and Monitoring","short":"Monitoring","summary":"Measuring node and Pod resource consumption with the Metrics Server, and reading application logs.","lessons":[{"id":"04-monitor-cluster","kind":"lesson","title":"Monitor Cluster Components","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/04-Logging-and-Monitoring/02-Monitor-Cluster-Components.md","html":"<p>What do you want to monitor? At <strong>node<\/strong> level: the number of nodes, their health, and their CPU, memory, disk and network usage. At <strong>Pod<\/strong> level: the number of Pods and their resource consumption.<\/p>\n<p>Kubernetes doesn't ship a full monitoring solution. There are open-source tools (Prometheus, Elastic Stack) and proprietary ones (Datadog, Dynatrace). <strong>Heapster<\/strong>, the original project, is deprecated; its slimmed-down successor is the <strong>Metrics Server<\/strong>.<\/p>\n<ul>\n<li>You run <strong>one Metrics Server per cluster<\/strong>.<\/li>\n<li>It is an <strong>in-memory<\/strong> solution: metrics are not stored on disk, so there is no history.<\/li>\n<li>Metrics come from the <strong>kubelet<\/strong>, which embeds <strong>cAdvisor<\/strong> (<em>Container Advisor<\/em>): it collects Pod performance metrics and exposes them through the kubelet API.<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"metrics\"><\/div>\n\n<p>Getting started:<\/p>\n<pre><code class=\"language-bash\">$ git clone <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/kubernetes-incubator/metrics-server.git\" target=\"_blank\" rel=\"noopener\">https://github.com/kubernetes-incubator/metrics-server.git<\/a>\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f metric-server/deploy/1.8+/\n<\/code><\/pre>\n<p>View node performance, then Pod performance:<\/p>\n<pre><code class=\"language-bash\">$ kubectl top node\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl top pod\n<\/code><\/pre>\n<div class=\"admonition tip\">\n<p class=\"admonition-title\">Good to know<\/p>\n<p>Data takes a minute or two to appear after deployment. Until then, <code>kubectl top<\/code> returns a <em>metrics not available yet<\/em> error.<\/p>\n<\/div>","text":"What do you want to monitor? At node level: the number of nodes, their health, and their CPU, memory, disk and network usage. At Pod level: the number of Pods and their resource consumption. Kubernetes doesn't ship a full monitoring solution. There are open-source tools (Prometheus, Elastic Stack) and proprietary ones (Datadog, Dynatrace). Heapster , the original project, is deprecated; its slimmed-down successor is the Metrics Server . You run one Metrics Server per cluster . It is an in-memory solution: metrics are not stored on disk, so there is no history. Metrics come from the kubelet , which embeds cAdvisor ( Container Advisor ): it collects Pod performance metrics and exposes them through the kubelet API. Getting started: View node performance, then Pod performance: Good to know Data takes a minute or two to appear after deployment. Until then, kubectl top returns a metrics not available yet error.","minutes":2,"ncode":4},{"id":"04-lab-1","kind":"lab","title":"Lab · Monitor Cluster Components","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/04-Logging-and-Monitoring/03-Practice-Test-Monitor-Cluster-Components.md","practice":"https://kodekloud.com/topic/practice-test-monitor-cluster-components/","items":[{"q":"We have deployed a few PODs running workloads. Inspect it.","a":"<pre><code>kubectl get pods\n<\/code><\/pre>"},{"q":"Let us deploy metrics-server to monitor the PODs and Nodes. Pull the git repository for the deployment files.","a":"<pre><code>git clone <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/kodekloudhub/kubernetes-metrics-server.git\" target=\"_blank\" rel=\"noopener\">https://github.com/kodekloudhub/kubernetes-metrics-server.git<\/a>\n<\/code><\/pre>"},{"q":"Deploy the metrics-server by creating all the components downloaded.","a":"<p>Run the 'kubectl create -f .' command from within the downloaded repository.<\/p>\n<pre><code>cd kubernetes-metrics-server\nkubectl create -f .\n<\/code><\/pre>"},{"q":"It takes a few minutes for the metrics server to start gathering data.","a":"<p>Run the <code>kubectl top node<\/code> command and wait for a valid output.<\/p>\n<pre><code>kubectl top node\n<\/code><\/pre>"},{"q":"Identify the node that consumes the most CPU(cores).","a":"<p>Run the <code>kubectl top node<\/code> command<\/p>\n<pre><code>kubectl top node\n<\/code><\/pre>\n<p>Examine the <code>CPU(cores)<\/code> column of the output to get the answer.<\/p>"},{"q":"Identify the node that consumes the most Memory(bytes).","a":"<p>Run the <code>kubectl top node<\/code> command<\/p>\n<pre><code>$ kubectl top node\n<\/code><\/pre>\n<p>Examine the <code>MEMORY(bytes)<\/code> column of the output to get the answer.<\/p>"},{"q":"Identify the POD that consumes the most Memory(bytes).","a":"<p>Run the <code>kubectl top pod<\/code> command<\/p>\n<pre><code>kubectl top pod\n<\/code><\/pre>\n<p>Examine the <code>MEMORY(bytes)<\/code> column of the output to get the answer.<\/p>"},{"q":"Ide
