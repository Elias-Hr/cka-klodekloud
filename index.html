es).<\/p>","text":"The kubelet (through the container runtime) invokes the CNI plugin every time a container is created. Three settings drive it: --network-plugin=cni , the binaries directory --cni-bin-dir=/opt/cni/bin , and the configuration directory --cni-conf-dir=/etc/cni/net.d . If there are several configuration files, the first one in alphabetical order is used. Example file 10-bridge.conf : type bridge , bridge name, isGateway , ipMasq (NAT), and an ipam section ( type: host-local , subnet, routes).","minutes":2,"ncode":4},{"id":"09-cni-weave","kind":"lesson","title":"CNI Weave","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/12-CNI-weave.md","html":"<p>With hundreds of nodes, a routing table isn't enough. <strong>Weave<\/strong> deploys an <strong>agent<\/strong> on each node. The agents form a <strong>mesh network<\/strong>: each one knows the topology and where every Pod lives. When a Pod sends a packet to a Pod on another node, the agent intercepts it, <strong>encapsulates<\/strong> it with the source and destination node addresses, and the agent on the other side decapsulates it.<\/p>\n<div class=\"anim\" data-anim=\"weave\"><\/div>\n\n<p>Weave deploys with a single command, as a <strong>DaemonSet<\/strong>:<\/p>\n<pre><code class=\"language-bash\">$ kubectl apply -f &quot;<a target=\"_blank\" rel=\"noopener\" href=\"https://cloud.weave.works/k8s/net?k8s-version=$(kubectl\" target=\"_blank\" rel=\"noopener\">https://cloud.weave.works/k8s/net?k8s-version=$(kubectl<\/a> version | base64 | tr -d '\\n')&quot;\nserviceaccount/weave-net created\nclusterrole.rbac.authorization.k8s.io/weave-net created\nclusterrolebinding.rbac.authorization.k8s.io/weave-net created\nrole.rbac.authorization.k8s.io/weave-net created\nrolebinding.rbac.authorization.k8s.io/weave-net created\ndaemonset.apps/weave-net created\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get pods -n kube-system\nNAME                                      READY   STATUS             RESTARTS   AGE\ncoredns-66bff467f8-894jf                  1/1     Running            0          52m\ncoredns-66bff467f8-nck5f                  1/1     Running            0          52m\netcd-controlplane                         1/1     Running            0          52m\nkube-apiserver-controlplane               1/1     Running            0          52m\nkube-controller-manager-controlplane      1/1     Running            0          52m\nkube-keepalived-vip-mbr7d                 1/1     Running            0          52m\nkube-proxy-p2mld                          1/1     Running            0          52m\nkube-proxy-vjcwp                          1/1     Running            0          52m\nkube-scheduler-controlplane               1/1     Running            0          52m\nweave-net-jgr8x                           2/2     Running            0          45m\nweave-net-tb9tz                           2/2     Running            0          45m\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl logs weave-net-tb9tz weave -n kube-system\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl run test --image=busybox --command -- sleep 4500\npod/test created\n$ kubectl exec test -- ip route\ndefault via 10.244.1.1 dev eth0\n<\/code><\/pre>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Outdated link<\/p>\n<p>The <code>cloud.weave.works<\/code> URL is no longer served. The manifest is now published on GitHub (<code>weaveworks/weave<\/code> releases page, file <code>weave-daemonset-k8s.yaml<\/code>).<\/p>\n<\/div>","text":"With hundreds of nodes, a routing table isn't enough. Weave deploys an agent on each node. The agents form a mesh network : each one knows the topology and where every Pod lives. When a Pod sends a packet to a Pod on another node, the agent intercepts it, encapsulates it with the source and destination node addresses, and the agent on the other side decapsulates it. Weave deploys with a single command, as a DaemonSet : Outdated link The cloud.weave.works URL is no longer served. The manifest is now published on GitHub ( weaveworks/weave releases page, file weave-daemonset-k8s.yaml ).","minutes":2,"ncode":4},{"id":"09-lab-11","kind":"lab","title":"Lab · CNI Weave","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/13-Practice-Test-CNI-weave.md","practice":"https://kodekloud.com/topic/practice-test-cni-weave/","items":[{"q":"Inspect the kubelet service and identify the container runtime value is set for Kubernetes.","a":"<p>Check kubelet unit file<\/p>\n<pre><code class=\"language-bash\">systemctl cat kubelet\n<\/code><\/pre>\n<p>Note from the output this line<\/p>\n<pre><code>EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env\n<\/code><\/pre>\n<p>Inspect this file<\/p>\n<pre><code class=\"language-bash\">cat /var/lib/kubelet/kubeadm-flags.env\n<\/code><\/pre>\n<p>Answer can be found as value of <code>--container-runtime<\/code><\/p>\n<blockquote>\n<p>REMOTE<\/p>\n<\/blockquote>"},{"q":"What is the path configured with all binaries of CNI supported plugins?","a":"<p>This is the standard location for the installation of CNI plugins<\/p>\n<p>| <code>/opt/cni/bin<\/code><\/p>"},{"q":"Identify which of the below plugins is not available in the list of available CNI plugins on this host?","a":"<pre><code class=\"language-bash\">ls -l /opt/cni/bin\n<\/code><\/pre>\n<p>Find the option from the given answers not in the output opf the above<\/p>\n<blockquote>\n<p>cisco<\/p>\n<\/blockquote>"},{"q":"What is the CNI plugin configured to be used on this kubernetes cluster?","a":"<p>From the available options, we need to recognise which of the four is not the name of a container networking provider. Of the three that are, only one of them is present in <code>/opt/cni/bin<\/code><\/p>\n<blockquote>\n<p>flannel<\/p>\n<\/blockquote>\n<p>Note that <code>bridge<\/code> is a mechanism for connecting networks together, and not a network <em>provider<\/em>.<\/p>"},{"q":"What binary executable file will be run by kubelet after a container and its associated namespace are created.","a":"<p>Following on from Q4...<\/p>\n<blockquote>\n<p>flannel<\/p>\n<\/blockquote>\n<p>All the files in <code>/opt/cni/bin<\/code> are binary executables with tasks related to configuring network namespaces. After the network namespace is configured using the other programs, <code>flannel<\/code> implements the network.<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://tonylixu.medium.com/k8s-network-cni-introduction-b035d42ad68f\">This is a great article<\/a> on what the programs in <code>/opt/cni/bin<\/code> are for.<\/p>"}],"text":"Inspect the kubelet service and identify the container runtime value is set for Kubernetes. What is the path configured with all binaries of CNI supported plugins? Identify which of the below plugins is not available in the list of available CNI plugins on this host? What is the CNI plugin configured to be used on this kubernetes cluster? What binary executable file will be run by kubelet after a container and its associated namespace are created.","minutes":5},{"id":"09-lab-12","kind":"lab","title":"Lab · Deploy a Network Solution","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/14-Practice-Test-Deploy-Network-Solution.md","practice":"https://kodekloud.com/topic/practice-test-deploy-network-solution/","items":[{"q":"We have deployed an application called app in the default namespace. What is the state of the pod?","a":"<pre><code class=\"language-bash\">kubectl get pods\n<\/code><\/pre>\n<p>Note it is stuck at <code>ContainerCreating<\/code>. It will reamin this way.<\/p>\n<blockquote>\n<p>NotRunning<\/p>\n<\/blockquote>"},{"q":"Inspect why the POD is not running.","a":"<pre><code class=\"language-bash\">kubectl describe pod app\n<\/code><\/pre>\n<p>The answer is in the <code>Events<\/code> section. It cannot allocate an IP address, therefore...<\/p>\n<blockquote>\n<p>No network configured<\/p>\n<\/blockquote>"},{"q":"Deploy weave-net networking solution to the cluster.","a":"<p>Apply the manifest found under the <code>/root/weave<\/code> directory.<\/p>"}],"text":"We have deployed an application called app in the default namespace. What is the state of the pod? Inspect why the POD is not running. Deploy weave-net networking solution to the cluster.","minutes":3},{"id":"09-ipam","kind":"lesson","title":"IPAM Weave","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/15-ipam-weave.md","html":"<p><strong>IPAM<\/strong> (<em>IP Address Management<\/em>) makes sure no IP is assigned twice. It is the <strong>CNI plugin's<\/strong> responsibility. CNI ships two built-in IPAM plugins: <strong>host-local<\/strong> (one range per node, managed locally) and <strong>dhcp<\/strong>. The choice is made in the <code>ipam<\/code> section of the configuration.<\/p>\n<p>By default, Weave allocates the range <strong><code>10.32.0.0/12<\/code><\/strong>, about a million addresses (<code>10.32.0.1<\/code> to <code>10.47.255.254<\/code>), and splits it between the nodes. The range is configurable at deployment.<\/p>","text":"IPAM ( IP Address Management ) makes sure no IP is assigned twice. It is the CNI plugin's responsibility. CNI ships two built-in IPAM plugins: host-local (one range per node, managed locally) and dhcp . The choice is made in the ipam section of the configuration. By default, Weave allocates the range 10.32.0.0/12 , about a million addresses ( 10.32.0.1 to 10.47.255.254 ), and splits it between the nodes. The range is configurable at deployment.","minutes":2,"ncode":0},{"id":"09-lab-14","kind":"lab","title":"Lab · Networking Weave","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/16-Practice-Test-Networking-weave.md","practice":"https://kodekloud.com/topic/practice-test-networking-weave/","items":[{"q":"How many Nodes are part of this cluster?","a":"<pre><code class=\"language-bash\">kunbectl get nodes\n<\/code><\/pre>\n<blockquote>\n<p>2<\/p>\n<\/blockquote>"},{"q":"What is the Networking Solution used by this cluster?","a":"<p>Two ways to do this:<\/p>\n<p>1.<\/p>\n<pre><code class=\"language-bash\">kubectl get pods -n kube-system\n<\/code><\/pre>\n<p>1.<\/p>\n<pre><code class=\"language-bash\">ls -l /opt/cni/bin\n<\/code><\/pre>\n<p>In both you see evidence of<\/p>\n<blockquote>\n<p>weave<\/p>\n<\/blockquote>"},{"q":"How many weave agents/peers are deployed in this cluster?","a":"<pre><code class=\"language-bash\">kubectl get pods -n kube-system\n<\/code><\/pre>\n<blockquote>\n<p>2<\/p>\n<\/blockquote>"},{"q":"On which nodes are the weave peers present?","a":"<pre><code class=\"language-bash\">kubectl get pods -n kube-system -o wide\n<\/code><\/pre>\n<blockquote>\n<p>One on every node<\/p>\n<\/blockquote>"},{"q":"Identify the name of the bridge network/interface created by weave on each node.","a":"<p>At either host...<\/p>\n<pre><code class=\"language-bash\">ip addr list\n<\/code><\/pre>\n<blockquote>\n<p>weave<\/p>\n<\/blockquote>\n<p>In actual fact, the network interface is <code>weave<\/code> and the bridge is implemented by <code>vethwe-datapath@vethwe-bridge<\/code> and <code>vethwe-bridge@vethwe-datapath<\/code><\/p>"},{"q":"What is the POD IP address range configured by weave?","a":"<p>Examine output of previous connad for <code>weave<\/code> interface. Note its IP begins with <code>10.<\/code>, so...<\/p>\n<blockquote>\n<p>10.X.X.X<\/p>\n<\/blockquote>"},{"q":"What is the default gateway configured on the PODs scheduled on node01?","a":"<p>Now we can deduce this from the naswer to the previous question. Since we know weave's IP range, its gateway must be on the same network. However we can verify that by starting a pod which is known to contain the <code>ip<\/code> tool.<\/p>\n<p>Remember this <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/wbitt/Network-MultiTool\">container image<\/a>. It is extremely useful for debugging cluster networking issues!<\/p>\n<pre><code class=\"language-bash\">kubectl run testpod --image=wbitt/network-multitool\n<\/code><\/pre>\n<p>Wait for it to be running.<\/p>\n<pre><code class=\"language-bash\">kubectl exec -it testpod -- ip route\n<\/code><\/pre>\n<p>Note the first line of the output. This is the answer.<\/p>"}],"text":"How many Nodes are part of this cluster? What is the Networking Solution used by this cluster? How many weave agents/peers are deployed in this cluster? On which nodes are the weave peers present? Identify the name of the bridge network/interface created by weave on each node. What is the POD IP address range configured by weave? What is the default gateway configured on the PODs scheduled on node01?","minutes":7},{"id":"09-service-networking","kind":"lesson","title":"Service Networking","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/17-Service-Networking.md","html":"<p>You rarely reach a Pod directly: you go through a <strong>Service<\/strong>. Unlike Pods, a Service doesn't exist <strong>on any node<\/strong>: no process, no interface, no namespace. It's a virtual object, visible cluster-wide.<\/p>\n<ul>\n<li><strong>ClusterIP<\/strong>: only reachable from inside the cluster.<\/li>\n<li><strong>NodePort<\/strong>: also exposed on a port of every node.<\/li>\n<\/ul>\n<pre><code class=\"language-yaml\">clusterIP.yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: local-cluster\nspec:\n  ports:\n  - port: 80\n    targetPort: 80\n  selector:\n    app: nginx\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">nodeportIP.yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: nodeport-wide\nspec:\n  type: NodePort\n  ports:\n  - port: 80\n    targetPort: 80\n  selector:\n    app: nginx\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f clusterIP.yaml\nservice/local-cluster created\n$ kubectl create -f nodeportIP.yaml\nservice/nodeport-wide created\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get pods -o wide\nNAME    READY   STATUS    RESTARTS   AGE   IP           NODE     NOMINATED NODE   READINESS GATES\nnginx   1/1     Running   0          1m   10.244.1.3   node01   &lt;none&gt;           &lt;no\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get service\nNAME            TYPE        CLUSTER-IP      EXTERNAL-IP   PORT(S)        AGE\nkubernetes      ClusterIP   10.96.0.1       &lt;none&gt;        443/TCP        5m22s\nlocal-cluster   ClusterIP   10.101.67.139   &lt;none&gt;        80/TCP         3m\nnodeport-wide   NodePort    10.102.29.204   &lt;none&gt;        80:30016/TCP   2m\n<\/code><\/pre>\n<p>When a Service is created, it gets an IP from a <strong>dedicated range<\/strong>, set by the kube-apiserver's <code>--service-cluster-ip-range<\/code> option (default <code>10.0.0.0/24<\/code>). It must not overlap the Pod range.<\/p>\n<pre><code class=\"language-bash\">$ ps -aux | grep kube-apiserver\n--secure-port=6443 --service-account-key-file=/etc/kubernetes/pki/sa.pub --\nservice-cluster-ip-range=10.96.0.0/12\n<\/code><\/pre>\n<p><strong>kube-proxy<\/strong> watches Services and creates forwarding rules on each node: \"anything going to Service-IP:port goes to Pod-IP:port\". Three proxy modes: <strong>userspace<\/strong>, <strong>iptables<\/strong> (default), <strong>ipvs<\/strong> (<code>--proxy-mode<\/code> option).<\/p>\n<div class=\"anim\" data-anim=\"svcnet\"><\/div>\n\n<pre><code class=\"language-bash\">$ iptables -L -t nat | grep local-cluster\nKUBE-MARK-MASQ  all  --  10.244.1.3           anywhere             /* default/local-cluster: */\nDNAT       tcp  --  anywhere             anywhere             /* default/local-cluster: */ tcp to:10.244.1.3:80\nKUBE-MARK-MASQ  tcp  -- !10.244.0.0/16        10.101.67.139        /* default/local-cluster: cluster IP */ tcp dpt:http\nKUBE-SVC-SDGXHD6P3SINP7QJ  tcp  --  anywhere             10.101.67.139        /* default/local-cluster: cluster IP */ tcp dpt:http\nKUBE-SEP-GEKJR4UBUI5ONAYW  all  --  anywhere             anywhere             /* default/local-cluster: */\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ cat /var/log/kube-proxy.log\n<\/code><\/pre>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">IP ranges<\/p>\n<p>Service range: <code>--service-cluster-ip-range<\/code> in <code>/etc/kubernetes/manifests/kube-apiserver.yaml<\/code>. Pod range: in the network plugin's configuration (weave logs, or <code>--cluster-cidr<\/code>). kube-proxy mode: <code>kubectl logs &lt;kube-proxy pod&gt; -n kube-system<\/code>.<\/p>\n<\/div>","text":"You rarely reach a Pod directly: you go through a Service . Unlike Pods, a Service doesn't exist on any node : no process, no interface, no namespace. It's a virtual object, visible cluster-wide. ClusterIP : only reachable from inside the cluster. NodePort : also exposed on a port of every node. When a Service is created, it gets an IP from a dedicated range , set by the kube-apiserver's --service-cluster-ip-range option (default 10.0.0.0/24 ). It must not overlap the Pod range. kube-proxy watches Services and creates forwarding rules on each node: \"anything going to Service-IP:port goes to Pod-IP:port\". Three proxy modes: userspace , iptables (default), ipvs ( --proxy-mode option). IP ranges Service range: --service-cluster-ip-range in /etc/kubernetes/manifests/kube-apiserver.yaml . Pod range: in the network plugin's configuration (weave logs, or --cluster-cidr ). kube-proxy mode: kubectl logs <kube-proxy pod> -n kube-system .","minutes":3,"ncode":8},{"id":"09-lab-16","kind":"lab","title":"Lab · Service Networking","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/18-Practice-Test-Service-Networking.md","practice":"https://kodekloud.com/topic/practice-test-service-networking/","items":[{"q":"What network range are the nodes in the cluster part of?","a":"<pre><code>kubectl get nodes -o wide\n<\/code><\/pre>\n<p>Note the INTERNAL-IP column to derive:<\/p>\n<pre><code>192.20.116.0/24\n<\/code><\/pre>"},{"q":"What is the range of IP addresses configured for PODs on this cluster?","a":"<pre><code>kubectl get pods -A -o wide\n<\/code><\/pre>\n<p>From this list, exclude the static control plane pods like <code>kube-apiserver<\/code> as these run on the host network, not the pod network. From the remaining pods we can derive:<\/p>\n<pre><code>10.244.0.0/16\n<\/code><\/pre>"},{"q":"What is the IP Range configured for the services within the cluster?","a":"<pre><code>kubectl get service -A\n<\/code><\/pre>\n<p>Note the CLUSTER-IP column to derive:<\/p>\n<pre><code>10.96.0.0/12\n<\/code><\/pre>"},{"q":"How many kube-proxy pods are deployed in this cluster?","a":"<pre><code>kubectl get pod -n kube-system | grep kube-proxy\n<\/code><\/pre>\n<p>Count the results<\/p>"},{"q":"What type of proxy is the kube-proxy configured to use?","a":"<p>From the output of the above question, you have two kube-proxy pods, e.g.<\/p>\n<pre><code>controlplane ~ kubectl get pod -n kube-system | grep kube-proxy\nkube-proxy-rtr8p                       1/1     Running   0             56m\nkube-proxy-t7w8f                       1/1     Running   0             56m\n<\/code><\/pre>\n<p>Pick either and check its logs. The answer is there.<\/p>\n<pre><code>k logs -n kube-system kube-proxy-rtr8p\n<\/code><\/pre>"},{"q":"How does this Kubernetes cluster ensure that a kube-proxy pod runs on all nodes in the cluster?","a":"<pre><code>kubectl get all -n kube-system\n<\/code><\/pre>\n<p>From this, you can see that <code>kube-proxy<\/code> is a <code>daemonset<\/code><\/p>"}],"text":"What network range are the nodes in the cluster part of? What is the range of IP addresses configured for PODs on this cluster? What is the IP Range configured for the services within the cluster? How many kube-proxy pods are deployed in this cluster? What type of proxy is the kube-proxy configured to use? How does this Kubernetes cluster ensure that a kube-proxy pod runs on all nodes in the cluster?","minutes":6},{"id":"09-dns-k8s","kind":"lesson","title":"DNS in Kubernetes","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/19-DNS-in-kubernetes.md","html":"<p>Kubernetes deploys a <strong>built-in DNS server<\/strong>. Every time a Service is created, it adds a record. The fully qualified name is built like this:<\/p>\n<p><strong>Service<\/strong>: <code>&lt;service&gt;.&lt;namespace&gt;.svc.cluster.local<\/code><\/p>\n<pre><code class=\"language-bash\">&lt;service-name&gt;.&lt;namespace-name&gt;.svc.cluster.local\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># Service is located in a default namespace\nweb-service.default.svc.cluster.local\n<\/code><\/pre>\n<p>Each namespace is a subdomain; all Services are grouped under the <code>svc<\/code> subdomain; the root domain is <code>cluster.local<\/code>.<\/p>\n<p><strong>Pods<\/strong>: records aren't created by default (it must be enabled). The name replaces the dots of the IP with dashes:<\/p>\n<pre><code class=\"language-bash\">&lt;POD-IP-ADDRESS&gt;.&lt;namespace-name&gt;.pod.cluster.local\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># Pod is located in a default namespace\n10-244-1-10.default.pod.cluster.local\n<\/code><\/pre>\n<p>Compose a name and see how it resolves:<\/p>\n<div class=\"anim\" data-anim=\"dnsk8s\"><\/div>\n\n<p>Demo with a Pod and a Service in the <code>apps<\/code> namespace:<\/p>\n<pre><code class=\"language-bash\"># To create a namespace\n$ kubectl create ns apps\n# To create a Pod\n$ kubectl run nginx --image=nginx --namespace apps\n# To get the additional information of the Pod in the namespace &quot;apps&quot;\n$ kubectl get po -n apps -owide\nNAME    READY   STATUS    RESTARTS   AGE   IP           NODE     NOMINATED NODE   READINESS GATES\nnginx   1/1     Running   0          99s   10.244.1.3   node01   &lt;none&gt;           &lt;none&gt;\n# To get the dns record of the nginx Pod from the default namespace\n$ kubectl run -it test --image=busybox:1.28 --rm --restart=Never -- nslookup 10-244-1-3.apps.pod.cluster.local\nServer:    10.96.0.10\nAddress 1: 10.96.0.10 kube-dns.kube-system.svc.cluster.local\nName:      10-244-1-3.apps.pod.cluster.local\nAddress 1: 10.244.1.3\npod &quot;test&quot; deleted\n# Accessing with curl command\n$ kubectl run -it nginx-test --image=nginx --rm --restart=Never -- curl -Is <a target=\"_blank\" rel=\"noopener\" href=\"http://10-244-1-3.apps.pod.cluster.local\" target=\"_blank\" rel=\"noopener\">http://10-244-1-3.apps.pod.cluster.local<\/a>\nHTTP/1.1 200 OK\nServer: nginx/1.19.2\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># Expose the nginx Pod\n$ kubectl expose pod nginx --name=nginx-service --port 80 --namespace apps\nservice/nginx-service exposed\n# Get the nginx-service in the namespace &quot;apps&quot;\n$ kubectl get svc -n apps\nNAME            TYPE        CLUSTER-IP      EXTERNAL-IP   PORT(S)   AGE\nnginx-service   ClusterIP   10.96.120.174   &lt;none&gt;        80/TCP    6s\n# To get the dns record of the nginx-service from the default namespace\n$ kubectl run -it test --image=busybox:1.28 --rm --restart=Never -- nslookup nginx-service.apps.svc.cluster.local\nServer:    10.96.0.10\nAddress 1: 10.96.0.10 kube-dns.kube-system.svc.cluster.local\nName:      nginx-service.apps.svc.cluster.local\nAddress 1: 10.96.120.174 nginx-service.apps.svc.cluster.local\npod &quot;test&quot; deleted\n# Accessing with curl command\n$ kubectl run -it nginx-test --image=nginx --rm --restart=Never -- curl -Is <a target=\"_blank\" rel=\"noopener\" href=\"http://nginx-service.apps.svc.cluster.local\" target=\"_blank\" rel=\"noopener\">http://nginx-service.apps.svc.cluster.local<\/a>\nHTTP/1.1 200 OK\nServer: nginx/1.19.2\n<\/code><\/pre>","text":"Kubernetes deploys a built-in DNS server . Every time a Service is created, it adds a record. The fully qualified name is built like this: Service : <service>.<namespace>.svc.cluster.local Each namespace is a subdomain; all Services are grouped under the svc subdomain; the root domain is cluster.local . Pods : records aren't created by default (it must be enabled). The name replaces the dots of the IP with dashes: Compose a name and see how it resolves: Demo with a Pod and a Service in the apps namespace:","minutes":2,"ncode":6},{"id":"09-coredns-k8s","kind":"lesson","title":"CoreDNS in Kubernetes","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/20-CoreDNS-in-Kubernetes.md","html":"<p>Instead of <code>/etc/hosts<\/code> entries on every Pod, Kubernetes centralises records in a DNS server: <strong>CoreDNS<\/strong> (before v1.12: kube-dns). It runs as a <strong>Deployment<\/strong> of two Pods in <code>kube-system<\/code>.<\/p>\n<pre><code class=\"language-bash\">$ kubectl get pods -n kube-system\nNAME                                      READY   STATUS    RESTARTS   AGE\ncoredns-66bff467f8-2vghh                  1/1     Running   0          53m\ncoredns-66bff467f8-t5nzm                  1/1     Running   0          53m\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get deployment -n kube-system\nNAME                      READY   UP-TO-DATE   AVAILABLE   AGE\ncoredns                   2/2     2            2           53m\n<\/code><\/pre>\n<p>Its configuration, the <strong>Corefile<\/strong>, is stored in a <strong>ConfigMap<\/strong>:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get configmap -n kube-system\nNAME                                 DATA   AGE\ncoredns                              1      52m\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl describe cm coredns -n kube-system\nCorefile:\n---\n.:53 {\n    errors\n    health {       lameduck 5s\n    }\n    ready\n    kubernetes cluster.local in-addr.arpa ip6.arpa {\n       pods insecure\n       fallthrough in-addr.arpa ip6.arpa\n       ttl 30\n    }\n    prometheus :9153\n    forward . /etc/resolv.conf\n    cache 30\n    loop\n    reload\n}\n<\/code><\/pre>\n<p>The <strong><code>kubernetes<\/code><\/strong> plugin sets the root domain <code>cluster.local<\/code>; <code>pods insecure<\/code> enables Pod records; <code>forward<\/code> sends unknown names (google.com) to the node's resolver.<\/p>\n<p>Pods reach CoreDNS through a Service named <strong><code>kube-dns<\/code><\/strong>:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get service -n kube-system\nNAME       TYPE        CLUSTER-IP   EXTERNAL-IP   PORT(S)                  AGE\nkube-dns   ClusterIP   10.96.0.10   &lt;none&gt;        53/UDP,53/TCP,9153/TCP   62m\n<\/code><\/pre>\n<p>The <strong>kubelet<\/strong> automatically writes this IP into each Pod's <code>/etc/resolv.conf<\/code>:<\/p>\n<pre><code class=\"language-bash\">$ cat /var/lib/kubelet/config.yaml | grep -A2  clusterDNS\nclusterDNS:\n- 10.96.0.10\nclusterDomain: cluster.local\n<\/code><\/pre>\n<p>Thanks to the <strong>search domains<\/strong>, you can shorten a Service name:<\/p>\n<pre><code class=\"language-bash\">$ host web-service\nweb-service.default.svc.cluster.local has address 10.106.112.101\n$ host web-service.default\nweb-service.default.svc.cluster.local has address 10.106.112.101\n$ host web-service.default.svc\nweb-service.default.svc.cluster.local has address 10.106.112.101\n$ host web-service.default.svc.cluster.local\nweb-service.default.svc.cluster.local has address 10.106.112.101\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl run -it --rm --restart=Never test-pod --image=busybox -- cat /etc/resolv.conf\nnameserver 10.96.0.10\nsearch default.svc.cluster.local svc.cluster.local cluster.local\noptions ndots:5\npod &quot;test-pod&quot; deleted\n<\/code><\/pre>\n<p>Search domains only apply to Services: for a Pod, you need the fully qualified name.<\/p>\n<pre><code class=\"language-bash\">$ kubectl get pods -o wide\nNAME      READY   STATUS    RESTARTS   AGE     IP           NODE     NOMINATED NODE   READINESS GATES\ntest-pod   1/1     Running   0          11m     10.244.1.3   node01   &lt;none&gt;           &lt;none&gt;\nnginx      1/1     Running   0          10m     10.244.1.4   node01   &lt;none&gt;           &lt;none&gt;\n$ kubectl exec -it test-pod -- nslookup 10-244-1-4.default.pod.cluster.local\nServer:    10.96.0.10\nAddress 1: 10.96.0.10 kube-dns.kube-system.svc.cluster.local\nName:      10-244-1-4.default.pod.cluster.local\nAddress 1: 10.244.1.4\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get service\nNAME          TYPE        CLUSTER-IP       EXTERNAL-IP   PORT(S)   AGE\nkubernetes    ClusterIP   10.96.0.1        &lt;none&gt;        443/TCP   85m\nweb-service   ClusterIP   10.106.112.101   &lt;none&gt;        80/TCP    9m\n$ kubectl exec -it test-pod -- nslookup web-service.default.svc.cluster.local\nServer:    10.96.0.10\nAddress 1: 10.96.0.10 kube-dns.kube-system.svc.cluster.local\nName:      web-service.default.svc.cluster.local\nAddress 1: 10.106.112.101 web-service.default.svc.cluster.local\n<\/code><\/pre>","text":"Instead of /etc/hosts entries on every Pod, Kubernetes centralises records in a DNS server: CoreDNS (before v1.12: kube-dns). It runs as a Deployment of two Pods in kube-system . Its configuration, the Corefile , is stored in a ConfigMap : The kubernetes plugin sets the root domain cluster.local ; pods insecure enables Pod records; forward sends unknown names (google.com) to the node's resolver. Pods reach CoreDNS through a Service named kube-dns : The kubelet automatically writes this IP into each Pod's /etc/resolv.conf : Thanks to the search domains , you can shorten a Service name: Search domains only apply to Services: for a Pod, you need the fully qualified name.","minutes":3,"ncode":10},{"id":"09-lab-19","kind":"lab","title":"Lab · CoreDNS in Kubernetes","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/21-Practice-Test-CoreDNS-in-Kubernetes.md","practice":"https://kodekloud.com/topic/practice-test-coredns-in-kubernetes/","items":[{"q":"Check the Solution","a":"<pre><code>CoreDNS\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>2\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>10.96.0.10\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>/etc/coredns/Corefile\n\nOR\n\nkubectl -n kube-system describe deployments.apps coredns | grep -A2 Args | grep Corefile\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>Configured as a ConfigMapObject\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>CoreDNS\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>coredns\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>cluster.local\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>Ok\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>web-service\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>web-serivce.default.pod\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>web-service.payroll\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>web-service.payroll.svc.cluster\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>kubectl edit deploy webapp\n\nSearch for DB_Host and Change the DB_Host from mysql to mysql.payroll\n\nspec:\n  containers:\n  - env:\n    - name: DB_Host\n      value: mysql.payroll\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>kubectl exec -it hr -- nslookup mysql.payroll &gt; /root/nslookup.out\n<\/code><\/pre>"}],"text":"Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution","minutes":15},{"id":"09-ingress","kind":"lesson","title":"Ingress","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/22-Ingress.md","html":"<p>An online store, <code>my-online-store.com<\/code>, serves two applications: <code>/wear<\/code> and <code>/watch<\/code>. With NodePort or LoadBalancer Services you'd need one load balancer per application, a proxy in front, SSL certificates in several places… An <strong>Ingress<\/strong> brings all of that <strong>inside the cluster<\/strong>: a single entry point, routing rules based on <strong>URL path<\/strong> or <strong>host name<\/strong>, and SSL termination. You still expose it once (NodePort or LoadBalancer).<\/p>\n<p>Two parts:<\/p>\n<ul>\n<li>the <strong>Ingress Controller<\/strong>: the engine (nginx, HAProxy, Traefik, Contour, GCE…). It <strong>isn't deployed by default<\/strong>. It watches the cluster and reconfigures itself when rules change.<\/li>\n<li><strong>Ingress Resources<\/strong>: the routing rules, defined in YAML.<\/li>\n<\/ul>\n<p>Try the routing:<\/p>\n<div class=\"anim\" data-anim=\"ingress\"><\/div>\n\n<p><strong>Deploying the nginx controller<\/strong>: a ConfigMap for its settings, a Deployment, a Service to expose it, and a ServiceAccount with the right permissions.<\/p>\n<pre><code class=\"language-yaml\">kind: ConfigMap\napiVersion: v1\nmetadata:\n  name: nginx-configuration\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ingress-controller\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      name: nginx-ingress\n  template:\n    metadata:\n      labels:\n        name: nginx-ingress\n    spec:\n      serviceAccountName: ingress-serviceaccount\n      containers:\n        - name: nginx-ingress-controller\n          image: quay.io/kubernetes-ingress-controller/nginx-ingress-controller:0.21.0\n          args:\n            - /nginx-ingress-controller\n            - --configmap=$(POD_NAMESPACE)/nginx-configuration\n          env:\n            - name: POD_NAME\n              valueFrom:\n                fieldRef:\n                  fieldPath: metadata.name\n            - name: POD_NAMESPACE\n              valueFrom:\n                fieldRef:\n                  fieldPath: metadata.namespace\n          ports:\n            - name: http\n              containerPort: 80\n            - name: https\n              containerPort: 443\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f ingress-sa.yaml\nserviceaccount/ingress-serviceaccount created\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># service-Nodeport.yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: ingress\nspec:\n  type: NodePort\n  ports:\n  - port: 80\n    targetPort: 80\n    protocol: TCP\n    name: http\n  - port: 443\n    targetPort: 443\n    protocol: TCP\n    name: https\n  selector:\n    name: nginx-ingress\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f service-Nodeport.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get service\n<\/code><\/pre>\n<p><strong>Ingress Resources<\/strong> — all traffic to a single Service:<\/p>\n<pre><code class=\"language-yaml\">Ingress-wear.yaml\napiVersion: extensions/v1beta1\nkind: Ingress\nmetadata:\n  name: ingress-wear\nspec:\n     backend:\n        serviceName: wear-service\n        servicePort: 80\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f Ingress-wear.yaml\ningress.extensions/ingress-wear created\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get ingress\nNAME           CLASS    HOSTS   ADDRESS   PORTS   AGE\ningress-wear   &lt;none&gt;   *                 80      18s\n<\/code><\/pre>\n<p><strong>1 rule and 2 paths<\/strong>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: extensions/v1beta1\nkind: Ingress\nmetadata:\n  name: ingress-wear-watch\nspec:\n  rules:\n  - http:\n      paths:\n      - path: /wear\n        backend:\n          serviceName: wear-service\n          servicePort: 80\n      - path: /watch\n        backend:\n          serviceName: watch-service\n          servicePort: 80\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl describe ingress ingress-wear-watch\nName:             ingress-wear-watch\nNamespace:        default\nAddress:\nDefault backend:  default-http-backend:80 (&lt;none&gt;)\nRules:\n  Host        Path  Backends\n  ----        ----  --------\n  *\n              /wear    wear-service:80 (&lt;none&gt;)\n              /watch   watch-service:80 (&lt;none&gt;)\nAnnotations:  &lt;none&gt;\nEvents:\n  Type    Reason  Age   From                      Message\n  ----    ------  ----  ----                      -------\n  Normal  CREATE  23s   nginx-ingress-controller  Ingress default/ingress-wear-watch\n<\/code><\/pre>\n<p>The <strong>default backend<\/strong> receives requests that match no rule (a 404 page, for example).<\/p>\n<p><strong>2 rules, 1 path each<\/strong>, by host name:<\/p>\n<pre><code class=\"language-yaml\"># Ingress-wear-watch.yaml\napiVersion: extensions/v1beta1\nkind: Ingress\nmetadata:\n  name: ingress-wear-watch\nspec:\n  rules:\n  - host: wear.my-online-store.com\n    http:\n      paths:\n      - backend:\n          serviceName: wear-service\n          servicePort: 80\n  - host: watch.my-online-store.com\n    http:\n      paths:\n      - backend:\n          serviceName: watch-service\n          servicePort: 80\n<\/code><\/pre>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Current syntax<\/p>\n<p><code>extensions/v1beta1<\/code> was removed in v1.22. The current version is <code>networking.k8s.io/v1<\/code>, where the backend is written <code>service: { name: wear-service, port: { number: 80 } }<\/code> and every path requires a <code>pathType<\/code> (<code>Prefix<\/code> or <code>Exact<\/code>). Imperatively: <code>kubectl create ingress ingress-test --rule=\"wear.my-online-store.com/wear*=wear-service:80\"<\/code>.<\/p>\n<\/div>\n<p>Equivalent example in <code>networking.k8s.io/v1<\/code> (added):<\/p>\n<pre><code class=\"language-yaml\">apiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: ingress-wear-watch\nspec:\n  rules:\n  - http:\n      paths:\n      - path: /wear\n        pathType: Prefix\n        backend:\n          service:\n            name: wear-service\n            port:\n              number: 80\n      - path: /watch\n        pathType: Prefix\n        backend:\n          service:\n            name: watch-service\n            port:\n              number: 80\n<\/code><\/pre>","text":"An online store, my-online-store.com , serves two applications: /wear and /watch . With NodePort or LoadBalancer Services you'd need one load balancer per application, a proxy in front, SSL certificates in several places… An Ingress brings all of that inside the cluster : a single entry point, routing rules based on URL path or host name , and SSL termination. You still expose it once (NodePort or LoadBalancer). Two parts: the Ingress Controller : the engine (nginx, HAProxy, Traefik, Contour, GCE…). It isn't deployed by default . It watches the cluster and reconfigures itself when rules change. Ingress Resources : the routing rules, defined in YAML. Try the routing: Deploying the nginx controller : a ConfigMap for its settings, a Deployment, a Service to expose it, and a ServiceAccount with the right permissions. Ingress Resources — all traffic to a single Service: 1 rule and 2 paths : The default backend receives requests that match no rule (a 404 page, for example). 2 rules, 1 path each , by host name: Current syntax extensions/v1beta1 was removed in v1.22. The current version is networking.k8s.io/v1 , where the backend is written service: { name: wear-service, port: { number: 80 } } and every path requires a pathType ( Prefix or Exact ). Imperatively: kubectl create ingress ingress-test --rule=\"wear.my-online-store.com/wear*=wear-service:80\" . Equivalent example in networking.k8s.io/v1 (added):","minutes":4,"ncode":13},{"id":"09-ingress-rewrite","kind":"lesson","title":"Ingress Annotations and rewrite-target","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/23-Ingress-Annotations-and-rewrite-target.md","html":"<p>Each Ingress controller has its own options, set through <strong>annotations<\/strong>. The nginx controller's <strong>rewrite-target<\/strong> option is the most commonly used.<\/p>\n<p>The problem: the <code>watch<\/code> application serves <code>/<\/code>, but the Ingress forwards <code>/watch<\/code>. Without a rewrite, it returns a 404. With <code>rewrite-target: /<\/code>, the path matched by the rule is <strong>replaced<\/strong> with <code>/<\/code> before being forwarded:<\/p>\n<div class=\"anim\" data-anim=\"rewrite\"><\/div>\n\n<pre><code class=\"language-yaml\">apiVersion: extensions/v1beta1\nkind: Ingress\nmetadata:\n  name: test-ingress\n  namespace: critical-space\n  annotations:\n    nginx.ingress.kubernetes.io/rewrite-target: /\nspec:\n  rules:\n  - http:\n      paths:\n      - path: /pay\n        backend:\n          serviceName: pay-service\n          servicePort: 8282\n<\/code><\/pre>\n<p>With regular expressions, you can keep part of the path: <code>path: /something(/|$)(.*)<\/code> with <code>rewrite-target: /$2<\/code> turns <code>/something/new<\/code> into <code>/new<\/code>.<\/p>\n<p>References:<\/p>\n<ul>\n<li>https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/<\/li>\n<li>https://kubernetes.github.io/ingress-nginx/examples/rewrite/<\/li>\n<\/ul>","text":"Each Ingress controller has its own options, set through annotations . The nginx controller's rewrite-target option is the most commonly used. The problem: the watch application serves / , but the Ingress forwards /watch . Without a rewrite, it returns a 404. With rewrite-target: / , the path matched by the rule is replaced with / before being forwarded: With regular expressions, you can keep part of the path: path: /something(/|$)(.*) with rewrite-target: /$2 turns /something/new into /new . References: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/ https://kubernetes.github.io/ingress-nginx/examples/rewrite/","minutes":2,"ncode":1},{"id":"09-lab-22","kind":"lab","title":"Lab · Ingress Networking 1","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/24-Practice-Test-CKA-Ingress-Net-1.md","practice":"https://kodekloud.com/topic/practice-test-cka-ingress-networking-1/","items":[{"q":"Check the Solution","a":"<pre><code>Ok\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>INGRESS-SPACE\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>NGINX-INGRESS-CONTROLLER\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>APP-SPACE\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>3\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>APP-SPACE\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>INGRESS-WEAR-WATCH\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>ALL-HOSTS(*)\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>WEAR-SERVICE\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>/WATCH\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>DEFAULT-HTTP-BACKEND\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>404-ERROR-PAGE\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>OK\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>kubectl edit ingress --namespace app-space\n<\/code><\/pre>\n<p>Change the path from /watch to /stream<\/p>\n<p>OR<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nitems:\n- apiVersion: extensions/v1beta1\n  kind: Ingress\n  metadata:\n    annotations:\n      nginx.ingress.kubernetes.io/rewrite-target: /\n      nginx.ingress.kubernetes.io/ssl-redirect: &quot;false&quot;\n    name: ingress-wear-watch\n    namespace: app-space\n  spec:\n    rules:\n    - http:\n        paths:\n        - backend:\n            serviceName: wear-service\n            servicePort: 8080\n          path: /wear\n          pathType: ImplementationSpecific\n        - backend:\n            serviceName: video-service\n            servicePort: 8080\n          path: /stream\n          pathType: ImplementationSpecific\n  status:\n    loadBalancer:\n      ingress:\n      - {}\nkind: List\nmetadata:\n  resourceVersion: &quot;&quot;\n  selfLink: &quot;&quot;\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>OK\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>404 ERROR PAGE\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>OK\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<p>Run the command <code>kubectl edit ingress --namespace app-space<\/code> and add a new Path entry for the new service.<\/p>\n<p>OR<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nitems:\n- apiVersion: extensions/v1beta1\n  kind: Ingress\n  metadata:\n    annotations:\n      nginx.ingress.kubernetes.io/rewrite-target: /\n      nginx.ingress.kubernetes.io/ssl-redirect: &quot;false&quot;\n    name: ingress-wear-watch\n    namespace: app-space\n  spec:\n    rules:\n    - http:\n        paths:\n        - backend:\n            serviceName: wear-service\n            servicePort: 8080\n          path: /wear\n          pathType: ImplementationSpecific\n        - backend:\n            serviceName: video-service\n            servicePort: 8080\n          path: /stream\n          pathType: ImplementationSpecific\n        - backend:\n            serviceName: food-service\n            servicePort: 8080\n          path: /eat\n          pathType: ImplementationSpecific\n  status:\n    loadBalancer:\n      ingress: heck the Solution","a":"<pre><code>kubectl create serviceaccount ingress-nginx --namespace ingress-nginx\nkubectl create serviceaccount ingress-nginx-admission --namespace ingress-nginx\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>Ok\n\nkubectl get roles,rolebindings --namespace ingress-nginx\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<p>Fix the issues<\/p>\n<pre><code>vi /root/ingress-controller.yaml\n<\/code><\/pre>\n<p>There is a <code>Deployment<\/code> and a <code>Service<\/code> in this file, There are issues with each.<\/p>\n<ol>\n<li>The <code>namespace<\/code> of the deployment is incorrect.<\/li>\n<li>indentation error at line 74 (use <code>:set nu<\/code> in vi to turn on line numbers)<\/li>\n<li><code>name<\/code> of the service is incorrect<\/li>\n<li><code>nodeport<\/code> on service is incorrect case. Should be <code>nodePort<\/code><\/li>\n<\/ol>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  labels:\n    app.kubernetes.io/component: controller\n    app.kubernetes.io/instance: ingress-nginx\n    app.kubernetes.io/managed-by: Helm\n    app.kubernetes.io/name: ingress-nginx\n    app.kubernetes.io/part-of: ingress-nginx\n    app.kubernetes.io/version: 1.1.2\n    helm.sh/chart: ingress-nginx-4.0.18\n  name: ingress-nginx-controller\n  namespace: ingress-nginx\nspec:\n  minReadySeconds: 0\n  revisionHistoryLimit: 10\n  selector:\n    matchLabels:\n      app.kubernetes.io/component: controller\n      app.kubernetes.io/instance: ingress-nginx\n      app.kubernetes.io/name: ingress-nginx\n  template:\n    metadata:\n      labels:\n        app.kubernetes.io/component: controller\n        app.kubernetes.io/instance: ingress-nginx\n        app.kubernetes.io/name: ingress-nginx\n    spec:\n      containers:\n      - args:\n        - /nginx-ingress-controller\n        - --publish-service=$(POD_NAMESPACE)/ingress-nginx-controller\n        - --election-id=ingress-controller-leader\n        - --watch-ingress-without-class=true\n        - --default-backend-service=app-space/default-http-backend\n        - --controller-class=k8s.io/ingress-nginx\n        - --ingress-class=nginx\n        - --configmap=$(POD_NAMESPACE)/ingress-nginx-controller\n        - --validating-webhook=:8443\n        - --validating-webhook-certificate=/usr/local/certificates/cert\n        - --validating-webhook-key=/usr/local/certificates/key\n        env:\n        - name: POD_NAME\n          valueFrom:\n            fieldRef:\n              fieldPath: metadata.name\n        - name: POD_NAMESPACE\n          valueFrom:\n            fieldRef:\n              fieldPath: metadata.namespace\n        - name: LD_PRELOAD\n          value: /usr/local/lib/libmimalloc.so\n        image: registry.k8s.io/ingress-nginx/controller:v1.1.2@sha256:28b11ce69e57843de44e3db6413e98d09de0f6688e33d4bd384002a44f78405c\n        imagePullPolicy: IfNotPresent\n        lifecycle:\n          preStop:\n            exec:\n              command:\n              - /wait-shutdown\n        livenessProbe:\n          failureThreshold: 5\n          httpGet:\n            path: /healthz\n            port: 10254\n            scheme: HTTP\n          initialDelaySeconds: 10\n          periodSeconds: 10\n          successThreshold: 1\n          timeoutSeconds: 1\n        name: controller\n        ports:\n        - name: http\n          containerPort: 80\n          protocol: TCP\n        - containerPort: 443\n          name: https\n          protocol: TCP\n        - containerPort: 8443\n          name: webhook\n          protocol: TCP\n        readinessProbe:\n          failureThreshold: 3\n          httpGet:\n            path: /healthz\n            port: 10254\n            scheme: HTTP\n          initialDelaySeconds: 10\n          periodSeconds: 10\n          successThreshold: 1\n          timeoutSeconds: 1\n        resources:\n          requests:\n            cpu: 100m\n            memory: 90Mi\n        securityContext:\n          allowPrivilegeEscalation: true\n          capabilities:\n            add:\n            - NET_BIND_SERVICE\n            drop:\n            - ALL\n          runAsUser: 101\n        volumeMounts:\n        - mountPath: /usr/local/certificates/\n          name: webhook-cert\n          readOnly: true\n      dnsPolicy: ClusterFirst\n      nodeSelector:\n        kubernetes.io/os: linux\n      serviceAccountName: ingress-nginx\n      terminationGracePeriodSeconds: 300\n      volumes:\n      - name: webhook-cert\n        secret:\n          secretName: ingress-nginx-admission\n\n---\n\napiVersion: v1\nkind: Service\nmetadata:\n  creationTimestamp: null\n  labels:\n    app.kubernetes.io/component: controller\n    app.kubernetes.io/instance: ingress-nginx\n    app.kubernetes.io/managed-by: Helm\n    app.kubernetes.io/name: ingress-nginx\n    app.kubernetes.io/part-of: ingress-nginx\n    app.kubernetes.io/version: 1.1.2\n    helm.sh/chart: ingress-nginx-4.0.18\n  name: ingress-nginx-controller\n  namespace: ingress-nginx\nspec:\n  ports:\n  - port: 80\n    protocol: TCP\n    targetPort: 80\n    nodePort: 30080\n  selector:\n    app.kubernetes.io/component: controller\n    app.kubernetes.io/instance: ingress-nginx\n    app.kubernetes.io/name: ingress-nginx\n  type: NodePort      \n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code class=\"language-yaml\">apiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: ingress-wear-watch\n  namespace: app-space\n  annotations:\n    nginx.ingress.kubernetes.io/rewrite-target: /\n    nginx.ingress.kubernetes.io/ssl-redirect: &quot;false&quot;\nspec:\n  rules:\n  - http:\n      paths:\n      - path: /wear\n        pathType: Prefix\n        backend:\n          service:\n          name: wear-service\n          port: \n            number: 8080\n      - path: /watch\n        pathType: Prefix\n        backend:\n          service:\n          name: video-service\n          port:\n            number: 8080\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<p>Press the <code>Ingress<\/code> button above the terminal pane.\nIn the browser tab that opens, try appending <code>/wear<\/code> or <code>/watch<\/code> after <code>labs.kodekloud.com<\/code> in the browser address bar.<\/p>"}],"text":"Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution","minutes":8}],"quiz":[{"q":"Which value of /proc/sys/net/ipv4/ip_forward lets Linux forward packets?","options":["0","1"],"answer":1,"explain":"To make it permanent: net.ipv4.ip_forward=1 in /etc/sysctl.conf."},{"q":"Which file is checked first to resolve a name, by default?","options":["/etc/hosts","/etc/resolv.conf"],"answer":0,"explain":"The order comes from the hosts: files dns line in /etc/nsswitch.conf."},{"q":"How do you connect two network namespaces directly?","options":["With a bridge only","With a veth pair (virtual cable)","With iptables"],"answer":1,"explain":"Beyond two namespaces, use a bridge."},{"q":"Which component invokes the CNI plugin when a Pod is created?","options":["kube-scheduler","The kubelet, through the container runtime","kube-proxy"],"answer":1,"explain":"Binaries live in /opt/cni/bin, configuration in /etc/cni/net.d."},{"q":"On which node does a Service run?","options":["On the master","On the node of its Pods","None: it's a virtual object programmed by kube-proxy"],"answer":2,"explain":"kube-proxy creates rules on every node that forward the Service IP to the Pods."},{"q":"What is the fully qualified name of web-service in the apps namespace?","options":["web-service.apps.svc.cluster.local","apps.web-service.cluster.local","web-service.svc.apps.cluster.local"],"answer":0,"explain":"The format is <service>.<namespace>.svc.cluster.local."},{"q":"Where is the CoreDNS configuration stored?","options":["In /etc/coredns.conf on every node","In the coredns ConfigMap in kube-system"],"answer":1,"explain":"The Corefile is mounted from it into the CoreDNS Pods."},{"q":"Is an Ingress Controller deployed by default?","options":["Yes, nginx","No, you have to deploy one"],"answer":1,"explain":"Ingress Resources have no effect without a controller."},{"q":"What does the rewrite-target: / annotation do?","options":["Replaces the matched path with / before forwarding the request","Redirects HTTP to HTTPS","Changes the host name"],"answer":0,"explain":"Without it, /watch is forwarded as is and the application returns 404."}],"folder":"09-Networking"}],"cheat":[{"verb":"create","cmds":[{"cmd":"kubectl create -f rc-definition.yaml","lesson":"02-replicasets","title":"ReplicaSets"},{"cmd":"kubectl create -f replicaset-definition.yaml","lesson":"02-replicasets","title":"ReplicaSets"},{"cmd":"kubectl create -f deployment-definition.yaml","lesson":"02-deployments","title":"Deployments"},{"cmd":"kubectl create deployment httpd-frontend --image=httpd:2.4-alpine --replicas=3","lesson":"02-deployments","title":"Deployments"},{"cmd":"kubectl create -f pod-definition.yaml","lesson":"02-namespaces","title":"Namespaces"},{"cmd":"kubectl create -f pod-definition.yaml --namespace=dev","lesson":"02-namespaces","title":"Namespaces"},{"cmd":"kubectl create -f namespace-dev.yaml","lesson":"02-namespaces","title":"Namespaces"},{"cmd":"kubectl create namespace dev","lesson":"02-namespaces","title":"Namespaces"},{"cmd":"kubectl create -f compute-quota.yaml","lesson":"02-namespaces","title":"Namespaces"},{"cmd":"kubectl create -f service-definition.yaml","lesson":"02-services","title":"Services"},{"cmd":"kubectl create deployment webapp --image=kodekloud/webapp-color --replicas=3","lesson":"02-imperative","title":"Imperative Commands with kubectl"},{"cmd":"kubectl create ns dev-ns","lesson":"02-imperative","title":"Imperative Commands with kubectl"},{"cmd":"kubectl create deployment redis-deploy -n dev-ns --image redis --replicas 2","lesson":"02-imperative","title":"Imperative Commands with kubectl"},{"cmd":"kubectl create -f pod-defini <script>
/* ===== Animation engine: stepper diagrams + interactive widgets ===== */
(function(){
"use strict";
const A = window.ANIMS = {};
const NS = "http://www.w3.org/2000/svg";
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let timers = [], live = [];
window.ANIM_CLEANUP = () => { timers.forEach(clearTimeout); timers = []; live.forEach(f => { try{f();}catch(e){} }); live = []; };
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const onCleanup = f => live.push(f);

function mk(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) { const v = attrs[k]; if (v === undefined || v === null || v === false) continue; if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
  if (parent) parent.appendChild(e);
  return e;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

const MARKS = { m:"var(--muted)", a:"var(--accent)", s:"var(--signal)", ok:"var(--ok)", bad:"var(--bad)" };
let svgCount = 0;
function newSvg(w, h, label){
  const svg = mk("svg", { viewBox:`0 0 ${w} ${h}`, role:"img", "aria-label": label || "Animated diagram" });
  svg._id = "s" + (++svgCount);
  defs(svg);
  return svg;
}
function defs(svg){
  const d = mk("defs", null, svg);
  for (const k in MARKS) {
    const m = mk("marker", { id:`${svg._id}-ar-${k}`, viewBox:"0 0 10 10", refX:"9", refY:"5", markerWidth:"9", markerHeight:"9", markerUnits:"userSpaceOnUse", orient:"auto-start-reverse" }, d);
    mk("path", { d:"M0 0L10 5L0 10z", style:`fill:${MARKS[k]}` }, m);
  }
}

/* ---- drawing kit bound to one svg ---- */
function kit(svg, instant){
  const K = {
    svg, instant: !!instant,
    g(parent, cls){ return mk("g", { class: "el " + (cls||"") }, parent || svg); },
    rect(p, x, y, w, h, cls, rx){ return mk("rect", { x, y, width:w, height:h, rx: rx==null?8:rx, class: cls||"box" }, p||svg); },
    text(p, x, y, s, cls, anchor){
      const lines = String(s).split("\n");
      const t = mk("text", { x, y, class: cls || "t", "text-anchor": anchor || "middle" }, p||svg);
      if (lines.length === 1) t.textContent = s;
      else lines.forEach((ln, i) => mk("tspan", { x, dy: i ? "1.2em" : (-(lines.length-1)*0.6)+"em", text: ln }, t));
      return t;
    },
    box(p, x, y, w, h, label, o){
      o = o || {};
      const g = K.g(p, o.gcls);
      K.rect(g, x, y, w, h, o.cls || "box", o.rx);
      if (label != null) K.text(g, x + w/2, y + h/2 + (o.sub ? -3 : 4.5), label, (o.tcls || "t") + (o.bold === false ? "" : " tb"));
      if (o.sub) K.text(g, x + w/2, y + h/2 + 12, o.sub, "ts");
      g._x = x; g._y = y; g._w = w; g._h = h; g._cx = x + w/2; g._cy = y + h/2;
      return g;
    },
    pod(p, cx, cy, o){
      o = o || {};
      const g = K.g(p, o.gcls);
      mk("circle", { cx, cy, r: o.r || 12, class: o.color || "f1", style: "stroke:var(--surface);stroke-width:2" }, g);
      if (o.label) K.text(g, cx, cy + 4, o.label, "t tb tw");
      if (o.under) K.text(g, cx, cy + (o.r||12) + 13, o.under, "ts");
      g._cx = cx; g._cy = cy;
      return g;
    },
    line(p, pts, o){
      o = o || {};
      const d = typeof pts === "string" ? pts : "M" + pts.map(q => q.join(" ")).join(" L");
      const cls = o.cls || "ln";
      const key = cls === "lna" ? "a" : cls === "lns" ? "s" : cls === "lnok" ? "ok" : cls === "lnbad" ? "bad" : "m";
      const e = mk("path", { d, class: "el " + cls + (o.dash ? " dash" : "") + (o.flow ? " flow" : ""), "marker-end": o.arrow === false ? null : `url(#${svg._id}-ar-${key})`, "marker-start": o.both ? `url(#${svg._id}-ar-${key})` : null }, p||svg);
      return e;
    },
    label(p, x, y, s, cls){ // small pill label
      const g = K.g(p);
      const w = Math.max(24, String(s).length * 7.2 + 14);
      K.rect(g, x - w/2, y - 9, w, 18, cls || "box", 9);
      K.text(g, x, y + 4, s, "tm");
      return g;
    },
    hide(...els){ els.flat().forEach(e => e && e.classList.add("is-hidden")); },
    show(...els){ els.flat().forEach(e => e && e.classList.remove("is-hidden")); },
    dim(on, ...els){ els.flat().forEach(e => e && e.classList.toggle("is-dim", !!on)); },
    hl(on, ...els){ els.flat().forEach(e => e && e.classList.toggle("is-hl", !!on)); },
    cls(el, c, on){ el && el.classList.toggle(c, on !== false); },
    setText(g, s){ const t = g.tagName === "text" ? g : g.querySelector("text"); if (t) t.textContent = s; },
    sleep(ms){ return (K.instant || RM) ? Promise.resolve() : new Promise(r => later(r, ms)); },
    packet(pts, o){
      o = o || {};
      const d = typeof pts === "string" ? pts : "M" + pts.map(q => q.join(" ")).join(" L");
      if (K.instant) return Promise.resolve();
      const path = mk("path", { d, fill:"none", stroke:"none" }, svg);
      const c = mk("circle", { r: o.r || 6, class: "pkt", style: o.color ? `fill:${o.color}` : null }, svg);
      let lab = null;
      if (o.text) { lab = mk("text", { class:"tm tb", "text-anchor":"middle", text:o.text }, svg); }
      const L = path.getTotalLength(), dur = RM ? 1 : (o.dur || Math.max(500, L * 4.2));
      return new Promise(res => {
        const t0 = performance.now();
        const step = now => {
          if (!c.isConnected) return res();
          const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
          const pt = path.getPointAtLength(L * e);
          c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y);
          if (lab) { lab.setAttribute("x", pt.x); lab.setAttribute("y", pt.y - 10); }
          if (k < 1) requestAnimationFrame(step); else { if (!o.keep) { c.remove(); lab && lab.remove(); } path.remove(); res(c); }
        };
        requestAnimationFrame(step);
      });
    },
    async flash(el, ms){ if (K.instant) return; K.hl(true, el); await K.sleep(ms || 700); K.hl(false, el); },
  };
  return K;
}

/* ---- frame ---- */
function frame(el, title){
  el.innerHTML = `<div class="anim-head"><span class="anim-title">${esc(title)}</span><span class="anim-count"></span></div><div class="anim-stage"></div><div class="anim-cap"></div><div class="anim-ctl"></div>`;
  return { head: el.querySelector(".anim-head"), count: el.querySelector(".anim-count"), stage: el.querySelector(".anim-stage"), cap: el.querySelector(".anim-cap"), ctl: el.querySelector(".anim-ctl") };
}

/* ---- stepper: a diagram whose state is built step by step ---- */
function stepper(el, cfg){
  const F = frame(el, cfg.title);
  const n = cfg.steps.length;
  let cur = 0, gen = 0, playing = false;
  F.ctl.innerHTML = `<button class="cbtn" data-a="prev" aria-label="Previous step">◀</button><button class="cbtn pri" data-a="play">▶ Play</button><button class="cbtn" data-a="next" aria-label="Next step">▶</button><span class="sp"></span><span class="dots">${cfg.steps.map((_,i)=>`<i data-i="${i}" title="Step ${i+1}"></i>`).join("")}</span><button class="cbtn" data-a="reset" aria-label="Restart">↺</button>`;
  const btn = a => F.ctl.querySelector(`[data-a="${a}"]`);
  async function go(i, animate){
    cur = Math.max(0, Math.min(n - 1, i));
    const my = ++gen;
    const svg = newSvg(cfg.w || 440, cfg.h || 260, cfg.title);
    F.stage.innerHTML = ""; F.stage.appendChild(svg);
    const fast = kit(svg, true);
    const refs = cfg.build(fast) || {};
    for (let k = 0; k < cur; k++) await cfg.steps[k].run(refs, fast);
    if (my !== gen) return;
    F.cap.innerHTML = cfg.steps[cur].t;
    F.count.textContent = `Step ${cur+1}/${n}`;
    F.ctl.querySelectorAll(".dots i").forEach((d, k) => d.classList.toggle("on", k === cur));
    btn("prev").disabled = cur === 0; btn("next").disabled = cur === n - 1;
    const K = kit(svg, !animate);
    await cfg.steps[cur].run(refs, K);
    if (my !== gen) return;
    if (playing) {
      if (cur < n - 1) later(() => { if (my === gen && playing) go(cur + 1, true); }, RM ? 2600 : (cfg.pause || 1500));
      else setPlay(false);
    }
  }
  function setPlay(on){ playing = on; btn("play").textContent = on ? "❚❚ Pause" : (cur === n-1 ? "↺ Replay" : "▶ Play"); }
  F.ctl.addEventListener("click", e => {
    const b = e.target.closest("[data-a],[data-i]"); if (!b) return;
    if (b.dataset.i != null) { setPlay(false); go(+b.dataset.i, true); return; }
    const a = b.dataset.a;
    if (a === "prev") { setPlay(false); go(cur - 1, false); }
    if (a === "next") { setPlay(false); go(cur + 1, true); }
    if (a === "reset") { setPlay(false); go(0, true); }
    if (a === "play") {
      if (playing) { setPlay(false); return; }
      if (cur === n - 1) { setPlay(true); go(0, true); } else { setPlay(true); go(cur + 1, true); }
    }
  });
  go(0, false).then(() => setPlay(false));
}

  const nodeX = [8, 222];
  nodeX.forEach((nx,i) => { K.rect(null, nx, 58, 210, 120, "node", 10); K.text(null, nx + 105, 76, "node0"+(i+1), "ts"); });
  let desired = 3, pods = [], uid = 0;
  const colors = ["f1","f2","f3","f4","f5","f6"];
  const layout = () => {
    pods.forEach((p, i) => { const n = i % 2, k = Math.floor(i / 2); p.cx = nodeX[n] + 36 + k*46; p.cy = 128; p.g.setAttribute("transform", `translate(${p.cx},${p.cy})`); });
    lbl.textContent = `myapp-replicaset · desired: ${desired} · current: ${pods.length}`;
  };
  const addPod = () => {
    const g = K.g(); g.classList.add("clickable"); const id = ++uid;
    window.AK.mk("circle", { r:15, class: colors[id % 6], style:"stroke:var(--surface);stroke-width:2" }, g);

    g.style.opacity = 0; requestAnimationFrame(() => { g.style.transition = "opacity .4s"; g.style.opacity = 1; });
    const p = { g, id }; pods.push(p);
    g.addEventListener("click", () => kill(p));
    layout();
  };
  const reconcile = () => {
    later(() => {
      if (pods.length < desired) { addPod(); F.cap.innerHTML = `The controller sees ${pods.length-1}/${desired} Pods and <strong>creates one</strong>.`; reconcile(); }
      else if (pods.length > desired) { const p = pods.pop(); p.g.remove(); layout(); F.cap.innerHTML = `Too many Pods: the controller <strong>deletes one</strong>.`; reconcile(); }
      else F.cap.innerHTML = `Steady state: <strong>${desired}</strong> Pods running, as requested. Click a Pod to delete it.`;
    }, 700);
  };
  const kill = p => { pods = pods.filter(x => x !== p); p.g.remove(); layout(); F.cap.innerHTML = "A Pod is gone…"; reconcile(); };

/* ===== Chapter 03 — Scheduling ===== */
(function(){
const { stepper, widget, ctlRow, esc, later, mk } = window.AK;
const A = window.ANIMS;

/* --- labels & selectors --- */
A.labels = el => {

  const K = F.K;
  const objs = [
    { n:"Pod", l:{app:"App1", function:"Front-end"} }, { n:"Pod", l:{app:"App1", function:"Front-end"} },
    { n:"Pod", l:{app:"App2", function:"Web-Servers"} }, { n:"Pod", l:{app:"App3", function:"DB"} },
    { n:"ReplicaSet", l:{app:"App1", function:"Front-end"} }, { n:"Service", l:{app:"App3", function:"DB"} },
  ];

  F.ctl.remove();
  const on = new Set();
  const upd = () => {
    const pairs = [...on].map(s => s.split("="));
    let n = 0;
    objs.forEach(o => { const m = pairs.length && pairs.every(([k,v]) => o.l[k] === v); K.hl(m, o.g); K.dim(pairs.length && !m, o.g); if (m) n++; });
    row.querySelectorAll("button").forEach(b => b.classList.toggle("on", on.has(b.dataset.s)));
    F.cap.innerHTML = pairs.length ? `<code>kubectl get all --selector ${[...on].join(",")}</code> → <strong>${n}</strong> object${n===1?"":"s"}.` : "Turn on one or more selectors: several labels combine as <strong>AND</strong>.";
  };
  row.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; on.has(b.dataset.s) ? on.delete(b.dataset.s) : on.add(b.dataset.s); upd(); });

/* --- taints & tolerations --- */
A.taints = el => {
  const F = widget(el, "Taints and tolerations", 440, 220);
  const K = F.K;
  const nodes = [0,1,2].map(i => { const g = K.box(null, 10 + i*144, 60, 132, 150, "node0"+(i+1), { cls:"node" }); g.querySelector("text").setAttribute("y", 78); return g; });
  const taintTag = K.g(); K.text(taintTag, 76, 100, "taint app=blue", "tm"); const effT = K.text(taintTag, 76, 116, "NoSchedule", "tm tsig");
  const pods = [{ n:"A" }, { n:"B" }, { n:"C" }, { n:"D", tol:true }];
  const home = (p, i) => [60 + i*52, 28];
  let taint = true, effect = "NoSchedule";
  pods.forEach((p,i) => { p.g = K.g(); mk("circle", { r:15, class: p.tol ? "f1" : "fm", style:"stroke:var(--surface);stroke-width:2" }, p.g); K.text(p.g, 0, 5, p.n, "t tb tw"); const [hx,hy]=home(p,i); p.g.setAttribute("transform",`translate(${hx},${hy})`); p.g.style.transition = "transform .7s cubic-bezier(.3,.8,.3,1), opacity .4s"; });
  K.text(null, 310, 33, "D tolerates app=blue", "ts", "start");
  mk("circle", { cx:300, cy:29, r:5, class:"f1" }, F.svg);
  const row = ctlRow(F, `<label><input type="checkbox" id="tOn" checked> taint on node01</label><label>effect <select id="tEff"><option>NoSchedule</option><option>PreferNoSchedule</option><option>NoExecute</option></select></label><button class="cbtn pri" id="tGo">Schedule the Pods</button><button class="cbtn" id="tRe">Reset</button>`);
  F.ctl.remove();
  const slot = [0,0,0];
  const place = (p, ni) => { const k = slot[ni]++; p.node = ni; p.g.setAttribute("transform", `translate(${40 + ni*144 + (k%3)*36},${140 + Math.floor(k/3)*36})`); };
  const reset = () => { slot.fill(0); pods.forEach((p,i)=>{ p.node = null; p.g.style.opacity = 1; const [hx,hy]=home(p,i); p.g.setAttribute("transform",`translate(${hx},${hy})`); }); F.cap.innerHTML = "Four Pods are waiting. Only D tolerates node01's <code>app=blue</code> taint. Click <strong>Schedule the Pods</strong>."; };
  const updTag = () => { taintTag.classList.toggle("is-hidden", !taint); effT.textContent = effect; nodes[0].querySelector("rect").setAttribute("class", taint ? "boxs" : "node"); };
  row.querySelector("#tOn").addEventListener("change", e => { taint = e.target.checked; updTag(); evict(); });
  row.querySelector("#tEff").addEventListener("change", e => { effect = e.target.value; updTag(); evict(); });
  function evict(){
    if (taint && effect === "NoExecute") {
      const bad = pods.filter(p => p.node === 0 && !p.tol);
      if (bad.length) { bad.forEach(p => { p.g.style.opacity = .2; }); F.cap.innerHTML = `<strong>NoExecute</strong>: ${bad.map(p=>p.n).join(", ")} ${bad.length>1?"don't":"doesn't"} tolerate the taint and ${bad.length>1?"are":"is"} evicted from node01.`; }
    }
  }
  row.querySelector("#tRe").addEventListener("click", reset);
  row.querySelector("#tGo").addEventListener("click", () => {
    slot.fill(0);
    let rr = 0;
    pods.forEach((p,i) => {
      let ni;
      if (!taint) ni = rr++ % 3;
      else if (p.tol) ni = 0;
      else ni = 1 + (rr++ % 2);
      p.g.style.opacity = 1;
      later(() => place(p, ni), i*220);
    });
    later(() => {

/* --- rolling update vs recreate --- */
A.rolling = el => {
  const F = widget(el, "Recreate or RollingUpdate", 440, 200);
  const K = F.K, N = 5;
  K.text(null, 12, 26, "ReplicaSet rev. 1", "ts tb", "start"); K.text(null, 12, 118, "ReplicaSet rev. 2", "ts tb", "start");
  K.rect(null, 8, 34, 424, 54, "boxa", 10); K.rect(null, 8, 126, 424, 54, "boxok", 10);
  const c1 = K.text(null, 424, 26, "", "tm", "end"), c2 = K.text(null, 424, 118, "", "tm", "end");
  const p1 = [], p2 = [];
  for (let i=0;i<N;i++){ p1.push(K.pod(null, 50 + i*84, 61, { r:15, color:"f1", label:"v1" })); p2.push(K.pod(null, 50 + i*84, 153, { r:15, color:"f3", label:"v2" })); }
  const avail = document.createElement("div"); avail.className = "ctl-row"; avail.innerHTML = `<span style="font-size:14px">Availability</span><div style="flex:1;min-width:120px;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden"><div id="avB" style="height:100%;width:100%;background:var(--ok);transition:width .3s"></div></div><b id="avT" style="font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px">5/5</b>`;
  F.cap.before(avail);
  const row = ctlRow(F, `<label>strategy.type <select id="rlS"><option>RollingUpdate</option><option>Recreate</option></select></label><button class="cbtn pri" id="rlGo">kubectl set image … nginx=nginx:1.9.1</button><button class="cbtn" id="rlUndo">kubectl rollout undo</button>`);
  F.ctl.remove();
  let s1 = N, s2 = 0, busy = false, ver = 1;
  const draw = () => {
    p1.forEach((p,i) => p.classList.toggle("is-hidden", i >= s1)); p2.forEach((p,i) => p.classList.toggle("is-hidden", i >= s2));
    c1.textContent = `${s1} Pod${s1===1?"":"s"}`; c2.textContent = `${s2} Pod${s2===1?"":"s"}`;
    const a = s1 + s2; avail.querySelector("#avB").style.width = (Math.min(a,N)/N*100)+"%"; avail.querySelector("#avB").style.background = a === 0 ? "var(--bad)" : a < N ? "var(--warn)" : "var(--ok)";
    avail.querySelector("#avT").textContent = `${Math.min(a,N)}/${N}`;
  };
  const wait = ms => new Promise(r => later(r, ms));
  const run = async (toV2) => {
    if (busy) return; busy = true;
    const strat = row.querySelector("#rlS").value;
    const dec = toV2 ? () => s1-- : () => s2--, inc = toV2 ? () => s2++ : () => s1++;
    const left = () => toV2 ? s1 : s2;
    F.cap.innerHTML = strat === "Recreate" ? "<strong>Recreate</strong>: all old Pods are deleted first…" : "<strong>RollingUpdate</strong>: a new Pod starts, an old one stops, and so on.";
    if (strat === "Recreate") { while (left()) { dec(); draw(); await wait(180); } F.cap.innerHTML += " The application is <strong>down</strong>."; await wait(1100); for (let i=0;i<N;i++){ inc(); draw(); await wait(220);} }
    else { for (let i=0;i<N;i++){ inc(); draw(); await wait(420); dec(); draw(); await wait(420);} }
    ver = toV2 ? 2 : 1;
    F.cap.innerHTML = toV2 ? "Done: revision 2 is running. The old ReplicaSet is kept at 0 Pods, which is what makes rollback possible." : "Back to revision 1: the Deployment scales the old ReplicaSet up and the new one down.";
    busy = false;
  };
  row.querySelector("#rlGo").addEventListener("click", () => ver === 1 && run(true));
  row.querySelector("#rlUndo").addEventListener("click", () => ver === 2 && run(false));
  draw(); F.cap.innerHTML = "Pick a strategy, then start the update. Watch the availability bar.";
};

/* ===== Chapter 06 — Cluster maintenance ===== */
(function(){
const { stepper, widget, ctlRow, esc, later, mk } = window.AK;
const A = window.ANIMS;

/* --- drain / cordon / uncordon --- */
A.drain = el => {
  const F = widget(el, "drain, cordon, uncordon", 440, 190);
  const K = F.K, colors = ["f1","f2","f3","f4","f5","f6"];
  const N = [{ pods:[0,1], st:"ok" }, { pods:[2,3], st:"ok" }, { pods:[4,5], st:"ok" }];
  const intro = "Three nodes, two Pods each. Get node01 ready for an OS upgrade.";
  let layer = null;
  const draw = () => {
    layer && layer.remove(); layer = K.g();
    N.forEach((n,i) => {
      const x0 = 8 + i*144;
      K.rect(layer, x0, 20, 136, 150, n.st === "ok" ? "node" : n.st === "cordon" ? "boxw" : "boxbad", 12);
      K.text(layer, x0 + 68, 40, "node0"+(i+1), "t tb");
      K.text(layer, x0 + 68, 58, n.st === "ok" ? "Ready" : "SchedulingDisabled", "ts " + (n.st === "ok" ? "tok" : "tsig"));
      n.pods.forEach((c,k) => K.pod(layer, x0 + 30 + (k%3)*38, 100 + Math.floor(k/3)*36, { r:14, color:colors[c] }));
    });
  };
  const row = ctlRow(F, `<button class="cbtn pri" data-k="drain">kubectl drain node01</button><button class="cbtn" data-k="cordon">kubectl cordon node02</button><button class="cbtn" data-k="un1">kubectl uncordon node01</button><button class="cbtn" data-k="new">Create 2 Pods</button><button class="cbtn" data-k="reset" aria-label="Reset">↺</button>`);
  F.ctl.remove();
  let nextC = 0;
  const place = c => { const ok = N.map((n,i)=>i).filter(i => N[i].st === "ok").sort((a,b) => N[a].pods.length - N[b].pods.length); if (!ok.length) return false; N[ok[0]].pods.push(c); return true; };
  row.addEventListener("click", e => {
    const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    if (k === "drain") { if (N[0].st === "drained") return; const moved = N[0].pods.splice(0); N[0].st = "drained"; moved.forEach(place); F.cap.innerHTML = "<strong>drain</strong>: node01's Pods are gracefully terminated and recreated elsewhere; node01 is marked unschedulable. Ready for maintenance."; }
    if (k === "cordon") { N[1].st = "cordon"; F.cap.innerHTML = "<strong>cordon</strong>: node02 keeps its Pods, but won't receive new ones."; }
    if (k === "un1") { if (N[0].st === "ok") return; N[0].st = "ok"; F.cap.innerHTML = "<strong>uncordon</strong>: node01 accepts Pods again. Moved Pods don't come back on their own: only new Pods will land there."; }
    if (k === "new") { const a = place(nextC++ % 6); place(nextC++ % 6); F.cap.innerHTML = a ? "New Pods only go to schedulable nodes." : "No schedulable node: the Pods would stay Pending."; }
    if (k === "reset") { N[0] = { pods:[0,1], st:"ok" }; N[1] = { pods:[2,3], st:"ok" }; N[2] = { pods:[4,5], st:"ok" }; F.cap.innerHTML = intro; }
    draw();
  });
  draw(); F.cap.innerHTML = intro;
};

/* ===== Chapter 07 — Security ===== */
(function(){
const { stepper, widget, ctlRow, esc, later, mk } = window.AK;
const A = window.ANIMS;
const sel = (o, v) => Object.entries(o).map(([k,l]) => `<option value="${k}"${k===v?" selected":""}>${l}</option>`).join("");

/* --- security gates --- */
A.secgate = el => stepper(el, { title:"A request's path to the kube-apiserver", w:440, h:180, build:x=>{
  const r = {};
  r.u = x.box(null, 6, 70, 70, 40, "kubectl", { cls:"boxs", tcls:"tm" });
  r.g = [["AuthN","who are you?"],["AuthZ","what can you do?"],["Admission","is it valid?"]].map(([a,b],i) => x.box(null, 92 + i*94, 60, 88, 60, a, { cls:"boxa", sub:b }));

  r.tls = x.label(null, 220, 24, "all traffic is encrypted with TLS", "boxok");
  x.hide(r.no, r.tls);
  return r;
}, steps:[
  { t:"Every action goes through the <strong>kube-apiserver</strong>. Before reaching etcd, a request passes several checks.", run:()=>{} },
  { t:"<strong>Authentication</strong>: who are you? Certificates, tokens, an external provider, or a service account.", run:async(r,x)=>{ await x.packet([[76,90],[92,90]]); x.hl(true, r.g[0]); } },
  { t:"<strong>Authorization</strong>: are you allowed to do this? RBAC, ABAC, Node, Webhook.", run:async(r,x)=>{ x.hl(false, r.g[0]); await x.packet([[180,90],[186,90]]); x.hl(true, r.g[1]); } },
  { t:"A denial at any step stops the request.", run:async(r,x)=>{ await x.packet([[230,124],[230,150]]); x.show(r.no); } },
  { t:"Otherwise the request goes through admission control and is stored in etcd. Traffic between components is encrypted with <strong>TLS</strong>.", run:async(r,x)=>{ x.hide(r.no); x.hl(false, r.g[1]); await x.packet([[76,90],[376,90]]); x.show(r.tls); } },
