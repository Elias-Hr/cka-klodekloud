ib/etcd-data-new&lt;/b&gt;.","a":"<p>As you recall, <code>cluster2<\/code> is using <em>external<\/em> etcd. This means\n* <code>etcd<\/code> does not have to be on the control plane node of the cluster. In this case, it is not.\n* <code>etcd<\/code> runs as an operating system service not a pod, therefore there is no manifest file to edit. Changes are instead made to a service unit file.  <\/p>\n<p>There are several parts to this question. Let's go through them one at a time.<\/p>\n<p>1.\nMove the backup to the etcd-server node<\/p>\n<pre><code class=\"language-bash\">scp /opt/cluster2.db etcd-server:~/\n<\/code><\/pre>"},{"q":"Log into etcd-server node","a":"<pre><code class=\"language-bash\">ssh etcd-server\n<\/code><\/pre>"},{"q":"Check the ownership of the current etcd-data directory","a":"<p>We will need to ensure correct ownership of our restored data. We determined the location of the data directory in Q12<\/p>\n<pre><code class=\"language-bash\">ls -ld /var/lib/etcd-data/\n<\/code><\/pre>\n<blockquote>\n<p>Note that owner and group are both <code>etcd<\/code><\/p>\n<\/blockquote>"},{"q":"Do the restore","a":"<pre><code class=\"language-bash\">ETCDCTL_API=3 etcdctl snapshot restore \\\n    --data-dir /var/lib/etcd-data-new \\\n    cluster2.db\n<\/code><\/pre>"},{"q":"Set ownership on the restored directory","a":"<pre><code class=\"language-bash\">chown -R etcd:etcd /var/lib/etcd-data-new\n<\/code><\/pre>\n<p><\/detials>\n1.\nReconfigure and restart etcd<\/p>\n<p>We will need the location of the service unit file which we also determined in Q12<\/p>\n<pre><code class=\"language-bash\">vi /etc/systemd/system/etcd.service\n<\/code><\/pre>\n<p>Edit the <code>--data-dir<\/code> argument to the newly restored directory, and save.<\/p>\n<p>Finally, reload and restart the <code>etcd<\/code> service. Whenever you have edited a service unit file, a <code>daemon-reload<\/code> is required to reload the in-memory configuration of the <code>systemd<\/code> service.<\/p>\n<pre><code class=\"language-bash\">systemctl daemon-reload\nsystemctl restart etcd.service\n<\/code><\/pre>\n<p>Return to the student node:<\/p>\n<pre><code class=\"language-bash\">exit\n<\/code><\/pre>"},{"q":"Verify the restore","a":"<pre><code class=\"language-bash\">kubectl config use-context cluster2\nkubectl get all -n critical\n<\/code><\/pre>"}],"text":"Information only Explore the student-node and the clusters it has access to. How many clusters are defined in the kubeconfig on the student-node? How many nodes (both controlplane and worker) are part of cluster1? What is the name of the controlplane node in cluster2? Information only How is ETCD configured for cluster1? How is ETCD configured for cluster2? What is the IP address of the External ETCD datastore used in cluster2? What is the default data directory used the for ETCD datastore used in cluster1? Information only What is the default data directory used the for ETCD datastore used in cluster2? How many other nodes are part of the ETCD cluster that etcd-server is a part of? Take a backup of etcd on cluster1 and save it on the student-node at the path /opt/cluster1.db An ETCD backup for cluster2 is stored at /opt/cluster2.db. Use this snapshot file to carry out a restore on cluster2 to a new path <b>/var/lib/etcd-data-new<\/b>. Log into etcd-server node Check the ownership of the current etcd-data directory Do the restore Set ownership on the restored directory Verify the restore","minutes":20}],"quiz":[{"q":"What does kubectl cordon do?","options":["Evicts every Pod from the node","Marks the node unschedulable without touching existing Pods","Restarts the kubelet"],"answer":1,"explain":"drain evicts Pods and cordons the node; cordon only stops new Pods from arriving."},{"q":"After a drain and some maintenance, what must you do?","options":["kubectl uncordon node-1","Nothing, the node becomes schedulable again on its own","kubectl undrain node-1"],"answer":0,"explain":"The node stays cordoned until you uncordon it."},{"q":"The kube-apiserver is at v1.10. Which kubelet version is allowed?","options":["v1.11","v1.8","v1.12"],"answer":1,"explain":"Kubelets can be up to two minor versions behind, never ahead."},{"q":"How do you go from 1.10 to 1.13?","options":["In one go with kubeadm upgrade apply v1.13.0","One minor version at a time: 1.11, 1.12, then 1.13"],"answer":1,"explain":"The recommended approach is to upgrade one minor version at a time."},{"q":"Why does kubectl get nodes still show the old version after kubeadm upgrade apply?","options":["The upgrade failed","The column shows the kubelet version"],"answer":1,"explain":"You then upgrade and restart the kubelet."},{"q":"Which variable must be set to use etcdctl snapshot?","options":["ETCDCTL_API=3","ETCD_VERSION=3","KUBECONFIG"],"answer":0,"explain":"The snapshot commands only exist in API v3."},{"q":"What must you stop before restoring ETCD on a cluster set up the hard way?","options":["kubelet","kube-apiserver","kube-proxy"],"answer":1,"explain":"The kube-apiserver depends on ETCD; start it again once ETCD is restored."}],"folder":"06-Cluster-Maintenance"},{"num":"07","title":"Security","short":"Security","summary":"Authentication, TLS certificates, kubeconfig, API groups, authorization and RBAC, service accounts, image security, security contexts and network policies.","lessons":[{"id":"07-security-primitives","kind":"lesson","title":"Kubernetes Security Primitives","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/02-Kubernetes-Security-Primitives.md","html":"<p>Security starts with the <strong>hosts<\/strong>: root access disabled, password authentication disabled, SSH key-based authentication only.<\/p>\n<p>For Kubernetes itself, everything revolves around the <strong>kube-apiserver<\/strong>, at the centre of all operations. Two decisions have to be made:<\/p>\n<ul>\n<li><strong>Who can access?<\/strong> That's <strong>authentication<\/strong>: files with usernames and passwords or tokens, certificates, external authentication providers (LDAP), service accounts.<\/li>\n<li><strong>What can they do?<\/strong> That's <strong>authorization<\/strong>: RBAC, ABAC, Node, Webhook.<\/li>\n<\/ul>\n<p>All communication between components (ETCD, kube-controller-manager, kube-scheduler, kube-apiserver, kubelet, kube-proxy) is secured with <strong>TLS encryption<\/strong>. Between applications, every Pod can reach every Pod by default; <strong>Network Policies<\/strong> restrict that traffic.<\/p>\n<div class=\"anim\" data-anim=\"secgate\"><\/div>","text":"Security starts with the hosts : root access disabled, password authentication disabled, SSH key-based authentication only. For Kubernetes itself, everything revolves around the kube-apiserver , at the centre of all operations. Two decisions have to be made: Who can access? That's authentication : files with usernames and passwords or tokens, certificates, external authentication providers (LDAP), service accounts. What can they do? That's authorization : RBAC, ABAC, Node, Webhook. All communication between components (ETCD, kube-controller-manager, kube-scheduler, kube-apiserver, kubelet, kube-proxy) is secured with TLS encryption . Between applications, every Pod can reach every Pod by default; Network Policies restrict that traffic.","minutes":2,"ncode":0},{"id":"07-authentication","kind":"lesson","title":"Authentication","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/03-Authentication.md","html":"<p>End users of the applications are managed by the applications themselves. That leaves two kinds of users:<\/p>\n<ul>\n<li><strong>humans<\/strong>, such as administrators and developers;<\/li>\n<li><strong>robots<\/strong>, such as processes, services or applications that need access to the cluster.<\/li>\n<\/ul>\n<p>Kubernetes <strong>doesn't manage user accounts<\/strong> natively: it relies on a file, certificates or an external identity service. It does manage <strong>ServiceAccounts<\/strong>. All user access goes through the kube-apiserver, which authenticates every request.<\/p>\n<p>Possible mechanisms: static password file, static token file, <strong>certificates<\/strong>, identity services (LDAP, Kerberos…).<\/p>\n<p>Basic authentication (a CSV file <code>password,user,uid[,group]<\/code> passed with <code>--basic-auth-file<\/code>) illustrates the idea:<\/p>\n<pre><code class=\"language-bash\">$ curl -v -k <a target=\"_blank\" rel=\"noopener\" href=\"http://master-node-ip:6443/api/v1/pods\" target=\"_blank\" rel=\"noopener\">http://master-node-ip:6443/api/v1/pods<\/a> -u &quot;user1:password123&quot;\n<\/code><\/pre>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Deprecated<\/p>\n<p>Static password and token files are not recommended: credentials are stored in clear text. The static password file was removed in v1.19. In a kubeadm cluster, you'd also have to mount the file into the kube-apiserver Pod.<\/p>\n<\/div>","text":"End users of the applications are managed by the applications themselves. That leaves two kinds of users: humans , such as administrators and developers; robots , such as processes, services or applications that need access to the cluster. Kubernetes doesn't manage user accounts natively: it relies on a file, certificates or an external identity service. It does manage ServiceAccounts . All user access goes through the kube-apiserver, which authenticates every request. Possible mechanisms: static password file, static token file, certificates , identity services (LDAP, Kerberos…). Basic authentication (a CSV file password,user,uid[,group] passed with --basic-auth-file ) illustrates the idea: Deprecated Static password and token files are not recommended: credentials are stored in clear text. The static password file was removed in v1.19. In a kubeadm cluster, you'd also have to mount the file into the kube-apiserver Pod.","minutes":2,"ncode":1},{"id":"07-tls-basics","kind":"lesson","title":"TLS Basics","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/05-TLS-Basics.md","html":"<p>A <strong>certificate<\/strong> guarantees trust between two parties during a transaction, and lets them encrypt the communication.<\/p>\n<ul>\n<li><strong>Symmetric encryption<\/strong>: the same key encrypts and decrypts. It has to be sent to the receiver: a hacker who intercepts it can read everything.<\/li>\n<li><strong>Asymmetric encryption<\/strong>: a <strong>key pair<\/strong>. The public key (the \"public lock\") encrypts, only the private key decrypts. It is used to safely exchange a symmetric key, which is then used for the rest of the session.<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"tls\"><\/div>\n\n<p>How do you know a certificate is legitimate? Look at <strong>who signed it<\/strong>. A certificate you sign yourself is <strong>self-signed<\/strong> and proves nothing. <strong>Certificate Authorities<\/strong> (CAs: Symantec, DigiCert, Comodo, GlobalSign…) sign certificates after validating the request (CSR). Browsers ship with the CAs' public keys to verify their signatures. An organisation can also host its own <strong>private CA<\/strong> for internal services.<\/p>\n<p>The whole system (CA, servers, clients, key pairs) is called a <strong>PKI<\/strong> (<em>Public Key Infrastructure<\/em>). Clients can also present a certificate to the server: that's <strong>mutual<\/strong> TLS.<\/p>\n<p><strong>Naming convention<\/strong>: certificates (public keys) end in <code>.crt<\/code> or <code>.pem<\/code> (<code>server.crt<\/code>, <code>client.pem<\/code>); private keys contain <code>key<\/code> (<code>server.key<\/code>, <code>client-key.pem<\/code>).<\/p>","text":"A certificate guarantees trust between two parties during a transaction, and lets them encrypt the communication. Symmetric encryption : the same key encrypts and decrypts. It has to be sent to the receiver: a hacker who intercepts it can read everything. Asymmetric encryption : a key pair . The public key (the \"public lock\") encrypts, only the private key decrypts. It is used to safely exchange a symmetric key, which is then used for the rest of the session. How do you know a certificate is legitimate? Look at who signed it . A certificate you sign yourself is self-signed and proves nothing. Certificate Authorities (CAs: Symantec, DigiCert, Comodo, GlobalSign…) sign certificates after validating the request (CSR). Browsers ship with the CAs' public keys to verify their signatures. An organisation can also host its own private CA for internal services. The whole system (CA, servers, clients, key pairs) is called a PKI ( Public Key Infrastructure ). Clients can also present a certificate to the server: that's mutual TLS. Naming convention : certificates (public keys) end in .crt or .pem ( server.crt , client.pem ); private keys contain key ( server.key , client-key.pem ).","minutes":2,"ncode":0},{"id":"07-tls-k8s","kind":"lesson","title":"TLS in Kubernetes","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/06-TLS-in-Kubernetes.md","html":"<p>Two requirements: every service in the cluster uses <strong>server certificates<\/strong>, and every client uses <strong>client certificates<\/strong> to prove who it is.<\/p>\n<p><strong>Server components<\/strong>:<\/p>\n<ul>\n<li><strong>kube-apiserver<\/strong>: <code>apiserver.crt<\/code> / <code>apiserver.key<\/code><\/li>\n<li><strong>ETCD<\/strong>: <code>etcdserver.crt<\/code> / <code>etcdserver.key<\/code><\/li>\n<li><strong>kubelet<\/strong> (it exposes an HTTPS API): <code>kubelet.crt<\/code> / <code>kubelet.key<\/code><\/li>\n<\/ul>\n<p><strong>Clients of the kube-apiserver<\/strong>: the administrator (<code>admin.crt<\/code>), kube-scheduler, kube-controller-manager, kube-proxy. The kube-apiserver is itself a <strong>client<\/strong> of ETCD and of the kubelets, and can reuse its own certificate or have dedicated ones.<\/p>\n<p>All these certificates are signed by at least one <strong>cluster CA<\/strong> (<code>ca.crt<\/code> / <code>ca.key<\/code>). You can have a second CA just for ETCD.<\/p>\n<div class=\"anim\" data-anim=\"certmap\"><\/div>","text":"Two requirements: every service in the cluster uses server certificates , and every client uses client certificates to prove who it is. Server components : kube-apiserver : apiserver.crt / apiserver.key ETCD : etcdserver.crt / etcdserver.key kubelet (it exposes an HTTPS API): kubelet.crt / kubelet.key Clients of the kube-apiserver : the administrator ( admin.crt ), kube-scheduler, kube-controller-manager, kube-proxy. The kube-apiserver is itself a client of ETCD and of the kubelets, and can reuse its own certificate or have dedicated ones. All these certificates are signed by at least one cluster CA ( ca.crt / ca.key ). You can have a second CA just for ETCD.","minutes":2,"ncode":0},{"id":"07-cert-creation","kind":"lesson","title":"Certificate Creation","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/07-TLS-in-Kubernetes-Certificate-Creation.md","html":"<p>Available tools: easyrsa, <strong>openssl<\/strong>, cfssl… The course uses openssl.<\/p>\n<p><strong>Certificate Authority (CA)<\/strong>: key, certificate signing request (CSR), then a self-signed certificate.<\/p>\n<pre><code class=\"language-bash\">$ openssl genrsa -out ca.key 2048\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ openssl req -new -key ca.key -subj &quot;/CN=KUBERNETES-CA&quot; -out ca.csr\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ openssl x509 -req -in ca.csr -signkey ca.key -out ca.crt\n<\/code><\/pre>\n<p><strong>A client: the admin user<\/strong>. The <code>CN<\/code> is the name that appears in audit logs.<\/p>\n<pre><code class=\"language-bash\">$ openssl genrsa -out admin.key 2048\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ openssl req -new -key admin.key -subj &quot;/CN=kube-admin&quot; -out admin.csr\n<\/code><\/pre>\n<p>This time, sign with the CA key:<\/p>\n<pre><code class=\"language-bash\">$ openssl x509 -req -in admin.csr -CA ca.crt -CAkey ca.key -out admin.crt\n<\/code><\/pre>\n<p>To tell an administrator from a regular user, add the <strong><code>system:masters<\/code><\/strong> group in the <code>O<\/code> field:<\/p>\n<pre><code class=\"language-bash\">$ openssl req -new -key admin.key -subj &quot;/CN=kube-admin/O=system:masters&quot; -out admin.csr\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"csrflow\"><\/div>\n\n<p>Follow the same procedure for the other clients. System components are named with the <code>system:<\/code> prefix (<code>system:kube-scheduler<\/code>, <code>system:kube-controller-manager<\/code>, <code>system:kube-proxy<\/code>).<\/p>\n<p><strong>Servers<\/strong>:<\/p>\n<ul>\n<li><strong>ETCD server<\/strong>: in a cluster, members also have <strong>peer<\/strong> certificates to talk to each other.<\/li>\n<li><strong>kube-apiserver<\/strong>: it is called <code>kubernetes<\/code>, <code>kubernetes.default<\/code>, <code>kubernetes.default.svc<\/code>, <code>kubernetes.default.svc.cluster.local<\/code>, or by its IP. All these names go in the <strong>subject alternative names<\/strong> (<code>alt_names<\/code> section of an <code>openssl.cnf<\/code> file).<\/li>\n<li><strong>kubelets<\/strong>: one server certificate per node, named after the node, and a client certificate named <code>system:node:&lt;node&gt;<\/code> in the <code>system:nodes<\/code> group.<\/li>\n<\/ul>","text":"Available tools: easyrsa, openssl , cfssl… The course uses openssl. Certificate Authority (CA) : key, certificate signing request (CSR), then a self-signed certificate. A client: the admin user . The CN is the name that appears in audit logs. This time, sign with the CA key: To tell an administrator from a regular user, add the system:masters group in the O field: Follow the same procedure for the other clients. System components are named with the system: prefix ( system:kube-scheduler , system:kube-controller-manager , system:kube-proxy ). Servers : ETCD server : in a cluster, members also have peer certificates to talk to each other. kube-apiserver : it is called kubernetes , kubernetes.default , kubernetes.default.svc , kubernetes.default.svc.cluster.local , or by its IP. All these names go in the subject alternative names ( alt_names section of an openssl.cnf file). kubelets : one server certificate per node, named after the node, and a client certificate named system:node:<node> in the system:nodes group.","minutes":3,"ncode":7},{"id":"07-view-certs","kind":"lesson","title":"View Certificate Details","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/08-View-Certificate-Details.md","html":"<p>Before troubleshooting, find out <strong>how the cluster was set up<\/strong>: the hard way (systemd services) or with <strong>kubeadm<\/strong> (static Pods). With kubeadm, the certificate paths are in <code>/etc/kubernetes/manifests/kube-apiserver.yaml<\/code>.<\/p>\n<p>View a certificate:<\/p>\n<pre><code class=\"language-bash\">$ openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text -noout\n<\/code><\/pre>\n<p>Check the <strong>Subject<\/strong> (CN), the <strong>alternative names<\/strong>, the <strong>expiry date<\/strong> (<em>Not After<\/em>) and the <strong>Issuer<\/strong> (it must be the right CA).<\/p>\n<div class=\"anim\" data-anim=\"certinspect\"><\/div>\n\n<p>Logs of a service set up the hard way:<\/p>\n<pre><code class=\"language-bash\">$ journalctl -u etcd.service -l\n<\/code><\/pre>\n<p>With kubeadm:<\/p>\n<pre><code class=\"language-bash\">$ kubectl logs etcd-master\n<\/code><\/pre>\n<p>If the kube-apiserver or ETCD is down, kubectl stops working: go one level down, to the runtime.<\/p>\n<pre><code class=\"language-bash\">$ docker ps -a\n$ docker logs &lt;container-id&gt;\n<\/code><\/pre>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">On containerd<\/p>\n<p>Use <code>crictl ps -a<\/code> and <code>crictl logs &lt;container-id&gt;<\/code> instead.<\/p>\n<\/div>","text":"Before troubleshooting, find out how the cluster was set up : the hard way (systemd services) or with kubeadm (static Pods). With kubeadm, the certificate paths are in /etc/kubernetes/manifests/kube-apiserver.yaml . View a certificate: Check the Subject (CN), the alternative names , the expiry date ( Not After ) and the Issuer (it must be the right CA). Logs of a service set up the hard way: With kubeadm: If the kube-apiserver or ETCD is down, kubectl stops working: go one level down, to the runtime. On containerd Use crictl ps -a and crictl logs <container-id> instead.","minutes":2,"ncode":4},{"id":"07-lab-6","kind":"lab","title":"Lab · View Certificate Details","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/10-Practice-Test-View-Certificate-Details.md","practice":"https://kodekloud.com/topic/practice-test-view-certificate-details/","items":[{"q":"Identify the certificate file used for the kube-api server","a":"<pre><code>$ cat /etc/kubernetes/manifest/kube-apiserver.yaml\n\nAnswer: /etc/kubernetes/pki/apiserver.crt\n<\/code><\/pre>"},{"q":"Identify the Certificate file used to authenticate kube-apiserver as a client to ETCD Server","a":"<pre><code>$ cat /etc/kubernetes/manifest/kube-apiserver.yaml\nAnswer: /etc/kubernetes/pki/apiserver-etcd-client.crt\n<\/code><\/pre>"},{"q":"Look for kubelet-client-key option in the file /etc/kubernetes/manifests/kube-apiserver.yaml","a":"<pre><code>Answer: /etc/kubernetes/pki/apiserver-kubelet-client.key\n<\/code><\/pre>"},{"q":"Look for cert file option in the file /etc/kubernetes/manifests/etcd.yaml","a":"<pre><code>Answer: /etc/kubernetes/pki/etcd/server.crt\n<\/code><\/pre>"},{"q":"Look for CA Certificate in file /etc/kubernetes/manifests/etcd.yaml","a":"<pre><code>Answer: /etc/kubernetes/pki/etcd/ca.crt\n<\/code><\/pre>"},{"q":"Run the command openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text","a":"<pre><code>$ openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text\n<\/code><\/pre>"},{"q":"Run the command openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text and look for issuer","a":"<pre><code>$ openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text \n<\/code><\/pre>"},{"q":"Run the command openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text and look at Alternative Names","a":"<pre><code>$ openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text\n<\/code><\/pre>"},{"q":"Run the command openssl x509 -in /etc/kubernetes/pki/etcd/server.crt -text and look for Subject CN.","a":"<pre><code>$ openssl x509 -in /etc/kubernetes/pki/etcd/server.crt -text\n<\/code><\/pre>"},{"q":"Run the command openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text and check on the Expiry date.","a":"<pre><code>$ openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text\n<\/code><\/pre>"},{"q":"Run the command &#x27;openssl x509 -in /etc/kubernetes/pki/ca.crt -text&#x27; and look for validity","a":"<pre><code>$ openssl x509 -in /etc/kubernetes/pki/ca.crt -text\n<\/code><\/pre>"},{"q":"Inspect the --cert-file option in the manifests file.","a":"<pre><code>$ vi /etc/kubernetes/manifests/etcd.yaml\n<\/code><\/pre>"},{"q":"ETCD has its own CA. The right CA must be used for the ETCD-CA file in /etc/kubernetes/manifests/kube-apiserver.yaml.","a":"<pre><code>View answer at /var/answers/kube-apiserver.yaml\n<\/code><\/pre>"}],"text":"Identify the certificate file used for the kube-api server Identify the Certificate file used to authenticate kube-apiserver as a client to ETCD Server Look for kubelet-client-key option in the file /etc/kubernetes/manifests/kube-apiserver.yaml Look for cert file option in the file /etc/kubernetes/manifests/etcd.yaml Look for CA Certificate in file /etc/kubernetes/manifests/etcd.yaml Run the command openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text Run the command openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text and look for issuer Run the command openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text and look at Alternative Names Run the command openssl x509 -in /etc/kubernetes/pki/etcd/server.crt -text and look for Subject CN. Run the command openssl x509 -in /etc/kubernetes/pki/apiserver.crt -text and check on the Expiry date. Run the command 'openssl x509 -in /etc/kubernetes/pki/ca.crt -text' and look for validity Inspect the --cert-file option in the manifests file. ETCD has its own CA. The right CA must be used for the ETCD-CA file in /etc/kubernetes/manifests/kube-apiserver.yaml.","minutes":13},{"id":"07-cert-api","kind":"lesson","title":"Certificates API","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/11-Certificate-API.md","html":"<p>The CA is just the pair of key and certificate files: <strong>whoever has them can sign any certificate<\/strong> for the cluster. They are kept on a secure server, often the master.<\/p>\n<p>When a new user joins, instead of logging in to the master to sign by hand, use the <strong>Certificates API<\/strong>: send a <strong>CertificateSigningRequest<\/strong> to Kubernetes, an administrator reviews and approves it, then the certificate is extracted and shared with the user.<\/p>\n<div class=\"anim\" data-anim=\"csrapi\"><\/div>\n\n<p>The user creates a key and a request:<\/p>\n<pre><code class=\"language-bash\">$ openssl genrsa -out jane.key 2048\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ openssl req -new -key jane.key -subj &quot;/CN=jane&quot; -out jane.csr\n<\/code><\/pre>\n<p>The administrator creates the object, with the base64-encoded content of <code>jane.csr<\/code> in <code>request<\/code>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: certificates.k8s.io/v1\nkind: CertificateSigningRequest\nmetadata:\n  name: jane\nspec:\n  groups:\n  - system:authenticated\n  usages:\n  - digital signature\n  - key encipherment\n  - client auth\n  signerName: kubernetes.io/kube-apiserver-client\n  request:\n    &lt;certificate-goes-here&gt;\n<\/code><\/pre>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Correction<\/p>\n<p>The repo uses <code>certificates.k8s.io/v1beta1<\/code> (removed in v1.22) and the <code>server auth<\/code> usage. In v1, the <code>signerName<\/code> field is required, and a user certificate needs the <code>client auth<\/code> usage.<\/p>\n<\/div>\n<pre><code class=\"language-bash\">$ cat jane.csr |base64\n$ kubectl create -f jane.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get csr\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl certificate approve jane\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get csr jane -o yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ echo &quot;&lt;certificate&gt;&quot; |base64 --decode\n<\/code><\/pre>\n<p>All certificate-related operations are carried out by the <strong>kube-controller-manager<\/strong> (<em>CSR-approving<\/em> and <em>CSR-signing<\/em> controllers). It needs the CA certificate and key, passed with <code>--cluster-signing-cert-file<\/code> and <code>--cluster-signing-key-file<\/code>.<\/p>\n<div class=\"admonition tip\">\n<p class=\"admonition-title\">Tip<\/p>\n<p>To encode the CSR on a single line: <code>cat jane.csr | base64 -w 0<\/code>. To reject: <code>kubectl certificate deny jane<\/code>.<\/p>\n<\/div>","text":"The CA is just the pair of key and certificate files: whoever has them can sign any certificate for the cluster. They are kept on a secure server, often the master. When a new user joins, instead of logging in to the master to sign by hand, use the Certificates API : send a CertificateSigningRequest to Kubernetes, an administrator reviews and approves it, then the certificate is extracted and shared with the user. The user creates a key and a request: The administrator creates the object, with the base64-encoded content of jane.csr in request : Correction The repo uses certificates.k8s.io/v1beta1 (removed in v1.22) and the server auth usage. In v1, the signerName field is required, and a user certificate needs the client auth usage. All certificate-related operations are carried out by the kube-controller-manager ( CSR-approving and CSR-signing controllers). It needs the CA certificate and key, passed with --cluster-signing-cert-file and --cluster-signing-key-file . Tip To encode the CSR on a single line: cat jane.csr | base64 -w 0 . To reject: kubectl certificate deny jane .","minutes":3,"ncode":8},{"id":"07-lab-8","kind":"lab","title":"Lab · Certificates API","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/12-Practice-Test-Certificates-API.md","practice":"https://kodekloud.com/topic/practice-test-certificates-api/","items":[{"q":"A new member akshay joined our team. He requires access to our cluster. The Certificate Signing Request is at the /root location.","a":"<pre><code>$ ls -l /root\n<\/code><\/pre>"},{"q":"View the answer at /var/answers/akshay-csr.yaml","a":"<pre><code>$ kubectl create -f /var/answers/akshay-csr.yaml\n<\/code><\/pre>"},{"q":"Run the command kubectl get csr","a":"<pre><code>$ kubectl get csr\n<\/code><\/pre>"},{"q":"Run the command kubectl certificate approve akshay","a":"<pre><code>$ kubectl certificate approve akshay\n<\/code><\/pre>"},{"q":"Run the command kubectl get csr","a":"<pre><code>$ kubectl get csr\n<\/code><\/pre>"},{"q":"Run the command kubectl get csr and look at the Requestor column","a":"<pre><code>$ kubectl get csr\n<\/code><\/pre>"},{"q":"The other CSR&#x27;s are requested during the TLS Bootstrapping process. We will discuss more about it later in the course when we go through the TLS bootstrap section.","a":""},{"q":"Run the command kubectl get csr","a":"<pre><code>$ kubectl get csr\n<\/code><\/pre>"},{"q":"Run the command kubectl get csr agent-smith -o yaml","a":"<pre><code>$ kubectl get csr agent-smith -o yaml\n<\/code><\/pre>"},{"q":"Run the command kubectl certificate deny agent-smith","a":"<pre><code>$ kubectl certificate deny agent-smith\n<\/code><\/pre>"},{"q":"Run the command kubectl delete csr agent-smith","a":"<pre><code>$ kubectl delete csr agent-smith\n<\/code><\/pre>"}],"text":"A new member akshay joined our team. He requires access to our cluster. The Certificate Signing Request is at the /root location. View the answer at /var/answers/akshay-csr.yaml Run the command kubectl get csr Run the command kubectl certificate approve akshay Run the command kubectl get csr Run the command kubectl get csr and look at the Requestor column The other CSR's are requested during the TLS Bootstrapping process. We will discuss more about it later in the course when we go through the TLS bootstrap section. Run the command kubectl get csr Run the command kubectl get csr agent-smith -o yaml Run the command kubectl certificate deny agent-smith Run the command kubectl delete csr agent-smith","minutes":11},{"id":"07-kubeconfig","kind":"lesson","title":"KubeConfig","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/13-kubeconfig.md","html":"<p>A client can query the API with curl by passing its certificate, key and the CA certificate. With kubectl you'd pass the same options (<code>--server<\/code>, <code>--client-key<\/code>, <code>--client-certificate<\/code>, <code>--certificate-authority<\/code>) on every command. Tedious, so they go into a <strong>kubeconfig<\/strong> file.<\/p>\n<pre><code class=\"language-bash\">$ kubectl get pods --kubeconfig config\n<\/code><\/pre>\n<p>By default, kubectl reads <code>$HOME/.kube/config<\/code>. The file has three sections:<\/p>\n<ul>\n<li><strong>clusters<\/strong>: the clusters you can access (development, production, cloud…);<\/li>\n<li><strong>users<\/strong>: the user accounts (admin, dev-user…) with their certificates;<\/li>\n<li><strong>contexts<\/strong>: which user is used to access which cluster (<code>admin@production<\/code>).<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"kubeconfig\"><\/div>\n\n<p>Example file (added from the course slides):<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Config\ncurrent-context: my-kube-admin@my-kube-playground\nclusters:\n- name: my-kube-playground\n  cluster:\n    certificate-authority: /etc/kubernetes/pki/ca.crt\n    server: <a target=\"_blank\" rel=\"noopener\" href=\"https://my-kube-playground:6443\" target=\"_blank\" rel=\"noopener\">https://my-kube-playground:6443<\/a>\ncontexts:\n- name: my-kube-admin@my-kube-playground\n  context:\n    cluster: my-kube-playground\n    user: my-kube-admin\n    namespace: finance\nusers:\n- name: my-kube-admin\n  user:\n    client-certificate: /etc/kubernetes/pki/users/admin.crt\n    client-key: /etc/kubernetes/pki/users/admin.key\n<\/code><\/pre>\n<p>View the file in use:<\/p>\n<pre><code class=\"language-bash\">$ kubectl config view\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl config view --kubeconfig=my-custom-config\n<\/code><\/pre>\n<p>Change the current context:<\/p>\n<pre><code class=\"language-bash\">$ kubectl config use-context &lt;context-name&gt;\nex:\n$ kubectl config use-context prod-user@production\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl config -h\n<\/code><\/pre>\n<p>A context can also set a default <strong>namespace<\/strong>. For certificates, prefer <strong>full paths<\/strong>, or embed the base64-encoded content directly with <code>certificate-authority-data<\/code>.<\/p>","text":"A client can query the API with curl by passing its certificate, key and the CA certificate. With kubectl you'd pass the same options ( --server , --client-key , --client-certificate , --certificate-authority ) on every command. Tedious, so they go into a kubeconfig file. By default, kubectl reads $HOME/.kube/config . The file has three sections: clusters : the clusters you can access (development, production, cloud…); users : the user accounts (admin, dev-user…) with their certificates; contexts : which user is used to access which cluster ( admin@production ). Example file (added from the course slides): View the file in use: Change the current context: A context can also set a default namespace . For certificates, prefer full paths , or embed the base64-encoded content directly with certificate-authority-data .","minutes":2,"ncode":6},{"id":"07-lab-10","kind":"lab","title":"Lab · KubeConfig","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/14-Practice-Test-KubeConfig.md","practice":"https://kodekloud.com/topic/practice-test-kubeconfig/","items":[{"q":"Look for the kube config file under <code>/root/.kube<\/code>","a":"<pre><code>$ ls -l /root/.kube\n<\/code><\/pre>"},{"q":"Run the kubectl config view command and count the number of clusters","a":"<pre><code>$ kubectl config view\n<\/code><\/pre>"},{"q":"Run the command <code>kubectl config view<\/code> and count the number of users","a":"<pre><code>$ kubectl config view\n<\/code><\/pre>"},{"q":"How many contexts are defined in the default kubeconfig file?","a":"<pre><code>$ kubectl config view\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl config view&#x27; and look for the user name.","a":"<pre><code>$ kubectl config view\n<\/code><\/pre>"},{"q":"What is the name of the cluster configured in the default kubeconfig file?","a":"<pre><code>$ kubectl config view\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl config view --kubeconfig my-kube-config&#x27;","a":"<pre><code>$ kubectl config view --kubeconfig my-kube-config\n<\/code><\/pre>"},{"q":"How many contexts are configured in the &#x27;my-kube-config&#x27; file?","a":"<pre><code>$ kubectl config view --kubeconfig my-kube-config\n<\/code><\/pre>"},{"q":"What user is configured in the &#x27;research&#x27; context?","a":"<pre><code>$ kubectl config view --kubeconfig my-kube-config\n<\/code><\/pre>"},{"q":"What is the name of the client-certificate file configured for the &#x27;aws-user&#x27;?","a":"<pre><code>$ kubectl config view --kubeconfig my-kube-config\n<\/code><\/pre>"},{"q":"What is the current context set to in the &#x27;my-kube-config&#x27; file?","a":"<pre><code>$ kubectl config view --kubeconfig my-kube-config\n<\/code><\/pre>"},{"q":"Run the command kubectl config --kubeconfig=/root/my-kube-config use-context research","a":"<pre><code>$ kubectl config --kubeconfig=/root/my-kube-config use-context research\n<\/code><\/pre>"},{"q":"Replace the contents in the default kubeconfig file with the content from my-kube-config file.","a":"<pre><code>$ mv .kube/config .kube/config.bak\n$ cp /root/my-kube-config .kube/config\n<\/code><\/pre>"},{"q":"The path to certificate is incorrect in the kubeconfig file. Fix it. All users certificates are stored at /etc/kubernetes/pki/users","a":"<p>$ kubectl get pods\nmaster $ ls\ndev-user.crt  dev-user.csr  dev-user.key\nmaster $ vi /root/.kube/config\nmaster $ grep dev-user.crt /root/.kube/config\nclient-certificate: /etc/kubernetes/pki/users/dev-user/dev-user.crt\nmaster $ pwd\n/etc/kubernetes/pki/users/dev-user\nmaster $ kubectl get pods\nNo resources found in default namespace.<\/p>"}],"text":"Look for the kube config file under /root/.kube Run the kubectl config view command and count the number of clusters Run the command kubectl config view and count the number of users How many contexts are defined in the default kubeconfig file? Run the command 'kubectl config view' and look for the user name. What is the name of the cluster configured in the default kubeconfig file? Run the command 'kubectl config view --kubeconfig my-kube-config' How many contexts are configured in the 'my-kube-config' file? What user is configured in the 'research' context? What is the name of the client-certificate file configured for the 'aws-user'? What is the current context set to in the 'my-kube-config' file? Run the command kubectl config --kubeconfig=/root/my-kube-config use-context research Replace the contents in the default kubeconfig file with the content from my-kube-config file. The path to certificate is incorrect in the kubeconfig file. Fix it. All users certificates are stored at /etc/kubernetes/pki/users","minutes":14},{"id":"07-api-groups","kind":"lesson","title":"API Groups","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/15-API-Groups.md","html":"<p>The Kubernetes API is grouped by purpose: <code>/version<\/code>, <code>/metrics<\/code>, <code>/healthz<\/code>, <code>/logs<\/code>, and above all <code>/api<\/code> and <code>/apis<\/code>.<\/p>\n<ul>\n<li><strong><code>/api<\/code><\/strong>: the <strong>core<\/strong> group, where the core functionality lives (pods, namespaces, services, nodes, configmaps, secrets, PVs, PVCs…).<\/li>\n<li><strong><code>/apis<\/code><\/strong>: the <strong>named groups<\/strong>, better organised. All newer features are made available there: <code>apps<\/code>, <code>extensions<\/code>, <code>networking.k8s.io<\/code>, <code>storage.k8s.io<\/code>, <code>certificates.k8s.io<\/code>…<\/li>\n<\/ul>\n<p>Each group contains <strong>resources<\/strong> (<code>deployments<\/code>, <code>replicasets<\/code>…) on which you perform <strong>verbs<\/strong> (<code>get<\/code>, <code>list<\/code>, <code>create<\/code>, <code>delete<\/code>, <code>update<\/code>, <code>watch<\/code>).<\/p>\n<div class=\"anim\" data-anim=\"apitree\"><\/div>\n\n<p>The API requires authentication: with curl, you pass the certificate files. A convenient alternative is to start <strong><code>kubectl proxy<\/code><\/strong>, which listens locally (port 8001) and uses the credentials from your kubeconfig.<\/p>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Don't mix them up<\/p>\n<p><strong>kube-proxy<\/strong> enables connectivity between Pods and Services across nodes. <strong>kubectl proxy<\/strong> is a local HTTP proxy that gives access to the kube-apiserver.<\/p>\n<\/div>\n<p>To find a resource's group: <code>kubectl api-resources<\/code>, or <code>kubectl explain &lt;resource&gt;<\/code>.<\/p>","text":"The Kubernetes API is grouped by purpose: /version , /metrics , /healthz , /logs , and above all /api and /apis . /api : the core group, where the core functionality lives (pods, namespaces, services, nodes, configmaps, secrets, PVs, PVCs…). /apis : the named groups , better organised. All newer features are made available there: apps , extensions , networking.k8s.io , storage.k8s.io , certificates.k8s.io … Each group contains resources ( deployments , replicasets …) on which you perform verbs ( get , list , create , delete , update , watch ). The API requires authentication: with curl, you pass the certificate files. A convenient alternative is to start kubectl proxy , which listens locally (port 8001) and uses the credentials from your kubeconfig. Don't mix them up kube-proxy enables connectivity between Pods and Services across nodes. kubectl proxy is a local HTTP proxy that gives access to the kube-apiserver. To find a resource's group: kubectl api-resources , or kubectl explain <resource> .","minutes":2,"ncode":0},{"id":"07-authorization","kind":"lesson","title":"Authorization","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/16-Authorization.md","html":"<p>An administrator can do everything:<\/p>\n<pre><code class=\"language-bash\">$ kubectl get nodes\n$ kubectl get pods\n$ kubectl delete node worker-2\n<\/code><\/pre>\n<p>But developers, testers or external tools should only have the access they need, sometimes only to their own namespace. Kubernetes supports several <strong>authorization mechanisms<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Principle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Node<\/strong><\/td>\n<td>Authorizes kubelets (<code>system:nodes<\/code> group) to read and write what concerns their node<\/td>\n<\/tr>\n<tr>\n<td><strong>ABAC<\/strong><\/td>\n<td>A JSON policy per user or group; the kube-apiserver must be restarted for every change<\/td>\n<\/tr>\n<tr>\n<td><strong>RBAC<\/strong><\/td>\n<td>Define roles, then associate users with them: the standard approach<\/td>\n<\/tr>\n<tr>\n<td><strong>Webhook<\/strong><\/td>\n<td>Delegate the decision to an external tool (Open Policy Agent…)<\/td>\n<\/tr>\n<tr>\n<td><strong>AlwaysAllow / AlwaysDeny<\/strong><\/td>\n<td>Allow or deny everything<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The mode is set with the kube-apiserver's <code>--authorization-mode<\/code> option (default <code>AlwaysAllow<\/code>; kubeadm sets <code>Node,RBAC<\/code>). With several modes, they are tried <strong>in the order specified<\/strong>: when a module denies, the request goes to the next; as soon as one approves, the request is allowed.<\/p>\n<div class=\"anim\" data-anim=\"authzchain\"><\/div>","text":"An administrator can do everything: But developers, testers or external tools should only have the access they need, sometimes only to their own namespace. Kubernetes supports several authorization mechanisms : Mode Principle Node Authorizes kubelets ( system:nodes group) to read and write what concerns their node ABAC A JSON policy per user or group; the kube-apiserver must be restarted for every change RBAC Define roles, then associate users with them: the standard approach Webhook Delegate the decision to an external tool (Open Policy Agent…) AlwaysAllow / AlwaysDeny Allow or deny everything The mode is set with the kube-apiserver's --authorization-mode option (default AlwaysAllow ; kubeadm sets Node,RBAC ). With several modes, they are tried in the order specified : when a module denies, the request goes to the next; as soon as one approves, the request is allowed.","minutes":2,"ncode":1},{"id":"07-rbac","kind":"lesson","title":"RBAC","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/17-RBAC.md","html":"<p>A <strong>Role<\/strong> defines permissions. Each rule has three sections: <strong>apiGroups<\/strong>, <strong>resources<\/strong> and <strong>verbs<\/strong>.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: developer\nrules:\n- apiGroups: [&quot;&quot;] # &quot;&quot; indicates the core API group\n  resources: [&quot;pods&quot;]\n  verbs: [&quot;get&quot;, &quot;list&quot;, &quot;update&quot;, &quot;delete&quot;, &quot;create&quot;]\n- apiGroups: [&quot;&quot;]\n  resources: [&quot;configmaps&quot;]\n  verbs: [&quot;create&quot;]\n<\/code><\/pre>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Correction<\/p>\n<p>The repo writes <code>resources: [\"ConfigMap\"]<\/code>. Resources are written in lowercase plural form: <code>configmaps<\/code>.<\/p>\n<\/div>\n<pre><code class=\"language-bash\">$ kubectl create -f developer-role.yaml\n<\/code><\/pre>\n<p>Then link a user to the role with a <strong>RoleBinding<\/strong>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: devuser-developer-binding\nsubjects:\n- kind: User\n  name: dev-user # &quot;name&quot; is case sensitive\n  apiGroup: rbac.authorization.k8s.io\nroleRef:\n  kind: Role\n  name: developer\n  apiGroup: rbac.authorization.k8s.io\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f devuser-developer-binding.yaml\n<\/code><\/pre>\n<p>Roles and RoleBindings fall under the <strong>scope of a namespace<\/strong> (the one set in <code>metadata<\/code>, <code>default<\/code> otherwise).<\/p>\n<div class=\"anim\" data-anim=\"rbac\"><\/div>\n\n<pre><code class=\"language-bash\">$ kubectl get roles\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get rolebindings\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl describe role developer\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl describe rolebinding devuser-developer-binding\n<\/code><\/pre>\n<p><strong>Check access<\/strong>:<\/p>\n<pre><code class=\"language-bash\">$ kubectl auth can-i create deployments\n$ kubectl auth can-i delete nodes\n<\/code><\/pre>\n<p>An administrator can impersonate a user:<\/p>\n<pre><code class=\"language-bash\">$ kubectl auth can-i create deployments --as dev-user\n$ kubectl auth can-i create pods --as dev-user\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl auth can-i create pods --as dev-user --namespace test\n<\/code><\/pre>\n<p><strong>Resource names<\/strong>: you can restrict access to specific objects.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: developer\nrules:\n- apiGroups: [&quot;&quot;] # &quot;&quot; indicates the core API group\n  resources: [&quot;pods&quot;]\n  verbs: [&quot;get&quot;, &quot;update&quot;, &quot;create&quot;]\n  resourceNames: [&quot;blue&quot;, &quot;orange&quot;]\n<\/code><\/pre>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">Imperatively<\/p>\n<p><code>kubectl create role developer --verb=list,create,delete --resource=pods<\/code> then <code>kubectl create rolebinding dev-user-binding --role=developer --user=dev-user<\/code>.<\/p>\n<\/div>","text":"A Role defines permissions. Each rule has three sections: apiGroups , resources and verbs . Correction The repo writes resources: [\"ConfigMap\"] . Resources are written in lowercase plural form: configmaps . Then link a user to the role with a RoleBinding : Roles and RoleBindings fall under the scope of a namespace (the one set in metadata , default otherwise). Check access : An administrator can impersonate a user: Resource names : you can restrict access to specific objects. Imperatively kubectl create role developer --verb=list,create,delete --resource=pods then kubectl create rolebinding dev-user-binding --role=developer --user=dev-user .","minutes":4,"ncode":12},{"id":"07-lab-14","kind":"lab","title":"Lab · RBAC","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/18-Practice-Test-RBAC.md","practice":"https://kodekloud.com/topic/practice-test-role-based-access-controls/","items":[{"q":"Run the command kubectl describe pod kube-apiserver-controlplane -n kube-system and look for --authorization-mode","a":"<pre><code>$ kubectl describe pod kube-apiserver-controlplane -n kube-system\n<\/code><\/pre>"},{"q":"Run the command kubectl get roles","a":"<pre><code>$ kubectl get roles\n<\/code><\/pre>"},{"q":"Run the command kubectl get roles --all-namespaces","a":"<pre><code>$ kubectl get roles --all-namespaces\n<\/code><\/pre>"},{"q":"Run the command kubectl describe role kube-proxy -n kube-system","a":"<pre><code>$ kubectl describe role kube-proxy -n kube-system\n<\/code><\/pre>"},{"q":"Check the verbs associated to the kube-proxy role","a":"<pre><code>$ kubectl describe role kube-proxy -n kube-system\n<\/code><\/pre>"},{"q":"Which of the following statements are true?","a":"<pre><code>kube-proxy role can get details of configmap object by the name kube-proxy\n<\/code><\/pre>"},{"q":"Run the command kubectl describe rolebinding kube-proxy -n kube-system","a":"<pre><code>$ kubectl describe rolebinding kube-proxy -n kube-system\n<\/code><\/pre>"},{"q":"Run the command kubectl get pods --as dev-user","a":"<pre><code>$ kubectl get pods --as dev-user\n<\/code><\/pre>"},{"q":"Answer file located at /var/answers","a":"<pre><code>$ kubectl create -f /var/answers/developer-role.yaml\n<\/code><\/pre>"},{"q":"New roles and role bindings are created in the blue namespace. Check it out. Check the resourceNames configured on the role","a":"<pre><code>$ kubectl get roles,rolebindings -n blue\n$ kubectl describe role developer -n blue\n$ kubectl edit role developer -n blue (update the resourceNames)\n<\/code><\/pre>"},{"q":"View the answer file located at /var/answers/dev-user-deploy.yaml","a":"<pre><code>$ kubectl create -f /var/answers/dev-user-deploy.yaml\n<\/code><\/pre>"}],"text":"Run the command kubectl describe pod kube-apiserver-controlplane -n kube-system and look for --authorization-mode Run the command kubectl get roles Run the command kubectl get roles --all-namespaces Run the command kubectl describe role kube-proxy -n kube-system Check the verbs associated to the kube-proxy role Which of the following statements are true? Run the command kubectl describe rolebinding kube-proxy -n kube-system Run the command kubectl get pods --as dev-user Answer file located at /var/answers New roles and role bindings are created in the blue namespace. Check it out. Check the resourceNames configured on the role View the answer file located at /var/answers/dev-user-deploy.yaml","minutes":11},{"id":"07-cluster-roles","kind":"lesson","title":"Cluster Roles","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/19-Cluster-Roles.md","html":"<p>Roles and RoleBindings are <strong>namespaced<\/strong>. But some resources don't belong to any namespace: nodes, PersistentVolumes, ClusterRoles, CertificateSigningRequests, namespaces themselves… They are <strong>cluster-scoped<\/strong>.<\/p>\n<pre><code class=\"language-bash\">$ kubectl api-resources --namespaced=true\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl api-resources --namespaced=false\n<\/code><\/pre>\n<p>To grant access to these resources, use a <strong>ClusterRole<\/strong> and a <strong>ClusterRoleBinding<\/strong>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: cluster-administrator\nrules:\n- apiGroups: [&quot;&quot;] # &quot;&quot; indicates the core API group\n  resources: [&quot;nodes&quot;]\n  verbs: [&quot;get&quot;, &quot;list&quot;, &quot;delete&quot;, &quot;create&quot;]\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n  name: cluster-admin-role-binding\nsubjects:\n- kind: User\n  name: cluster-admin\n  apiGroup: rbac.authorization.k8s.io\nroleRef:\n  kind: ClusterRole\n  name: cluster-administrator\n  apiGroup: rbac.authorization.k8s.io\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f cluster-admin-role.yaml\n$ kubectl create -f cluster-admin-role-binding.yaml\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"scope\"><\/div>\n\n<p>A ClusterRole can also target <strong>namespaced<\/strong> resources (Pods, for example): the user then has access to them <strong>across all namespaces<\/strong>.<\/p>","text":"Roles and RoleBindings are namespaced . But some resources don't belong to any namespace: nodes, PersistentVolumes, ClusterRoles, CertificateSigningRequests, namespaces themselves… They are cluster-scoped . To grant access to these resources, use a ClusterRole and a ClusterRoleBinding : A ClusterRole can also target namespaced resources (Pods, for example): the user then has access to them across all namespaces .","minutes":2,"ncode":5},{"id":"07-lab-16","kind":"lab","title":"Lab · Cluster Roles","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/20-Practice-Test-Cluster-Roles.md","practice":"https://kodekloud.com/topic/practice-test-cluster-roles/","items":[{"q":"Run the command kubectl get clusterroles --no-headers | wc -l or kubectl get clusterroles --no-headers -o json | jq &#x27;.items | length&#x27;","a":"<pre><code>$ kubectl get clusterroles --no-headers | wc -l (or)\n$ kubectl get clusterroles --no-headers -o json | jq '.items | length'\n<\/code><\/pre>"},{"q":"Run the command kubectl get clusterrolebindings --no-headers | wc -l or kubectl get clusterrolebindings --no-headers -o json | jq &#x27;.items | length&#x27;","a":"<pre><code>$ kubectl get clusterrolebindings --no-headers | wc -l (or)\n$ kubectl get clusterrolebindings --no-headers -o json | jq '.items | length'\n<\/code><\/pre>"},{"q":"What namespace is the cluster-admin clusterrole part of?","a":"<pre><code>$ Cluster roles are cluster wide and not part of any namespace\n<\/code><\/pre>"},{"q":"Run the command kubectl describe clusterrolebinding cluster-admin","a":"<pre><code>$ kubectl describe clusterrolebinding cluster-admin\n<\/code><\/pre>"},{"q":"Run the command kubectl describe clusterrole cluster-admin","a":"<pre><code>$ kubectl describe clusterrole cluster-admin\n<\/code><\/pre>"},{"q":"Check answer at /var/answers","a":"<pre><code>$ kubectl create -f /var/answers/michelle-node-admin.yaml\n<\/code><\/pre>"},{"q":"Check answer at /var/answers","a":"<pre><code>$ kubectl create -f /var/answers/michelle-storage-admin.yaml\n<\/code><\/pre>"}],"text":"Run the command kubectl get clusterroles --no-headers | wc -l or kubectl get clusterroles --no-headers -o json | jq '.items | length' Run the command kubectl get clusterrolebindings --no-headers | wc -l or kubectl get clusterrolebindings --no-headers -o json | jq '.items | length' What namespace is the cluster-admin clusterrole part of? Run the command kubectl describe clusterrolebinding cluster-admin Run the command kubectl describe clusterrole cluster-admin Check answer at /var/answers Check answer at /var/answers","minutes":7},{"id":"07-service-accounts","kind":"lesson","title":"Service Accounts","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/21-Service-Account.md","html":"<p>Kubernetes has two kinds of users: <strong>humans<\/strong> (through kubectl) and <strong>bots/applications<\/strong> (Prometheus, Jenkins, other applications). <strong>Service accounts<\/strong> authenticate the latter to the kube-apiserver.<\/p>\n<p>To query the API from within a Pod, the Pod must authenticate. Every namespace has a <strong><code>default<\/code><\/strong> service account, assigned automatically to Pods that don't specify one. Its token is mounted in the Pod at <code>/var/run/secrets/kubernetes.io/serviceaccount/token<\/code>.<\/p>\n<p>Use another service account:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: myapp-pod\nspec:\n  serviceAccountName: myapp-service-account\n<\/code><\/pre>\n<p>Opt out of automounting:<\/p>\n<pre><code class=\"language-yaml\">spec:\n  automountServiceAccountToken: false\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"satoken\"><\/div>\n\n<p><strong>How tokens evolved<\/strong>:<\/p>\n<ul>\n<li><strong>Before v1.22<\/strong>: creating a service account created a Secret holding a token with <strong>no expiry<\/strong> and no audience.<\/li>\n<li><strong>v1.22<\/strong>: the <strong>TokenRequest API<\/strong> issues tokens that are <strong>audience-bound<\/strong>, <strong>time-bound<\/strong> (1 hour by default) and <strong>object-bound<\/strong> (to the Pod). They are injected through a <strong>projected volume<\/strong> and aren't readable by other API clients.<\/li>\n<li><strong>v1.24<\/strong> (KEP-2799): token Secrets are no longer created automatically. Request a token manually:<\/li>\n<\/ul>\n<pre><code class=\"language-bash\"> kubectl create token &lt;serviceaccount&gt;\n<\/code><\/pre>\n<p>Only create a non-expiring token Secret if you can't use the TokenRequest API. In that case, create the service account, then a Secret of type <code>kubernetes.io/service-account-token<\/code> with the annotation <code>kubernetes.io/service-account.name: &lt;serviceaccountname&gt;<\/code>.<\/p>\n<div class=\"admonition tip\">\n<p class=\"admonition-title\">Reminder<\/p>\n<p>A service account on its own grants nothing: give it permissions with a Role and a RoleBinding (subject <code>kind: ServiceAccount<\/code>).<\/p>\n<\/div>","text":"Kubernetes has two kinds of users: humans (through kubectl) and bots/applications (Prometheus, Jenkins, other applications). Service accounts authenticate the latter to the kube-apiserver. To query the API from within a Pod, the Pod must authenticate. Every namespace has a default service account, assigned automatically to Pods that don't specify one. Its token is mounted in the Pod at /var/run/secrets/kubernetes.io/serviceaccount/token . Use another service account: Opt out of automounting: How tokens evolved : Before v1.22 : creating a service account created a Secret holding a token with no expiry and no audience. v1.22 : the TokenRequest API issues tokens that are audience-bound , time-bound (1 hour by default) and object-bound (to the Pod). They are injected through a projected volume and aren't readable by other API clients. v1.24 (KEP-2799): token Secrets are no longer created automatically. Request a token manually: Only create a non-expiring token Secret if you can't use the TokenRequest API. In that case, create the service account, then a Secret of type kubernetes.io/service-account-token with the annotation kubernetes.io/service-account.name: <serviceaccountname> . Reminder A service account on its own grants nothing: give it permissions with a Role and a RoleBinding (subject kind: ServiceAccount ).","minutes":2,"ncode":3},{"id":"07-lab-18","kind":"lab","title":"Lab · Service Accounts","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/22-Practice-Test-Service-Accounts.md","practice":"https://uklabs.kodekloud.com/topic/practice-test-service-accounts-2/","items":[{"q":"How many service accounts exist in the default namespace?","a":"<p>Run the command <code>kubectl get serviceaccounts<\/code> and count the number of accounts.<\/p>"},{"q":"What is the secret token used by the default service account?","a":"<p>Run the command <code>kubectl describe serviceaccount default<\/code> and look at the <code>Tokens<\/code> field.<\/p>\n<blockquote>\n<p><code>none<\/code><\/p>\n<\/blockquote>\n<p><\/dtails><\/p>\n<p>1.\nWe just deployed the Dashboard application. Inspect the deployment. What is the image used by the deployment?<\/p>\n<p>Run the command <code>kubectl describe deployment<\/code> and look at the <code>Image<\/code> field<\/p>\n<blockquote>\n<p><code>gcr.io/kodekloud/customimage/my-kubernetes-dashboard<\/code><\/p>\n<\/blockquote>"},{"q":"Information only.","a":""},{"q":"What is the state of the dashboard? Have the pod details loaded successfully?","a":"<p>Open the <code>web-dashboard<\/code> link located above the terminal and inspect the status. We can see an error message, therefore the status is...<\/p>\n<blockquote>\n<p><code>Failed<\/code><\/p>\n<\/blockquote>"},{"q":"What type of account does the Dashboard application use to query the Kubernetes API?","a":"<p>As evident from the error in the web-dashboard UI, the pod makes use of a service account to query the Kubernetes API.<\/p>\n<blockquote>\n<p>Service Account<\/p>\n<\/blockquote>"},{"q":"Which account does the Dashboard application use to query the Kubernetes API?","a":"<p>To find this, we need to insect the YAML of the running pod. The correct field for specifying a pod's service account is <code>serviceAccountName<\/code>. To save looking at <em>all<\/em> the YAML, we can use <code>grep<\/code> command to extract only that field:<\/p>\n<pre><code>kubectl get po -o yaml | grep 'serviceAccountName:'\n<\/code><\/pre>\n<p>You could also do it with JSONPath. First get the name of the pod using <code>kubectl get pods<\/code>. It will be different each time you run this lab. Then the command is e.g.<\/p>\n<pre><code>kubectl get po web-dashboard-65b9cf6cbb-79vbs -o jsonpath='{.spec.serviceAccountName}'\n<\/code><\/pre>\n<blockquote>\n<p><code>default<\/code><\/p>\n<\/blockquote>"},{"q":"Inspect the Dashboard Application POD and identify the Service Account mounted on it.","a":"<p>This is the same as the previous question.<\/p>\n<blockquote>\n<p><code>default<\/code><\/p>\n<\/blockquote>"},{"q":"At what location is the ServiceAccount credentials available within the pod?","a":"<p>Know that service account tokens are mounted in pods as a volume mount, so it is the <code>volumeMounts<\/code> section in which we look.<\/p>\n<pre><code>kubectl describe pod\n<\/code><\/pre>\n<p>Find the <code>Mounts<\/code> section which represents mounted volumes, and you will see a path to the mounted service account. From the anwsers, choose the one with the correct path prefix<\/p>\n<blockquote>\n<p><code>/var/run/secrets<\/code><\/p>\n<\/blockquote>"},{"q":"Create a new ServiceAccount named &lt;b&gt;dashboard-sa&lt;/b&gt;.","a":"<p>Run the command <code>kubectl create serviceaccount dashboard-sa<\/code><\/p>"},{"q":"Information only","a":""},{"q":"Now we are going to test the service account&#x27;s access to the dashboard.","a":""},{"q":"Generate a token","a":"<pre><code>kubectl create token dashboard-sa\n<\/code><\/pre>\n<p>This will generate a long string of characters.<\/p>"},{"q":"Select all the output using your mouse and copy it.","a":""},{"q":"Return to the dashboard UI, and paste this to the <code>Token<\/code> field","a":""},{"q":"Press Load Dashboard. It should now display the pod","a":""},{"q":"Edit the deployment to change ServiceAccount from &lt;b&gt;default&lt;/b&gt; to &lt;b&gt;dashboard-sa&lt;/b&gt;.","a":"<ol>\n<li>Use command <code>kubectl edit deployment web-dashboard<\/code>, which opens the running deployment in <code>vi<\/code><\/li>\n<li>Move dowm to the deployment spec and insert the service account as shown:<\/li>\n<\/ol>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  annotations:\n    deployment.kubernetes.io/revision: &quot;2&quot;\n  creationTimestamp: &quot;2023-02-21T19:29:21Z&quot;\n  generation: 2\n  name: web-dashboard\n  namespace: default\n  resourceVersion: &quot;1499&quot;\n  uid: ac5a26bf-7a88-41cc-8db3-d5a4bd2ad31c\nspec:\n  progressDeadlineSeconds: 600\n  replicas: 1\n  revisionHistoryLimit: 10\n  selector:\n    matchLabels:\n      name: web-dashboard\n  strategy:\n    rollingUpdate:\n      maxSurge: 25%\n      maxUnavailable: 25%\n    type: RollingUpdate\n  template:\n    metadata:\n      creationTimestamp: null\n      labels:\n        name: web-dashboard\n    spec:\n      serviceAccountName: dashboard-sa    # &lt;- Insert this line\n      containers:\n      - env:\n        - name: PYTHONUNBUFFERED\n          value: &quot;1&quot;\n        image: gcr.io/kodekloud/customimage/my-kubernetes-dashboard\n        imagePullPolicy: Always\n        name: web-dashboard\n        ports:\n        - containerPort: 8080\n          protocol: TCP\n<\/code><\/pre>\n<ol>\n<li>Save and exit <code>vi<\/code>. The deployment will be updated<\/li>\n<\/ol>"},{"q":"Reload the dashboard and verify it works without pasting a token.","a":""}],"text":"How many service accounts exist in the default namespace? What is the secret token used by the default service account? Information only. What is the state of the dashboard? Have the pod details loaded successfully? What type of account does the Dashboard application use to query the Kubernetes API? Which account does the Dashboard application use to query the Kubernetes API? Inspect the Dashboard Application POD and identify the Service Account mounted on it. At what location is the ServiceAccount credentials available within the pod? Create a new ServiceAccount named <b>dashboard-sa<\/b>. Information only Now we are going to test the service account's access to the dashboard. Generate a token Select all the output using your mouse and copy it. Return to the dashboard UI, and paste this to the Token field Press Load Dashboard. It should now display the pod Edit the deployment to change ServiceAccount from <b>default<\/b> to <b>dashboard-sa<\/b>. Reload the dashboard and verify it works without pasting a token.","minutes":17},{"id":"07-image-security","kind":"lesson","title":"Image Security","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/23-Image-Security.md","html":"<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx-pod\nspec:\n  containers:\n  - name: nginx\n    image: nginx\n<\/code><\/pre>\n<p>The name <code>nginx<\/code> is short for <strong><code>docker.io/library/nginx<\/code><\/strong>: registry (<code>docker.io<\/code>), user account (<code>library<\/code> for official images), image repository (<code>nginx<\/code>). Other registries exist: <code>gcr.io<\/code> (Google), <code>registry.k8s.io<\/code>, or a <strong>private registry<\/strong>.<\/p>\n<div class=\"anim\" data-anim=\"imagename\"><\/div>\n\n<p>With Docker, you log in and then run the image:<\/p>\n<pre><code class=\"language-bash\">$ docker login private-registry.io\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ docker run private-registry.io/apps/internal-app\n<\/code><\/pre>\n<p>In Kubernetes, the container runtime on the worker nodes pulls the image. Pass it the credentials in a Secret of type <strong>docker-registry<\/strong>:<\/p>\n<pre><code class=\"language-bash\">$ kubectl create secret docker-registry regcred \\\n  --docker-server=private-registry.io \\\n  --docker-username=registry-user \\\n  --docker-password=registry-password \\\n  --docker-email=registry-user@org.com\n<\/code><\/pre>\n<p>Then reference it in the Pod with <strong><code>imagePullSecrets<\/code><\/strong>:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx-pod\nspec:\n  containers:\n  - name: nginx\n    image: private-registry.io/apps/internal-app\n  imagePullSecrets:\n  - name: regcred\n<\/code><\/pre>","text":"The name nginx is short for docker.io/library/nginx : registry ( docker.io ), user account ( library for official images), image repository ( nginx ). Other registries exist: gcr.io (Google), registry.k8s.io , or a private registry . With Docker, you log in and then run the image: In Kubernetes, the container runtime on the worker nodes pulls the image. Pass it the credentials in a Secret of type docker-registry : Then reference it in the Pod with imagePullSecrets :","minutes":2,"ncode":5},{"id":"07-lab-20","kind":"lab","title":"Lab · Image Security","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/24-Practice-Test-Image-Security.md","practice":"https://kodekloud.com/topic/practice-test-image-security/","items":[{"q":"We have an application running on our cluster. Let us explore it first. What image is the application using?","a":"<pre><code>$ kubectl get deploy -o wide\n<\/code><\/pre>"},{"q":"Use the kubectl edit deployment command to edit the image name to myprivateregistry.com:5000/nginx:alpine","a":"<pre><code>$ kubectl edit deployment web\n<\/code><\/pre>"},{"q":"Run the command kubectl get pods command and check the status of the pods","a":"<pre><code>$ kubectl get pods\n<\/code><\/pre>"},{"q":"Run command kubectl create secret docker-registry private-reg-cred --docker-username=dock_user --docker-password=dock_password --docker-server=myprivateregistry.com:5000 --docker-email=dock_user@myprivateregistry.com","a":"<pre><code>$ kubectl create secret docker-registry private-reg-cred --docker-username=dock_user --docker-password=dock_password --docker-server=myprivateregistry.com:5000 --docker-email=dock_user@myprivateregistry.com\n<\/code><\/pre>"},{"q":"Edit deployment using kubectl edit deploy web command and add imagePullSecrets section. Use private-reg-cred","a":"<pre><code>$ kubectl edit deploy web\n<\/code><\/pre>"},{"q":"Check the status of PODs. Wait for them to be running. You have now successfully configured a Deployment to pull images from the private registry","a":"<pre><code>$ kubectl get pods\n<\/code><\/pre>"}],"text":"We have an application running on our cluster. Let us explore it first. What image is the application using? Use the kubectl edit deployment command to edit the image name to myprivateregistry.com:5000/nginx:alpine Run the command kubectl get pods command and check the status of the pods Run command kubectl create secret docker-registry private-reg-cred --docker-username=dock_user --docker-password=dock_password --docker-server=myprivateregistry.com:5000 --docker-email=dock_user@myprivateregistry.com Edit deployment using kubectl edit deploy web command and add imagePullSecrets section. Use private-reg-cred Check the status of PODs. Wait for them to be running. You have now successfully configured a Deployment to pull images from the private registry","minutes":6},{"id":"07-security-context","kind":"lesson","title":"Security Contexts","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/25-Security-Context.md","html":"<p>With Docker, you can choose the user a container runs as, or add Linux <strong>capabilities<\/strong>:<\/p>\n<pre><code class=\"language-bash\">$ docker run --user=1001 ubuntu sleep 3600\n$ docker run --cap-add MAC_ADMIN ubuntu\n<\/code><\/pre>\n<p>In Kubernetes, these settings are configured at the <strong>Pod<\/strong> level (they apply to all its containers) or the <strong>container<\/strong> level. Container-level settings <strong>override<\/strong> Pod-level ones.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: web-pod\nspec:\n  securityContext:\n    runAsUser: 1000\n  containers:\n  - name: ubuntu\n    image: ubuntu\n    command: [&quot;sleep&quot;, &quot;3600&quot;]\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: web-pod\nspec:\n  containers:\n  - name: ubuntu\n    image: ubuntu\n    command: [&quot;sleep&quot;, &quot;3600&quot;]\n    securityContext:\n      runAsUser: 1000\n<\/code><\/pre>\n<p><strong>Capabilities<\/strong> are only supported at the <strong>container<\/strong> level:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: web-pod\nspec:\n  containers:\n  - name: ubuntu\n    image: ubuntu\n    command: [&quot;sleep&quot;, &quot;3600&quot;]\n    securityContext:\n      runAsUser: 1000\n      capabilities:\n        add: [&quot;MAC_ADMIN&quot;]\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"secctx\"><\/div>","text":"With Docker, you can choose the user a container runs as, or add Linux capabilities : In Kubernetes, these settings are configured at the Pod level (they apply to all its containers) or the container level. Container-level settings override Pod-level ones. Capabilities are only supported at the container level:","minutes":2,"ncode":4},{"id":"07-lab-22","kind":"lab","title":"Lab · Security Contexts","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/26-Practice-Test-Security-Context.md","practice":"https://kodekloud.com/topic/practice-test-security-contexts/","items":[{"q":"Run the command &#x27;kubectl exec ubuntu-sleeper -- whoami&#x27; and count the number of pods.","a":"<pre><code>$ kubectl exec ubuntu-sleeper whoami\n<\/code><\/pre>"},{"q":"Set a security context to run as user 1010.","a":"<pre><code>$ kubectl get pods ubuntu-sleeper -o yaml &gt; ubuntu.yaml\n$ kubectl delete pod ubuntu-sleeper\n$ vi ubuntu.yaml ( add securityContext Section)\n  securityContext:\n    runAsUser: 1010\n$ kubectl create -f ubuntu.yaml\n<\/code><\/pre>"},{"q":"The User ID defined in the securityContext of the container overrides the User ID in the POD.","a":""},{"q":"The User ID defined in the securityContext of the POD is carried over to all the PODs in the container.","a":""},{"q":"Run kubectl exec -it ubuntu-sleeper -- date -s &#x27;19 APR 2012 11:14:00&#x27;","a":"<pre><code>$ kubectl exec -it ubuntu-sleeper -- date -s '19 APR 2012 11:14:00'\n<\/code><\/pre>"},{"q":"Add SYS_TIME capability to the container&#x27;s securityContext","a":"<pre><code>$ kubectl get pods ubuntu-sleeper -o yaml &gt; ubuntu.yaml\n$ kubectl delete pod ubuntu-sleeper\n$ vi ubuntu.yaml\n\nUnder container section add the below\n\nsecurityContext:\n    capabilities:\n      add: [&quot;SYS_TIME&quot;]\n\n$ kubectl create -f ubuntu.yaml\n<\/code><\/pre>"},{"q":"Now try to run the below command in the pod to set the date. If the security capability was added correctly, it should work. If it doesn&#x27;t make sure you changed the user back to root.","a":"<pre><code>$ kubectl exec -it ubuntu-sleeper -- date -s '19 APR 2012 11:14:00'\n<\/code><\/pre>"}],"text":"Run the command 'kubectl exec ubuntu-sleeper -- whoami' and count the number of pods. Set a security context to run as user 1010. The User ID defined in the securityContext of the container overrides the User ID in the POD. The User ID defined in the securityContext of the POD is carried over to all the PODs in the container. Run kubectl exec -it ubuntu-sleeper -- date -s '19 APR 2012 11:14:00' Add SYS_TIME capability to the container's securityContext Now try to run the below command in the pod to set the date. If the security capability was added correctly, it should work. If it doesn't make sure you changed the user back to root.","minutes":7},{"id":"07-network-policies","kind":"lesson","title":"Network Policies","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/27-Network-Policies.md","html":"<p>Take three tiers: a web server (port 80), an API server (port 5000) and a database server (port 3306). For each component, <strong>incoming<\/strong> traffic is <strong>ingress<\/strong> and <strong>outgoing<\/strong> traffic is <strong>egress<\/strong>. Replies don't count: what matters is the direction in which the connection is opened.<\/p>\n<p>By default, Kubernetes applies an <strong>\"All Allow\"<\/strong> rule: every Pod can reach every Pod and Service. A <strong>NetworkPolicy<\/strong> is attached to Pods (via labels) and only lets through the traffic it describes.<\/p>\n<p>Goal: the database only accepts the API Pod, on port 3306.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n name: db-policy\nspec:\n  podSelector:\n    matchLabels:\n      role: db\n  policyTypes:\n  - Ingress\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels:\n          role: api-pod\n    ports:\n    - protocol: TCP\n      port: 3306\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f policy-definition.yaml\n<\/code><\/pre>\n<p>Send packets and turn the policy on:<\/p>\n<div class=\"anim\" data-anim=\"netpol\"><\/div>\n\n<ul>\n<li>Only the traffic types listed in <code>policyTypes<\/code> are isolated. Here, the database's egress stays open.<\/li>\n<li>Allowing ingress from the API Pod is enough: the reply goes back automatically.<\/li>\n<li>In <code>from<\/code>, you can combine <code>podSelector<\/code>, <code>namespaceSelector<\/code> (restrict to a namespace) and <code>ipBlock<\/code> (an IP range outside the cluster). Several selectors in the same list item act as <strong>AND<\/strong>; separate list items act as <strong>OR<\/strong>.<\/li>\n<\/ul>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Depends on the network solution<\/p>\n<p>Network Policies are enforced by the network solution. <strong>Calico, Cilium, Kube-router, Romana and Weave-net<\/strong> support them; <strong>Flannel<\/strong> doesn't. With Flannel you can create the policy, but it won't be enforced, and you get no error.<\/p>\n<\/div>","text":"Take three tiers: a web server (port 80), an API server (port 5000) and a database server (port 3306). For each component, incoming traffic is ingress and outgoing traffic is egress . Replies don't count: what matters is the direction in which the connection is opened. By default, Kubernetes applies an \"All Allow\" rule: every Pod can reach every Pod and Service. A NetworkPolicy is attached to Pods (via labels) and only lets through the traffic it describes. Goal: the database only accepts the API Pod, on port 3306. Send packets and turn the policy on: Only the traffic types listed in policyTypes are isolated. Here, the database's egress stays open. Allowing ingress from the API Pod is enough: the reply goes back automatically. In from , you can combine podSelector , namespaceSelector (restrict to a namespace) and ipBlock (an IP range outside the cluster). Several selectors in the same list item act as AND ; separate list items act as OR . Depends on the network solution Network Policies are enforced by the network solution. Calico, Cilium, Kube-router, Romana and Weave-net support them; Flannel doesn't. With Flannel you can create the policy, but it won't be enforced, and you get no error.","minutes":2,"ncode":2},{"id":"07-lab-24","kind":"lab","title":"Lab · Network Policies","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/28-Practice-Test-Network-Policies.md","practice":"https://kodekloud.com/topic/practice-test-network-policies/","items":[{"q":"Run the command &#x27;kubectl get networkpolicy&#x27;","a":"<pre><code>$ kubectl get networkpolicy\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl get networkpolicy&#x27;","a":"<pre><code>$ kubectl get networkpolicy\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl get networkpolicy&#x27; and look under pod selector","a":"<pre><code>$ kubectl get networkpolicy\n<\/code><\/pre>"},{"q":"Run the command &#x27;kubectl describe networkpolicy&#x27; and look under PolicyTypes","a":"<pre><code>$ kubectl describe networkpolicy\n<\/code><\/pre>"},{"q":"What is the impact of the rule configured on this Network Policy?","a":"<pre><code>Traffic from internal to payroll pod is blocked\n<\/code><\/pre>"},{"q":"What is the impact of the rule conf
