/* --- authorization chain --- */
A.authzchain = el => {
  const F = widget(el, "--authorization-mode=Node,RBAC,Webhook", 440, 170);
  const reqs = {
    kubelet: { l:"system:node:node01 reads its Pods", d:["ok"] },
    dev: { l:"dev-user lists Pods (Role exists)", d:["no","ok"] },
    ext: { l:"user-x creates a Deployment (no Role)", d:["no","no","ok"] },
    none: { l:"user-y deletes a node (nobody approves)", d:["no","no","no"] },
  };
  const row = ctlRow(F, `<label>Request <select id="azR">${sel(Object.fromEntries(Object.entries(reqs).map(([k,v])=>[k,v.l])),"dev")}</select></label>`, true);
  F.ctl.remove();
  let gen = 0;
  const run = async () => {
    const my = ++gen, K = F.redraw(), r = reqs[row.querySelector("#azR").value];
    const mods = ["Node","RBAC","Webhook"].map((m,i) => K.box(null, 96 + i*112, 60, 96, 46, m, { cls:"boxa" }));
    K.box(null, 6, 64, 70, 38, "request", { cls:"boxs", tcls:"ts" });
    const res = K.text(null, 220, 150, "", "t tb");
    F.cap.innerHTML = "Modules are consulted <strong>in order</strong>. A denial passes the request to the next module; an approval ends the chain.";
    let x0 = 76;
    for (let i=0;i<r.d.length;i++){
      await K.packet([[x0,83],[96 + i*112,83]]); if (my !== gen) return;
      const ok = r.d[i] === "ok";
      mods[i].querySelector("rect").setAttribute("class", ok ? "boxok" : "boxbad");
      K.text(null, 144 + i*112, 124, ok ? "approves" : "denies", "ts " + (ok ? "tok" : "tbad"));
      if (ok) { res.textContent = "Allowed"; res.setAttribute("class","t tb tok"); return; }
      x0 = 192 + i*112;
      await K.sleep(250);
    }
    res.textContent = "Denied (403 Forbidden)"; res.setAttribute("class","t tb tbad");
  };
  row.addEventListener("change", run); run();
};

  const res = K.text(null, 220, 194, "", "t tb");
  const row = ctlRow(F, `<label><input type="checkbox" id="rtA"> route on A</label><label><input type="checkbox" id="rtC"> route on C</label><label><input type="checkbox" id="rtF"> ip_forward=1 on B</label><button class="cbtn pri" id="rtGo">ping 192.168.2.5 from A</button>`);
  const pre = document.createElement("pre"); pre.className = "term"; pre.style.minHeight = "0"; row.after(pre);
  F.ctl.remove();
  const cmds = () => { const r = []; if (row.querySelector("#rtA").checked) r.push("A$ ip route add 192.168.2.0/24 via 192.168.1.6"); if (row.querySelector("#rtC").checked) r.push("C$ ip route add 192.168.1.0/24 via 192.168.2.6"); if (row.querySelector("#rtF").checked) r.push("B$ echo 1 > /proc/sys/net/ipv4/ip_forward"); pre.textContent = r.join("\n") || "# nothing configured"; };
  row.addEventListener("change", cmds); cmds();

    res.textContent = "";
    if (!rA) { await K.packet([[138,103],[160,103]], { color:"var(--bad)" }); res.textContent = "Network is unreachable: A doesn't know where to send it"; res.setAttribute("class","t tb tbad"); return; }

  r.vl = [x.label(null, 165, 62, "veth-red", "boxs"), x.label(null, 275, 62, "veth-blue", "boxs")];
  r.ip = [x.text(null, 80, 100, "192.168.15.1", "tm"), x.text(null, 360, 100, "192.168.15.2", "tm")];

}, steps:[
  { t:"<code>ip netns add red</code> and <code>ip netns add blue</code>: two isolated namespaces, no interfaces, their own routing and ARP tables.", run:(r,x)=>x.show(r.red, r.blue) },

  { t:"Assign IPs (<code>ip -n red addr add 192.168.15.1/24 dev veth-red</code>), bring the interfaces up: red and blue can reach each other.", run:async(r,x)=>{ x.show(...r.ip); await x.packet([[140,75],[300,75]], { text:"ping" }); await x.packet([[300,82],[140,82]]); } },
  { t:"With more namespaces, create a <strong>bridge</strong>, <code>v-net-0</code>: a virtual switch. Each namespace connects to it with a veth pair.", run:(r,x)=>{ x.hide(r.veth, ...r.vl); x.show(r.br, ...r.bl); } },

  { t:"To reach the LAN: a route via <code>192.168.15.5</code> in the namespace, then NAT with <code>iptables … -j MASQUERADE</code>.", run:async(r,x)=>{ x.hl(false, r.br); x.show(r.eth, r.el, r.nat); await x.packet([[360,110],[360,170],[290,170],[220,190],[220,206]]); } },

/* --- k8s DNS name composer --- */
A.dnsk8s = el => {
  const F = widget(el, "Composing a cluster DNS name");
  const row = ctlRow(F, `<label>type <select id="dkT"><option value="svc">Service</option><option value="pod">Pod</option></select></label><label>name / IP <input id="dkN" type="text" value="web-service" style="width:140px"></label><label>namespace <input id="dkS" type="text" value="apps" style="width:90px"></label><label>from namespace <input id="dkF" type="text" value="default" style="width:90px"></label>`, true);
  const out = document.createElement("div"); out.style.cssText = "padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:14px";
  F.cap.before(out); F.ctl.remove();
  const upd = () => {
    const t = row.querySelector("#dkT").value; let n = row.querySelector("#dkN").value.trim() || "web-service"; const s = row.querySelector("#dkS").value.trim() || "default", f = row.querySelector("#dkF").value.trim() || "default";
    if (t === "pod") n = n.replace(/\./g, "-");
    const fq = `${n}.${s}.${t}.cluster.local`;
    const search = [`${f}.svc.cluster.local`, "svc.cluster.local", "cluster.local"];
    const tries = t === "svc" ? [n, `${n}.${s}`, `${n}.${s}.svc`, fq] : [fq];
    const ok = q => q === fq || (t === "svc" && search.some(d => `${q}.${d}` === fq));
    out.innerHTML = `<div>Fully qualified name: <code style="font-size:15px;color:var(--accent)">${esc(fq)}</code></div>` + tries.map(q => `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="badge ${ok(q)?"ok":"bad"}">${ok(q)?"resolves":"fails"}</span><code>${esc(q)}</code></div>`).join("");
    F.cap.innerHTML = t === "pod" ? "Pods: IP with dashes, <code>pod</code> subdomain. Search domains don't apply: you always need the full name." : `The <code>/etc/resolv.conf</code> of a Pod in the <code>${esc(f)}</code> namespace contains <code>search ${esc(search.join(" "))}</code>. Short names are completed with these domains.`;
  };
  row.addEventListener("input", upd); row.addEventListener("change", e => { if (e.target.id === "dkT") row.querySelector("#dkN").value = e.target.value === "pod" ? "10.244.1.3" : "web-service"; upd(); }); upd();
};

/* --- ingress router --- */
A.ingress = el => {
  const F = widget(el, "Ingress routing", 440, 220);
  const urls = ["my-online-store.com/wear","my-online-store.com/watch","my-online-store.com/listen","wear.my-online-store.com","watch.my-online-store.com"];
  const row = ctlRow(F, `<label>Rules <select id="igM"><option value="path">by path (1 rule, 2 paths)</option><option value="host">by host (2 rules)</option></select></label>`, true);
  const urow = ctlRow(F, urls.map(u => `<button class="cbtn" data-u="${u}" style="font-family:var(--f-mono);font-size:12px">${u}</button>`).join(""));
  F.ctl.remove();
  let gen = 0;
  const route = (mode, u) => {
    const [host, path] = u.includes("/") ? [u.split("/")[0], "/" + u.split("/")[1]] : [u, "/"];
    if (mode === "path") return host === "my-online-store.com" && path === "/wear" ? 0 : host === "my-online-store.com" && path === "/watch" ? 1 : 2;
    return host.startsWith("wear.") ? 0 : host.startsWith("watch.") ? 1 : 2;
  };
  const draw = async u => {
    const my = ++gen, mode = row.querySelector("#igM").value, K = F.redraw();
    K.box(null, 6, 90, 80, 44, "user", { cls:"boxs", tcls:"ts" });
    K.box(null, 112, 74, 110, 76, "Ingress Controller", { cls:"boxa", tcls:"ts", sub:"nginx" });
    const rules = mode === "path" ? ["path /wear","path /watch","no rule · 404"] : ["host wear.…","host watch.…","no rule · 404"];
    const back = ["wear-service","watch-service","default-http-backend"].map((n,i) => K.box(null, 280, 16 + i*68, 152, 52, n, { cls: i===2 ? "box" : "boxok", tcls:"tm", sub: rules[i] }));
    rules.forEach((t,i) => K.line(null, [[222,112],[280,42 + i*68]], { dash:true }));
    if (!u) { F.cap.innerHTML = "Pick a URL. The controller matches the host and path against the Ingress Resource rules."; urow.querySelectorAll("button").forEach(b => b.classList.remove("on")); return; }
    urow.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.u === u));
    const k = route(mode, u);
    await K.packet([[86,112],[112,112]], { text: u.length > 20 ? u.slice(0, 20) + "…" : u }); if (my !== gen) return;
    await K.packet([[222,112],[280,42 + k*68]]); if (my !== gen) return;
    K.hl(true, back[k]);
    F.cap.innerHTML = k === 2 ? `<code>${esc(u)}</code> matches no rule: the request goes to the <strong>default backend</strong> (404 page).` : `<code>${esc(u)}</code> → <strong>${k ? "watch-service" : "wear-service"}</strong>.`;
  };
  urow.addEventListener("click", e => { const b = e.target.closest("button"); if (b) draw(b.dataset.u); });
  row.addEventListener("change", () => draw(null));
  draw(null);
};

/* --- rewrite-target --- */
A.rewrite = el => {
  const F = widget(el, "rewrite-target: /", 440, 150);
  const row = ctlRow(F, `<label><input type="checkbox" id="rwOn"> annotation nginx.ingress.kubernetes.io/rewrite-target: /</label><button class="cbtn pri" id="rwGo">GET /watch</button>`);
  F.ctl.remove();
  const go = async () => {
    const K = F.redraw(), on = row.querySelector("#rwOn").checked;
    K.box(null, 6, 50, 80, 44, "client", { cls:"boxs", tcls:"ts" });
    K.box(null, 140, 40, 120, 64, "Ingress", { cls:"boxa", sub: on ? "rewrites the path" : "forwards as is" });
    const app = K.box(null, 316, 40, 118, 64, "watch-app", { cls:"box", sub:"serves /" });
    await K.packet([[86,72],[140,72]], { text:"/watch" });
    await K.packet([[260,72],[316,72]], { text: on ? "/" : "/watch" });
    app.querySelector("rect").setAttribute("class", on ? "boxok" : "boxbad");
    K.text(null, 375, 128, on ? "200 OK" : "404 Not Found", "t tb " + (on ? "tok" : "tbad"));
    F.cap.innerHTML = on ? "The path matched by the rule (<code>/watch</code>) is replaced with <code>/</code>: the application gets what it expects." : "Without a rewrite, the application receives <code>/watch</code>, which it doesn't know.";
  };
  row.querySelector("#rwGo").addEventListener("click", go);
  row.querySelector("#rwOn").addEventListener("change", go);
  go();
};
})();

</script>
<script>
(function(){
"use strict";
const C = window.COURSE;
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- index ---------- */
const flat = [];
C.chapters.forEach(ch => ch.lessons.forEach(l => { l.ch = ch; flat.push(l); }));
const byId = Object.fromEntries(flat.map(l => [l.id, l]));
const chByNum = Object.fromEntries(C.chapters.map(c => [c.num, c]));

/* ---------- progress (per-viewer, localStorage) ---------- */
const KEY = "cka-fr-progress-v1";
let P = { done:{}, quiz:{}, last:null, theme:null };
try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {} }
const QUIZ_PASS = 0.7;
function chStats(ch){
  const total = ch.lessons.length + 1;
  let d = ch.lessons.filter(l => P.done[l.id]).length;
  const q = P.quiz[ch.num];
  const qpass = q && q.best/q.total >= QUIZ_PASS;
  if (qpass) d++;
  return { total, done:d, pct: d/total, qpass };
}
function globalPct(){
  let t=0,d=0; C.chapters.forEach(c => { const s = chStats(c); t+=s.total; d+=s.done; });
  return d/t;
}
function updateProgress(){
  const p = Math.round(globalPct()*100);
  $("#gFill").style.width = p + "%";
  $("#gPct").textContent = p + "%";
  $("#gTrack").setAttribute("aria-valuenow", p);
  renderSidebar();
}

/* ---------- theme ---------- */
if (P.theme) document.documentElement.setAttribute("data-theme", P.theme);
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", nx); P.theme = nx; save();
});

/* ---------- toast ---------- */
let tt; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1800); }

/* ---------- ring ---------- */
function ring(pct, size=26, done=false){
  const r = size/2-3, c = 2*Math.PI*r;
  return `<svg class="ring${done?' done':''}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="bgc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="3"/><circle class="fgc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}

/* ---------- sidebar ---------- */
let openCh = null, curId = null;
function renderSidebar(){
  const sb = $("#sidebar");
  let h = `<div class="side-home"><a href="#home" class="${curId==='home'?'on':''}">Home</a><a href="#memo" class="${curId==='memo'?'on':''}">kubectl cheat sheet</a><a href="#speed-sheet" class="${curId==='speed-sheet'?'on':''}">CLI speed notes</a></div>`;
  C.chapters.forEach(ch => {
    const s = chStats(ch); const isOpen = openCh === ch.num;
    h += `<div class="chap"><button class="chap-head" data-ch="${ch.num}" aria-expanded="${isOpen}"><span class="chap-num">${ch.num}</span><span class="chap-title">${esc(ch.title)}</span>${ring(s.pct,26,s.done===s.total)}</button>`;
    if (isOpen){
      h += `<ul class="chap-list">`;
      ch.lessons.forEach(l => {
        h += `<li><a href="#${l.id}" class="${P.done[l.id]?'isdone':''} ${curId===l.id?'on':''}"><span class="tick"></span><span>${esc(l.title.replace(/^Lab · /,''))}</span>${l.kind==='lab'?'<span class="tag">Lab</span>':''}</a></li>`;
      });
      const q = P.quiz[ch.num];
      h += `<li class="quizlink"><a href="#quiz-${ch.num}" class="${s.qpass?'isdone':''} ${curId==='quiz-'+ch.num?'on':''}"><span class="tick"></span><span>Chapter quiz${q?` · ${q.best}/${q.total}`:''}</span><span class="tag">Quiz</span></a></li></ul>`;
    }
    h += `</div>`;
  });
  sb.innerHTML = h;
  $$(".chap-head", sb).forEach(b => b.addEventListener("click", () => { openCh = openCh === b.dataset.ch ? null : b.dataset.ch; renderSidebar(); }));
  const on = $(".chap-list a.on", sb); if (on && !sb._scrolled) { on.scrollIntoView({block:"center"}); sb._scrolled = true; }
}
$("#menuBtn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
$("#scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));
$("#sidebar").addEventListener("click", e => { if (e.target.closest("a")) document.body.classList.remove("nav-open"); });

/* ---------- code blocks ---------- */
function enhanceCode(root){
  $$("pre > code", root).forEach(code => {
    const pre = code.parentElement;
    if (pre.parentElement.classList.contains("codeblock")) return;
    let lang = (code.className.match(/language-(\w+)/)||[])[1] || "";
    let txt = code.textContent.replace(/\n$/,"");
    let fname = "";
    const first = txt.split("\n")[0];
    const fm = first.match(/^#?\s*([\w.-]+\.ya?ml)\s*$/i);
    if (fm && txt.includes("\n")) { fname = fm[1]; txt = txt.split("\n").slice(1).join("\n"); }
    if (!lang) lang = /^\s*(apiVersion|kind):/m.test(txt) ? "yaml" : "bash";
    code.textContent = txt;
    code.className = "language-" + lang;
    if (window.hljs) { try { hljs.highlightElement(code); } catch(e){} }
    if (lang === "bash") code.innerHTML = code.innerHTML.replace(/^(\s*)\$ /gm, '$1<span class="prompt">$ </span>');
    const wrap = document.createElement("div"); wrap.className = "codeblock";
    const label = fname ? `<span class="fname">${esc(fname)}</span>` : `<span>${lang === "yaml" ? "YAML" : "Terminal"}</span>`;
    wrap.innerHTML = `<div class="codebar">${label}<button class="copy" type="button">Copy</button></div>`;
    pre.replaceWith(wrap); wrap.appendChild(pre);
    $(".copy", wrap).addEventListener("click", ev => {
      const clean = txt.split("\n").map(l => l.replace(/^(\s*)\$ /, "$1")).join("\n");
      const done = () => { ev.target.textContent = "Copied"; setTimeout(()=>ev.target.textContent="Copy",1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(clean).then(done, () => selectNode(pre));
      else selectNode(pre);
    });
  });
  $$("table", root).forEach(t => { if (!t.parentElement.classList.contains("tablewrap")) { const w=document.createElement("div"); w.className="tablewrap"; t.replaceWith(w); w.appendChild(t);} });
}
function selectNode(n){ const r=document.createRange(); r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text selected: copy it with Ctrl+C"); }

function mountAnims(root){
  $$(".anim[data-anim]", root).forEach(el => {
    const name = el.dataset.anim, fn = window.ANIMS && window.ANIMS[name];
    if (!fn) { el.remove(); return; }
    try { fn(el); } catch(e) { console.error("anim", name, e); el.remove(); }
  });
}

function nextUndone(){ return flat.find(l => !P.done[l.id]); }
function neighbors(id){ const i = flat.findIndex(l=>l.id===id); return { prev: flat[i-1], next: flat[i+1] }; }

function renderLesson(id){
  const l = byId[id]; if (!l) return renderHome();
  curId = id; openCh = l.ch.num; P.last = id; save();
  const { prev, next } = neighbors(id);
  const idx = l.ch.lessons.indexOf(l)+1;
  let body = "";
  if (l.kind === "lesson") {
    body = `<article class="prose">${l.html}</article>`;
  } else {
    body = `<div class="lab-intro"><span>${l.items.length} lab questions with their solutions from the repository. Open a question to see its solution.</span>${l.practice?`<a class="btn ghost" href="${l.practice}" target="_blank" rel="noopener">Open the KodeKloud lab</a>`:''}</div>`;
    l.items.forEach((it,i) => {
      body += `<details class="labq prose"><summary><span class="qn">${String(i+1).padStart(2,"0")}</span><span class="qt">${it.q}</span><svg class="chev" width="12" height="12" viewBox="0 0 12 12"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></summary><div class="qa">${it.a || '<p>Information step: nothing to run.</p>'}</div></details>`;
    });

  const nxtLabel = next ? (next.ch !== l.ch ? `Chapter ${l.ch.num} quiz` : next.title) : `Chapter ${l.ch.num} quiz`;
  const nxtHref = (next && next.ch === l.ch) ? "#"+next.id : "#quiz-"+l.ch.num;
  setView(`<div class="wrap"><div class="crumb"><a href="#home">Home</a><span>/</span><a href="#${l.ch.lessons[0].id}">Chapter ${l.ch.num} · ${esc(l.ch.title)}</a></div>

  ${body}
  <footer class="lesson-foot">
    <div class="donebar"><span class="msg" id="doneMsg">${isDone?'Completed.':'Finished this '+(l.kind==='lab'?'lab':'lesson')+'?'}</span><div class="btns"><button class="btn ${isDone?'ghost':'okb'}" id="doneBtn">${isDone?'Mark as not done':'Complete and continue'}</button></div></div>
    <nav class="pager">${prev?`<a href="#${prev.id}"><small>Previous</small><span>${esc(prev.title)}</span></a>`:''}<a class="next" href="${nxtHref}"><small>Next</small><span>${esc(nxtLabel)}</span></a></nav>
  </footer></div>`);
  enhanceCode(main);
  mountAnims(main);
  $("#doneBtn").addEventListener("click", () => {
    if (P.done[id]) { delete P.done[id]; save(); updateProgress(); renderLesson(id); return; }
    P.done[id] = Date.now(); save(); updateProgress(); toast("Progress saved");
    location.hash = nxtHref.slice(1);
  });
  renderSidebar();
}

function renderQuiz(num){
  const ch = chByNum[num]; if (!ch) return renderHome();
  curId = "quiz-"+num; openCh = num;
  const answers = new Array(ch.quiz.length).fill(null);
  let h = `<div class="wrap"><div class="crumb"><a href="#home">Home</a><span>/</span><a href="#${ch.lessons[0].id}">Chapter ${num} · ${esc(ch.title)}</a></div>
  <header class="lesson-head"><h1>Quiz · ${esc(ch.title)}</h1><div class="lmeta"><span>${ch.quiz.length} questions</span><span>Pass mark ${Math.round(QUIZ_PASS*100)}%</span>${P.quiz[num]?`<span>Best score: ${P.quiz[num].best}/${P.quiz[num].total}</span>`:''}</div></header>`;
  ch.quiz.forEach((q,i) => {
    h += `<div class="qcard" data-q="${i}"><h3><span class="qn">${String(i+1).padStart(2,"0")}</span><span>${esc(q.q)}</span></h3><div class="opts">${q.options.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="explain" hidden></div></div>`;
  });
  const nextCh = C.chapters[C.chapters.indexOf(ch)+1];
  h += `<div class="score" id="score"><span><b id="sc">0</b> / ${ch.quiz.length} · <span id="scm">Answer the questions</span></span><div class="btns"><button class="btn ghost" id="retry">Start over</button>${nextCh?`<a class="btn primary" href="#${nextCh.lessons[0].id}">Chapter ${nextCh.num}</a>`:`<a class="btn primary" href="#home">Home</a>`}</div></div></div>`;
  setView(h); renderSidebar();
  $$(".qcard").forEach(card => {
    const i = +card.dataset.q, q = ch.quiz[i];
    $$(".opt", card).forEach(b => b.addEventListener("click", () => {
      const j = +b.dataset.j; answers[i] = j;
      $$(".opt", card).forEach(x => { x.disabled = true; const k=+x.dataset.j; if (k===q.answer) x.classList.add("right"); else if (k===j) x.classList.add("wrong"); });
      const ex = $(".explain", card); ex.hidden = false; ex.innerHTML = (j===q.answer?"<strong style='color:var(--ok)'>Correct.</strong> ":"<strong style='color:var(--bad)'>Not quite.</strong> ") + esc(q.explain);
      const score = answers.filter((a,k)=>a===ch.quiz[k].answer).length, answered = answers.filter(a=>a!==null).length;
      $("#sc").textContent = score;
      if (answered === ch.quiz.length){
        const prevBest = P.quiz[num] ? P.quiz[num].best : -1;
        P.quiz[num] = { best: Math.max(score, prevBest), total: ch.quiz.length, at: Date.now() }; save(); updateProgress();
        $("#scm").textContent = score/ch.quiz.length >= QUIZ_PASS ? "Chapter passed" : "Review the lessons and try again";
      } else $("#scm").textContent = `${answered}/${ch.quiz.length} answered`;
    }));
  });
  $("#retry").addEventListener("click", () => renderQuiz(num));
}

/* ---------- search ---------- */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const idx = flat.map(l => ({ l, t: norm(l.title), b: norm(l.text||"") }));
function openSearch(){ $("#searchOv").hidden = false; const i=$("#searchIn"); i.value=""; drawSearch(""); setTimeout(()=>i.focus(),10); }
function closeSearch(){ $("#searchOv").hidden = true; }
let selI = 0;
function drawSearch(q){
  const n = norm(q.trim()); const box = $("#sres");
  if (!n) { box.innerHTML = `<div class="empty">Type a keyword. Examples: <code>nodeSelector</code>, <code>snapshot</code>, <code>RoleBinding</code>.</div>`; return; }
  const terms = n.split(/\s+/);
  const res = idx.map(x => { let s=0; for (const t of terms){ if (x.t.includes(t)) s+=10; const c = x.b.split(t).length-1; if (!c && !x.t.includes(t)) return null; s+=Math.min(c,6);} return {x,s}; }).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,14);
  if (!res.length) { box.innerHTML = `<div class="empty">No results for "${esc(q)}".</div>`; return; }
  selI = 0;
  box.innerHTML = res.map(({x},k) => {
    const raw = x.l.text||""; const p = norm(raw).indexOf(terms[0]); let snip = "";
    if (p >= 0) { const a = Math.max(0,p-50); snip = esc(raw.slice(a, p+90)); terms.forEach(t => { snip = snip.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"), "<mark>$1</mark>"); }); snip = (a>0?"…":"")+snip+"…"; }
    return `<a href="#${x.l.id}" class="${k===0?'sel':''}"><small>Chapter ${x.l.ch.num} · ${esc(x.l.ch.title)}${x.l.kind==='lab'?' · Lab':''}</small>${esc(x.l.title)}${snip?`<p>${snip}</p>`:''}</a>`;
  }).join("");
}
$("#searchBtn").addEventListener("click", openSearch);
$("#searchIn").addEventListener("input", e => drawSearch(e.target.value));
$("#searchIn").addEventListener("keydown", e => {
  const items = $$("#sres a"); if (e.key==="Escape") return closeSearch();
  if (e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!items.length) return; items[selI]&&items[selI].classList.remove("sel"); selI=(selI+(e.key==="ArrowDown"?1:-1)+items.length)%items.length; items[selI].classList.add("sel"); items[selI].scrollIntoView({block:"nearest"}); }
  if (e.key==="Enter" && items[selI]) { location.hash = items[selI].getAttribute("href").slice(1); closeSearch(); }
});
$("#searchOv").addEventListener("click", e => { if (e.target.id==="searchOv" || e.target.closest("a")) closeSearch(); });
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName||"").toLowerCase(); if (["input","textarea","select"].includes(tag)) return;
  if (e.key==="/" || ((e.ctrlKey||e.metaKey) && e.key==="k")) { e.preventDefault(); openSearch(); }
  if (curId && byId[curId] && (e.key==="ArrowRight"||e.key==="ArrowLeft") && !e.altKey && !e.ctrlKey && !e.metaKey) {
    const {prev,next} = neighbors(curId); const t = e.key==="ArrowRight"?next:prev; if (t) location.hash = t.id;
  }
});

/* ---------- router ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  document.body.classList.remove("nav-open");
  $("#sidebar")._scrolled = false;
  if (!h || h==="home" || h==="accueil") renderHome();
  else if (h==="memo") renderMemo();
  else if (h==="speed-sheet") renderSpeedSheet();
  else if (h.startsWith("quiz-")) renderQuiz(h.slice(5));
  else if (byId[h]) renderLesson(h);
  else renderHome();
  updateProgress();
  main.focus({preventScroll:true});
}
window.addEventListener("hashchange", route);
route();
})();
</script>
