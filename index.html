igured on this Network Policy?","a":"<pre><code>Internal pod can access port 8080 on payroll pod\n<\/code><\/pre>"},{"q":"Access the UI of these applications using the link given above the terminal.","a":""},{"q":"Only internal applications can access payroll service","a":""},{"q":"Perform a connectivity test using the User Interface of the Internal Application to access the &#x27;external-service&#x27; at port &#x27;8080&#x27;.","a":"<pre><code>Successful\n<\/code><\/pre>"},{"q":"Answer file located at /var/answers/answer-internal-policy.yaml","a":"<pre><code>$ kubectl create -f /var/answers/answer-internal-policy.yaml\n<\/code><\/pre>"}],"text":"Run the command 'kubectl get networkpolicy' Run the command 'kubectl get networkpolicy' Run the command 'kubectl get networkpolicy' and look under pod selector Run the command 'kubectl describe networkpolicy' and look under PolicyTypes What is the impact of the rule configured on this Network Policy? What is the impact of the rule configured on this Network Policy? Access the UI of these applications using the link given above the terminal. Only internal applications can access payroll service Perform a connectivity test using the User Interface of the Internal Application to access the 'external-service' at port '8080'. Answer file located at /var/answers/answer-internal-policy.yaml","minutes":10},{"id":"07-kubectx","kind":"lesson","title":"kubectx and kubens Commands","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/07-Security/29-kubectx-and-kubens-commands.md","html":"<p>Two optional utilities that make switching contexts and namespaces faster (<code>ahmetb/kubectx<\/code> project).<\/p>\n<p><strong>kubectx<\/strong>:<\/p>\n<pre><code class=\"language-bash\">kubectx                  # list all contexts\nkubectx &lt;context_name&gt;   # switch to a context\nkubectx -                # switch back to the previous context\nkubectx -c               # show the current context\n<\/code><\/pre>\n<p><strong>kubens<\/strong>:<\/p>\n<pre><code class=\"language-bash\">kubens                   # list namespaces\nkubens &lt;new_namespace&gt;   # switch to a namespace\nkubens -                 # switch back to the previous namespace\n<\/code><\/pre>\n<p>Without them, the native equivalents are <code>kubectl config use-context<\/code> and <code>kubectl config set-context --current --namespace=&lt;ns&gt;<\/code>.<\/p>","text":"Two optional utilities that make switching contexts and namespaces faster ( ahmetb/kubectx project). kubectx : kubens : Without them, the native equivalents are kubectl config use-context and kubectl config set-context --current --namespace=<ns> .","minutes":2,"ncode":2}],"quiz":[{"q":"Does Kubernetes natively manage human user accounts?","options":["Yes, with kubectl create user","No, only service accounts"],"answer":1,"explain":"Humans are authenticated through certificates, tokens or an external identity provider."},{"q":"In which CSR field do you put the system:masters group?","options":["CN","O","OU"],"answer":1,"explain":"CN holds the user name, O the group."},{"q":"Who signs certificates approved through the Certificates API?","options":["kube-apiserver","kube-controller-manager","etcd"],"answer":1,"explain":"It uses --cluster-signing-cert-file and --cluster-signing-key-file."},{"q":"What are the three sections of a kubeconfig file?","options":["clusters, users, contexts","servers, accounts, namespaces","clusters, roles, bindings"],"answer":0,"explain":"A context links a user to a cluster, optionally with a namespace."},{"q":"What does apiGroups: [\"\"] mean in an RBAC rule?","options":["The core API group","All groups","No group"],"answer":0,"explain":"\"*\" would mean all groups."},{"q":"Which command checks whether dev-user can create Pods?","options":["kubectl auth can-i create pods --as dev-user","kubectl check pods --user dev-user","kubectl get role --as dev-user"],"answer":0,"explain":"Add --namespace to check another namespace."},{"q":"What do you need to grant access to nodes?","options":["A Role","A ClusterRole and a ClusterRoleBinding"],"answer":1,"explain":"Nodes are cluster-scoped resources."},{"q":"Since v1.24, how do you get a token for a service account?","options":["It's in the automatically created Secret","kubectl create token <serviceaccount>"],"answer":1,"explain":"TokenRequest tokens are time-bound and audience-bound."},{"q":"Where are Linux capabilities configured?","options":["At Pod level only","At container level only","Both"],"answer":1,"explain":"runAsUser can be set at both levels; capabilities only on the container."},{"q":"With which network solution is a NetworkPolicy not enforced?","options":["Calico","Flannel","Weave-net"],"answer":1,"explain":"The policy is accepted but has no effect."}],"folder":"07-Security"},{"num":"08","title":"Storage","short":"Storage","summary":"Storage in Docker, the CRI, CNI and CSI interfaces, volumes, Persistent Volumes, Persistent Volume Claims and Storage Classes.","lessons":[{"id":"08-docker-storage-intro","kind":"lesson","title":"Introduction to Docker Storage","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/02-Introduction-to-Docker-Storage.md","html":"<p>To understand storage in container orchestration tools like Kubernetes, you first need to understand how storage works with containers. Docker has two concepts:<\/p>\n<ul>\n<li><strong>storage drivers<\/strong>, which manage the layers of images and containers;<\/li>\n<li><strong>volume driver plugins<\/strong>, which manage persistent volumes.<\/li>\n<\/ul>\n<p>We start with storage drivers.<\/p>\n<p>References: <a target=\"_blank\" rel=\"noopener\" href=\"https://docs.docker.com/storage/storagedriver/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/storage/storagedriver/<\/a> and <a target=\"_blank\" rel=\"noopener\" href=\"https://docs.docker.com/storage/volumes/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/storage/volumes/<\/a><\/p>","text":"To understand storage in container orchestration tools like Kubernetes, you first need to understand how storage works with containers. Docker has two concepts: storage drivers , which manage the layers of images and containers; volume driver plugins , which manage persistent volumes. We start with storage drivers. References: https://docs.docker.com/storage/storagedriver/ and https://docs.docker.com/storage/volumes/","minutes":2,"ncode":0},{"id":"08-storage-in-docker","kind":"lesson","title":"Storage in Docker","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/03-Storage-in-Docker.md","html":"<p>When Docker is installed, it creates its directory structure under <code>/var/lib/docker<\/code>: <code>aufs<\/code>, <code>containers<\/code>, <code>image<\/code>, <code>volumes<\/code>… That's where Docker stores all its data by default.<\/p>\n<pre><code class=\"language-bash\">$ cd /var/lib/docker/\n<\/code><\/pre>\n<p><strong>Layered architecture<\/strong>: each instruction in the Dockerfile creates a <strong>layer<\/strong> with only the changes from the previous one (Ubuntu base, apt packages, pip packages, source code, entrypoint). A second application sharing the first three instructions <strong>reuses<\/strong> those layers from the cache: builds are faster and disk space is saved.<\/p>\n<p>Once built, image layers are <strong>read-only<\/strong>. When a container runs, Docker adds a writable <strong>container layer<\/strong> on top, which stores logs, temporary files and so on. It is destroyed with the container.<\/p>\n<p>You can still modify a file from the image: Docker first copies it into the writable layer, and you modify that copy. This is <strong>copy-on-write<\/strong>.<\/p>\n<div class=\"anim\" data-anim=\"layers\"><\/div>\n\n<p><strong>Volumes<\/strong>: to persist data, create a volume, stored under <code>/var/lib/docker/volumes<\/code>.<\/p>\n<pre><code class=\"language-bash\">$ docker volume create data_volume\n$ ls -l /var/lib/docker/volumes/\ndrwxr-xr-x 3 root root  4096 Aug 01 17:53 data_volume\n$ docker volume ls\nDRIVER              VOLUME NAME\nlocal               data_volume\n<\/code><\/pre>\n<p>Mount it with <code>-v<\/code> at the location where MySQL stores its data:<\/p>\n<pre><code class=\"language-bash\">$ docker run -v data_volume:/var/lib/mysql mysql\n<\/code><\/pre>\n<p>If the volume doesn't exist yet, Docker creates it automatically:<\/p>\n<pre><code class=\"language-bash\">$ docker run -v data_volume2:/var/lib/mysql mysql\n$ docker volume ls\nDRIVER              VOLUME NAME\nlocal               data_volume\nlocal               data_volume2\n<\/code><\/pre>\n<p>Two kinds of mounts:<\/p>\n<ul>\n<li><strong>volume mount<\/strong>: mounts a volume from Docker's <code>volumes<\/code> directory;<\/li>\n<li><strong>bind mount<\/strong>: mounts any directory from the Docker host (for example <code>/data/mysql<\/code>).<\/li>\n<\/ul>\n<p>The preferred syntax is <code>--mount<\/code>:<\/p>\n<pre><code class=\"language-bash\">$ mkdir -p /data/mysql\n$ docker run --mount type=bind,source=/data/mysql,target=/var/lib/mysql mysql\n<\/code><\/pre>\n<p><strong>Storage drivers<\/strong> take care of the layers, the writable layer and copy-on-write: <strong>AUFS<\/strong>, <strong>ZFS<\/strong>, <strong>BTRFS<\/strong>, <strong>Device Mapper<\/strong>, <strong>Overlay<\/strong>, <strong>Overlay2<\/strong>. Docker picks the best one available for the operating system.<\/p>","text":"When Docker is installed, it creates its directory structure under /var/lib/docker : aufs , containers , image , volumes … That's where Docker stores all its data by default. Layered architecture : each instruction in the Dockerfile creates a layer with only the changes from the previous one (Ubuntu base, apt packages, pip packages, source code, entrypoint). A second application sharing the first three instructions reuses those layers from the cache: builds are faster and disk space is saved. Once built, image layers are read-only . When a container runs, Docker adds a writable container layer on top, which stores logs, temporary files and so on. It is destroyed with the container. You can still modify a file from the image: Docker first copies it into the writable layer, and you modify that copy. This is copy-on-write . Volumes : to persist data, create a volume, stored under /var/lib/docker/volumes . Mount it with -v at the location where MySQL stores its data: If the volume doesn't exist yet, Docker creates it automatically: Two kinds of mounts: volume mount : mounts a volume from Docker's volumes directory; bind mount : mounts any directory from the Docker host (for example /data/mysql ). The preferred syntax is --mount : Storage drivers take care of the layers, the writable layer and copy-on-write: AUFS , ZFS , BTRFS , Device Mapper , Overlay , Overlay2 . Docker picks the best one available for the operating system.","minutes":3,"ncode":5},{"id":"08-volume-drivers","kind":"lesson","title":"Volume Driver Plugins in Docker","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/04-Volume-Driver-Plugins-in-Docker.md","html":"<p>Volumes aren't handled by storage drivers but by <strong>volume driver plugins<\/strong>. The default plugin, <strong>local<\/strong>, creates volumes under <code>/var/lib/docker/volumes/<\/code>.<\/p>\n<p>Other plugins create volumes on third-party solutions: Azure File Storage, DigitalOcean Block Storage, Portworx, Google Compute Persistent Disks, Amazon EBS… Example with <strong>RexRay EBS<\/strong>, which provisions a volume from Amazon EBS:<\/p>\n<pre><code class=\"language-bash\">$ docker run -it --name mysql --volume-driver rexray/ebs --mount src=ebs-vol,target=/var/lib/mysql mysql\n<\/code><\/pre>\n<p>When the container exits, the data is safe in the cloud.<\/p>","text":"Volumes aren't handled by storage drivers but by volume driver plugins . The default plugin, local , creates volumes under /var/lib/docker/volumes/ . Other plugins create volumes on third-party solutions: Azure File Storage, DigitalOcean Block Storage, Portworx, Google Compute Persistent Disks, Amazon EBS… Example with RexRay EBS , which provisions a volume from Amazon EBS: When the container exits, the data is safe in the cloud.","minutes":2,"ncode":1},{"id":"08-csi","kind":"lesson","title":"Container Storage Interface","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/05-Container.Storage-Interface.md","html":"<p>Originally, all the code for Docker was embedded in the Kubernetes source code. To open up to other solutions, Kubernetes defined three standard interfaces:<\/p>\n<ul>\n<li><strong>CRI<\/strong> (<em>Container Runtime Interface<\/em>): how an orchestrator talks to container runtimes (Docker, rkt, CRI-O…);<\/li>\n<li><strong>CNI<\/strong> (<em>Container Network Interface<\/em>): how networking solutions plug in (weaveworks, flannel, cilium…);<\/li>\n<li><strong>CSI<\/strong> (<em>Container Storage Interface<\/em>): how storage solutions plug in (Portworx, Amazon EBS, Azure Disk, GlusterFS, Dell EMC…).<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"interfaces\"><\/div>\n\n<p>CSI isn't Kubernetes-specific: it's a <strong>universal standard<\/strong>, also adopted by Cloud Foundry and Mesos. It defines a set of <strong>RPCs<\/strong> that the orchestrator calls and that storage drivers must implement. For example, when a Pod needs a volume, Kubernetes calls <code>CreateVolume<\/code> with the request details; the driver provisions a volume on the storage provider and returns the result. On deletion, Kubernetes calls <code>DeleteVolume<\/code>.<\/p>\n<p>References: <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/container-storage-interface/spec\" target=\"_blank\" rel=\"noopener\">https://github.com/container-storage-interface/spec<\/a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://kubernetes-csi.github.io/docs/\" target=\"_blank\" rel=\"noopener\">https://kubernetes-csi.github.io/docs/<\/a><\/p>","text":"Originally, all the code for Docker was embedded in the Kubernetes source code. To open up to other solutions, Kubernetes defined three standard interfaces: CRI ( Container Runtime Interface ): how an orchestrator talks to container runtimes (Docker, rkt, CRI-O…); CNI ( Container Network Interface ): how networking solutions plug in (weaveworks, flannel, cilium…); CSI ( Container Storage Interface ): how storage solutions plug in (Portworx, Amazon EBS, Azure Disk, GlusterFS, Dell EMC…). CSI isn't Kubernetes-specific: it's a universal standard , also adopted by Cloud Foundry and Mesos. It defines a set of RPCs that the orchestrator calls and that storage drivers must implement. For example, when a Pod needs a volume, Kubernetes calls CreateVolume with the request details; the driver provisions a volume on the storage provider and returns the result. On deletion, Kubernetes calls DeleteVolume . References: https://github.com/container-storage-interface/spec · https://kubernetes-csi.github.io/docs/","minutes":2,"ncode":0},{"id":"08-volumes","kind":"lesson","title":"Volumes","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/06-Volumes.md","html":"<p>Like Docker containers, Pods are <strong>transient<\/strong>: a Pod that processes data and is then deleted takes its data with it. So you attach a <strong>volume<\/strong>.<\/p>\n<p>Course example: a Pod generates a random number between 1 and 100 and writes it to <code>/opt/number.out<\/code>. You declare a <code>hostPath<\/code> volume pointing to <code>/data<\/code> on the node, then mount it into the container at <code>/opt<\/code> with <code>volumeMounts<\/code>. The file is written on the host and outlives the Pod.<\/p>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: random-number-generator\nspec:\n  containers:\n  - image: alpine\n    name: alpine\n    command: [&quot;/bin/sh&quot;,&quot;-c&quot;]\n    args: [&quot;shuf -i 0-100 -n 1 &gt;&gt; /opt/number.out;&quot;]\n    volumeMounts:\n    - mountPath: /opt\n      name: data-volume\n  volumes:\n  - name: data-volume\n    hostPath:\n      path: /data\n      type: Directory\n<\/code><\/pre>\n<p><em>(Manifest rebuilt from the course diagram.)<\/em><\/p>\n<div class=\"anim\" data-anim=\"hostpath\"><\/div>\n\n<p><code>hostPath<\/code> is fine on a single node but <strong>not recommended for a multi-node cluster<\/strong>: every node has its own <code>/data<\/code>, with different content. Kubernetes supports many shared storage solutions: NFS, GlusterFS, Flocker, CephFS, ScaleIO, or public cloud disks (AWS EBS, Azure Disk, Google Persistent Disk).<\/p>\n<pre><code class=\"language-yaml\">volumes:\n- name: data-volume\n  awsElasticBlockStore:\n    volumeID: &lt;volume-id&gt;\n    fsType: ext4\n<\/code><\/pre>","text":"Like Docker containers, Pods are transient : a Pod that processes data and is then deleted takes its data with it. So you attach a volume . Course example: a Pod generates a random number between 1 and 100 and writes it to /opt/number.out . You declare a hostPath volume pointing to /data on the node, then mount it into the container at /opt with volumeMounts . The file is written on the host and outlives the Pod. (Manifest rebuilt from the course diagram.) hostPath is fine on a single node but not recommended for a multi-node cluster : every node has its own /data , with different content. Kubernetes supports many shared storage solutions: NFS, GlusterFS, Flocker, CephFS, ScaleIO, or public cloud disks (AWS EBS, Azure Disk, Google Persistent Disk).","minutes":2,"ncode":2},{"id":"08-persistent-volumes","kind":"lesson","title":"Persistent Volumes","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/07-Persistent-Volumes.md","html":"<p>In a large environment, configuring storage in every Pod definition file becomes unmanageable: every change has to be repeated everywhere.<\/p>\n<p>A <strong>Persistent Volume<\/strong> (PV) is a <strong>cluster-wide pool of storage volumes<\/strong> configured by an administrator. Users pick storage from this pool with <strong>Persistent Volume Claims<\/strong>.<\/p>\n<pre><code class=\"language-yaml\">pv-definition.yaml\nkind: PersistentVolume\napiVersion: v1\nmetadata:\n  name: pv-vol1\nspec:\n  accessModes: [ &quot;ReadWriteOnce&quot; ]\n  capacity:\n   storage: 1Gi\n  hostPath:\n   path: /tmp/data\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pv-definition.yaml\npersistentvolume/pv-vol1 created\n$ kubectl get pv\nNAME      CAPACITY   ACCESS MODES   RECLAIM POLICY   STATUS      CLAIM   STORAGECLASS   REASON   AGE\npv-vol1   1Gi        RWO            Retain           Available                                   3min\n$ kubectl delete pv pv-vol1\npersistentvolume &quot;pv-vol1&quot; deleted\n<\/code><\/pre>\n<p><strong>Access modes<\/strong>: <code>ReadWriteOnce<\/code> (RWO, read-write by a single node), <code>ReadOnlyMany<\/code> (ROX), <code>ReadWriteMany<\/code> (RWX).<\/p>","text":"In a large environment, configuring storage in every Pod definition file becomes unmanageable: every change has to be repeated everywhere. A Persistent Volume (PV) is a cluster-wide pool of storage volumes configured by an administrator. Users pick storage from this pool with Persistent Volume Claims . Access modes : ReadWriteOnce (RWO, read-write by a single node), ReadOnlyMany (ROX), ReadWriteMany (RWX).","minutes":2,"ncode":2},{"id":"08-pvc","kind":"lesson","title":"Persistent Volume Claims","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/08-Persistent-Volume-Claims.md","html":"<p>PVs and PVCs are two separate objects. Administrators create PVs, users create PVCs. Kubernetes <strong>binds<\/strong> each PVC to a PV based on <strong>capacity<\/strong>, <strong>access modes<\/strong>, <strong>volume modes<\/strong>, <strong>storage class<\/strong>, or a label <strong>selector<\/strong>.<\/p>\n<ul>\n<li>The relationship is <strong>one-to-one<\/strong>: a small PVC can bind to a large PV if nothing else fits, and the remaining capacity is wasted.<\/li>\n<li>If no PV is available, the PVC stays <strong>Pending<\/strong> until a suitable PV appears.<\/li>\n<\/ul>\n<div class=\"anim\" data-anim=\"pvbind\"><\/div>\n\n<pre><code class=\"language-yaml\">pvc-definition.yaml\nkind: PersistentVolumeClaim\napiVersion: v1\nmetadata:\n  name: myclaim\nspec:\n  accessModes: [ &quot;ReadWriteOnce&quot; ]\n  resources:\n   requests:\n     storage: 1Gi\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">pv-definition.yaml\nkind: PersistentVolume\napiVersion: v1\nmetadata:\n    name: pv-vol1\nspec:\n    accessModes: [ &quot;ReadWriteOnce&quot; ]\n    capacity:\n     storage: 1Gi\n    hostPath:\n     path: /tmp/data\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pv-definition.yaml\npersistentvolume/pv-vol1 created\n$ kubectl get pv\nNAME      CAPACITY   ACCESS MODES   RECLAIM POLICY   STATUS      CLAIM   STORAGECLASS   REASON   AGE\npv-vol1   1Gi        RWO            Retain           Available                                   10s\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pvc-definition.yaml\npersistentvolumeclaim/myclaim created\n$ kubectl get pvc\nNAME      STATUS    VOLUME   CAPACITY   ACCESS MODES   STORAGECLASS   AGE\nmyclaim   Pending                                                     35s\n$ kubectl get pvc\nNAME      STATUS   VOLUME    CAPACITY   ACCESS MODES   STORAGECLASS   AGE\nmyclaim   Bound    pv-vol1   1Gi        RWO                           1min\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl delete pvc myclaim\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl delete pv pv-vol1\n<\/code><\/pre>\n<p><strong>What happens to the PV when the PVC is deleted?<\/strong> That's the <code>persistentVolumeReclaimPolicy<\/code>:<\/p>\n<ul>\n<li><strong>Retain<\/strong> (default for manually created PVs): the PV remains but can't be reused until the administrator cleans it up;<\/li>\n<li><strong>Delete<\/strong>: the PV and the underlying storage are deleted;<\/li>\n<li><strong>Recycle<\/strong> (deprecated): the data is scrubbed and the PV becomes available again.<\/li>\n<\/ul>","text":"PVs and PVCs are two separate objects. Administrators create PVs, users create PVCs. Kubernetes binds each PVC to a PV based on capacity , access modes , volume modes , storage class , or a label selector . The relationship is one-to-one : a small PVC can bind to a large PV if nothing else fits, and the remaining capacity is wasted. If no PV is available, the PVC stays Pending until a suitable PV appears. What happens to the PV when the PVC is deleted? That's the persistentVolumeReclaimPolicy : Retain (default for manually created PVs): the PV remains but can't be reused until the administrator cleans it up; Delete : the PV and the underlying storage are deleted; Recycle (deprecated): the data is scrubbed and the PV becomes available again.","minutes":2,"ncode":6},{"id":"08-pvc-in-pods","kind":"lesson","title":"Using PVCs in Pods","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/09-Using-PVC-in-PODs.md","html":"<p>Pods access storage by using the <strong>claim as a volume<\/strong>. The PVC must be in the <strong>same namespace<\/strong> as the Pod: the cluster finds the claim, gets the PV backing it, mounts it on the host and then into the Pod.<\/p>\n<p><strong>A PV is cluster-scoped. A PVC is namespace-scoped.<\/strong><\/p>\n<pre><code class=\"language-yaml\">pv-definition.yaml\nkind: PersistentVolume\napiVersion: v1\nmetadata:\n    name: pv-vol1\nspec:\n    accessModes: [ &quot;ReadWriteOnce&quot; ]\n    capacity:\n     storage: 1Gi\n    hostPath:\n     path: /tmp/data\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pv-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">pvc-definition.yaml\nkind: PersistentVolumeClaim\napiVersion: v1\nmetadata:\n  name: myclaim\nspec:\n  accessModes: [ &quot;ReadWriteOnce&quot; ]\n  resources:\n   requests:\n     storage: 1Gi\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pvc-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">pod-definition.yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: mypod\nspec:\n  containers:\n    - name: myfrontend\n      image: nginx\n      volumeMounts:\n      - mountPath: &quot;/var/www/html&quot;\n        name: web\n  volumes:\n    - name: web\n      persistentVolumeClaim:\n        claimName: myclaim\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pod-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get pod,pvc,pv\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"pvchain\"><\/div>\n\n<div class=\"admonition tip\">\n<p class=\"admonition-title\">Note<\/p>\n<p>In these examples, the first line (<code>pv-definition.yaml<\/code>…) is the file name, not part of the YAML. A PVC in use by a Pod can't be deleted: it stays <code>Terminating<\/code> as long as the Pod exists (<em>pvc-protection<\/em>).<\/p>\n<\/div>","text":"Pods access storage by using the claim as a volume . The PVC must be in the same namespace as the Pod: the cluster finds the claim, gets the PV backing it, mounts it on the host and then into the Pod. A PV is cluster-scoped. A PVC is namespace-scoped. Note In these examples, the first line ( pv-definition.yaml …) is the file name, not part of the YAML. A PVC in use by a Pod can't be deleted: it stays Terminating as long as the Pod exists ( pvc-protection ).","minutes":2,"ncode":7},{"id":"08-lab-8","kind":"lab","title":"Lab · Persistent Volume Claims","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/10-Practice-Test-Persistent-Volume-Claims.md","practice":"https://kodekloud.com/topic/practice-test-persistent-volume-claims/","items":[{"q":"Check the Solution","a":"<pre><code>OK\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>OK\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>No\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>apiVersion: v1\nkind: Pod\nmetadata:\n  name: webapp\nspec:\n  containers:\n  - name: event-simulator\n    image: kodekloud/event-simulator\n    env:\n    - name: LOG_HANDLERS\n      value: file\n    volumeMounts:\n    - mountPath: /log\n      name: log-volume\n\n  volumes:\n  - name: log-volume\n    hostPath:\n      # directory location on host\n      path: /var/log/webapp\n      # this field is optional\n      type: Directory\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>apiVersion: v1\nkind: PersistentVolume\nmetadata:\n  name: pv-log\nspec:\n  accessModes:\n    - ReadWriteMany\n  capacity:\n    storage: 100Mi\n  hostPath:\n    path: /pv/log\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>kind: PersistentVolumeClaim\napiVersion: v1\nmetadata:\n  name: claim-log-1\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: 50Mi\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>PENDING\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>AVAILABLE\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>Access Modes Mismatch\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>kind: PersistentVolumeClaim\napiVersion: v1\nmetadata:\n  name: claim-log-1\nspec:\n  accessModes:\n    - ReadWriteMany\n  resources:\n    requests:\n      storage: 50Mi\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>100Mi\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>apiVersion: v1\nkind: Pod\nmetadata:\n  name: webapp\nspec:\n  containers:\n  - name: event-simulator\n    image: kodekloud/event-simulator\n    env:\n    - name: LOG_HANDLERS\n      value: file\n    volumeMounts:\n    - mountPath: /log\n      name: log-volume\n\n  volumes:\n  - name: log-volume\n    persistentVolumeClaim:\n      claimName: claim-log-1\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>Retain\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>The PV is not delete but not available\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>The PVC is stuck in `terminating` state\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>The PVC is being used by a POD\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>kubectl delete pod webapp\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>Deleted\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>Released\n<\/code><\/pre>"}],"text":"Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution","minutes":19},{"id":"08-storage-class","kind":"lesson","title":"Storage Class","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/12-Storage-Class.md","html":"<p>With a cloud disk, you first create the disk on the provider (<code>gcloud beta compute disks create…<\/code>), then a PV that references it. That's <strong>static provisioning<\/strong>: repeat it for every need.<\/p>\n<p>A <strong>StorageClass<\/strong> enables <strong>dynamic provisioning<\/strong>: it declares a <strong>provisioner<\/strong> able to create the disk automatically when a PVC asks for it. No need to create a PV any more: it is generated and bound to the PVC.<\/p>\n<div class=\"anim\" data-anim=\"dynamic\"><\/div>\n\n<pre><code class=\"language-yaml\">sc-definition.yaml\napiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n   name: google-storage\nprovisioner: kubernetes.io/gce-pd\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f sc-definition.yaml\nstorageclass.storage.k8s.io/google-storage created\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl get sc\nNAME             PROVISIONER            RECLAIMPOLICY   VOLUMEBINDINGMODE   ALLOWVOLUMEEXPANSION   AGE\ngoogle-storage   kubernetes.io/gce-pd   Delete          Immediate           false                  20s\n<\/code><\/pre>\n<p>The PVC names the class with <code>storageClassName<\/code>:<\/p>\n<pre><code class=\"language-yaml\">pvc-definition.yaml\nkind: PersistentVolumeClaim\napiVersion: v1\nmetadata:\n  name: myclaim\nspec:\n  accessModes: [ &quot;ReadWriteOnce&quot; ]\n  storageClassName: google-storage\n  resources:\n   requests:\n     storage: 500Mi\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pvc-definition.yaml\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">pod-definition.yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: mypod\nspec:\n  containers:\n    - name: frontend\n      image: nginx\n      volumeMounts:\n      - mountPath: &quot;/var/www/html&quot;\n        name: web\n  volumes:\n    - name: web\n      persistentVolumeClaim:\n        claimName: myclaim\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ kubectl create -f pod-definition.yaml\n<\/code><\/pre>\n<p><strong>Provisioners<\/strong>: AWSElasticBlockStore, AzureFile, AzureDisk, CephFS, Cinder, FC, FlexVolume, Flocker, GCEPersistentDisk, Glusterfs, iSCSI, Quobyte, NFS, RBD, VsphereVolume, PortworxVolume, ScaleIO, StorageOS, Local… Each provisioner accepts <strong>parameters<\/strong> (disk type <code>pd-standard<\/code> or <code>pd-ssd<\/code>, replication…), so you can create classes of service: <em>silver<\/em>, <em>gold<\/em>, <em>platinum<\/em>.<\/p>\n<div class=\"admonition exam\">\n<p class=\"admonition-title\">volumeBindingMode<\/p>\n<p>With <code>WaitForFirstConsumer<\/code>, the PVC stays Pending until a Pod uses it: that's expected, not a failure. <code>Immediate<\/code> binds as soon as the PVC is created.<\/p>\n<\/div>","text":"With a cloud disk, you first create the disk on the provider ( gcloud beta compute disks create… ), then a PV that references it. That's static provisioning : repeat it for every need. A StorageClass enables dynamic provisioning : it declares a provisioner able to create the disk automatically when a PVC asks for it. No need to create a PV any more: it is generated and bound to the PVC. The PVC names the class with storageClassName : Provisioners : AWSElasticBlockStore, AzureFile, AzureDisk, CephFS, Cinder, FC, FlexVolume, Flocker, GCEPersistentDisk, Glusterfs, iSCSI, Quobyte, NFS, RBD, VsphereVolume, PortworxVolume, ScaleIO, StorageOS, Local… Each provisioner accepts parameters (disk type pd-standard or pd-ssd , replication…), so you can create classes of service: silver , gold , platinum . volumeBindingMode With WaitForFirstConsumer , the PVC stays Pending until a Pod uses it: that's expected, not a failure. Immediate binds as soon as the PVC is created.","minutes":3,"ncode":7},{"id":"08-lab-10","kind":"lab","title":"Lab · Storage Class","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/08-Storage/13-Practice-Test-Storage-Class.md","practice":"https://kodekloud.com/topic/practice-test-storage-class-2/","items":[{"q":"Check the Solution","a":"<pre><code>0\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>2\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>local-storage\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>WaitForFirstConsumer\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>portworx-volume\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>NO\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: local-pvc\nspec:\n  accessModes:\n  - ReadWriteOnce\n  resources:\n    requests:\n      storage: 500Mi\n  storageClassName: local-storage\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>Pending\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>A Pod consuming the volume in not scheduled\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>The Storage Class called local-storage makes use of VolumeBindingMode set to WaitForFirstConsumer. This will delay the binding and provisioning of a PersistentVolume until a Pod using the PersistentVolumeClaim is created.\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>apiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx\n  labels:\n    name: nginx\nspec:\n    containers:\n    - name: nginx\n      image: nginx:alpine\n      volumeMounts:\n      - name: local-persistent-storage\n        mountPath: /var/www/html\n    volumes:\n    - name: local-persistent-storage\n      persistentVolumeClaim:\n        claimName: local-pvc\n<\/code><\/pre>"},{"q":"Check the Solution","a":"<pre><code>apiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n  name: delayed-volume-sc\nprovisioner: kubernetes.io/no-provisioner\nvolumeBindingMode: WaitForFirstConsumer\n<\/code><\/pre>"}],"text":"Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution Check the Solution","minutes":12}],"quiz":[{"q":"What does copy-on-write do in Docker?","options":["It copies the image into a volume","It copies the file into the writable layer before modifying it","It duplicates containers"],"answer":1,"explain":"Image layers stay read-only; only the copy is modified."},{"q":"Which interface standardises how a storage provider creates volumes?","options":["CRI","CNI","CSI"],"answer":2,"explain":"It defines RPCs such as CreateVolume and DeleteVolume."},{"q":"Why avoid hostPath in a multi-node cluster?","options":["Each node has its own directory, with different data","hostPath is deprecated","hostPath is read-only"],"answer":0,"explain":"You need shared storage (NFS, EBS, Ceph…)."},{"q":"What is the scope of a PersistentVolume?","options":["The cluster","A namespace"],"answer":0,"explain":"The PVC is namespaced and must be in the Pod's namespace."},{"q":"No PV matches a PVC. What happens?","options":["The PVC is rejected","The PVC stays Pending","Kubernetes creates a hostPath PV"],"answer":1,"explain":"Unless dynamic provisioning is set up with a StorageClass."},{"q":"Reclaim policy Retain: what happens to the PV after the PVC is deleted?","options":["It remains but isn't reused automatically","It is deleted with its data","It becomes Available again"],"answer":0,"explain":"The administrator must clean it up manually."},{"q":"With a StorageClass, who creates the PV?","options":["The administrator","The provisioner, automatically"],"answer":1,"explain":"That's dynamic provisioning."}],"folder":"08-Storage"},{"num":"09","title":"Networking","short":"Networking","summary":"Linux networking prerequisites (routing, DNS, network namespaces), Docker networking, CNI, Pod and Service networking, cluster DNS with CoreDNS, and Ingress.","lessons":[{"id":"09-switching-routing","kind":"lesson","title":"Switching, Routing and Gateways","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/02-Pre-requisite-Switching-Routing-Gateways.md","html":"<p><strong>Switching<\/strong>: two machines connected to the same switch communicate within one network (e.g. <code>192.168.1.0<\/code>). Each has an interface (<code>eth0<\/code>) with an IP in that network.<\/p>\n<pre><code class=\"language-bash\">$ ip link\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip addr\n<\/code><\/pre>\n<p><strong>Routing<\/strong>: a <strong>router<\/strong> connects two networks (<code>192.168.1.0<\/code> and <code>192.168.2.0<\/code>) and has an IP in each. Every machine must know <strong>which way to go<\/strong> to reach the other network: that's its <strong>routing table<\/strong>.<\/p>\n<pre><code class=\"language-bash\">$ route\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip route show\nor\n$ ip route list\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip route add 192.168.1.0/24 via 192.168.2.1\n<\/code><\/pre>\n<p><strong>Default gateway<\/strong>: for everything not listed (the Internet), you set a default route (equivalent to <code>0.0.0.0<\/code>).<\/p>\n<pre><code class=\"language-bash\">$ ip route add default via 192.168.2.1\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"routing\"><\/div>\n\n<p><strong>A Linux host as a router<\/strong>: if host B connects two networks, you add routes on A and C, <strong>and<\/strong> allow B to forward packets. Linux doesn't do that by default:<\/p>\n<pre><code class=\"language-bash\">$ cat /proc/sys/net/ipv4/ip_forward\n0\n$ echo 1 &gt; /proc/sys/net/ipv4/ip_forward\n<\/code><\/pre>\n<p>This setting doesn't survive a reboot. To make it permanent:<\/p>\n<pre><code class=\"language-bash\">$ cat /etc/sysctl.conf\n# Uncomment the line\nnet.ipv4.ip_forward=1\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ sysctl -a\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ sysctl --system\n<\/code><\/pre>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Persistence<\/p>\n<p>Changes made with <code>ip addr<\/code> and <code>ip route<\/code> are lost on reboot. To keep them, write them to the network configuration (<code>/etc/network/interfaces<\/code>, netplan…).<\/p>\n<\/div>","text":"Switching : two machines connected to the same switch communicate within one network (e.g. 192.168.1.0 ). Each has an interface ( eth0 ) with an IP in that network. Routing : a router connects two networks ( 192.168.1.0 and 192.168.2.0 ) and has an IP in each. Every machine must know which way to go to reach the other network: that's its routing table . Default gateway : for everything not listed (the Internet), you set a default route (equivalent to 0.0.0.0 ). A Linux host as a router : if host B connects two networks, you add routes on A and C, and allow B to forward packets. Linux doesn't do that by default: This setting doesn't survive a reboot. To make it permanent: Persistence Changes made with ip addr and ip route are lost on reboot. To keep them, write them to the network configuration ( /etc/network/interfaces , netplan…).","minutes":3,"ncode":10},{"id":"09-dns-basics","kind":"lesson","title":"DNS","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/03-Pre-requisite-DNS.md","html":"<p>You reach a machine by IP. To call it by name, add it to <code>/etc/hosts<\/code>: that's <strong>name resolution<\/strong>. Linux doesn't check that the name is the machine's \"real\" hostname.<\/p>\n<pre><code class=\"language-bash\">$ ping 172.17.0.64\nPING 172.17.0.64 (172.17.0.64) 56(84) bytes of data.\n64 bytes from 172.17.0.64: icmp_seq=1 ttl=64 time=0.384 ms\n64 bytes from 172.17.0.64: icmp_seq=2 ttl=64 time=0.415 ms\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ping web\nping: unknown host web\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ cat &gt;&gt; /etc/hosts\n172.17.0.64  web\n# Ctrl + c to exit\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ping web\nPING web (172.17.0.64) 56(84) bytes of data.\n64 bytes from web (172.17.0.64): icmp_seq=1 ttl=64 time=0.491 ms\n64 bytes from web (172.17.0.64): icmp_seq=2 ttl=64 time=0.636 ms\n$ ssh web\n$ curl <a target=\"_blank\" rel=\"noopener\" href=\"http://web\" target=\"_blank\" rel=\"noopener\">http://web<\/a>\n<\/code><\/pre>\n<p>With dozens of machines, keeping those files in sync everywhere becomes impossible: you centralise them in a <strong>DNS server<\/strong>, declared in <code>/etc/resolv.conf<\/code>.<\/p>\n<pre><code class=\"language-bash\">$ cat /etc/resolv.conf\nnameserver 127.0.0.53\noptions edns0\n<\/code><\/pre>\n<p>If a name exists in both, <code>/etc/hosts<\/code> is checked <strong>first<\/strong>. The order is set in <code>/etc/nsswitch.conf<\/code>:<\/p>\n<pre><code class=\"language-bash\">$ cat /etc/nsswitch.conf\nhosts:          files dns\nnetworks:       files\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ping wwww.github.com\nping: www.github.com: Temporary failure in name resolution\n<\/code><\/pre>\n<p>You can add a public nameserver (Google's <code>8.8.8.8<\/code>) or configure the internal DNS server to forward unknown names:<\/p>\n<pre><code class=\"language-bash\">$ cat /etc/resolv.conf\nnameserver   127.0.0.53\nnameserver   8.8.8.8\noptions edns0\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ping www.github.com\nPING github.com (140.82.121.3) 56(84) bytes of data.\n64 bytes from 140.82.121.3 (140.82.121.3): icmp_seq=1 ttl=57 time=7.07 ms\n64 bytes from 140.82.121.3 (140.82.121.3): icmp_seq=2 ttl=57 time=5.42 ms\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"dnsresolve\"><\/div>\n\n<p><strong>Domain names<\/strong>: <code>www.google.com<\/code> reads right to left: <code>.<\/code> is the root, <code>.com<\/code> the top-level domain, <code>google<\/code> the domain, <code>www<\/code> a subdomain. <strong>Search domain<\/strong>: a <code>search mycompany.com<\/code> entry in <code>resolv.conf<\/code> lets you type <code>web<\/code> instead of <code>web.mycompany.com<\/code>. <strong>Record types<\/strong>: <code>A<\/code> (name → IPv4), <code>AAAA<\/code> (name → IPv6), <code>CNAME<\/code> (name → another name).<\/p>\n<p><code>ping<\/code> isn't the right tool to test DNS. Use <code>nslookup<\/code> and <code>dig<\/code>, which query the DNS server (but ignore <code>/etc/hosts<\/code>):<\/p>\n<pre><code class=\"language-bash\">$ nslookup www.google.com\nServer:         127.0.0.53\nAddress:        127.0.0.53#53\nNon-authoritative answer:\nName:   www.google.com\nAddress: 172.217.18.4\nName:   www.google.com\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ dig www.google.com\n; &lt;&lt;&gt;&gt; DiG 9.11.3-1 ...\n;; Got answer:\n;; -&gt;&gt;HEADER&lt;&lt;- opcode: QUERY, status: NOERROR, id: 8738\n;; flags: qr rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 1\n;; OPT PSEUDOSECTION:\n; EDNS: version: 0, flags:; udp: 65494\n;; QUESTION SECTION:\n;www.google.com.                        IN      A\n;; ANSWER SECTION:\nwww.google.com.         63      IN      A       216.58.206.4\n;; Query time: 6 msec\n;; SERVER: 127.0.0.53#53(127.0.0.53)\n<\/code><\/pre>","text":"You reach a machine by IP. To call it by name, add it to /etc/hosts : that's name resolution . Linux doesn't check that the name is the machine's \"real\" hostname. With dozens of machines, keeping those files in sync everywhere becomes impossible: you centralise them in a DNS server , declared in /etc/resolv.conf . If a name exists in both, /etc/hosts is checked first . The order is set in /etc/nsswitch.conf : You can add a public nameserver (Google's 8.8.8.8 ) or configure the internal DNS server to forward unknown names: Domain names : www.google.com reads right to left: . is the root, .com the top-level domain, google the domain, www a subdomain. Search domain : a search mycompany.com entry in resolv.conf lets you type web instead of web.mycompany.com . Record types : A (name → IPv4), AAAA (name → IPv6), CNAME (name → another name). ping isn't the right tool to test DNS. Use nslookup and dig , which query the DNS server (but ignore /etc/hosts ):","minutes":4,"ncode":11},{"id":"09-coredns-basics","kind":"lesson","title":"CoreDNS","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/04-Pre-requisite-CoreDNS.md","html":"<p><strong>CoreDNS<\/strong> is a lightweight DNS server, extensible through plugins. It's the DNS server used in Kubernetes.<\/p>\n<pre><code class=\"language-bash\">$ wget <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/coredns/coredns/releases/download/v1.7.0/coredns_1.7.0_linux_amd64.tgz\" target=\"_blank\" rel=\"noopener\">https://github.com/coredns/coredns/releases/download/v1.7.0/coredns_1.7.0_linux_amd64.tgz<\/a>\ncoredns_1.7.0_linux_amd64.tgz\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ tar -xzvf coredns_1.7.0_linux_amd64.tgz\ncoredns\n<\/code><\/pre>\n<p>By default it listens on <strong>port 53<\/strong>, the standard DNS port:<\/p>\n<pre><code class=\"language-bash\">$ ./coredns\n<\/code><\/pre>\n<p>It can serve the names from an <code>/etc/hosts<\/code> file:<\/p>\n<pre><code class=\"language-bash\">$ cat &gt; /etc/hosts\n192.168.1.10    web\n192.168.1.11    db\n192.168.1.15    web-1\n192.168.1.16    db-1\n192.168.1.21    web-2\n192.168.1.22    db-2\n<\/code><\/pre>\n<p>Its configuration lives in a <strong>Corefile<\/strong>:<\/p>\n<pre><code class=\"language-bash\">$ cat &gt; Corefile\n. {\n    hosts   /etc/hosts\n}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ./coredns\n<\/code><\/pre>","text":"CoreDNS is a lightweight DNS server, extensible through plugins. It's the DNS server used in Kubernetes. By default it listens on port 53 , the standard DNS port: It can serve the names from an /etc/hosts file: Its configuration lives in a Corefile :","minutes":2,"ncode":6},{"id":"09-network-namespaces","kind":"lesson","title":"Network Namespaces","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/05-Pre-requisite-Network-Namespace.md","html":"<p>A container is isolated from its host by Linux <strong>namespaces<\/strong>. If the host is a house, each namespace is a room: the child only sees their own room, while the parents see the whole house.<\/p>\n<p><strong>Process namespace<\/strong>: inside the container, its process has PID 1; on the host, the same process has another PID.<\/p>\n<pre><code class=\"language-bash\"># On the container\n$ ps aux\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># On the host\n$ ps aux\n<\/code><\/pre>\n<p><strong>Network namespace<\/strong>: the container has its own interfaces, routing table and ARP table. It sees nothing of the host's.<\/p>\n<pre><code class=\"language-bash\">$ route\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ arp\n<\/code><\/pre>\n<p>Let's build the network between two namespaces, <code>red<\/code> and <code>blue<\/code>, step by step. Follow along in the diagram:<\/p>\n<div class=\"anim\" data-anim=\"netns\"><\/div>\n\n<p><strong>1. Create the namespaces<\/strong><\/p>\n<pre><code class=\"language-bash\">$ ip netns add red\n$ ip netns add blue\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip netns\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip link\n<\/code><\/pre>\n<p>Each namespace only sees its loopback interface:<\/p>\n<pre><code class=\"language-bash\">$ ip netns exec red ip link\n1: lo: &lt;LOOPBACK&gt; mtu 65536 qdisc noop state DOWN mode DEFAULT group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n$ ip netns exec blue ip link\n1: lo: &lt;LOOPBACK&gt; mtu 65536 qdisc noop state DOWN mode DEFAULT group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip -n red link\n1: lo: &lt;LOOPBACK&gt; mtu 65536 qdisc noop state DOWN mode DEFAULT group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n<\/code><\/pre>\n<p>ARP and routing tables, on the host and then in the namespaces (empty):<\/p>\n<pre><code class=\"language-bash\">$ arp\nAddress                  HWtype  HWaddress           Flags Mask            Iface\n172.17.0.21              ether   02:42:ac:11:00:15   C                     ens3\n172.17.0.55              ether   02:42:ac:11:00:37   C                     ens3\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip netns exec red arp\nAddress                  HWtype  HWaddress           Flags Mask            Iface\n$ ip netns exec blue arp\nAddress                  HWtype  HWaddress           Flags Mask            Iface\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip netns exec red route\nKernel IP routing table\nDestination     Gateway         Genmask         Flags Metric Ref    Use Iface\n$ ip netns exec blue route\nKernel IP routing table\nDestination     Gateway         Genmask         Flags Metric Ref    Use Iface\n<\/code><\/pre>\n<p><strong>2. Connect two namespaces with a virtual cable (veth)<\/strong><\/p>\n<pre><code class=\"language-bash\">$ ip link add veth-red type veth peer name veth-blue\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip link set veth-red netns red\n$ ip link set veth-blue netns blue\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip -n red addr add 192.168.15.1/24 dev veth-red\n$ ip -n blue addr add 192.168.15.2/24 dev veth-blue\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip -n red link set veth-red up\n$ ip -n blue link set veth-blue up\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip netns exec red ping 192.168.15.2\nPING 192.168.15.2 (192.168.15.2) 56(84) bytes of data.\n64 bytes from 192.168.15.2: icmp_seq=1 ttl=64 time=0.035 ms\n64 bytes from 192.168.15.2: icmp_seq=2 ttl=64 time=0.046 ms\n$ ip netns exec red arp\nAddress                  HWtype  HWaddress           Flags Mask            Iface\n192.168.15.2             ether   da:a7:29:c4:5a:45   C                     veth-red\n$ ip netns exec blue arp\nAddress                  HWtype  HWaddress           Flags Mask            Iface\n192.168.15.1             ether   92:d1:52:38:c8:bc   C                     veth-blue\n<\/code><\/pre>\n<p>Deleting one end deletes the whole cable:<\/p>\n<pre><code class=\"language-bash\">$ ip -n red link del veth-red\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># Not available\n$ arp\nAddress                  HWtype  HWaddress           Flags Mask            Iface\n172.16.0.72              ether   06:fe:61:1a:75:47   C                     ens3\n172.17.0.68              ether   02:42:ac:11:00:44   C                     ens3\n172.17.0.74              ether   02:42:ac:11:00:4a   C                     ens3\n172.17.0.75              ether   02:42:ac:11:00:4b   C                     ens3\n<\/code><\/pre>\n<p><strong>3. Many namespaces: a virtual switch (Linux bridge)<\/strong><\/p>\n<p>With more than two namespaces, create a <strong>bridge<\/strong> on the host. To the host it's an interface; to the namespaces it's a switch.<\/p>\n<pre><code class=\"language-bash\">$ ip netns add red\n$ ip netns add blue\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip link add v-net-0 type bridge\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip link\n8: v-net-0: &lt;BROADCAST,MULTICAST&gt; mtu 1500 qdisc noop state DOWN mode DEFAULT group default qlen 1000\n    link/ether fa:fd:d4:9b:33:66 brd ff:ff:ff:ff:ff:ff\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip link set dev v-net-0 up\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip link add veth-red type veth peer name veth-red-br\n$ ip link add veth-blue type veth peer name veth-blue-br\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip link set veth-red netns red\n$ ip link set veth-blue netns blue\n$ ip link set veth-red-br master v-net-0\n$ ip link set veth-blue-br master v-net-0\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip -n red addr add 192.168.15.1/24 dev veth-red\n$ ip -n blue addr add 192.168.15.2/24 dev veth-blue\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip -n red link set veth-red up\n$ ip -n blue link set veth-blue up\n<\/code><\/pre>\n<p>Give the bridge an IP so the <strong>host<\/strong> can reach the namespaces:<\/p>\n<pre><code class=\"language-bash\">$ ip addr add 192.168.15.5/24 dev v-net-0\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip link set dev veth-red-br up\n$ ip link set dev veth-blue-br up\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ping 192.168.15.1\n<\/code><\/pre>\n<p><strong>4. Reach the LAN and the Internet<\/strong>: add a route via the bridge, enable <strong>NAT<\/strong> (masquerade) so packets leave with the host's IP, then add a default route.<\/p>\n<pre><code class=\"language-bash\">$ ip netns exec blue ping 192.168.1.1\nConnect: Network is unreachable\n$ ip netns exec blue route\n$ ip netns exec blue ip route add 192.168.1.0/24 via 192.168.15.5\n# Check the IP Address of the host\n$ ip a\n$ ip netns exec blue ping 192.168.1.1\nPING 192.168.1.1 (192.168.1.1) 56(84) bytes of data.\n$ iptables -t nat -A POSTROUTING -s 192.168.15.0/24 -j MASQUERADE\n$ ip netns exec blue ping 192.168.1.1\n$ ip netns exec blue ping 8.8.8.8\n$ ip netns exec blue route\n$ ip netns exec blue ip route add default via 192.168.15.5\n$ ip netns exec blue ping 8.8.8.8\n<\/code><\/pre>\n<p><strong>5. Reach in from outside<\/strong>: a port forwarding rule (DNAT).<\/p>\n<pre><code class=\"language-bash\">$ iptables -t nat -A PREROUTING --dport 80 --to-destination 192.168.15.2:80 -j DNAT\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ iptables -nvL -t nat\n<\/code><\/pre>","text":"A container is isolated from its host by Linux namespaces . If the host is a house, each namespace is a room: the child only sees their own room, while the parents see the whole house. Process namespace : inside the container, its process has PID 1; on the host, the same process has another PID. Network namespace : the container has its own interfaces, routing table and ARP table. It sees nothing of the host's. Let's build the network between two namespaces, red and blue , step by step. Follow along in the diagram: 1. Create the namespaces Each namespace only sees its loopback interface: ARP and routing tables, on the host and then in the namespaces (empty): 2. Connect two namespaces with a virtual cable (veth) Deleting one end deletes the whole cable: 3. Many namespaces: a virtual switch (Linux bridge) With more than two namespaces, create a bridge on the host. To the host it's an interface; to the namespaces it's a switch. Give the bridge an IP so the host can reach the namespaces: 4. Reach the LAN and the Internet : add a route via the bridge, enable NAT (masquerade) so packets leave with the host's IP, then add a default route. 5. Reach in from outside : a port forwarding rule (DNAT).","minutes":9,"ncode":33},{"id":"09-docker-networking","kind":"lesson","title":"Docker Networking","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/06-Pre-requisite-Docker-Networking.md","html":"<p>Three network modes for a container:<\/p>\n<ul>\n<li><strong>none<\/strong>: no interface, no network access.<\/li>\n<li><strong>host<\/strong>: the container shares the host's network. A server on port 80 is reachable on port 80 of the host; two containers can't use the same port.<\/li>\n<li><strong>bridge<\/strong> (default): an internal private network (<code>172.17.0.0/16<\/code> by default) that each container attaches to.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">$ docker run --network none nginx\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ docker run --network host nginx\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ docker run --network bridge nginx\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ docker network ls\nNETWORK ID          NAME                DRIVER              SCOPE\n4974cba36c8e        bridge              bridge              local\n0e7b30a6c996        host                host                local\na4b19b17d2c5        none                null                local\n<\/code><\/pre>\n<p>The <code>bridge<\/code> network is the <strong><code>docker0<\/code><\/strong> interface on the host: Docker does exactly what we did by hand with <code>v-net-0<\/code>.<\/p>\n<pre><code class=\"language-bash\">$ ip link\nor\n$ ip link show docker0\n3: docker0: &lt;NO-CARRIER,BROADCAST,MULTICAST,UP&gt; mtu 1500 qdisc noqueue state DOWN mode DEFAULT group default\n    link/ether 02:42:cf:c3:df:f5 brd ff:ff:ff:ff:ff:ff\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip link add docker0 type bridge\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip addr\nor\n$ ip addr show docker0\n3: docker0: &lt;NO-CARRIER,BROADCAST,MULTICAST,UP&gt; mtu 1500 qdisc noqueue state DOWN group default\n    link/ether 02:42:cf:c3:df:f5 brd ff:ff:ff:ff:ff:ff\n    inet 172.18.0.1/24 brd 172.18.0.255 scope global docker0\n       valid_lft forever preferred_lft forever\n<\/code><\/pre>\n<p>For every container, Docker creates a network namespace and a veth pair: one end on <code>docker0<\/code>, the other (<code>eth0<\/code>) inside the container.<\/p>\n<pre><code class=\"language-bash\">$ docker run nginx\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip netns\n1c452d473e2a (id: 2)\ndb732004aa9b (id: 1)\n04acb487a641 (id: 0)\ndefault\n# Inspect the Docker Container\n$ docker inspect &lt;container-id&gt;\n# To view the interface attached with the local bridge docker0\n$ ip link\n3: docker0: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 qdisc noqueue state UP mode DEFAULT group default\n    link/ether 02:42:c8:3a:ea:67 brd ff:ff:ff:ff:ff:ff\n5: vetha3e33331@if3: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 qdisc noqueue master docker0 state UP mode DEFAULT group default\n    link/ether e2:b2:ad:c9:8b:98 brd ff:ff:ff:ff:ff:ff link-netnsid 0\n# with -n options with the network namespace to view the other end of the interface\n$ ip -n 04acb487a641 link\n1: lo: &lt;LOOPBACK,UP,LOWER_UP&gt; mtu 65536 qdisc noqueue state UNKNOWN mode DEFAULT group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n3: eth0@if5: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 qdisc noqueue state UP mode DEFAULT group default\n    link/ether c6:f3:ca:12:5e:74 brd ff:ff:ff:ff:ff:ff link-netnsid 0\n# To view the IP Addr assigned to this interface\n$ ip -n 04acb487a641 addr\n3: eth0@if5: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 qdisc noqueue state UP group default\n    link/ether c6:f3:ca:12:5e:74 brd ff:ff:ff:ff:ff:ff link-netnsid 0\n    inet 10.244.0.2/24 scope global eth0\n       valid_lft forever preferred_lft forever\n<\/code><\/pre>\n<p><strong>Port mapping<\/strong>: the container is only reachable from the host. To expose it, map a host port to the container port (<code>-p 8080:80<\/code>). Docker creates a <strong>DNAT<\/strong> rule in iptables for this.<\/p>\n<pre><code class=\"language-bash\">$ docker run -itd --name nginx nginx\nd74ca9d57c1d8983db2c590df2fdd109e07e1972d6b361a6ecad8a942af5bf7e\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ docker inspect nginx | grep -w IPAddress\n            &quot;IPAddress&quot;: &quot;172.18.0.6&quot;,\n                    &quot;IPAddress&quot;: &quot;172.18.0.6&quot;,\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ curl --head  <a target=\"_blank\" rel=\"noopener\" href=\"http://172.18.0.6:80\" target=\"_blank\" rel=\"noopener\">http://172.18.0.6:80<\/a>\nHTTP/1.1 200 OK\nServer: nginx/1.19.2\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ docker run -itd --name nginx -p 8080:80 nginx\ne7387bbb2e2b6cc1d2096a080445a6b83f2faeb30be74c41741fe7891402f6b6\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ docker inspect nginx | grep -w -A5 Ports\n  &quot;Ports&quot;: {\n                &quot;80/tcp&quot;: [\n                    {\n                        &quot;HostIp&quot;: &quot;0.0.0.0&quot;,\n                        &quot;HostPort&quot;: &quot;8080&quot;\n                    }\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip a\n# Accessing nginx page with curl command\n$ curl --head <a target=\"_blank\" rel=\"noopener\" href=\"http://192.168.10.11:8080\" target=\"_blank\" rel=\"noopener\">http://192.168.10.11:8080<\/a>\nHTTP/1.1 200 OK\nServer: nginx/1.19.2\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"portmap\"><\/div>\n\n<pre><code class=\"language-bash\">$ iptables \\\n         -t nat \\\n         -A PREROUTING \\\n         -j DNAT \\\n         --dport 8080 \\\n         --to-destination 80\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ iptables \\\n      -t nat \\\n      -A DOCKER \\\n      -j DNAT \\\n      --dport 8080 \\\n      --to-destination 172.18.0.6:80\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ iptables -nvL -t nat\n<\/code><\/pre>","text":"Three network modes for a container: none : no interface, no network access. host : the container shares the host's network. A server on port 80 is reachable on port 80 of the host; two containers can't use the same port. bridge (default): an internal private network ( 172.17.0.0/16 by default) that each container attaches to. The bridge network is the docker0 interface on the host: Docker does exactly what we did by hand with v-net-0 . For every container, Docker creates a network namespace and a veth pair: one end on docker0 , the other ( eth0 ) inside the container. Port mapping : the container is only reachable from the host. To expose it, map a host port to the container port ( -p 8080:80 ). Docker creates a DNAT rule in iptables for this.","minutes":5,"ncode":18},{"id":"09-cni","kind":"lesson","title":"Container Network Interface (CNI)","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/07-Pre-requisite-CNI.md","html":"<p>Docker, rkt, Mesos, Kubernetes: they all repeat the same networking steps (namespace, bridge, veth pair, IP, NAT…). <strong>CNI<\/strong> standardises this work as <strong>plugins<\/strong>:<\/p>\n<ul>\n<li>the <strong>container runtime<\/strong> creates the network namespace, then invokes the plugin when a container is added or deleted, passing a JSON configuration file;<\/li>\n<li>the <strong>plugin<\/strong> implements the <code>ADD<\/code>, <code>DEL<\/code> and <code>CHECK<\/code> commands, assigns IPs and configures routes.<\/li>\n<\/ul>\n<p>Built-in plugins: <code>bridge<\/code>, <code>vlan<\/code>, <code>ipvlan<\/code>, <code>macvlan<\/code>, <code>host-device<\/code>, and for IPAM <code>host-local<\/code> and <code>dhcp<\/code>. Third-party solutions: <strong>Weave<\/strong>, <strong>Calico<\/strong>, <strong>Flannel<\/strong>, <strong>Cilium<\/strong>, VMware NSX…<\/p>\n<pre><code class=\"language-bash\">$ ls /opt/cni/bin/\nbridge  dhcp  flannel  host-device  host-local  ipvlan  loopback  macvlan  portmap  ptp  sample  tuning  vlan\n<\/code><\/pre>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">What about Docker?<\/p>\n<p>Docker doesn't implement CNI: it has its own standard, CNM. Kubernetes works around it by creating the container on the <code>none<\/code> network, then invoking the CNI plugins itself.<\/p>\n<\/div>","text":"Docker, rkt, Mesos, Kubernetes: they all repeat the same networking steps (namespace, bridge, veth pair, IP, NAT…). CNI standardises this work as plugins : the container runtime creates the network namespace, then invokes the plugin when a container is added or deleted, passing a JSON configuration file; the plugin implements the ADD , DEL and CHECK commands, assigns IPs and configures routes. Built-in plugins: bridge , vlan , ipvlan , macvlan , host-device , and for IPAM host-local and dhcp . Third-party solutions: Weave , Calico , Flannel , Cilium , VMware NSX… What about Docker? Docker doesn't implement CNI: it has its own standard, CNM. Kubernetes works around it by creating the container on the none network, then invoking the CNI plugins itself.","minutes":2,"ncode":1},{"id":"09-cluster-networking","kind":"lesson","title":"Cluster Networking","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/08-Cluster-Networking.md","html":"<p>Each node needs at least one network interface, an IP address, a <strong>unique hostname<\/strong> and a <strong>unique MAC address<\/strong>. Several ports must be open:<\/p>\n<table>\n<thead>\n<tr>\n<th>Port<\/th>\n<th>Component<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>6443<\/td>\n<td>kube-apiserver<\/td>\n<\/tr>\n<tr>\n<td>2379<\/td>\n<td>ETCD (clients)<\/td>\n<\/tr>\n<tr>\n<td>2380<\/td>\n<td>ETCD (peers, in HA)<\/td>\n<\/tr>\n<tr>\n<td>10250<\/td>\n<td>kubelet (master and workers)<\/td>\n<\/tr>\n<tr>\n<td>10259<\/td>\n<td>kube-scheduler<\/td>\n<\/tr>\n<tr>\n<td>10257<\/td>\n<td>kube-controller-manager<\/td>\n<\/tr>\n<tr>\n<td>30000-32767<\/td>\n<td>NodePort Services (workers)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-bash\">$ hostname\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip a\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ hostnamectl set-hostname &lt;host-name&gt;\n$ exec bash\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ netstat -nltp\n<\/code><\/pre>\n<div class=\"admonition tip\">\n<p class=\"admonition-title\">Lab<\/p>\n<p>To find the node's interface in the cluster: <code>ip a | grep -B2 &lt;node IP&gt;<\/code>. The default gateway IP: <code>ip route show default<\/code>.<\/p>\n<\/div>","text":"Each node needs at least one network interface, an IP address, a unique hostname and a unique MAC address . Several ports must be open: Port Component 6443 kube-apiserver 2379 ETCD (clients) 2380 ETCD (peers, in HA) 10250 kubelet (master and workers) 10259 kube-scheduler 10257 kube-controller-manager 30000-32767 NodePort Services (workers) Lab To find the node's interface in the cluster: ip a | grep -B2 <node IP> . The default gateway IP: ip route show default .","minutes":2,"ncode":4},{"id":"09-lab-7","kind":"lab","title":"Lab · Explore the Environment","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/09-Practice-Test-Explore-Env.md","practice":"https://kodekloud.com/topic/practice-test-explore-environment/","items":[{"q":"How many nodes are part of this cluster?","a":"<pre><code>kubectl get nodes\n<\/code><\/pre>\n<p>Count the results<\/p>"},{"q":"What is the Internal IP address of the controlplane node in this cluster?","a":"<pre><code>kubectl get nodes -o wide\n<\/code><\/pre>\n<p>Note the value in <code>INTERNAL-IP<\/code> column for <code>controlplane<\/code><\/p>"},{"q":"What is the network interface configured for cluster connectivity on the controlplane node?","a":"<p>This will be the network interface that has the same IP address you determined in the previous question.<\/p>\n<pre><code>ip a\n<\/code><\/pre>\n<p>There is quite a lot of output for the above command. We can filter it better:<\/p>\n<pre><code>ip a | grep -B2 X.X.X.X\n<\/code><\/pre>\n<p>where <code>X.X.X.X<\/code> is the IP address you got from the previous question. <code>grep -B2<\/code> will find the line containing the value we are looking for and print that and the previous 2 line of output. It will look like this, though the values will be different each time you run the lab.<\/p>\n<pre><code>3058: eth0@if3059: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1450 qdisc noqueue state UP group default\n   link/ether 02:42:c0:08:ea:03 brd ff:ff:ff:ff:ff:ff link-netnsid 0\n  inet 192.8.234.3/24 brd 192.8.234.255 scope global eth0\n<\/code><\/pre>\n<p>From this, we can determine the answer to be<\/p>\n<blockquote>\n<p><code>eth0<\/code><\/p>\n<\/blockquote>"},{"q":"What is the MAC address of the interface on the controlplane node?","a":"<p>This value is also present in the output of the command you ran for the previous question. The MAC address is the value in the <code>link/ether<\/code> field of the output and is 6 hex numbers separated by <code>:<\/code>. Note that the value can be different each time you run the lab.<\/p>\n<p>If the output for <code>eth0<\/code> is<\/p>\n<pre><code>3058: eth0@if3059: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1450 qdisc noqueue state UP group default\n   link/ether 02:42:c0:08:ea:03 brd ff:ff:ff:ff:ff:ff link-netnsid 0\n  inet 192.8.234.3/24 brd 192.8.234.255 scope global eth0\n<\/code><\/pre>\n<p>then the MAC address is<\/p>\n<blockquote>\n<p><code>02:42:c0:08:ea:03<\/code><\/p>\n<\/blockquote>"},{"q":"What is the IP address assigned to node01?","a":"<pre><code>kubectl get nodes -o wide\n<\/code><\/pre>\n<p>Note the value in <code>INTERNAL-IP<\/code> column for <code>node01<\/code><\/p>"},{"q":"What is the MAC address assigned to node01?","a":"<p>For this we will need to SSH onto <code>node01<\/code> so we can view its interfaces. We know what IP to look for, as we determined this in the previous question<\/p>\n<pre><code>ssh node01\nip a | grep -B2 X.X.X.X\n<\/code><\/pre>\n<p>where <code>X.X.X.X<\/code> is the IP address you got from the previous question. Again, look at the <code>link/ether<\/code> field.<\/p>\n<p>We could guess that the correct interface on <code>node01<\/code> is also <code>eth0<\/code> and simply run<\/p>\n<pre><code>ip link show eth0\n<\/code><\/pre>\n<p>but it's best to be sure.<\/p>\n<p>Now return to <code>controlplane<\/code><\/p>\n<pre><code>exit\n<\/code><\/pre>"},{"q":"We use Containerd as our container runtime. What is the interface/bridge created by Containerd on this host?","a":"<p>This is not immediately straight forward.<\/p>\n<pre><code>ip link show\n<\/code><\/pre>\n<p>Know that<\/p>\n<ul>\n<li>Any interface with name beginning <code>eth<\/code> is a \"physical\" interface, and represents a network card attached to the host.<\/li>\n<li>Interface <code>lo<\/code> is the loopback, and covers all IP addresses starting with <code>127<\/code>. Every computer has this.<\/li>\n<li>Any interface with name beginning <code>veth<\/code> is a virtual network interface used for tunnelling between the host and the pod network. These connect with bridges, and the bridge interface name is listed with their details.<\/li>\n<\/ul>\n<p>We can see that for the two <code>veth<\/code> devices, they are associated with another device in the list <code>cni0<\/code>, therefore that is the answer.<\/p>"},{"q":"What is the state of the interface cni0?","a":"<p>You can see in the output of the previous command that the state field for <code>cni0<\/code> is<\/p>\n<blockquote>\n<p><code>UP<\/code><\/p>\n<\/blockquote>"},{"q":"If you were to ping google from the controlplane node, which route does it take?","a":"<p>What is the IP address of the Default Gateway?<\/p>\n<p>Run<\/p>\n<pre><code>ip route show default\n<\/code><\/pre>\n<p>and note the output<\/p>"},{"q":"What is the port the kube-scheduler is listening on in the controlplane node?","a":"<p>Use the <a target=\"_blank\" rel=\"noopener\" href=\"https://linux.die.net/man/8/netstat\">netstat<\/a> command to look at network sockets used by programs running on the host. There's a lot of output, so we will filter by process name, i.e. <code>kube-scheduler<\/code><\/p>\n<pre><code>netstat -nplt | grep kube-scheduler\n<\/code><\/pre>\n<p>What the netstat options used mean<\/p>\n<ul>\n<li><code>-n<\/code> - Show IP addresses (don't try to resolve to host names)<\/li>\n<li><code>-p<\/code> - Show the process names (e.g. <code>kube-scheduler<\/code>)<\/li>\n<li><code>-l<\/code> - Include only <em>listening<\/em> sockets<\/li>\n<li><code>-t<\/code> - Include only TCP sockets<\/li>\n<\/ul>\n<p>Output:<\/p>\n<pre><code>tcp        0      0 127.0.0.1:10259         0.0.0.0:*               LISTEN      3291/kube-scheduler\n<\/code><\/pre>\n<p>We can see it's listening on localhost, port <code>10259<\/code><\/p>"},{"q":"Notice that ETCD is listening on two ports. Which of these have more client connections established?","a":"<p>We use <code>netstat<\/code> with slightly different options and filter for <code>etcd<\/code><\/p>\n<pre><code>netstat -anp | grep etcd\n<\/code><\/pre>\n<p>What the netstat options used mean<\/p>\n<ul>\n<li><code>-a<\/code> - Include sockets in all states<\/li>\n<li><code>-n<\/code> - Show IP addresses (don't try to resolve to host names)<\/li>\n<li><code>-p<\/code> - Show the process names (e.g. <code>etcd<\/code>)<\/li>\n<\/ul>\n<p>You can see that by far and away, the most used port is <code>2379<\/code>.<\/p>"},{"q":"Information","a":"<p>That's because <code>2379<\/code> is the port of ETCD to which API server connects to There are multiple concurrent connections so that API server can process multiple etcd operations simultaneously.<\/p>\n<p><code>2380<\/code> is only for etcd peer-to-peer connectivity when you have multiple controlplane nodes. In this case we don't.<\/p>"}],"text":"How many nodes are part of this cluster? What is the Internal IP address of the controlplane node in this cluster? What is the network interface configured for cluster connectivity on the controlplane node? What is the MAC address of the interface on the controlplane node? What is the IP address assigned to node01? What is the MAC address assigned to node01? We use Containerd as our container runtime. What is the interface/bridge created by Containerd on this host? What is the state of the interface cni0? If you were to ping google from the controlplane node, which route does it take? What is the port the kube-scheduler is listening on in the controlplane node? Notice that ETCD is listening on two ports. Which of these have more client connections established? Information","minutes":12},{"id":"09-pod-networking","kind":"lesson","title":"Pod Networking","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/10-Pod-Networking.md","html":"<p>Kubernetes doesn't ship a solution, but defines the <strong>networking model<\/strong>:<\/p>\n<ol>\n<li>every Pod gets <strong>its own IP address<\/strong>;<\/li>\n<li>every Pod can reach every other Pod <strong>on the same node<\/strong> by IP;<\/li>\n<li>every Pod can reach every Pod <strong>on other nodes<\/strong> by IP, <strong>without NAT<\/strong>.<\/li>\n<\/ol>\n<p>The course builds it by hand on three nodes (<code>192.168.1.11<\/code>, <code>.12<\/code>, <code>.13<\/code>). On each node, a bridge with its own subnet:<\/p>\n<pre><code class=\"language-bash\">$ ip link add v-net-0 type bridge\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip link set dev v-net-0 up\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># node01\n$ ip addr add 10.244.1.1/24 dev v-net-0\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># node02\n$ ip addr add 10.244.2.1/24 dev v-net-0\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># node03\n$ ip addr add 10.244.3.1/24 dev v-net-0\n<\/code><\/pre>\n<p>A script, run for each container, creates the veth pair, attaches it to the bridge, assigns the IP and the default route. Pods on the same node can talk. Across nodes, routes are missing:<\/p>\n<pre><code class=\"language-bash\">$ ping 10.244.2.2\nConnect: Network is unreachable\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ip route add 10.244.2.2 via 192.168.1.12\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># node01\n$ ip route add 10.244.2.2 via 192.168.1.12\n$ ip route add 10.244.3.2 via 192.168.1.13\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># node02\n$ ip route add 10.244.1.2 via 192.168.1.11\n$ ip route add 10.244.3.2 via 192.168.1.13\n<\/code><\/pre>\n<pre><code class=\"language-bash\"># node03\n$ ip route add 10.244.1.2 via 192.168.1.11\n$ ip route add 10.244.2.2 via 192.168.1.12\n<\/code><\/pre>\n<div class=\"anim\" data-anim=\"podnet\"><\/div>\n\n<p>Rather than routes on every node, it's better to configure them <strong>on the router<\/strong> and treat the whole thing as <strong>one large network<\/strong>, <code>10.244.0.0/16<\/code>. And rather than running a script by hand, <strong>CNI<\/strong> calls it automatically every time a Pod is created.<\/p>","text":"Kubernetes doesn't ship a solution, but defines the networking model : every Pod gets its own IP address ; every Pod can reach every other Pod on the same node by IP; every Pod can reach every Pod on other nodes by IP, without NAT . The course builds it by hand on three nodes ( 192.168.1.11 , .12 , .13 ). On each node, a bridge with its own subnet: A script, run for each container, creates the veth pair, attaches it to the bridge, assigns the IP and the default route. Pods on the same node can talk. Across nodes, routes are missing: Rather than routes on every node, it's better to configure them on the router and treat the whole thing as one large network , 10.244.0.0/16 . And rather than running a script by hand, CNI calls it automatically every time a Pod is created.","minutes":3,"ncode":10},{"id":"09-cni-k8s","kind":"lesson","title":"CNI in Kubernetes","src":"https://github.com/kodekloudhub/certified-kubernetes-administrator-course/blob/master/docs/09-Networking/11-CNI-in-Kubernetes.md","html":"<p>The <strong>kubelet<\/strong> (through the container runtime) invokes the CNI plugin every time a container is created. Three settings drive it: <code>--network-plugin=cni<\/code>, the binaries directory <code>--cni-bin-dir=/opt/cni/bin<\/code>, and the configuration directory <code>--cni-conf-dir=/etc/cni/net.d<\/code>.<\/p>\n<pre><code class=\"language-bash\">$ systemctl status kubelet.service\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ps -aux | grep kubelet\n<\/code><\/pre>\n<pre><code class=\"language-bash\">$ ls /opt/cni/bin\n<\/code><\/pre>\n<pre><code class=\"language-bash\">ls /etc/cni/net.d\n<\/code><\/pre>\n<p>If there are several configuration files, the first one in <strong>alphabetical order<\/strong> is used. Example file <code>10-bridge.conf<\/code>: type <code>bridge<\/code>, bridge name, <code>isGateway<\/code>, <code>ipMasq<\/code> (NAT), and an <strong><code>ipam<\/code><\/strong> section (<code>type: host-local<\/code>, subnet, rout
